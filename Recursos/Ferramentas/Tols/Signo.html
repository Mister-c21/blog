<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Signos e Ascendente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .zodiac-container {
            background-color: #ffffff;
            width: 420px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.3rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            color: #b0a8b9;
            margin-top: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-row label {
            font-size: 0.85rem;
            color: #2d2d2d;
            font-weight: 500;
        }

        .input-row input, .input-row select {
            padding: 10px 12px;
            border: 1px solid #e6d5f5;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            color: #333333;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .input-row input:focus, .input-row select:focus {
            border-color: #8a2be2;
        }

        .btn-calc {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 5px;
        }

        .btn-calc:hover {
            background-color: #7b22d0;
        }

        .results-section {
            margin-top: 20px;
            border-top: 1px solid #e6d5f5;
            padding-top: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .result-card {
            background-color: #f9f5fd;
            border: 1px solid #e6d5f5;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a2be2;
            font-weight: 600;
        }

        .result-value {
            font-size: 1.05rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .result-desc {
            font-size: 0.82rem;
            color: #555555;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="zodiac-container">
        <div class="header">
            <h2>Mapa Astral Express</h2>
            <p>Descubra seu Signo, Ascendente e Signo Chinês</p>
        </div>

        <div class="form-group">
            <div class="input-row">
                <label for="birth-date">Data de Nascimento:</label>
                <input type="date" id="birth-date">
            </div>
            <div class="input-row">
                <label for="birth-time">Horário de Nascimento:</label>
                <input type="time" id="birth-time" value="12:00">
            </div>
            <button class="btn-calc" onclick="calculateAstrology()">Calcular</button>
        </div>

        <div class="results-section" id="results-section">
            <div class="result-card">
                <div class="result-label">Signo Solar (Ocidental)</div>
                <div class="result-value" id="res-sun">-</div>
                <div class="result-desc" id="res-sun-desc">-</div>
            </div>
            <div class="result-card">
                <div class="result-label">Ascendente (Estimado)</div>
                <div class="result-value" id="res-asc">-</div>
                <div class="result-desc" id="res-asc-desc">-</div>
            </div>
            <div class="result-card">
                <div class="result-label">Signo Chinês</div>
                <div class="result-value" id="res-chinese">-</div>
                <div class="result-desc" id="res-chinese-desc">-</div>
            </div>
        </div>
    </div>

    <script>
        function getSunSign(day, month) {
            if ((month === 3 && day >= 21) || (month === 4 && day <= 20)) return {name: "Áries", desc: "Corajoso, enérgico, pioneiro e impulsivo."};
            if ((month === 4 && day >= 21) || (month === 5 && day <= 20)) return {name: "Touro", desc: "Prático, paciente, determinado e apreciador do conforto."};
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return {name: "Gêmeos", desc: "Comunicativo, versátil, curioso e adaptável."};
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return {name: "Câncer", desc: "Emocional, intuitivo, protetor e carinhoso."};
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return {name: "Leão", desc: "Generoso, caloroso, criativo e carismático."};
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return {name: "Virgem", desc: "Analítico, organizado, prestativo e detalhista."};
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return {name: "Libra", desc: "Diplomata, elegante, justo e sociável."};
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return {name: "Escorpião", desc: "Intenso, magnético, profundo e transformador."};
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return {name: "Sagitário", desc: "Otimista, aventureiro, sincero e filosófico."};
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return {name: "Capricórnio", desc: "Disciplinado, ambicioso, responsável e focado."};
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return {name: "Aquário", desc: "Original, inovador, humanitário e independente."};
            return {name: "Peixes", desc: "Sensível, compassivo, sonhador e empático."};
        }

        function getAscendant(hour, sunSignName) {
            const signsOrder = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
            let sunIndex = signsOrder.indexOf(sunSignName);
            let shift = Math.floor(hour / 2);
            let ascIndex = (sunIndex + shift) % 12;
            return signsOrder[ascIndex];
        }

        function getChineseZodiac(year) {
            const animals = [
                {name: "Macaco", desc: "Espirituoso, inteligente, curioso e brincalhão."},
                {name: "Galo", desc: "Trabalhador, corajoso, organizado e sincero."},
                {name: "Cão", desc: "Leal, honesto, prudente e protetor."},
                {name: "Porco", desc: "Generoso, compassivo, diligente e pacífico."},
                {name: "Rato", desc: "Engenhoso, versátil, gentil e perspicaz."},
                {name: "Boi", desc: "Confiável, calmo, metódico e forte."},
                {name: "Tigre", desc: "Corajoso, competitivo, confiante e imprevisível."},
                {name: "Coelho", desc: "Vigilante, espirituoso, compassivo e elegante."},
                {name: "Dragão", desc: "Confiante, inteligente, entusiasta e ambicioso."},
                {name: "Serpente", desc: "Enigmática, inteligente, intuitiva e sábia."},
                {name: "Cavalo", desc: "Animado, ativo, enérgico e independente."},
                {name: "Cabra", desc: "Criativa, resiliente, gentil e empática."}
            ];
            let index = (year - 1900) % 12;
            if (index < 0) index += 12;
            return animals[index];
        }

        function calculateAstrology() {
            const dateVal = document.getElementById('birth-date').value;
            const timeVal = document.getElementById('birth-time').value;

            if (!dateVal) {
                alert("Por favor, selecione a data de nascimento.");
                return;
            }

            const parts = dateVal.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            const day = parseInt(parts[2]);

            const hour = timeVal ? parseInt(timeVal.split(':')[0]) : 12;

            const sun = getSunSign(day, month);
            const ascendant = getAscendant(hour, sun.name);
            const chinese = getChineseZodiac(year);

            document.getElementById('res-sun').innerText = sun.name;
            document.getElementById('res-sun-desc').innerText = sun.desc;

            document.getElementById('res-asc').innerText = ascendant;
            document.getElementById('res-asc-desc').innerText = "O modo como você se apresenta ao mundo e a sua primeira impressão.";

            document.getElementById('res-chinese').innerText = chinese.name;
            document.getElementById('res-chinese-desc').innerText = chinese.desc;

            document.getElementById('results-section').style.display = 'flex';
        }
    </script>
</body>
</html>
