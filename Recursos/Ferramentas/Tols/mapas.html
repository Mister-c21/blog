<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Map Comunitário (Leaflet + OpenStreetMap)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Barra de Pesquisa Superior */
        header {
            height: 60px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: #f1f3f4;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            max-width: 400px;
        }

        .search-container input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 16px;
            margin-left: 8px;
        }

        /* Área do Mapa */
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="search-container">
            <span>📍</span>
            <input type="text" placeholder="Pesquisar no OpenStreetMap..." id="searchInput">
        </div>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // 1. Inicialização do mapa (Latitude, Longitude e Nível de Zoom inicial)
        // Exemplo centrado na cidade de São Paulo (-23.5505, -46.6333)
        const map = L.map('map').setView([-23.5505, -46.6333], 13);

        // 2. Adição da camada de tiles gratuita mantida pela comunidade OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Adicionando marcadores de exemplo (pins)
        const markerSP = L.marker([-23.5505, -46.6333]).addTo(map);
        markerSP.bindPopup("<b>São Paulo</b><br>Centro financeiro e cultural.").openPopup();

        const markerAvenida = L.marker([-23.5618, -46.6565]).addTo(map);
        markerAvenida.bindPopup("<b>Avenida Paulista</b><br>Um dos principais cartões-postais da cidade.");

        // 4. Exemplo de evento de clique no mapa (mostra coordenadas no console)
        map.on('click', function(e) {
            console.log("Você clicou nas coordenadas: " + e.latlng.lat + ", " + e.latlng.lng);
        });
    </script>
</body>
</html>
