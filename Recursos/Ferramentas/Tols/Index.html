<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes</title>
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
            transition: color 0.3s ease;
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador animado em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container e estilo dos iframes */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 53px); /* Ocupa o restante da tela abaixo da barra */
            position: relative;
            overflow: hidden; /* Garante que os iframes deslizando para fora não gerem scroll na página */
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            
            /* Configuração do slide estilo React Navigation */
            display: block;
            visibility: hidden;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* Mostra e posiciona o iframe ativo */
        .tab-iframe.active {
            visibility: visible;
            transform: translateX(0);
        }

        /* Classe auxiliar para quando o iframe vai para a esquerda (passado) */
        .tab-iframe.exit-left {
            visibility: visible;
            transform: translateX(-100%);
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-calculadora" data-index="0">Calculadora</li>
            <li class="tiktok-tab-item" data-target="iframe-mapas" data-index="1">Mapas</li>
            <li class="tiktok-tab-item" data-target="iframe-tradutor" data-index="2">Tradutor</li>
            <li class="tiktok-tab-item" data-target="iframe-calendario" data-index="3">Calendário</li>
            <li class="tiktok-tab-item" data-target="iframe-scrapbook" data-index="4">Scrapbook</li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-calculadora" class="tab-iframe active" src="calculadora.html"></iframe>
        <iframe id="iframe-mapas" class="tab-iframe" src="mapas.html"></iframe>
        <iframe id="iframe-tradutor" class="tab-iframe" src="tradutor.html"></iframe>
        <iframe id="iframe-calendario" class="tab-iframe" src="calendario.html"></iframe>
        <iframe id="iframe-scrapbook" class="tab-iframe" src="scrapbook.html"></iframe>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        
        let currentIndex = 0;

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                if (index === currentIndex) return; // Não faz nada se clicar na mesma aba

                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);
                const currentIframe = iframes[currentIndex];

                // Remove classes ativas de todas as abas
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Direção da animação baseada na ordem das abas (igual ao React Navigation)
                const movingRight = index > currentIndex;

                // Prepara a posição inicial do novo iframe antes de entrar em cena
                targetIframe.style.transition = 'none';
                targetIframe.classList.remove('exit-left');
                targetIframe.classList.remove('active');
                targetIframe.style.transform = movingRight ? 'translateX(100%)' : 'translateX(-100%)';
                
                // Força o reflow para aplicar o estilo imediato
                void targetIframe.offsetWidth;

                // Restaura a transição suave
                targetIframe.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.35s';
                currentIframe.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.35s';

                // Anima a saída da aba atual e a entrada da nova aba
                if (movingRight) {
                    currentIframe.classList.add('exit-left');
                } else {
                    currentIframe.style.transform = 'translateX(100%)';
                }
                currentIframe.classList.remove('active');

                targetIframe.classList.add('active');
                targetIframe.style.transform = 'translateX(0)';

                currentIndex = index;
            });
        });
    </script>

</body>
</html>
