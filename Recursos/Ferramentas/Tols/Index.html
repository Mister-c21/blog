<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes</title>
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
            transition: color 0.3s ease;
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador animado em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container e estilo dos iframes */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 53px); /* Ocupa o restante da tela abaixo da barra */
            position: relative;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Ocultos por padrão */
        }

        /* Mostra apenas o iframe ativo */
        .tab-iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-calculadora">Calculadora</li>
            <li class="tiktok-tab-item" data-target="iframe-mapas">Mapas</li>
            <li class="tiktok-tab-item" data-target="iframe-tradutor">Tradutor</li>
            <li class="tiktok-tab-item" data-target="iframe-calendario">Calendário</li>
            <li class="tiktok-tab-item" data-target="iframe-clima">Clima</li>
            <li class="tiktok-tab-item" data-target="iframe-scrapbook">Scrapbook</li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-calculadora" class="tab-iframe active" src="calculadora.html"></iframe>
        <iframe id="iframe-mapas" class="tab-iframe" src="mapas.html"></iframe>
        <iframe id="iframe-tradutor" class="tab-iframe" src="tradutor.html"></iframe>
        <iframe id="iframe-calendario" class="tab-iframe" src="calendario.html"></iframe>
        <iframe id="iframe-clima" class="tab-iframe" src="clima.html"></iframe>
        <iframe id="iframe-scrapbook" class="tab-iframe" src="scrapbook.html"></iframe>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove a classe 'active' de todas as abas e iframes
                tabs.forEach(t => t.classList.remove('active'));
                iframes.forEach(f => f.classList.remove('active'));

                // Adiciona a classe 'active' na aba clicada
                tab.classList.add('active');

                // Pega o ID correspondente e ativa o iframe respectivo
                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);
                if (targetIframe) {
                    targetIframe.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
