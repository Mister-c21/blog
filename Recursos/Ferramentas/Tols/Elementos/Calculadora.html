<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Funcional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #ffffff;
            width: 320px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.15);
        }

        .display {
            background-color: #ffffff;
            border: 2px solid #e6d5f5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .previous-operand {
            color: #b0a8b9;
            font-size: 0.9rem;
            min-height: 20px;
            word-break: break-all;
        }

        .current-operand {
            color: #2d2d2d;
            font-size: 1.8rem;
            font-weight: 600;
            word-break: break-all;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            background-color: #ffffff;
            border: 1px solid #e6d5f5;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #333333;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #f9f5fd;
            border-color: #8a2be2;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-violet {
            background-color: #8a2be2;
            color: #ffffff;
            border-color: #8a2be2;
        }

        .btn-violet:hover {
            background-color: #7b22d0;
            border-color: #7b22d0;
        }

        .btn-light-violet {
            color: #8a2be2;
            background-color: #f4ecfc;
            border-color: #e6d5f5;
        }

        .btn-light-violet:hover {
            background-color: #ebdff9;
        }

        .span-2 {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="buttons-grid">
            <button class="btn-light-violet" onclick="clearCalculator()">C</button>
            <button class="btn-light-violet" onclick="deleteDigit()">DEL</button>
            <button class="btn-light-violet" onclick="appendOperation('%')">%</button>
            <button class="btn-violet" onclick="appendOperation('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-violet" onclick="appendOperation('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-violet" onclick="appendOperation('-')">-</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-violet" onclick="appendOperation('+')">+</button>

            <button onclick="appendNumber('0')" class="span-2">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="btn-violet" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        const previousOperandElement = document.getElementById('previous-operand');
        const currentOperandElement = document.getElementById('current-operand');

        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        function updateDisplay() {
            currentOperandElement.innerText = currentOperand;
            if (operation != null) {
                previousOperandElement.innerText = `${previousOperand} ${operation}`;
            } else {
                previousOperandElement.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand += number;
            }
            updateDisplay();
        }

        function appendOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = prev / current;
                    break;
                case '%':
                    computation = (prev / 100) * current;
                    break;
                default:
                    return;
            }

            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        function clearCalculator() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteDigit() {
            if (currentOperand === '0') return;
            if (currentOperand.length === 1) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }
    </script>
</body>
</html>
