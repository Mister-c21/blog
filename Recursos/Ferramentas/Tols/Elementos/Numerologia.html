<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Numerologia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .numerology-container {
            background-color: #ffffff;
            width: 400px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.3rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            color: #b0a8b9;
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #2d2d2d;
            font-weight: 500;
        }

        .input-group input {
            padding: 12px;
            border: 1px solid #e6d5f5;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            color: #333333;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #8a2be2;
        }

        .btn-calc {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-calc:hover {
            background-color: #7b22d0;
        }

        .result-section {
            margin-top: 20px;
            border-top: 1px solid #e6d5f5;
            padding-top: 15px;
            display: none;
        }

        .result-card {
            background-color: #f9f5fd;
            border: 1px solid #e6d5f5;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .result-number {
            font-size: 2rem;
            font-weight: bold;
            color: #8a2be2;
            margin-bottom: 5px;
        }

        .result-title {
            font-size: 0.95rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .result-description {
            font-size: 0.85rem;
            color: #555555;
            line-height: 1.4;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="numerology-container">
        <div class="header">
            <h2>Calculadora de Numerologia</h2>
            <p>Descubra o significado do seu nome</p>
        </div>

        <div class="input-group">
            <label for="name-input">Digite seu nome completo:</label>
            <input type="text" id="name-input" placeholder="Ex: Klara lins">
            <button class="btn-calc" onclick="calculateNumerology()">Calcular</button>
        </div>

        <div class="result-section" id="result-section">
            <div class="result-card">
                <div class="result-number" id="res-num">0</div>
                <div class="result-title" id="res-title">Título</div>
                <div class="result-description" id="res-desc">Descrição do significado do número...</div>
            </div>
        </div>
    </div>

    <script>
        const numerologyTable = {
            'a': 1, 'j': 1, 's': 1,
            'b': 2, 'k': 2, 't': 2,
            'c': 3, 'l': 3, 'u': 3,
            'd': 4, 'm': 4, 'v': 4,
            'e': 5, 'n': 5, 'w': 5,
            'f': 6, 'o': 6, 'x': 6,
            'g': 7, 'p': 7, 'y': 7,
            'h': 8, 'q': 8, 'z': 8,
            'i': 9, 'r': 9
        };

        const meanings = {
            1: {
                title: "O Líder / Pioneiro",
                desc: "Indica independência, originalidade, coragem e forte capacidade de liderança. Você gosta de abrir novos caminhos."
            },
            2: {
                title: "O Diplomata / Pacificador",
                desc: "Representa a cooperação, empatia, sensibilidade e o trabalho em equipe. Você valoriza muito a harmonia e as parcerias."
            },
            3: {
                title: "O Comunicador / Criativo",
                desc: "Sinaliza expressividade, otimismo, talento artístico e carisma. Sua energia é contagiante e voltada para a alegria."
            },
            4: {
                title: "O Construtor / Organizado",
                desc: "Focado em estabilidade, disciplina, praticidade e esforço constante. Você cria bases sólidas para o futuro."
            },
            5: {
                title: "O Visionário / Explorador",
                desc: "Amor pela liberdade, versatilidade, curiosidade e adaptabilidade. Você busca novas experiências constantemente."
            },
            6: {
                title: "O Protetor / Provedor",
                desc: "Ligado ao amor familiar, responsabilidade, harmonia no lar, cuidado com os outros e forte senso de justiça."
            },
            7: {
                title: "O Pensador / Investigador",
                desc: "Busca pelo conhecimento, espiritualidade, análise profunda e intuição aguçada. Prefere momentos de introspecção."
            },
            8: {
                title: "O Realizador / Executivo",
                desc: "Ambição, foco em resultados, poder pessoal, organização empresarial e capacidade de gerir recursos com sucesso."
            },
            9: {
                title: "O Humanitário / Compassivo",
                desc: "Altruísmo, generosidade global, compreensão ampla das pessoas e desapego. Você se importa profundamente com o coletivo."
            }
        };

        function normalizeText(text) {
            return text.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function reduceNumber(num) {
            while (num > 9) {
                let sum = 0;
                while (num > 0) {
                    sum += num % 10;
                    num = Math.floor(num / 10);
                }
                num = sum;
            }
            return num;
        }

        function calculateNumerology() {
            const name = document.getElementById('name-input').value.trim();
            if (!name) return;

            const cleanName = normalizeText(name);
            let totalSum = 0;

            for (let char of cleanName) {
                if (numerologyTable[char]) {
                    totalSum += numerologyTable[char];
                }
            }

            if (totalSum === 0) return;

            const finalNumber = reduceNumber(totalSum);
            const data = meanings[finalNumber];

            document.getElementById('res-num').innerText = finalNumber;
            document.getElementById('res-title').innerText = data.title;
            document.getElementById('res-desc').innerText = data.desc;
            document.getElementById('result-section').style.display = 'block';
        }
    </script>
</body>
</html>
