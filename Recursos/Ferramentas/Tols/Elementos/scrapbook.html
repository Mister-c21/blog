<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook Digital com Menu Flutuante</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .scrapbook-container {
            background-color: #ffffff;
            width: 440px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .header {
            text-align: center;
        }

        .header h2 {
            font-size: 1.2rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .header p {
            font-size: 0.8rem;
            color: #b0a8b9;
        }

        /* Palco Principal */
        .scrapbook-canvas {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #ffffff;
            border: 2px dashed #e6d5f5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }

        /* Elementos Flutuantes no Scrapbook */
        .scrap-item {
            position: absolute;
            cursor: move;
            user-select: none;
            padding: 6px;
            border-radius: 6px;
            transition: box-shadow 0.2s;
        }

        .scrap-item:hover {
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.25);
            outline: 1px dashed #8a2be2;
        }

        .scrap-text {
            font-size: 1rem;
            font-weight: 600;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
        }

        .scrap-sticker {
            font-size: 2rem;
        }

        .scrap-frame {
            background-color: #ffffff;
            padding: 6px 6px 20px 6px;
            border: 1px solid #e6d5f5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transform: rotate(-3deg);
        }

        .scrap-frame img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        /* MENU FLUTUANTE DE BOTÕES (Floating Action Buttons) */
        .floating-menu {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column-reverse;
            align-items: flex-end;
            gap: 10px;
            z-index: 100;
        }

        .fab-main {
            width: 50px;
            height: 50px;
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, background-color 0.2s;
        }

        .fab-main:hover {
            background-color: #7b22d0;
        }

        .fab-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .floating-menu.active .fab-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .floating-menu.active .fab-main {
            transform: rotate(45deg);
        }

        .fab-btn {
            background-color: #ffffff;
            color: #8a2be2;
            border: 1px solid #e6d5f5;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .fab-btn:hover {
            background-color: #f9f5fd;
            border-color: #8a2be2;
        }

        /* Modal / Caixa Flutuante de Entrada */
        .input-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #ffffff;
            border: 2px solid #e6d5f5;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.2);
            z-index: 200;
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 80%;
        }

        .input-modal.active {
            display: flex;
            transform: translate(-50%, -50%) scale(1);
        }

        .input-modal input {
            padding: 8px 10px;
            border: 1px solid #e6d5f5;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        .input-modal input:focus {
            border-color: #8a2be2;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .modal-buttons button {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: #f4ecfc;
            color: #8a2be2;
        }

        .btn-confirm {
            background-color: #8a2be2;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="scrapbook-container">
        <div class="header">
            <h2>Scrapbook Criativo</h2>
            <p>Use o menu flutuante para customizar</p>
        </div>

        <div class="scrapbook-canvas" id="canvas">
            <div class="scrap-item scrap-frame" style="top: 20px; left: 20px;" onmousedown="startDrag(event)">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" alt="Exemplo">
            </div>
            <div class="scrap-item scrap-text" style="top: 150px; left: 140px; color: #8a2be2;" onmousedown="startDrag(event)">
                Memórias ✨
            </div>
            <div class="scrap-item scrap-sticker" style="top: 220px; left: 20px;" onmousedown="startDrag(event)">
                💜
            </div>
        </div>

        <div class="floating-menu" id="floating-menu">
            <div class="fab-options">
                <button class="fab-btn" onclick="clearCanvas()">🗑️ Limpar</button>
                <button class="fab-btn" onclick="addStickerItem()">⭐ Adesivo</button>
                <button class="fab-btn" onclick="addPhotoFrame()">📷 Foto</button>
                <button class="fab-btn" onclick="openTextModal()">✍️ Texto</button>
            </div>
            <button class="fab-main" onclick="toggleMenu()">+</button>
        </div>

        <div class="input-modal" id="text-modal">
            <span style="font-size: 0.9rem; font-weight: 600; color: #2d2d2d;">Adicionar Texto</span>
            <input type="text" id="modal-text-input" placeholder="Digite sua lembrança...">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeTextModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmAddText()">Adicionar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const floatingMenu = document.getElementById('floating-menu');
        const textModal = document.getElementById('text-modal');
        const modalTextInput = document.getElementById('modal-text-input');

        function toggleMenu() {
            floatingMenu.classList.toggle('active');
        }

        function openTextModal() {
            toggleMenu();
            textModal.classList.add('active');
            modalTextInput.focus();
        }

        function closeTextModal() {
            textModal.classList.remove('active');
            modalTextInput.value = '';
        }

        function confirmAddText() {
            const textVal = modalTextInput.value.trim();
            if (!textVal) return;

            const div = document.createElement('div');
            div.className = 'scrap-item scrap-text';
            div.style.top = '100px';
            div.style.left = '100px';
            div.style.color = '#8a2be2';
            div.innerText = textVal;
            div.setAttribute('onmousedown', 'startDrag(event)');
            
            canvas.appendChild(div);
            closeTextModal();
        }

        function addStickerItem() {
            toggleMenu();
            const stickers = ["💜", "✨", "🌸", "⭐", "📷", "📌"];
            const randomSticker = stickers[Math.floor(Math.random() * stickers.length)];

            const div = document.createElement('div');
            div.className = 'scrap-item scrap-sticker';
            div.style.top = '140px';
            div.style.left = '150px';
            div.innerText = randomSticker;
            div.setAttribute('onmousedown', 'startDrag(event)');

            canvas.appendChild(div);
        }

        function addPhotoFrame() {
            toggleMenu();
            const sampleImages = [
                "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
            ];
            const randomImg = sampleImages[Math.floor(Math.random() * sampleImages.length)];
            const randomRot = Math.floor(Math.random() * 12) - 6;

            const div = document.createElement('div');
            div.className = 'scrap-item scrap-frame';
            div.style.top = '60px';
            div.style.left = '160px';
            div.style.transform = `rotate(${randomRot}deg)`;
            div.innerHTML = `<img src="${randomImg}" alt="Foto Scrapbook">`;
            div.setAttribute('onmousedown', 'startDrag(event)');

            canvas.appendChild(div);
        }

        function clearCanvas() {
            toggleMenu();
            canvas.innerHTML = '';
        }

        // Sistema de Arrastar Elementos (Drag and Drop)
        let activeItem = null;
        let offsetX = 0, offsetY = 0;

        function startDrag(e) {
            activeItem = e.currentTarget;
            const rect = activeItem.getBoundingClientRect();

            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            e.preventDefault();
        }

        function onDrag(e) {
            if (!activeItem) return;
            const canvasRect = canvas.getBoundingClientRect();

            let x = e.clientX - canvasRect.left - offsetX;
            let y = e.clientY - canvasRect.top - offsetY;

            if (x < 0) x = 0;
            if (y < 0) y = 0;

            activeItem.style.left = x + 'px';
            activeItem.style.top = y + 'px';
        }

        function stopDrag() {
            activeItem = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }
    </script>
</body>
</html>
