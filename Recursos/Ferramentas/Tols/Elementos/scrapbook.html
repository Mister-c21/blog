<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook Digital Criativo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .scrapbook-container {
            background-color: #ffffff;
            width: 440px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 128, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            text-align: center;
        }

        .header h2 {
            font-size: 1.3rem;
            color: #2d2d2d;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            color: #b0a8b9;
            margin-top: 3px;
        }

        /* Controles de Estilo */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f9f5fd;
            border: 1px solid #e6d5f5;
            padding: 12px;
            border-radius: 12px;
        }

        .control-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="color"], select {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #e6d5f5;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            color: #333333;
            background-color: #ffffff;
        }

        input[type="text"]:focus, select:focus {
            border-color: #8a2be2;
        }

        input[type="color"] {
            padding: 2px;
            height: 38px;
            cursor: pointer;
        }

        .btn-violet {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-violet:hover {
            background-color: #7b22d0;
        }

        /* Palco / Página do Scrapbook */
        .scrapbook-canvas {
            position: relative;
            width: 100%;
            height: 340px;
            background-color: #ffffff;
            border: 2px dashed #e6d5f5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }

        /* Elementos flutuantes colados no Scrapbook */
        .scrap-item {
            position: absolute;
            cursor: move;
            user-select: none;
            padding: 8px;
            border-radius: 6px;
            display: inline-block;
            transition: box-shadow 0.2s;
        }

        .scrap-item:hover {
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.25);
            outline: 1px dashed #8a2be2;
        }

        .scrap-text {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 4px;
        }

        .scrap-sticker {
            font-size: 2rem;
        }

        .scrap-frame {
            background-color: #ffffff;
            padding: 8px 8px 24px 8px;
            border: 1px solid #e6d5f5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transform: rotate(-3deg);
        }

        .scrap-frame img {
            width: 110px;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .actions-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            background-color: #f4ecfc;
            color: #8a2be2;
            border: 1px solid #e6d5f5;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }

        .clear-btn:hover {
            background-color: #ebdff9;
        }
    </style>
</head>
<body>

    <div class="scrapbook-container">
        <div class="header">
            <h2>Meu Scrapbook Digital</h2>
            <p>Adicione textos, adesivos e personalize sua página</p>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <input type="text" id="text-input" placeholder="Escreva uma lembrança...">
                <button class="btn-violet" onclick="addTextItem()">Add Texto</button>
            </div>
            <div class="control-row">
                <select id="sticker-select">
                    <option value="💜">Coração Violeta</option>
                    <option value="✨">Brilho</option>
                    <option value="🌸">Flor</option>
                    <option value="⭐">Estrela</option>
                    <option value="📷">Câmera</option>
                    <option value="📌">Alfinete</option>
                </select>
                <button class="btn-violet" onclick="addStickerItem()">Add Adesivo</button>
                <button class="btn-violet" onclick="addPhotoFrame()">Add Foto</button>
            </div>
        </div>

        <div class="scrapbook-canvas" id="canvas">
            <div class="scrap-item scrap-frame" style="top: 20px; left: 20px;" onmousedown="startDrag(event)">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" alt="Exemplo">
            </div>
            <div class="scrap-item scrap-text" style="top: 160px; left: 160px; color: #8a2be2;" onmousedown="startDrag(event)">
                Momentos Felizes ✨
            </div>
            <div class="scrap-item scrap-sticker" style="top: 220px; left: 30px;" onmousedown="startDrag(event)">
                💜
            </div>
        </div>

        <div class="actions-bottom">
            <button class="clear-btn" onclick="clearCanvas()">Limpar Página</button>
            <span style="font-size: 0.75rem; color: #b0a8b9;">Dica: Arraste os itens livremente</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');

        function addTextItem() {
            const textVal = document.getElementById('text-input').value.trim();
            if (!textVal) return;

            const div = document.createElement('div');
            div.className = 'scrap-item scrap-text';
            div.style.top = '100px';
            div.style.left = '100px';
            div.style.color = '#8a2be2';
            div.innerText = textVal;
            div.setAttribute('onmousedown', 'startDrag(event)');
            
            canvas.appendChild(div);
            document.getElementById('text-input').value = '';
        }

        function addStickerItem() {
            const sticker = document.getElementById('sticker-select').value;
            const div = document.createElement('div');
            div.className = 'scrap-item scrap-sticker';
            div.style.top = '120px';
            div.style.left = '150px';
            div.innerText = sticker;
            div.setAttribute('onmousedown', 'startDrag(event)');

            canvas.appendChild(div);
        }

        function addPhotoFrame() {
            const sampleImages = [
                "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
            ];
            const randomImg = sampleImages[Math.floor(Math.random() * sampleImages.length)];
            const randomRot = Math.floor(Math.random() * 12) - 6;

            const div = document.createElement('div');
            div.className = 'scrap-item scrap-frame';
            div.style.top = '50px';
            div.style.left = '180px';
            div.style.transform = `rotate(${randomRot}deg)`;
            div.innerHTML = `<img src="${randomImg}" alt="Foto Scrapbook">`;
            div.setAttribute('onmousedown', 'startDrag(event)');

            canvas.appendChild(div);
        }

        function clearCanvas() {
            canvas.innerHTML = '';
        }

        // Sistema Simples de Arrastar Elementos (Drag and Drop)
        let activeItem = null;
        let offsetX = 0, offsetY = 0;

        function startDrag(e) {
            activeItem = e.currentTarget;
            const rect = activeItem.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();

            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            e.preventDefault();
        }

        function onDrag(e) {
            if (!activeItem) return;
            const canvasRect = canvas.getBoundingClientRect();

            let x = e.clientX - canvasRect.left - offsetX;
            let y = e.clientY - canvasRect.top - offsetY;

            // Limites básicos dentro do canvas
            if (x < 0) x = 0;
            if (y < 0) y = 0;

            activeItem.style.left = x + 'px';
            activeItem.style.top = y + 'px';
        }

        function stopDrag() {
            activeItem = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }
    </script>
</body>
</html>
