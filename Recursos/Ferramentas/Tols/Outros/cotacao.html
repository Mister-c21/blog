<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotações - Estilo MSN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ffffff;
      --secondary: #7C3AED;
      --secondary-light: #A78BFA;
      --text: #1F2937;
      --text-light: #6B7280;
      --card: #ffffff;
      --border: #E5E7EB;
      --shadow: 0 4px 20px rgba(124, 58, 237, 0.08);
      --green: #10B981;
      --red: #EF4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--primary);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right { text-align: right; }
    .header-right h1 { font-size: 1.4rem; font-weight: 600; }
    .header-right p { color: var(--text-light); font-size: 0.9rem; }

    /* ===== Barra de Pesquisa ===== */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .search-box button {
      padding: 0 24px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: #6D28D9;
    }

    /* Resultado da pesquisa */
    #search-result {
      margin-bottom: 30px;
      display: none;
    }

    .result-card {
      background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 100%);
      border: 1px solid var(--secondary-light);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .result-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result-info .symbol {
      color: var(--secondary);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .result-price {
      text-align: right;
    }

    .result-price .price {
      font-size: 2.2rem;
      font-weight: 600;
    }

    .result-price .change {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 4px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 30px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--secondary);
      border-radius: 2px;
    }

    .indices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .index-card, .stock-card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .index-card:hover, .stock-card:hover {
      transform: translateY(-3px);
      border-color: var(--secondary-light);
    }

    .index-card .name, .stock-name {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .index-card .price, .stock-price {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .change {
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 4px;
    }

    .up { color: var(--green); }
    .down { color: var(--red); }

    .stocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .stock-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
    }

    .stock-symbol { font-weight: 600; font-size: 1.05rem; }

    .loading, .error {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .note {
      margin-top: 40px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .note a { color: var(--secondary); text-decoration: none; font-weight: 500; }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 12px; text-align: center; }
      .header-right { text-align: center; }
      .indices { grid-template-columns: 1fr 1fr; }
      .result-card { flex-direction: column; text-align: center; }
      .result-price { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">📈 Cotações</div>
      <div class="header-right">
        <h1>Mercado ao Vivo</h1>
        <p id="datetime">Carregando...</p>
      </div>
    </header>

    <!-- Barra de Pesquisa -->
    <div class="search-box">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Pesquisar ação ou cripto (ex: AAPL, TSLA, PETR4.SA, bitcoin, eth...)"
        autocomplete="off"
      >
      <button onclick="searchAsset()">Pesquisar</button>
    </div>

    <!-- Resultado da pesquisa -->
    <div id="search-result"></div>

    <!-- Conteúdo principal -->
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Buscando cotações em tempo real...</p>
      </div>
    </div>

    <div class="note">
      Dados em tempo real via <a href="https://finnhub.io" target="_blank">Finnhub</a> + <a href="https://www.coingecko.com" target="_blank">CoinGecko</a><br>
      Atualiza automaticamente a cada 60 segundos
    </div>
  </div>

  <script>
    // ============================================
    // COLE SUA CHAVE DO FINNHUB AQUI
    // ============================================
    const FINNHUB_API_KEY = "d9v5529r01qv408j5b8gd9v5529r01qv408j5b90";
    // ============================================

    const indices = [
      { symbol: "SPY", name: "S&P 500 (SPY)" },
      { symbol: "QQQ", name: "Nasdaq 100 (QQQ)" },
      { symbol: "DIA", name: "Dow Jones (DIA)" },
      { symbol: "IWM", name: "Russell 2000" }
    ];

    const stocks = [
      { symbol: "AAPL", name: "Apple" },
      { symbol: "MSFT", name: "Microsoft" },
      { symbol: "NVDA", name: "NVIDIA" },
      { symbol: "AMZN", name: "Amazon" },
      { symbol: "GOOGL", name: "Alphabet" },
      { symbol: "TSLA", name: "Tesla" },
      { symbol: "META", name: "Meta" },
      { symbol: "BRK.B", name: "Berkshire Hathaway" }
    ];

    // Mapeamento rápido de criptos comuns
    const cryptoMap = {
      btc: "bitcoin", bitcoin: "bitcoin",
      eth: "ethereum", ethereum: "ethereum",
      sol: "solana", solana: "solana",
      bnb: "binancecoin", binancecoin: "binancecoin",
      ada: "cardano", cardano: "cardano",
      xrp: "ripple", ripple: "ripple",
      doge: "dogecoin", dogecoin: "dogecoin",
      dot: "polkadot", polkadot: "polkadot",
      avax: "avalanche-2", avalanche: "avalanche-2",
      link: "chainlink", chainlink: "chainlink",
      matic: "matic-network", polygon: "matic-network"
    };

    async function getQuote(symbol) {
      const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erro ao buscar ${symbol}`);
      return await res.json();
    }

    async function getProfile(symbol) {
      try {
        const url = `https://finnhub.io/api/v1/stock/profile2?symbol=${symbol}&token=${FINNHUB_API_KEY}`;
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    async function getCryptoPrice(id) {
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true`;
      const res = await fetch(url);
      return await res.json();
    }

    function formatPrice(price) {
      if (!price && price !== 0) return "—";
      return price.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatChange(change) {
      if (change === undefined || change === null) return "—";
      const sign = change >= 0 ? "+" : "";
      return `${sign}${change.toFixed(2)}%`;
    }

    // ========== PESQUISA ==========
    async function searchAsset() {
      const input = document.getElementById("search-input");
      const query = input.value.trim().toLowerCase();
      const resultDiv = document.getElementById("search-result");

      if (!query) {
        resultDiv.style.display = "none";
        return;
      }

      resultDiv.style.display = "block";
      resultDiv.innerHTML = `
        <div class="loading" style="padding:30px">
          <div class="spinner"></div>
          <p>Buscando "${query}"...</p>
        </div>
      `;

      try {
        // 1. Tenta como criptomoeda primeiro
        const cryptoId = cryptoMap[query] || query;
        const cryptoData = await getCryptoPrice(cryptoId);

        if (cryptoData[cryptoId]) {
          const data = cryptoData[cryptoId];
          const change = data.usd_24h_change || 0;
          const isUp = change >= 0;

          resultDiv.innerHTML = `
            <div class="result-card">
              <div class="result-info">
                <h2>${cryptoId.charAt(0).toUpperCase() + cryptoId.slice(1)}</h2>
                <div class="symbol">${query.toUpperCase()} · Criptomoeda</div>
              </div>
              <div class="result-price">
                <div class="price">$${formatPrice(data.usd)}</div>
                <div class="change ${isUp ? 'up' : 'down'}">
                  ${isUp ? '▲' : '▼'} ${formatChange(change)}
                </div>
              </div>
            </div>
          `;
          return;
        }

        // 2. Tenta como ação (Finnhub)
        if (FINNHUB_API_KEY === "d9v5529r01qv408j5b8gd9v5529r01qv408j5b90") {
          throw new Error("Configure a chave do Finnhub para buscar ações");
        }

        const symbol = query.toUpperCase();
        const [quote, profile] = await Promise.all([
          getQuote(symbol),
          getProfile(symbol)
        ]);

        if (!quote.c || quote.c === 0) {
          throw new Error("Ativo não encontrado");
        }

        const change = quote.dp || 0;
        const isUp = change >= 0;
        const name = profile?.name || symbol;

        resultDiv.innerHTML = `
          <div class="result-card">
            <div class="result-info">
              <h2>${name}</h2>
              <div class="symbol">${symbol} · Ação</div>
            </div>
            <div class="result-price">
              <div class="price">$${formatPrice(quote.c)}</div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '▲' : '▼'} ${formatChange(change)}
              </div>
            </div>
          </div>
        `;

      } catch (err) {
        resultDiv.innerHTML = `
          <div class="result-card" style="justify-content:center; text-align:center; color:var(--text-light)">
            <div>
              <p style="font-size:1.1rem; margin-bottom:6px">Não encontrado</p>
              <p style="font-size:0.9rem">${err.message}</p>
              <p style="font-size:0.85rem; margin-top:10px">
                Exemplos: AAPL, TSLA, MSFT, PETR4.SA, bitcoin, eth, sol
              </p>
            </div>
          </div>
        `;
      }
    }

    // Enter para pesquisar
    document.getElementById("search-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") searchAsset();
    });

    // ========== CARREGAMENTO PRINCIPAL ==========
    async function loadData() {
      const content = document.getElementById("content");

      if (FINNHUB_API_KEY === "SUA_CHAVE_AQUI" || !FINNHUB_API_KEY) {
        content.innerHTML = `
          <div class="error">
            <h3 style="color:var(--secondary);margin-bottom:12px">Chave da API necessária</h3>
            <p>1. Acesse <a href="https://finnhub.io" target="_blank" style="color:var(--secondary)">finnhub.io</a></p>
            <p>2. Crie uma conta gratuita e copie a API Key</p>
            <p>3. Cole a chave no código (procure por FINNHUB_API_KEY)</p>
          </div>
        `;
        return;
      }

      try {
        const [quotesIndices, quotesStocks, crypto] = await Promise.all([
          Promise.all(indices.map(i => getQuote(i.symbol))),
          Promise.all(stocks.map(s => getQuote(s.symbol))),
          getCryptoPrice("bitcoin,ethereum,solana,binancecoin")
        ]);

        let indicesHTML = indices.map((item, i) => {
          const q = quotesIndices[i];
          const change = q.dp || 0;
          const isUp = change >= 0;
          return `
            <div class="index-card">
              <div class="name">${item.name}</div>
              <div class="price">$${formatPrice(q.c)}</div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '▲' : '▼'} ${formatChange(change)}
              </div>
            </div>
          `;
        }).join("");

        // Bitcoin
        const btc = crypto.bitcoin;
        indicesHTML += `
          <div class="index-card">
            <div class="name">Bitcoin</div>
            <div class="price">$${formatPrice(btc.usd)}</div>
            <div class="change ${btc.usd_24h_change >= 0 ? 'up' : 'down'}">
              ${btc.usd_24h_change >= 0 ? '▲' : '▼'} ${formatChange(btc.usd_24h_change)}
            </div>
          </div>
        `;

        let stocksHTML = stocks.map((item, i) => {
          const q = quotesStocks[i];
          const change = q.dp || 0;
          const isUp = change >= 0;
          return `
            <div class="stock-card">
              <div>
                <div class="stock-symbol">${item.symbol}</div>
                <div class="stock-name">${item.name}</div>
              </div>
              <div style="text-align:right">
                <div class="stock-price">$${formatPrice(q.c)}</div>
                <div class="change ${isUp ? 'up' : 'down'}">
                  ${isUp ? '▲' : '▼'} ${formatChange(change)}
                </div>
              </div>
            </div>
          `;
        }).join("");

        // Criptos extras
        const extraCryptos = [
          { id: "ethereum", symbol: "ETH", name: "Ethereum" },
          { id: "solana", symbol: "SOL", name: "Solana" },
          { id: "binancecoin", symbol: "BNB", name: "BNB" }
        ];

        extraCryptos.forEach(c => {
          const data = crypto[c.id];
          const change = data.usd_24h_change || 0;
          const isUp = change >= 0;
          stocksHTML += `
            <div class="stock-card">
              <div>
                <div class="stock-symbol">${c.symbol}</div>
                <div class="stock-name">${c.name}</div>
              </div>
              <div style="text-align:right">
                <div class="stock-price">$${formatPrice(data.usd)}</div>
                <div class="change ${isUp ? 'up' : 'down'}">
                  ${isUp ? '▲' : '▼'} ${formatChange(change)}
                </div>
              </div>
            </div>
          `;
        });

        document.getElementById("datetime").textContent = new Date().toLocaleString("pt-BR", {
          weekday: "long", day: "numeric", month: "long",
          hour: "2-digit", minute: "2-digit"
        });

        content.innerHTML = `
          <div class="section-title">Principais Índices & Bitcoin</div>
          <div class="indices">${indicesHTML}</div>

          <div class="section-title">Ações & Criptomoedas</div>
          <div class="stocks">${stocksHTML}</div>
        `;

      } catch (err) {
        content.innerHTML = `
          <div class="error">
            <p>Erro ao carregar cotações.</p>
            <p style="font-size:0.9rem;margin-top:10px">${err.message}</p>
          </div>
        `;
      }
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
