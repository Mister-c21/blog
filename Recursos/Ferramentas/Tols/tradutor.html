<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor Web Estilo Naver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Container Principal */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .translator-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }

        /* Barra de Idiomas */
        .language-bar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e1e4e8;
            background: #fafbfc;
            padding: 10px 20px;
            gap: 15px;
        }

        .lang-select-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #555;
        }

        select {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #8a2be2;
        }

        .swap-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }

        .swap-btn:hover {
            background: #f4ecfc;
            color: #8a2be2;
            border-color: #8a2be2;
        }

        /* Painéis de Tradução (Lado a Lado) */
        .translation-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 320px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px;
        }

        .panel.source {
            border-right: 1px solid #e1e4e8;
        }

        .panel.target {
            background-color: #fcfcfc;
        }

        textarea {
            width: 100%;
            height: 220px;
            border: none;
            resize: none;
            outline: none;
            font-size: 1.1rem;
            background: transparent;
            color: #222;
            line-height: 1.5;
        }

        .output-box {
            width: 100%;
            height: 220px;
            font-size: 1.1rem;
            color: #222;
            line-height: 1.5;
            overflow-y: auto;
            word-break: break-word;
        }

        /* Rodapé dos Painéis (Contador de caracteres e Ações) */
        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-size: 0.85rem;
            color: #888;
        }

        .panel-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #f4ecfc;
            color: #8a2be2;
        }

        .action-btn.listening {
            color: #8a2be2;
            background: #f4ecfc;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Botão principal de Traduzir */
        .translate-action-bar {
            padding: 15px 20px;
            background: #ffffff;
            border-top: 1px solid #e1e4e8;
            display: flex;
            justify-content: flex-end;
        }

        .btn-translate {
            background-color: #8a2be2;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-translate:hover {
            background-color: #7220c9;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .translation-panels {
                grid-template-columns: 1fr;
            }
            .panel.source {
                border-right: none;
                border-bottom: 1px solid #e1e4e8;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="translator-container">
            <div class="language-bar">
                <div class="lang-select-group">
                    <label for="source-lang">De:</label>
                    <select id="source-lang">
                        <option value="pt">Português</option>
                        <option value="en">Inglês</option>
                        <option value="es">Espanhol</option>
                        <option value="ko">Coreano</option>
                        <option value="ja">Japonês</option>
                        <option value="fr">Francês</option>
                    </select>
                </div>

                <button class="swap-btn" onclick="swapLanguages()" title="Inverter idiomas">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>

                <div class="lang-select-group">
                    <label for="target-lang">Para:</label>
                    <select id="target-lang">
                        <option value="en">Inglês</option>
                        <option value="pt" selected>Português</option>
                        <option value="es">Espanhol</option>
                        <option value="ko">Coreano</option>
                        <option value="ja">Japonês</option>
                        <option value="fr">Francês</option>
                    </select>
                </div>
            </div>

            <div class="translation-panels">
                <div class="panel source">
                    <textarea id="source-text" placeholder="Digite o texto aqui..." oninput="updateCharCount()"></textarea>
                    <div class="panel-footer">
                        <span id="char-count">0 / 5000</span>
                        <div class="panel-actions">
                            <button class="action-btn" id="mic-btn" onclick="toggleSpeechRecognition()" title="Digitar por voz">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                                Falar
                            </button>
                            <button class="action-btn" onclick="speakSourceText()" title="Ouvir original">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                Ouvir
                            </button>
                            <button class="action-btn" onclick="clearText()" title="Limpar">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                Limpar
                            </button>
                        </div>
                    </div>
                </div>

                <div class="panel target">
                    <div id="target-text" class="output-box" style="color: #666;">A tradução aparecerá aqui...</div>
                    <div class="panel-footer">
                        <span></span>
                        <div class="panel-actions">
                            <button class="action-btn" onclick="speakTargetText()" title="Ouvir tradução">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                Ouvir
                            </button>
                            <button class="action-btn" onclick="shareTranslation()" title="Compartilhar tradução">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                                Compartilhar
                            </button>
                            <button class="action-btn" onclick="copyTranslation()" title="Copiar">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="translate-action-bar">
                <button class="btn-translate" onclick="performTranslation()">Traduzir</button>
            </div>
        </div>
    </main>

    <script>
        function updateCharCount() {
            const text = document.getElementById('source-text').value;
            document.getElementById('char-count').innerText = `${text.length} / 5000`;
        }

        function clearText() {
            document.getElementById('source-text').value = '';
            document.getElementById('target-text').innerText = 'A tradução aparecerá aqui...';
            document.getElementById('target-text').style.color = '#666';
            updateCharCount();
        }

        function swapLanguages() {
            const sourceSelect = document.getElementById('source-lang');
            const targetSelect = document.getElementById('target-lang');
            
            const temp = sourceSelect.value;
            sourceSelect.value = targetSelect.value;
            targetSelect.value = temp;

            const sourceText = document.getElementById('source-text');
            const targetText = document.getElementById('target-text');
            if (targetText.innerText !== 'A tradução aparecerá aqui...') {
                const tempText = sourceText.value;
                sourceText.value = targetText.innerText;
                targetText.innerText = tempText;
            }
        }

        function copyTranslation() {
            const textToCopy = document.getElementById('target-text').innerText;
            if (textToCopy && textToCopy !== 'A tradução aparecerá aqui...') {
                navigator.clipboard.writeText(textToCopy);
                alert('Tradução copiada para a área de transferência!');
            }
        }

        function shareTranslation() {
            const textToShare = document.getElementById('target-text').innerText;
            if (textToShare && textToShare !== 'A tradução aparecerá aqui...') {
                if (navigator.share) {
                    navigator.share({
                        title: 'Tradução',
                        text: textToShare
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(textToShare);
                    alert('Link/Texto copiado para compartilhamento!');
                }
            }
        }

        let recognition = null;
        let isListening = false;

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Seu navegador não suporta reconhecimento de voz.');
                return;
            }

            const micBtn = document.getElementById('mic-btn');

            if (isListening) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('source-lang').value;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                const sourceText = document.getElementById('source-text');
                sourceText.value = sourceText.value ? sourceText.value + ' ' + speechResult : speechResult;
                updateCharCount();
            };

            recognition.onerror = function() {
                stopMicState();
            };

            recognition.onend = function() {
                stopMicState();
            };

            recognition.start();
        }

        function stopMicState() {
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) micBtn.classList.remove('listening');
        }

        function speakText(text, lang) {
            if (!text || text.trim() === '' || text === 'A tradução aparecerá aqui...') return;
            if (!('speechSynthesis' in window)) {
                alert('Seu navegador não suporta recurso de áudio/fala.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        function speakSourceText() {
            const text = document.getElementById('source-text').value;
            const lang = document.getElementById('source-lang').value;
            speakText(text, lang);
        }

        function speakTargetText() {
            const text = document.getElementById('target-text').innerText;
            const lang = document.getElementById('target-lang').value;
            speakText(text, lang);
        }

        async function performTranslation() {
            const query = document.getElementById('source-text').value.trim();
            const sourceLang = document.getElementById('source-lang').value;
            const targetLang = document.getElementById('target-lang').value;
            const targetBox = document.getElementById('target-text');

            if (!query) {
                alert('Por favor, digite algum texto para traduzir.');
                return;
            }

            targetBox.style.color = '#888';
            targetBox.innerText = 'Traduzindo...';

            const pair = `${sourceLang}|${targetLang}`;
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(query)}&langpair=${pair}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData) {
                    targetBox.style.color = '#222';
                    targetBox.innerText = data.responseData.translatedText;
                } else {
                    targetBox.style.color = 'red';
                    targetBox.innerText = 'Erro ao processar a tradução.';
                }
            } catch (error) {
                targetBox.style.color = 'red';
                targetBox.innerText = 'Falha de conexão com o serviço de tradução.';
            }
        }
    </script>
</body>
</html>
