<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes e FAB Modal com Font Awesome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container dos iframes */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 53px);
            position: relative;
            overflow: hidden;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .tab-iframe.active {
            display: block;
        }

        /* Botão Flutuante (FAB) de Extras */
        .fab-extras {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background-color: #8A2BE2;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .fab-extras:hover {
            background-color: #721bc4;
            transform: scale(1.05);
        }

        /* Menu Modal Flutuante */
        .extras-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .extras-modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .extras-modal-content {
            background-color: #ffffff;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .extras-modal-overlay.active .extras-modal-content {
            transform: scale(1);
        }

        .extras-modal-header {
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 700;
            color: #161823;
            border-bottom: 1px solid #efefef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .extras-modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #8a8a8a;
        }

        .extras-modal-close:hover {
            color: #161823;
        }

        /* Lista Vertical dentro do Modal */
        .extras-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .extras-item {
            padding: 16px 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            border-bottom: 1px solid #f2f2f2;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s, color 0.2s;
        }

        .extras-item:last-child {
            border-bottom: none;
        }

        .extras-item:hover {
            background-color: #f8f0ff;
            color: #8A2BE2;
        }

        .extras-item.active {
            background-color: #f2e6ff;
            color: #8A2BE2;
            font-weight: 600;
        }

        /* Estilo para os ícones Font Awesome */
        .extras-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-calculadora" data-index="0">Calculadora</li>
            <li class="tiktok-tab-item" data-target="iframe-mapas" data-index="1">Mapas</li>
            <li class="tiktok-tab-item" data-target="iframe-tradutor" data-index="2">Tradutor</li>
            <li class="tiktok-tab-item" data-target="iframe-calendario" data-index="3">Calendário</li>
            <li class="tiktok-tab-item" data-target="iframe-scrapbook" data-index="4">Scrapbook</li>
            <li class="tiktok-tab-item" data-target="iframe-signo" data-index="5">Signo</li>
            <li class="tiktok-tab-item" data-target="iframe-numerologia" data-index="6">Numerologia</li>
            <li class="tiktok-tab-item" data-target="iframe-dicionario" data-index="7">Dicionário</li>
            <li class="tiktok-tab-item" data-target="iframe-enciclopedia" data-index="8">Enciclopédia</li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-calculadora" class="tab-iframe active" src="Tols/Calculadora.html"></iframe>
        <iframe id="iframe-mapas" class="tab-iframe" src="Tols/mapas.html"></iframe>
        <iframe id="iframe-tradutor" class="tab-iframe" src="Tols/tradutor.html"></iframe>
        <iframe id="iframe-calendario" class="tab-iframe" src="Tols/Calendario.html"></iframe>
        <iframe id="iframe-scrapbook" class="tab-iframe" src="Tols/scrapbook.html"></iframe>
        <iframe id="iframe-signo" class="tab-iframe" src="Tols/Signo.html"></iframe>
        <iframe id="iframe-numerologia" class="tab-iframe" src="Tols/Numerologia.html"></iframe>
        <iframe id="iframe-dicionario" class="tab-iframe" src="Tols/dicionario.html"></iframe>
        <iframe id="iframe-enciclopedia" class="tab-iframe" src="Tols/enciclopedia.html"></iframe>
        
        <iframe id="iframe-estudio" class="tab-iframe" src="Tols/estudio.html"></iframe>
        <iframe id="iframe-gamemaker" class="tab-iframe" src="Tols/gameMaker.html"></iframe>
        <iframe id="iframe-midia" class="tab-iframe" src="Tols/Midia.html"></iframe>
    </div>

    <button id="fabExtrasBtn" class="fab-extras" title="Extras"><i class="fas fa-plus"></i></button>

    <div id="extrasModal" class="extras-modal-overlay">
        <div class="extras-modal-content">
            <div class="extras-modal-header">
                <span>Recursos Extras</span>
                <button id="closeModalBtn" class="extras-modal-close">&times;</button>
            </div>
            <ul class="extras-list">
                <li class="extras-item" data-target="iframe-estudio">
                    <span class="icon"><i class="fas fa-palette"></i></span> estudio
                </li>
                <li class="extras-item" data-target="iframe-gamemaker">
                    <span class="icon"><i class="fas fa-gamepad"></i></span> gameMaker
                </li>
                <li class="extras-item" data-target="iframe-midia">
                    <span class="icon"><i class="fas fa-photo-film"></i></span> Midia
                </li>
            </ul>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        const fabBtn = document.getElementById('fabExtrasBtn');
        const extrasModal = document.getElementById('extrasModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const extraItems = document.querySelectorAll('.extras-item');
        
        let currentIndex = 0;

        // Lógica da Top Tab Bar principal
        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                if (index === currentIndex && tab.classList.contains('active')) return;

                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);

                // Remove classes ativas de tudo (abas e extras)
                tabs.forEach(t => t.classList.remove('active'));
                extraItems.forEach(e => e.classList.remove('active'));
                iframes.forEach(frame => frame.classList.remove('active'));

                // Ativa a aba clicada e o iframe correspondente
                tab.classList.add('active');
                targetIframe.classList.add('active');

                currentIndex = index;
            });
        });

        // Abrir o Modal ao clicar no FAB
        fabBtn.addEventListener('click', () => {
            extrasModal.classList.add('active');
        });

        // Fechar o Modal pelo botão "X"
        closeModalBtn.addEventListener('click', () => {
            extrasModal.classList.remove('active');
        });

        // Fechar o Modal clicando no fundo escuro (overlay)
        extrasModal.addEventListener('click', (e) => {
            if (e.target === extrasModal) {
                extrasModal.classList.remove('active');
            }
        });

        // Lógica de seleção dos recursos extras no modal
        extraItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetId = item.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);

                // 1. Desativa a toptabbar que estava ativa anteriormente
                tabs.forEach(t => t.classList.remove('active'));
                
                // 2. Remove o destaque dos outros itens extras e marca este como ativo
                extraItems.forEach(e => e.classList.remove('active'));
                item.classList.add('active');

                // 3. Esconde todos os iframes e exibe o correspondente ao extra selecionado
                iframes.forEach(frame => frame.classList.remove('active'));
                targetIframe.classList.add('active');

                // Fecha o modal após a seleção
                extrasModal.classList.remove('active');
            });
        });
    </script>

</body>
</html>
