<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes e Font Awesome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
            user-select: none;
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Estilos específicos para o Dropdown "Outros" */
        .dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Usamos position: fixed para evitar corte pelo overflow-x */
        .dropdown-menu {
            display: none;
            position: fixed;
            background-color: #ffffff;
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15);
            border: 1px solid #efefef;
            border-radius: 8px;
            padding: 8px 0;
            z-index: 9999;
            list-style: none;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #8a8a8a;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .dropdown-item:hover {
            background-color: #f8f8f8;
            color: #161823;
        }

        .dropdown-item.active {
            color: #8A2BE2;
            font-weight: 600;
            background-color: #f0e6fa;
        }

        /* Container dos iframes */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 53px);
            position: relative;
            overflow: hidden;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .tab-iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-calculadora">Calculadora</li>
            <li class="tiktok-tab-item" data-target="iframe-mapas">Mapas</li>
            <li class="tiktok-tab-item" data-target="iframe-tradutor">Tradutor</li>
            <li class="tiktok-tab-item" data-target="iframe-calendario">Calendário</li>
            <li class="tiktok-tab-item" data-target="iframe-signo">Signo</li>
            <li class="tiktok-tab-item" data-target="iframe-numerologia">Numerologia</li>
            <li class="tiktok-tab-item" data-target="iframe-dicionario">Dicionário</li>
            <li class="tiktok-tab-item" data-target="iframe-enciclopedia">Enciclopédia</li>
            
            <li class="tiktok-tab-item" id="dropdown-parent">
                <div class="dropdown-toggle" id="dropdown-btn">
                    <span>Outros</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i>
                </div>
                <ul class="dropdown-menu" id="dropdown-menu">
                    <li class="dropdown-item" data-target="iframe-clima">Clima</li>
                    <li class="dropdown-item" data-target="iframe-cotacao">Cotação</li>
                    <li class="dropdown-item" data-target="iframe-placares">Placares</li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-calculadora" class="tab-iframe active" src="Tols/Calculadora.html"></iframe>
        <iframe id="iframe-mapas" class="tab-iframe" src="Tols/mapas.html"></iframe>
        <iframe id="iframe-tradutor" class="tab-iframe" src="Tols/tradutor.html"></iframe>
        <iframe id="iframe-calendario" class="tab-iframe" src="Tols/Calendario.html"></iframe>    
        <iframe id="iframe-signo" class="tab-iframe" src="Tols/Signo.html"></iframe>
        <iframe id="iframe-numerologia" class="tab-iframe" src="Tols/Numerologia.html"></iframe>
        <iframe id="iframe-dicionario" class="tab-iframe" src="Tols/dicionario.html"></iframe>
        <iframe id="iframe-enciclopedia" class="tab-iframe" src="Tols/enciclopedia.html"></iframe>
        
        <iframe id="iframe-clima" class="tab-iframe" src="Tols/Outros/clima.html"></iframe>
        <iframe id="iframe-cotacao" class="tab-iframe" src="Tols/Outros/cotacao.html"></iframe>
        <iframe id="iframe-placares" class="tab-iframe" src="Tols/Outros/placares.html"></iframe>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item:not(#dropdown-parent)');
        const dropdownItems = document.querySelectorAll('.dropdown-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        
        const dropdownBtn = document.getElementById('dropdown-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const dropdownParent = document.getElementById('dropdown-parent');

        // Limpa seleções ativas
        function clearActiveStates() {
            tabs.forEach(t => t.classList.remove('active'));
            dropdownItems.forEach(d => d.classList.remove('active'));
            dropdownParent.classList.remove('active');
            iframes.forEach(frame => frame.classList.remove('active'));
        }

        // Ativa o iframe selecionado
        function activateIframe(targetId) {
            const targetIframe = document.getElementById(targetId);
            if (targetIframe) {
                targetIframe.classList.add('active');
            }
        }

        // Clique nas abas comuns
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                clearActiveStates();
                tab.classList.add('active');
                
                const targetId = tab.getAttribute('data-target');
                activateIframe(targetId);
                
                dropdownMenu.classList.remove('show');
            });
        });

        // Toggle do Dropdown + Posicionamento Dinâmico
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            
            const isShowing = dropdownMenu.classList.contains('show');
            
            if (!isShowing) {
                // Calcula a posição do botão na tela para colar o menu logo abaixo dele
                const rect = dropdownBtn.getBoundingClientRect();
                dropdownMenu.style.top = `${rect.bottom + 6}px`;
                dropdownMenu.style.left = `${rect.left}px`;
                dropdownMenu.classList.add('show');
            } else {
                dropdownMenu.classList.remove('show');
            }
        });

        // Clique nos itens do Dropdown
        dropdownItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                clearActiveStates();

                item.classList.add('active');
                dropdownParent.classList.add('active');

                const targetId = item.getAttribute('data-target');
                activateIframe(targetId);

                dropdownMenu.classList.remove('show');
            });
        });

        // Fecha o menu ao clicar fora ou rolar a página
        window.addEventListener('click', () => dropdownMenu.classList.remove('show'));
        window.addEventListener('resize', () => dropdownMenu.classList.remove('show'));
    </script>

</body>
</html>
