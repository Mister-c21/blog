<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio</title>
    <style>
        /* Garante que o html e o body ocupem 100% da tela e sem rolagem externa */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: relative;
            z-index: 1000;
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2;
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container dos iframes usando Flexbox para ocupar exatamente o restante da tela */
        .tab-content-container {
            width: 100%;
            height: calc(100% - 53px); /* Subtrai a altura exata aproximada da barra de navegação */
            position: relative;
            overflow: hidden;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .tab-iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-desenho" data-index="0">Desenho</li>
            <li class="tiktok-tab-item" data-target="iframe-pixelart" data-index="1">Pixel Art</li>
            <li class="tiktok-tab-item" data-target="iframe-modelagem3d" data-index="2">Modelagem 3D</li>
            <li class="tiktok-tab-item" data-target="iframe-TxtEditor" data-index="3">Editor de Texto</li>
            <li class="tiktok-tab-item" data-target="iframe-Planilhas" data-index="4">Planilhas</li>
   
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-desenho" class="tab-iframe active" src="Telas/desenho.html"></iframe>
        <iframe id="iframe-pixelart" class="tab-iframe" src="Telas/pixelart.html"></iframe>
        <iframe id="iframe-modelagem3d" class="tab-iframe" src="Telas/modelagem3d.html"></iframe>    
        <iframe id="iframe-TxtEditor" class="tab-iframe" src="Telas/TextEditor.html"></iframe>    
        <iframe id="iframe-Planilhas" class="tab-iframe" src="Telas/Planilhas.html"></iframe>    
   
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        let currentIndex = 0;

        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                const index = parseInt(tab.getAttribute('data-index'));
                if (index === currentIndex) return;

                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);

                tabs.forEach(t => t.classList.remove('active'));
                iframes.forEach(frame => frame.classList.remove('active'));

                tab.classList.add('active');
                targetIframe.classList.add('active');

                currentIndex = index;
            });
        });
    </script>

</body>
</html>
