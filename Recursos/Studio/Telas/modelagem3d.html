<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor 3D Avançado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f0eef6;
            --panel: #ffffff;
            --panel-2: #f4f1fa;
            --text: #1a1625;
            --muted: #6b6280;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --danger: #ef4444;
            --border: #e0d9ef;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 64px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 10px;
            border-right: 1px solid var(--border);
            z-index: 20;
            box-shadow: 2px 0 12px rgba(124, 58, 237, 0.05);
        }

        .tool-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--muted);
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .tool-btn:hover {
            background: #ebe4f7;
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
        }

        .tool-btn.danger:hover {
            background: #fee2e2;
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ===== MAIN ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }

        .topbar {
            height: 52px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .topbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border);
            border-radius: 50%;
        }

        input[type="range"] {
            width: 80px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .action-btn {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #ebe4f7;
            border-color: var(--accent);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .action-btn.primary:hover {
            background: var(--accent-hover);
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* ===== RIGHT PANEL ===== */
        .panels-sidebar {
            width: 270px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 7px;
            margin-bottom: 2px;
        }

        .elements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mesh-btn {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 8px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.18s;
        }

        .mesh-btn:hover {
            background: #ebe4f7;
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .status-info {
            font-size: 0.78rem;
            color: var(--muted);
            background: var(--panel-2);
            padding: 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            line-height: 1.5;
        }

        .object-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .object-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .object-item:hover {
            border-color: var(--accent);
        }

        .object-item.selected {
            background: #ede9fe;
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .object-item .delete-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .object-item .delete-btn:hover {
            color: var(--danger);
            background: #fee2e2;
        }

        /* ===== FLOATING MENU (mobile only) ===== */
        .mobile-header-btn {
            display: none;
        }

        .floating-menu {
            display: none;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 860px) {
            body { flex-direction: column; }

            .sidebar {
                width: 92%;
                max-width: 420px;
                height: 56px;
                flex-direction: row;
                justify-content: center;
                gap: 8px;
                padding: 0 10px;
                border: 1px solid var(--border);
                border-radius: 28px;
                position: fixed;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
                background: rgba(255,255,255,0.92);
                backdrop-filter: blur(12px);
                box-shadow: 0 10px 30px rgba(124, 58, 237, 0.18);
            }

            /* Esconde o topbar original no mobile */
            .topbar {
                display: none !important;
            }

            /* Botão flutuante para abrir o menu */
            .mobile-header-btn {
                display: flex;
                position: fixed;
                top: 16px;
                right: 16px;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--accent);
                color: white;
                border: none;
                font-size: 1.15rem;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 1100;
                box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
                transition: transform 0.2s, background 0.2s;
            }

            .mobile-header-btn:active {
                transform: scale(0.94);
            }

            .mobile-header-btn.open {
                background: var(--accent-hover);
            }

            /* Menu flutuante */
            .floating-menu {
                display: none;
                position: fixed;
                top: 76px;
                right: 16px;
                width: min(300px, calc(100vw - 32px));
                background: rgba(255, 255, 255, 0.97);
                backdrop-filter: blur(16px);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 18px;
                z-index: 1090;
                box-shadow: 0 12px 40px rgba(124, 58, 237, 0.18);
                flex-direction: column;
                gap: 16px;
                animation: floatIn 0.22s ease;
            }

            .floating-menu.open {
                display: flex;
            }

            @keyframes floatIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px) scale(0.96);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .floating-menu .menu-title {
                font-size: 0.78rem;
                font-weight: 700;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: -4px;
            }

            .floating-menu .control-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                font-size: 0.85rem;
            }

            .floating-menu .control-row label {
                color: var(--muted);
                font-weight: 600;
                min-width: 60px;
            }

            .floating-menu input[type="range"] {
                flex: 1;
                width: auto;
            }

            .floating-menu .actions {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-top: 4px;
            }

            .floating-menu .action-btn {
                width: 100%;
                justify-content: center;
                padding: 10px;
            }

            .panels-sidebar {
                position: absolute;
                right: 0;
                top: 0;
                width: 260px;
                height: 100%;
                background: rgba(255,255,255,0.97);
                backdrop-filter: blur(8px);
                z-index: 30;
                transform: translateX(100%);
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .panels-sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- LEFT TOOLBAR -->
    <div class="sidebar">
        <button class="tool-btn active" title="Órbita (Câmera)" data-mode="orbit" onclick="setMode('orbit')">
            <i class="fa-solid fa-arrows-rotate"></i>
        </button>
        <button class="tool-btn" title="Rotacionar Objeto" data-mode="rotate" onclick="setMode('rotate')">
            <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="tool-btn" title="Escalar Objeto" data-mode="scale" onclick="setMode('scale')">
            <i class="fa-solid fa-expand"></i>
        </button>
        <button class="tool-btn" title="Mover Objeto" data-mode="translate" onclick="setMode('translate')">
            <i class="fa-solid fa-up-down-left-right"></i>
        </button>
        <button class="tool-btn" title="Duplicar" onclick="duplicateSelected()">
            <i class="fa-solid fa-clone"></i>
        </button>
        <button class="tool-btn danger" title="Deletar" onclick="deleteSelected()">
            <i class="fa-solid fa-trash"></i>
        </button>
        <button class="tool-btn mobile-layers-btn" title="Painel" onclick="toggleMobileSidebar()">
            <i class="fa-solid fa-cube"></i>
        </button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <!-- Topbar (desktop only) -->
        <div class="topbar">
            <div class="topbar-group">
                <label>Cor</label>
                <input type="color" id="objectColor" value="#7c3aed" onchange="updateMaterial()">

                <label>Wire</label>
                <input type="checkbox" id="wireframe" onchange="updateMaterial()">

                <label>Metal</label>
                <input type="range" id="metalness" min="0" max="1" step="0.05" value="0.2" oninput="updateMaterial()">

                <label>Rough</label>
                <input type="range" id="roughness" min="0" max="1" step="0.05" value="0.35" oninput="updateMaterial()">
            </div>

            <div class="topbar-group">
                <button class="action-btn" onclick="resetCamera()">
                    <i class="fa-solid fa-camera"></i> Reset Câmera
                </button>
                <button class="action-btn primary" onclick="exportOBJ()">
                    <i class="fa-solid fa-download"></i> Exportar OBJ
                </button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="webgl-canvas"></canvas>
        </div>
    </div>

    <!-- Botão flutuante + Menu (só aparece no mobile via CSS) -->
    <button class="mobile-header-btn" id="mobileHeaderBtn" onclick="toggleFloatingMenu()" title="Opções">
        <i class="fa-solid fa-sliders"></i>
    </button>

    <div class="floating-menu" id="floatingMenu">
        <div class="menu-title">Material</div>

        <div class="control-row">
            <label>Cor</label>
            <input type="color" id="objectColorMobile" value="#7c3aed" onchange="syncAndUpdate(this, 'objectColor')">
        </div>

        <div class="control-row">
            <label>Wireframe</label>
            <input type="checkbox" id="wireframeMobile" onchange="syncAndUpdate(this, 'wireframe')">
        </div>

        <div class="control-row">
            <label>Metalness</label>
            <input type="range" id="metalnessMobile" min="0" max="1" step="0.05" value="0.2" oninput="syncAndUpdate(this, 'metalness')">
        </div>

        <div class="control-row">
            <label>Roughness</label>
            <input type="range" id="roughnessMobile" min="0" max="1" step="0.05" value="0.35" oninput="syncAndUpdate(this, 'roughness')">
        </div>

        <div class="menu-title">Ações</div>
        <div class="actions">
            <button class="action-btn" onclick="resetCamera(); toggleFloatingMenu();">
                <i class="fa-solid fa-camera"></i> Reset Câmera
            </button>
            <button class="action-btn primary" onclick="exportOBJ(); toggleFloatingMenu();">
                <i class="fa-solid fa-download"></i> Exportar OBJ
            </button>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panels-sidebar" id="panelsSidebar">
        <div class="panel-title">Criar Primitivas</div>
        <div class="elements-grid">
            <button class="mesh-btn" onclick="addMesh('box')"><i class="fa-solid fa-cube"></i> Cubo</button>
            <button class="mesh-btn" onclick="addMesh('sphere')"><i class="fa-solid fa-globe"></i> Esfera</button>
            <button class="mesh-btn" onclick="addMesh('cylinder')"><i class="fa-solid fa-database"></i> Cilindro</button>
            <button class="mesh-btn" onclick="addMesh('cone')"><i class="fa-solid fa-mountain"></i> Cone</button>
            <button class="mesh-btn" onclick="addMesh('torus')"><i class="fa-solid fa-ring"></i> Toro</button>
            <button class="mesh-btn" onclick="addMesh('plane')"><i class="fa-solid fa-square"></i> Plano</button>
        </div>

        <div class="panel-title">Objetos na Cena</div>
        <div class="object-list" id="objectList"></div>

        <div class="panel-title">Ajuda</div>
        <div class="status-info">
            • <b>Órbita</b>: arraste para girar a câmera<br>
            • <b>Scroll / Pinça</b>: zoom<br>
            • <b>Shift + Arrastar</b>: pan<br>
            • Clique no objeto para selecionar<br>
            • Use os modos de transformação na barra lateral
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== STATE ====================
        let scene, camera, renderer, raycaster, mouse;
        let objects = [];
        let selected = null;
        let mode = 'orbit';

        // Orbit controls state
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let spherical = { theta: 0.4, phi: 1.2, radius: 6 };
        let target = new THREE.Vector3(0, 0.5, 0);
        let panOffset = new THREE.Vector3();

        // ==================== INIT ====================
        function init() {
            const container = document.querySelector('.canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0eef6);

            camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 200);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('webgl-canvas'),
                antialias: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambient);

            const dir = new THREE.DirectionalLight(0xffffff, 0.9);
            dir.position.set(6, 12, 8);
            dir.castShadow = true;
            dir.shadow.mapSize.set(1024, 1024);
            dir.shadow.camera.near = 0.5;
            dir.shadow.camera.far = 40;
            dir.shadow.camera.left = -10;
            dir.shadow.camera.right = 10;
            dir.shadow.camera.top = 10;
            dir.shadow.camera.bottom = -10;
            scene.add(dir);

            // Helpers
            const grid = new THREE.GridHelper(20, 20, 0xc4b5fd, 0xe0d9ef);
            grid.position.y = 0;
            scene.add(grid);

            const axes = new THREE.AxesHelper(1.5);
            scene.add(axes);

            // Ground plane (invisible for shadows)
            const groundGeo = new THREE.PlaneGeometry(30, 30);
            const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Start with a cube
            addMesh('box');

            setupEvents();
            animate();
            window.addEventListener('resize', onResize);

            // Fecha o menu flutuante ao clicar fora
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('floatingMenu');
                const btn = document.getElementById('mobileHeaderBtn');
                if (menu.classList.contains('open') && 
                    !menu.contains(e.target) && 
                    !btn.contains(e.target)) {
                    toggleFloatingMenu(false);
                }
            });
        }

        // ==================== FLOATING MENU ====================
        function toggleFloatingMenu(force) {
            const menu = document.getElementById('floatingMenu');
            const btn = document.getElementById('mobileHeaderBtn');
            const isOpen = force !== undefined ? force : !menu.classList.contains('open');

            menu.classList.toggle('open', isOpen);
            btn.classList.toggle('open', isOpen);

            // Sincroniza valores ao abrir
            if (isOpen) {
                document.getElementById('objectColorMobile').value = document.getElementById('objectColor').value;
                document.getElementById('wireframeMobile').checked = document.getElementById('wireframe').checked;
                document.getElementById('metalnessMobile').value = document.getElementById('metalness').value;
                document.getElementById('roughnessMobile').value = document.getElementById('roughness').value;
            }
        }

        function syncAndUpdate(el, desktopId) {
            const desktop = document.getElementById(desktopId);
            if (el.type === 'checkbox') {
                desktop.checked = el.checked;
            } else {
                desktop.value = el.value;
            }
            updateMaterial();
        }

        // ==================== CAMERA ====================
        function updateCameraPosition() {
            const x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            const y = spherical.radius * Math.cos(spherical.phi);
            const z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);

            camera.position.set(
                target.x + x + panOffset.x,
                target.y + y + panOffset.y,
                target.z + z + panOffset.z
            );
            camera.lookAt(target.clone().add(panOffset));
        }

        function resetCamera() {
            spherical = { theta: 0.4, phi: 1.2, radius: 6 };
            target.set(0, 0.5, 0);
            panOffset.set(0, 0, 0);
            updateCameraPosition();
        }

        // ==================== MESHES ====================
        function createGeometry(type) {
            switch (type) {
                case 'box':      return new THREE.BoxGeometry(1.4, 1.4, 1.4);
                case 'sphere':   return new THREE.SphereGeometry(0.9, 48, 48);
                case 'cylinder': return new THREE.CylinderGeometry(0.7, 0.7, 1.8, 48);
                case 'cone':     return new THREE.ConeGeometry(0.85, 1.8, 48);
                case 'torus':    return new THREE.TorusGeometry(0.85, 0.32, 24, 64);
                case 'plane':    return new THREE.PlaneGeometry(2.5, 2.5);
                default:         return new THREE.BoxGeometry(1.4, 1.4, 1.4);
            }
        }

        function addMesh(type) {
            const geo = createGeometry(type);
            const color = document.getElementById('objectColor').value;
            const wire = document.getElementById('wireframe').checked;
            const metal = parseFloat(document.getElementById('metalness').value);
            const rough = parseFloat(document.getElementById('roughness').value);

            const mat = new THREE.MeshStandardMaterial({
                color: color,
                wireframe: wire,
                metalness: metal,
                roughness: rough,
                side: type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                type: type,
                name: `${type.charAt(0).toUpperCase() + type.slice(1)} ${objects.length + 1}`
            };

            mesh.position.set(
                (Math.random() - 0.5) * 1.5,
                type === 'plane' ? 0.01 : 0.9,
                (Math.random() - 0.5) * 1.5
            );

            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
            updateObjectList();
        }

        function selectObject(mesh) {
            if (selected) {
                selected.material.emissive?.setHex(0x000000);
            }

            selected = mesh;

            if (selected) {
                if (!selected.material.emissive) {
                    selected.material.emissive = new THREE.Color(0x000000);
                }
                selected.material.emissive.setHex(0x222244);

                const hex = '#' + selected.material.color.getHexString();
                document.getElementById('objectColor').value = hex;
                document.getElementById('objectColorMobile').value = hex;
                document.getElementById('wireframe').checked = selected.material.wireframe;
                document.getElementById('wireframeMobile').checked = selected.material.wireframe;
                document.getElementById('metalness').value = selected.material.metalness;
                document.getElementById('metalnessMobile').value = selected.material.metalness;
                document.getElementById('roughness').value = selected.material.roughness;
                document.getElementById('roughnessMobile').value = selected.material.roughness;
            }

            updateObjectList();
        }

        function updateMaterial() {
            if (!selected) return;
            selected.material.color.set(document.getElementById('objectColor').value);
            selected.material.wireframe = document.getElementById('wireframe').checked;
            selected.material.metalness = parseFloat(document.getElementById('metalness').value);
            selected.material.roughness = parseFloat(document.getElementById('roughness').value);
        }

        function deleteSelected() {
            if (!selected) return;
            scene.remove(selected);
            objects = objects.filter(o => o !== selected);
            selected = null;
            updateObjectList();
        }

        function duplicateSelected() {
            if (!selected) return;
            const clone = selected.clone();
            clone.material = selected.material.clone();
            clone.position.x += 1.2;
            clone.userData = {
                type: selected.userData.type,
                name: selected.userData.name + ' (cópia)'
            };
            scene.add(clone);
            objects.push(clone);
            selectObject(clone);
            updateObjectList();
        }

        function updateObjectList() {
            const list = document.getElementById('objectList');
            list.innerHTML = '';

            if (objects.length === 0) {
                list.innerHTML = '<div style="font-size:0.78rem;color:var(--muted);padding:8px;">Nenhum objeto</div>';
                return;
            }

            objects.forEach((obj) => {
                const item = document.createElement('div');
                item.className = 'object-item' + (obj === selected ? ' selected' : '');
                item.innerHTML = `
                    <span>${obj.userData.name}</span>
                    <button class="delete-btn" title="Deletar"><i class="fa-solid fa-xmark"></i></button>
                `;
                item.onclick = (e) => {
                    if (e.target.closest('.delete-btn')) {
                        scene.remove(obj);
                        objects = objects.filter(o => o !== obj);
                        if (selected === obj) selected = null;
                        updateObjectList();
                    } else {
                        selectObject(obj);
                    }
                };
                list.appendChild(item);
            });
        }

        // ==================== MODES ====================
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.sidebar .tool-btn[data-mode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === newMode);
            });
        }

        function toggleMobileSidebar() {
            document.getElementById('panelsSidebar').classList.toggle('open');
        }

        // ==================== INTERACTIONS ====================
        function setupEvents() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            canvas.addEventListener('dblclick', onDoubleClick);

            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp);
        }

        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function onPointerDown(e) {
            isDragging = true;
            const pos = getPointerPos(e);
            previousMouse = { x: pos.x, y: pos.y };

            if (mode === 'orbit' && !e.shiftKey) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((pos.x - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((pos.y - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(objects);
                if (hits.length > 0) {
                    selectObject(hits[0].object);
                }
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const pos = getPointerPos(e);
            const dx = pos.x - previousMouse.x;
            const dy = pos.y - previousMouse.y;

            if (mode === 'orbit') {
                if (e.shiftKey || (e.touches && e.touches.length === 2)) {
                    const panSpeed = 0.004 * spherical.radius;
                    const right = new THREE.Vector3();
                    const up = new THREE.Vector3(0, 1, 0);
                    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), up).normalize();
                    panOffset.add(right.multiplyScalar(-dx * panSpeed));
                    panOffset.y += dy * panSpeed;
                } else {
                    spherical.theta -= dx * 0.007;
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.007));
                }
                updateCameraPosition();
            } else if (selected) {
                if (mode === 'rotate') {
                    selected.rotation.y += dx * 0.012;
                    selected.rotation.x += dy * 0.012;
                } else if (mode === 'scale') {
                    const factor = 1 + dx * 0.006;
                    const s = Math.max(0.15, Math.min(6, selected.scale.x * factor));
                    selected.scale.setScalar(s);
                } else if (mode === 'translate') {
                    const speed = 0.008 * (spherical.radius / 6);
                    selected.position.x += dx * speed;
                    selected.position.y -= dy * speed;
                }
            }

            previousMouse = { x: pos.x, y: pos.y };
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onWheel(e) {
            e.preventDefault();
            spherical.radius += e.deltaY * 0.006;
            spherical.radius = Math.max(2, Math.min(25, spherical.radius));
            updateCameraPosition();
        }

        function onDoubleClick() {
            if (selected) {
                target.copy(selected.position);
                updateCameraPosition();
            }
        }

        let lastTouchDist = 0;
        function onTouchStart(e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                onPointerDown(e);
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
            }
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                onPointerMove(e);
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const delta = lastTouchDist - dist;
                spherical.radius += delta * 0.02;
                spherical.radius = Math.max(2, Math.min(25, spherical.radius));
                updateCameraPosition();
                lastTouchDist = dist;
            }
        }

        // ==================== EXPORT OBJ ====================
        function exportOBJ() {
            if (objects.length === 0) {
                alert('Nenhum objeto para exportar!');
                return;
            }

            let obj = '# Exported from Editor 3D\n';
            let vertexOffset = 1;

            objects.forEach((mesh, idx) => {
                const geo = mesh.geometry;
                const pos = geo.attributes.position;
                const matrix = mesh.matrixWorld;

                obj += `\no ${mesh.userData.name || 'Object_' + idx}\n`;

                for (let i = 0; i < pos.count; i++) {
                    const v = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(matrix);
                    obj += `v ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
                }

                if (geo.index) {
                    const idxAttr = geo.index;
                    for (let i = 0; i < idxAttr.count; i += 3) {
                        const a = idxAttr.getX(i) + vertexOffset;
                        const b = idxAttr.getX(i + 1) + vertexOffset;
                        const c = idxAttr.getX(i + 2) + vertexOffset;
                        obj += `f ${a} ${b} ${c}\n`;
                    }
                } else {
                    for (let i = 0; i < pos.count; i += 3) {
                        obj += `f ${i + vertexOffset} ${i + 1 + vertexOffset} ${i + 2 + vertexOffset}\n`;
                    }
                }

                vertexOffset += pos.count;
            });

            const blob = new Blob([obj], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cena-3d.obj';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==================== RESIZE & LOOP ====================
        function onResize() {
            const container = document.querySelector('.canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
