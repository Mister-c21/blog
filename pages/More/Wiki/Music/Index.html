<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Breve</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0614;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .container {
            padding: 2rem;
            z-index: 10;
            max-width: 600px;
        }

        /* Título Principal com Brilho Pulsante */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 20%, #c084fc 50%, #ffffff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s ease-in-out infinite alternate, glowPulse 2s ease-in-out infinite alternate;
        }

        /* Subtítulo Fluido com Efeito Blur na Entrada */
        p {
            font-size: 1.25rem;
            color: #e9d5ff;
            margin-bottom: 45px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: blurIn 1.2s ease-out 0.3s forwards;
        }

        /* Barra de Carregamento Dupla */
        .loader-container {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .loader-bar {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #a855f7, #ffffff, #a855f7, transparent);
            position: absolute;
            left: -100%;
            border-radius: 20px;
            animation: loading 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Animações CSS */
        @keyframes textShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4)); }
            100% { filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8)); }
        }

        @keyframes blurIn {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(10px);
            }
            100% {
                opacity: 0.9;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% { left: -60%; }
            100% { left: 100%; }
        }

        /* Orbes e Fundo Dinâmico */
        .orbs {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            top: -100px;
            left: -100px;
            background: rgba(168, 85, 247, 0.25);
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            bottom: -150px;
            right: -150px;
            background: rgba(126, 34, 206, 0.2);
            animation-duration: 14s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.05);
            animation-duration: 6s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(200px) scale(0.95); }
        }
    </style>
</head>
<body>

    <div class="orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <h1>Em Breve</h1>
        <p>Algo extraordinário está sendo construído.</p>
        
        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>
    </div>

</body>
</html>
