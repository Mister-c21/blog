<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        /* Caixa de entrada do texto */
        .gsc-control-cse .gsc-input-box {
            border-radius: 20px !important;
            overflow: hidden;
            transition: all 0.3s ease !important;
        }

        /* Efeito HOVER na caixa de busca */
        .gsc-control-cse .gsc-input-box:hover {
            border-color: #888 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
        }

        /* Efeito FOCUS na caixa de busca (quando o usuário clica/digita) */
        .gsc-control-cse .gsc-input-box:focus-within {
            border-color: #4285f4 !important;
            box-shadow: 0 2px 10px rgba(66, 133, 244, 0.3) !important;
        }

        /* Botão de busca */
        .gsc-control-cse .gsc-search-button-v2 {
            border-radius: 20px !important;
            transition: all 0.3s ease !important;
        }

        /* Efeito HOVER e FOCUS no botão */
        .gsc-control-cse .gsc-search-button-v2:hover,
        .gsc-control-cse .gsc-search-button-v2:focus {
            opacity: 0.85 !important;
            transform: scale(1.03);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <script async src="https://cse.google.com/cse.js?cx=4241717f32002490e"></script>
    <div class="gcse-search" data-linkTarget="_blank"></div>
  
</body>
</html>
