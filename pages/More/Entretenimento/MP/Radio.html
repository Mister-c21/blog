<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Rádio - Lista de Transmissões</title>
    <!-- Importando a fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Importando ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --text-secondary: #666666;
            --violet-primary: #7c3aed;
            --violet-light: #f3e8ff;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Container Principal */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        /* Bottom Tab Bar (Fixa na parte de baixo da tela) */
        .navigation-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.2rem;
            width: auto;
            text-align: center;
        }

        .nav-item:hover {
            color: var(--text-color);
        }

        .nav-item.active {
            color: var(--violet-primary);
        }

        /* Conteúdo Principal Centralizado */
        .main-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Top Tab Bars (Estilo TikTok) */
        .tabs-container {
            width: 100%;
            display: flex;
            gap: 24px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .tab-item {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-bottom: 10px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-item:hover {
            color: var(--text-color);
        }

        .tab-item.active {
            color: var(--violet-primary);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--violet-primary);
            border-radius: 3px 3px 0 0;
        }

        /* Lista de Faixas */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-item:hover {
            border-color: var(--violet-primary);
            background-color: var(--violet-light);
            transform: translateY(-2px);
        }

        .track-info h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .track-action {
            background-color: var(--violet-primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .track-item:hover .track-action {
            transform: scale(1.1);
        }

        /* Modais */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--violet-primary);
        }

        /* Caixa de Busca no Modal */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0 20px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .search-box:hover {
            border-color: var(--violet-primary);
        }

        .search-box:focus-within {
            border-color: var(--violet-primary);
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.3);
            background-color: var(--bg-color);
        }

        .search-box i.search-icon {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-right: 12px;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
        }

        .clear-search-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px;
            display: none;
            transition: color 0.2s;
        }

        .clear-search-btn:hover {
            color: var(--violet-primary);
        }

        .clear-search-btn.visible {
            display: block;
        }

        .modal-art {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--violet-primary), #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
        }

        .modal-song-info {
            margin-bottom: 24px;
        }

        .modal-song-info h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* Controles do Player */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .btn-control {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-control:hover {
            color: var(--violet-primary);
        }

        .btn-play {
            background-color: var(--violet-primary);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .btn-play:hover {
            transform: scale(1.05);
            background-color: #6d28d9;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        input[type="range"] {
            appearance: none;
            width: 130px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--violet-primary);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Conteúdo Principal -->
        <div class="main-content-wrapper">
            <!-- Top Tab Bars (Estilo TikTok) -->
            <div class="tabs-container">
                <button class="tab-item active" onclick="switchTab('brasil', this)">Brasil</button>
                <button class="tab-item" onclick="switchTab('internacional', this)">Internacional</button>
            </div>

            <!-- Lista de Faixas/Programas -->
            <main>
                <div class="track-list" id="track-list">
                    <!-- Item 1 (Brasil) -->
                    <div class="track-item" data-category="brasil" data-title="Rádio Principal - Ao Vivo" onclick="openPlayer('Rádio Principal - Ao Vivo', 'https://icecast.som1.com.br:8000/live')">
                        <div class="track-info">
                            <h3>Rádio Principal - Ao Vivo</h3>
                        </div>
                        <div class="track-action">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>

                    <!-- Item 2 (Internacional) -->
                    <div class="track-item" data-category="internacional" data-title="Lo-Fi & Study Beats" onclick="openPlayer('Lo-Fi & Study Beats', 'https://stream.zeno.fm/f3wvbbqmdg8uv')">
                        <div class="track-info">
                            <h3>Lo-Fi & Study Beats</h3>
                        </div>
                        <div class="track-action">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>

                    <!-- Item 3 (Internacional) -->
                    <div class="track-item" data-category="internacional" data-title="Rock Classics Session" onclick="openPlayer('Rock Classics Session', 'https://stream.zeno.fm/0r0xa3c5zxquv')">
                        <div class="track-info">
                            <h3>Rock Classics Session</h3>
                        </div>
                        <div class="track-action">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Bottom Tab Bar Fixa na Parte de Baixo (Play começa ativo) -->
        <nav class="navigation-bar" id="bottom-nav">
            <button class="nav-item" data-action="home" onclick="handleNavClick('home', this)">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item active" data-action="play" onclick="handleNavClick('play', this)">
                <i class="fa-solid fa-play"></i>
                <span>Play</span>
            </button>
            <button class="nav-item" data-action="search" onclick="handleNavClick('search', this)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Pesquisar</span>
            </button>
        </nav>
    </div>

    <!-- Modal de Pesquisa -->
    <div class="modal-overlay" id="search-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSearchModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Pesquisar Rádio</h3>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Buscar rádio ou gênero...">
                <button id="clear-search-btn" class="clear-search-btn" title="Limpar busca">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal do Player -->
    <div class="modal-overlay" id="player-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-art">
                <i class="fa-solid fa-music"></i>
            </div>
            
            <div class="modal-song-info">
                <h2 id="modal-title">Título da Rádio</h2>
            </div>

            <!-- Elemento de Áudio HTML5 -->
            <audio id="audio-stream" preload="none"></audio>

            <div class="controls">
                <button class="btn-control" id="mute-btn"><i class="fa-solid fa-volume-high"></i></button>
                <button class="btn-play" id="play-btn"><i class="fa-solid fa-play" id="play-icon"></i></button>
                <button class="btn-control" onclick="restartStream()"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div class="volume-container">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>
    </div>

    <!-- Script de Interação -->
    <script>
        let currentTab = 'brasil';

        function switchTab(category, btnElement) {
            currentTab = category;
            
            document.querySelectorAll('.tabs-container .tab-item').forEach(tab => tab.classList.remove('active'));
            btnElement.classList.add('active');

            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');

            filterTracks();
        }

        function activatePlayTab() {
            document.querySelectorAll('.navigation-bar .nav-item').forEach(item => item.classList.remove('active'));
            const playBtnNav = document.querySelector('.navigation-bar .nav-item[data-action="play"]');
            if (playBtnNav) playBtnNav.classList.add('active');
        }

        function handleNavClick(action, btnElement) {
            if (action === 'home') {
                window.location.href = '../Index.html';
                return;
            }

            document.querySelectorAll('.navigation-bar .nav-item').forEach(item => item.classList.remove('active'));
            btnElement.classList.add('active');

            if (action === 'play') {
                openPlayer('Rádio Principal - Ao Vivo', 'https://icecast.som1.com.br:8000/live');
            } else if (action === 'search') {
                openSearchModal();
            }
        }

        const searchModal = document.getElementById('search-modal');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const trackList = document.getElementById('track-list');
        const tracks = trackList.getElementsByClassName('track-item');

        function openSearchModal() {
            searchModal.classList.add('active');
            setTimeout(() => { searchInput.focus(); }, 100);
        }

        function closeSearchModal() {
            searchModal.classList.remove('active');
            activatePlayTab();
        }

        searchModal.addEventListener('click', (e) => {
            if (e.target === searchModal) {
                closeSearchModal();
            }
        });

        function filterTracks() {
            const query = searchInput.value.toLowerCase().trim();

            Array.from(tracks).forEach(track => {
                const category = track.getAttribute('data-category');
                const title = track.getAttribute('data-title').toLowerCase();

                const matchesTab = (category === currentTab);
                const matchesSearch = title.includes(query);

                if (matchesTab && matchesSearch) {
                    track.style.display = 'flex';
                } else {
                    track.style.display = 'none';
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                clearSearchBtn.classList.add('visible');
            } else {
                clearSearchBtn.classList.remove('visible');
            }
            filterTracks();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            filterTracks();
            searchInput.focus();
        });

        const modal = document.getElementById('player-modal');
        const audio = document.getElementById('audio-stream');
        const modalTitle = document.getElementById('modal-title');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        function openPlayer(title, streamUrl) {
            modalTitle.innerText = title;
            audio.src = streamUrl;
            
            modal.classList.add('active');
            
            audio.play().then(() => {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            }).catch(error => {
                console.log("Autoplay bloqueado ou erro na stream:", error);
            });
        }

        function closePlayer() {
            audio.pause();
            audio.src = "";
            modal.classList.remove('active');
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                });
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateVolumeIcon(audio.volume);
        });

        muteBtn.addEventListener('click', () => {
            if (audio.muted) {
                audio.muted = false;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                volumeSlider.value = audio.volume;
            } else {
                audio.muted = true;
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                volumeSlider.value = 0;
            }
        });

        function updateVolumeIcon(volume) {
            if (volume == 0) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        }

        function restartStream() {
            const currentSrc = audio.src;
            audio.src = "";
            audio.src = currentSrc;
            audio.play();
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closePlayer();
            }
        });
    </script>
</body>
</html>
