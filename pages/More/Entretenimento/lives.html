<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePlay-Lives</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blueviolet-color: #8a2be2;
            --ghost: #f8f8ff;
            --vidro: rgba(255, 255, 255, 0.1);
            --bg-dark: #0e0e10;
            --nav-width: 240px;
            --bottom-nav-height: 60px;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--ghost); 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 1.5s ease-in-out;
            padding-bottom: var(--bottom-nav-height);
        }

        body.modal-open { overflow: hidden; }

        .page-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* --- BARRA DE NAVEGAÇÃO --- */
        .navigation-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--bottom-nav-height);
            background: rgba(14, 14, 16, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--vidro);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 2000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ghost);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            width: 100%;
            height: 100%;
            transition: color 0.3s;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-item i { font-size: 1.2rem; }
        .nav-item:hover, .nav-item.active { color: var(--blueviolet-color); }

        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
                padding-left: var(--nav-width);
            }

            .navigation-bar {
                top: 0;
                left: 0;
                width: var(--nav-width);
                height: 100vh;
                border-top: none;
                border-right: 1px solid var(--vidro);
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 30px;
                gap: 15px;
            }

            .nav-item {
                flex-direction: row;
                justify-content: flex-start;
                padding: 12px 24px;
                width: 100%;
                height: auto;
                font-size: 1rem;
                gap: 15px;
                box-sizing: border-box;
            }

            .nav-item i { font-size: 1.1rem; }
        }

        header { 
            position: sticky; 
            top: 0; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(14, 14, 16, 0.6); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--vidro); 
            z-index: 1000; 
        }

        .btn-nav { position: absolute; left: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--vidro); color: var(--ghost); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Modal de Pesquisa e Modal de Plataformas */
        #searchModal, #platformsModal {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(14, 14, 16, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #searchModal.active, #platformsModal.active { display: flex; }

        .search-modal-header, .platforms-modal-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .search-container { padding: 0; display: flex; gap: 10px; align-items: center; width: 100%; max-width: 600px; }
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .search-input { width: 100%; padding: 14px 40px 14px 20px; border-radius: 25px; border: 1px solid var(--vidro); background: rgba(255,255,255,0.08); color: var(--ghost); outline: none; box-sizing: border-box; transition: 0.3s; font-size: 1rem; }
        .search-input:focus { border-color: var(--blueviolet-color); box-shadow: 0 0 15px rgba(138,43,226,0.4); }
        .clear-btn { position: absolute; right: 15px; background: none; border: none; color: var(--ghost); cursor: pointer; display: none; font-size: 1rem; }
        .mic-btn { background: none; border: none; color: var(--ghost); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .mic-btn:active { color: var(--blueviolet-color); }

        /* Lista do Modal de Plataformas */
        .platforms-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .platform-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--vidro);
            border-radius: 12px;
            color: var(--ghost);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .platform-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-logo {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: contain;
        }

        .platform-item:hover {
            border-color: var(--blueviolet-color);
            background: rgba(138, 43, 226, 0.1);
        }

        .platform-item.active {
            border-color: var(--blueviolet-color);
            background: rgba(138, 43, 226, 0.2);
            font-weight: 600;
        }

        .platform-item i {
            font-size: 1.1rem;
            color: var(--blueviolet-color);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .platform-item.active i {
            opacity: 1;
        }

        main { padding: 20px; }
        h2 { font-size: 1.2rem; margin: 30px 0 15px 0; padding-left: 5px; border-left: 4px solid var(--blueviolet-color); }

        .carrossel-wrapper { display: flex; overflow-x: auto; gap: 16px; padding-bottom: 15px; scrollbar-width: none; }
        .carrossel-wrapper::-webkit-scrollbar { display: none; }

        .card { clip-path: polygon(12px 0%, 100% 0%, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0% 100%, 0% 12px);
               flex: 0 0 240px; height: 135px; background-color: var(--vidro); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; cursor: pointer; position: relative; overflow: hidden; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 10px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--blueviolet-color); }
        .card-title { background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }

        .search-engines a:hover, .search-engines a:focus, 
        .short-card:hover, .short-card:focus {
            border-color: var(--blueviolet-color);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
            outline: none;
            transform: scale(1.05);
        }

        #playerModal { position: fixed; inset: 0; z-index: 9999; background-color: black; display: none; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease-out; }
        #playerModal.active { display: flex; transform: translateY(0); }
        #modal-drag-handle { height: 40px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; flex-shrink: 0; }
        .drag-pill { width: 48px; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 9999px; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.85); flex-grow: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; width: 100%; box-sizing: border-box; }
        
        .video-box, .ad-container, .shorts-wrapper { width: 100%; max-width: 950px; box-sizing: border-box; }
        .video-box { aspect-ratio: 16/9; background: #222; border-radius: 15px; overflow: hidden; flex-shrink: 0; }
        .ad-container { height: 100px; background: var(--vidro); margin: 20px 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--blueviolet-color); flex-shrink: 0; position: relative; }
        .ad-tag { position: absolute; top: 5px; left: 10px; font-size: 0.6rem; color: var(--blueviolet-color); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .search-engines { display: flex; gap: 10px; padding: 10px 20px; width: 100%; max-width: 950px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; flex-shrink: 0; box-sizing: border-box; }
        .search-engines::-webkit-scrollbar { display: none; }
        .search-engines a { display: flex; align-items: center; gap: 8px; color: var(--ghost); text-decoration: none; font-size: 0.9rem; padding: 8px 20px; border-radius: 20px; background: rgba(255,255,255,0.05); flex-shrink: 0; border: 1px solid transparent; transition: 0.3s; }
        
        .shorts-wrapper { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0; scrollbar-width: none; flex-shrink: 0; }
        .short-card { flex: 0 0 160px; height: 285px; background: var(--vidro); border-radius: 12px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        
        .close-btn { display: none; position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; }
        .modal-close-btn { position: relative; top: 0; right: 0; display: block; }
        @media (min-width: 768px) { .close-btn { display: block; } }
    </style>
</head>

        </button>
        <button onclick="switchTab('pesquisar')" id="nav-pesquisar" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Pesquisar</span>
        </button>
        <button onclick="switchTab('plataformas')" id="nav-plataformas" class="nav-item">
            <i class="fas fa-cubes"></i>
            <span>Plataformas</span>
        </button>
    </nav>

    <div class="page-container">

    <div id="searchModal">

        </div>
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar canal..." oninput="toggleClearBtn()" onkeyup="handleSearch(event)">

            </div>
            <button class="mic-btn" onclick="startVoiceSearch()"><i class="fas fa-microphone"></i></button>

    <div id="platformsModal">

                </div>
                <i class="fas fa-check"></i>
            </div>
            <div class="platform-item" onclick="selectPlatform(this, 'CHZZK')">
                <div class="platform-info">
                    <img src="https://www.google.com/s2/favicons?domain=chzzk.naver.com&sz=32" alt="CHZZK" class="platform-logo">
                    <span>CHZZK</span>
                </div>
                <i class="fas fa-check"></i>
            </div>
            <div class="platform-item" onclick="selectPlatform(this, 'Rumble')">
                <div class="platform-info">
                    <img src="https://www.google.com/s2/favicons?domain=rumble.com&sz=32" alt="Rumble" class="platform-logo">
                    <span>Rumble</span>
                </div>
                <i class="fas fa-check"></i>
            </div>
            <div class="platform-item" onclick="selectPlatform(this, 'SOOP Korea')">

                </div>

            </div>
        </div>
    </div>

    <div id="playerModal">
        <div id="modal-drag-handle"><div class="drag-pill"></div></div>
        <div class="modal-body" id="modalContainer">
            <button class="close-btn" onclick="closePlayer()"><i class="fas fa-times"></i></button>
            <div class="video-box" id="videoBox"></div>

            <a id="platformLink" href="#" target="_blank" style="color: var(--blueviolet-color); text-decoration: none; font-size: 0.9rem; margin-bottom: 10px;">Ver mais na Twitch</a>
            
            <div class="ad-container">

                Espaço para Anúncio

            <div class="search-engines">

            <h2 style="align-self: flex-start; width: 100%; max-width: 950px;">Outros</h2>
            <div class="shorts-wrapper" id="shortsList"></div>
        </div>

            'Kick': [
                { tema: "E-sports & Gaming", itens: [{ nome: "ESLCS", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQS2j0vOKqwJajkmLXYyj6dcsUXq_3ukF7wbFu7xQ2SmQ&s" }, { nome: "EsportsWorldCup", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1rJohJOgFN__F104kQ6GXBMqQy0RJcYfwtxTTEHhEdg&s=10" }, {nome:"KICK F1 Sim Racing Team", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlH5YtZQ3KRVR5EtE5f_VIPvgTrAo9ZaUnSRnfe78C3g&s=10"}, {nome:"BCGameEsports", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA6yGbCdEhLLlHq0CNbOjW3VBFvyTbNZzQpoaY5c-aiA&s=10"}, {nome: "El Gato", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQe61UCKsf2GJ_gXNx_DY4P7s9HMAxeVZSDnztCsYrgqw&s=10"}] },
                { tema: "Entretenimento", itens: [{ nome: "AdinRoss", img: "https://www.gigwise.com/wp-content/uploads/2025/07/How-Tall-is-Adin-Ross.png" }, {nome:"Baiano", img:"https://files.kick.com/images/user/9170063/profile_image/conversion/933585a0-5120-472f-b5a5-e147048ef4d6-fullsize.webp"}, {nome:"Brunozor", img:"https://i.ytimg.com/vi/ELY4T9jryJE/hq720.jpg?sqp=-oaymwE7CK4FEIIDSFryq4qpAy0IARUAAAAAGAElAADIQj0AgKJD8AEB-AH-CYAC0AWKAgwIABABGHIgPygvMA8=&rs=AOn4CLB2F2dMfqrzQ42A1CcUM25yoJ2TUA"},{nome:"Maumauzk", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOYr26gpN_byDoGpPQcN8ZZTbX2zuuHroCsyPO_JwJeA&s"},{nome:"Ruyter", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB5HDm6m6iE0hpFQ9Uq0XFvHmb4uyeta4VmECQ013c1a8LoLiBwFpWTVo&s=10"}] }
            ],
            'CHZZK': [
                { tema: "Destaques CHZZK", itens: [{ nome: "chzzk_official", img: "https://www.google.com/s2/favicons?domain=chzzk.naver.com&sz=128" }] }
            ],
            'Rumble': [
                { tema: "Canais Rumble", itens: [{ nome: "rumble_news", img: "https://www.google.com/s2/favicons?domain=rumble.com&sz=128" }] }
            ],
            'SOOP Korea': [
                { tema: "Destaques SOOP", itens: [{ nome: "soop_live", img: "https://www.google.com/s2/favicons?domain=sooplive.co.kr&sz=128" }] }
            ]
        };

        const configPlataformas = {
            'Twitch': {
                getUrl: (canal) => `https://twitch.tv/${canal}`,
                getEmbed: (canal) => `<iframe src="https://player.twitch.tv/?channel=${canal}&parent=${window.location.hostname}&muted=false" frameborder="0" allowfullscreen="true" scrolling="no" height="100%" width="100%"></iframe>`
            },
            'Kick': {
                getUrl: (canal) => `https://kick.com/${canal}`,
                getEmbed: (canal) => `<iframe src="https://player.kick.com/${canal}" frameborder="0" allowfullscreen="true" scrolling="no" height="100%" width="100%"></iframe>`
            },
            'CHZZK': {
                getUrl: (canal) => `https://chzzk.naver.com/${canal}`,
                getEmbed: (canal) => `<iframe src="https://chzzk.naver.com/live/${canal}/embed" frameborder="0" allowfullscreen="true" height="100%" width="100%"></iframe>`
            },
            'Rumble': {
                getUrl: (canal) => `https://rumble.com/c/${canal}`,
                getEmbed: (canal) => `<iframe src="https://rumble.com/embed/${canal}" frameborder="0" allowfullscreen="true" height="100%" width="100%"></iframe>`
            },
            'SOOP Korea': {
                getUrl: (canal) => `https://sooplive.co.kr/${canal}`,
                getEmbed: (canal) => `<iframe src="https://play.sooplive.co.kr/${canal}/embed" frameborder="0" allowfullscreen="true" height="100%" width="100%"></iframe>`
            }
        };

        const imagensFundo = [
            'https://www.oficinadanet.com.br/imagens/post/24260/esports-2.jpg',
            'https://upload-os-bbs.hoyolab.com/upload/2024/10/10/100250575/fad5afce35418d20e60ad071ff8f669e_4928620822152350094.jpg?x-oss-process=image%2Fresize%2Cs_1000%2Fauto-orient%2C0%2Finterlace%2C1%2Fformat%2Cwebp%2Fquality%2Cq_70',
            'https://cdn.crusoe.com.br/uploads/2025/10/homem-ouvindo-musica-scaled-1.jpg',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCl0LO94kumIapVh6fAV9aa4UKhzmvPUF7Rkqcb6h4LwKBNPIf8NeqhBTu&s=10',
            'https://forbes.com.br/wp-content/uploads/2023/11/ASMR.jpg',
            'https://media.clipchamp.com/clipchamp/2048/2qp1BKkEe0FtVtwTQxmOcf'
        ];

        let indiceFundo = 0;
        function mudarFundo() {
            document.body.style.backgroundImage = `linear-gradient(rgba(14, 14, 16, 0.9), rgba(14, 14, 16, 0.9)), url('${imagensFundo[indiceFundo]}')`;
            indiceFundo = (indiceFundo + 1) % imagensFundo.length;
        }
        setInterval(mudarFundo, 10000);
        mudarFundo();

        const app = document.getElementById('app');
        const shortsList = document.getElementById('shortsList');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchModal = document.getElementById('searchModal');
        const platformsModal = document.getElementById('platformsModal');

        function openSearchModal() {
            closePlatformsModal();
            searchModal.classList.add('active');
            searchInput.focus();
            updateActiveTab('nav-pesquisar');
        }

        function closeSearchModal() {
            searchModal.classList.remove('active');
            clearSearch();
            updateActiveTab('nav-assistir');
        }

        function openPlatformsModal() {
            closeSearchModal();
            platformsModal.classList.add('active');
            updateActiveTab('nav-plataformas');
        }

        function closePlatformsModal() {
            platformsModal.classList.remove('active');
            updateActiveTab('nav-assistir');
        }

        function selectPlatform(element, platformName) {
            document.querySelectorAll('.platform-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            plataformaAtiva = platformName;
            renderizarConteudoPlataforma();
            closePlatformsModal();
        }

        function switchTab(tab) {
            if (tab === 'pesquisar') {
                openSearchModal();
            } else if (tab === 'plataformas') {
                openPlatformsModal();
            } else {
                closeSearchModal();
                closePlatformsModal();
                updateActiveTab(`nav-${tab}`);
            }
        }

        function updateActiveTab(activeId) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(activeId);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function toggleClearBtn() { clearBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none'; }
        
        function clearSearch() { 
            searchInput.value = ''; 
            toggleClearBtn(); 
            document.querySelectorAll('.card').forEach(card => card.style.display = ''); 
        }
        
        function startVoiceSearch() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.start();
            recognition.onresult = (event) => { searchInput.value = event.results[0][0].transcript; toggleClearBtn(); handleSearch({key: 'Enter'}); };
        }

        function getSearchUrl(engine) {
            const canalAtivo = document.getElementById('modalTitle').innerText;
            const query = (canalAtivo !== "Título da Live" && canalAtivo !== "") ? canalAtivo : searchInput.value.trim();
            const baseUrl = { 'google': 'https://google.com/search?q=', 'bing': 'https://bing.com/search?q=', 'duckduckgo': 'https://duckduckgo.com/?q=', 'naver': 'https://search.naver.com/search.naver?query=', 'baidu': 'https://www.baidu.com/s?wd=' };
            return query ? baseUrl[engine] + encodeURIComponent(query) : `https://${engine}.com`;
        }

        function renderizarConteudoPlataforma() {
            app.innerHTML = '';
            shortsList.innerHTML = '';

            const dadosCarrossel = dadosPlataformas[plataformaAtiva] || [];

            dadosCarrossel.forEach(data => {
                const section = document.createElement('section');
                section.innerHTML = `<h2>${data.tema}</h2>`;
                const wrapper = document.createElement('div');
                wrapper.className = 'carrossel-wrapper';
                data.itens.forEach(canal => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.canal = canal.nome.toLowerCase();
                    card.style.backgroundImage = `url('${canal.img}')`;
                    card.innerHTML = `<span class="card-title">${canal.nome}</span>`;
                    card.onclick = (e) => openPlayer(canal.nome, e.target);
                    wrapper.appendChild(card);
                });
                section.appendChild(wrapper);
                app.appendChild(section);
            });

            if (dadosCarrossel.length > 0) {
                dadosCarrossel[0].itens.forEach(canal => {
                    const short = document.createElement('div');
                    short.className = 'short-card';
                    short.style.backgroundImage = `url('${canal.img}')`;
                    short.innerHTML = `<span class="card-title">${canal.nome}</span>`;
                    short.onclick = (e) => openPlayer(canal.nome, e.target);
                    shortsList.appendChild(short);
                });
            }
        }

        function handleSearch(event) {
            const query = searchInput.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card');
            if (event.key === 'Enter' && query !== "") {
                const exists = Array.from(cards).some(c => c.dataset.canal === query);
                closeSearchModal();
                if (!exists) openPlayer(query, null);
            } else { 
                cards.forEach(card => card.style.display = card.dataset.canal.includes(query) ? '' : 'none'); 
            }
        }

        function openPlayer(canal, element) {
            document.getElementById('modalTitle').innerText = canal;

            const config = configPlataformas[plataformaAtiva] || configPlataformas['Twitch'];
            const linkPlataforma = document.getElementById('platformLink');
            linkPlataforma.href = config.getUrl(canal);
            linkPlataforma.innerText = `Ver mais na ${plataformaAtiva}`;

            const bg = element ? element.style.backgroundImage : "none";
            document.getElementById('modalContainer').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), ${bg}`;
            document.getElementById('modalContainer').style.backgroundSize = "cover";

            document.getElementById('videoBox').innerHTML = config.getEmbed(canal);
            document.getElementById('playerModal').classList.add('active');
            document.body.classList.add('modal-open');
        }

        function closePlayer() {
            document.getElementById('playerModal').style.transform = 'translateY(100%)';
            setTimeout(() => {
                document.getElementById('playerModal').classList.remove('active');
                document.getElementById('playerModal').style.transform = '';
                document.getElementById('modalTitle').innerText = "Título da Live";
                document.body.classList.remove('modal-open');
                document.getElementById('videoBox').innerHTML = '';
                document.getElementById('modalContainer').style.backgroundImage = "none";
            }, 300);
        }

        const handle = document.getElementById('modal-drag-handle');
        let touchStartY = 0;
        handle.addEventListener('touchstart', (e) => touchStartY = e.touches[0].clientY);
        handle.addEventListener('touchmove', (e) => {
            const diff = e.touches[0].clientY - touchStartY;
            if (diff > 0) document.getElementById('playerModal').style.transform = `translateY(${diff}px)`;
        });
        handle.addEventListener('touchend', (e) => {
            if (e.changedTouches[0].clientY - touchStartY > 150) closePlayer();
            else document.getElementById('playerModal').style.transform = 'translateY(0)';
        });

        // Inicialização
        renderizarConteudoPlataforma();
    </script>
</body>
</html>
