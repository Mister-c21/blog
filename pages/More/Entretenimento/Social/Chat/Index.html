<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Web - Violeta & Branco</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-color: #6c5ce7; /* Violeta principal */
            --secondary-hover: #5b4be2; /* Violeta escuro para hover */
            --light-violet: #f3f0ff;    /* Violeta claro para detalhes */
            --gray-bg: #f8f9fa;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-violet);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container Principal ocupando 100% da tela e sem bordas arredondadas */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: var(--primary-bg);
            overflow: hidden;
            border-radius: 0;
            box-shadow: none;
            max-width: none;
        }

        /* --- PAINEL ESQUERDO: Lista de Contatos --- */
        .sidebar {
            width: 100%;
            background-color: var(--primary-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            height: 100%;
        }

        @media (min-width: 768px) {
            .sidebar {
                width: 35%;
                min-width: 320px;
            }
        }

        .sidebar-header {
            padding: 18px 20px 10px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-header .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--secondary-color);
            font-size: 18px;
        }

        .sidebar-actions i {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.2s;
        }

        .sidebar-actions i:hover {
            color: var(--secondary-color);
        }

        /* Estilo Toptabbar estilo TikTok */
        .top-tab-bar {
            display: flex;
            gap: 20px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-item {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--secondary-color);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--secondary-color);
            border-radius: 2px 2px 0 0;
        }

        /* Barra de Busca com bordas arredondadas */
        .search-container {
            padding: 12px 20px;
            background-color: var(--primary-bg);
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--gray-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 15px;
            gap: 10px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--secondary-color);
            background-color: var(--primary-bg);
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            font-size: 14px;
            width: 100%;
            color: var(--text-main);
        }

        .chat-list {
            overflow-y: auto;
            flex: 1;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--gray-bg);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: var(--gray-bg);
        }

        .chat-item.active {
            background-color: var(--light-violet);
            border-left: 4px solid var(--secondary-color);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--light-violet);
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .chat-last-msg {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- PAINEL DIREITO: Área de Conversa --- */
        .chat-area {
            display: none;
            flex-direction: column;
            flex: 1;
            background-color: var(--primary-bg);
            height: 100%;
        }

        @media (min-width: 768px) {
            .chat-area {
                display: flex !important;
            }
            .app-container:not(.desktop-has-chat) .chat-area .messages-container,
            .app-container:not(.desktop-has-chat) .chat-area .chat-input-area,
            .app-container:not(.desktop-has-chat) .chat-area .chat-header {
                opacity: 0.4;
                pointer-events: none;
            }
        }

        .chat-header {
            padding: 12px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--secondary-color);
            display: inline-block;
        }

        @media (min-width: 768px) {
            .back-btn {
                display: none;
            }
        }

        /* Menu Contextual da Elipse */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 20px;
            top: 60px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
            border-radius: 8px;
            z-index: 100;
            width: 180px;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--light-violet);
            color: var(--secondary-color);
        }

        .dropdown-item i {
            font-size: 14px;
            color: var(--text-muted);
        }

        .dropdown-item:hover i {
            color: var(--secondary-color);
        }

        /* Menu de anexos (clipe) */
        .attachment-menu {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 20px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
            border-radius: 12px;
            z-index: 100;
            width: 220px;
            overflow: hidden;
        }

        .attachment-menu.show {
            display: block;
        }

        .attachment-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, color 0.2s;
        }

        .attachment-item:hover {
            background-color: var(--light-violet);
            color: var(--secondary-color);
        }

        .attachment-item i {
            font-size: 16px;
            color: var(--secondary-color);
            width: 20px;
            text-align: center;
        }

        /* --- MODAL DE SCANNER DE CÓDIGO QR / ADICIONAR CONTATO --- */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .qr-modal.show {
            display: flex;
        }

        .qr-modal-content {
            background-color: var(--primary-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: scaleUp 0.25s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .qr-modal-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
        }

        .qr-modal-header i {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
        }

        .qr-modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Abas internas do Modal */
        .qr-tabs {
            display: flex;
            width: 100%;
            background-color: var(--gray-bg);
            border-radius: 10px;
            padding: 4px;
        }

        .qr-tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .qr-tab-btn.active {
            background-color: var(--primary-bg);
            color: var(--secondary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .qr-view-section {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .qr-view-section.active {
            display: flex;
        }

        /* Viewport da Câmera Real com html5-qrcode */
        .scanner-viewport {
            width: 100%;
            height: 220px;
            background-color: #111;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
        
        #reader__dashboard_section_csr button, 
        #reader button {
            background-color: var(--secondary-color) !important;
            color: white !important;
            border: none !important;
            padding: 6px 12px !important;
            border-radius: 6px !important;
            font-size: 12px !important;
            cursor: pointer !important;
            margin-top: 5px !important;
        }

        /* Exibição do "Meu Código QR" */
        .my-qr-box {
            padding: 15px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .my-qr-code-render {
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .my-qr-code-render img {
            width: 100% !important;
            height: 100% !important;
        }

        .my-qr-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Container de Inserção de Código por Texto (Desktop) */
        .code-input-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .code-input-container label {
            font-size: 13px;
            color: var(--text-muted);
            text-align: left;
            width: 100%;
        }

        .code-input-container input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background-color: var(--gray-bg);
            color: var(--text-main);
        }

        .code-input-container input:focus {
            border-color: var(--secondary-color);
            background-color: var(--primary-bg);
        }

        .qr-action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .qr-action-btn:hover {
            background-color: var(--secondary-hover);
        }

        /* Modal customizado para URL de Imagem ou YouTube */
        .url-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .url-modal.show {
            display: flex;
        }

        .url-modal-content {
            background-color: var(--primary-bg);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .url-modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .url-modal input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .url-modal input:focus {
            border-color: var(--secondary-color);
        }

        .url-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .url-modal-buttons button {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: var(--gray-bg);
            color: var(--text-muted);
        }

        .btn-confirm {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Modal de Seleção de Música */
        .music-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 768px) {
            .music-modal {
                align-items: center;
            }
        }

        .music-modal.show {
            display: flex;
        }

        .music-modal-content {
            background-color: var(--primary-bg);
            width: 100%;
            max-width: 450px;
            height: 75vh;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
            animation: slideUp 0.3s ease-out;
        }

        @media (min-width: 768px) {
            .music-modal-content {
                border-radius: 16px;
                height: 600px;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .music-modal-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
        }

        .music-modal-header i {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
        }

        .music-search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--gray-bg);
        }

        .music-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background-color: var(--primary-bg);
        }

        .music-search-input:focus {
            border-color: var(--secondary-color);
        }

        .music-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .music-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .music-item:hover {
            background-color: var(--gray-bg);
        }

        .music-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .music-details {
            flex: 1;
            min-width: 0;
        }

        .music-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .music-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-preview-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: var(--secondary-color);
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-preview-btn:hover {
            color: var(--secondary-hover);
        }

        /* --- Estilo de Player de Música em Vinil --- */
        .vinyl-player-card {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--light-violet), #eae4ff);
            padding: 12px 16px;
            border-radius: 16px;
            gap: 14px;
            border: 1px solid rgba(108, 92, 231, 0.2);
            width: 100%;
            max-width: 300px;
        }

        .vinyl-container {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .vinyl-disc {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #111 0%, #111 35%, #222 36%, #111 38%, #111 60%, #333 61%, #111 63%, #111 100%);
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .vinyl-disc.playing {
            animation: spinVinyl 3s linear infinite;
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vinyl-center-art {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.4);
            position: relative;
            z-index: 2;
        }

        .vinyl-album-cover {
            position: absolute;
            top: 4px;
            left: -12px;
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 3;
            border: 2px solid #ffffff;
            background-color: #fff;
            transition: transform 0.3s ease;
        }

        .vinyl-container:hover .vinyl-album-cover {
            transform: scale(1.05);
        }

        .vinyl-info {
            flex: 1;
            min-width: 0;
            margin-left: 8px;
        }

        .vinyl-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vinyl-artist {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .vinyl-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vinyl-play-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .vinyl-play-btn:hover {
            background-color: var(--secondary-hover);
        }

        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--gray-bg);
            justify-content: center;
            align-items: center;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.received {
            background-color: var(--primary-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .message.sent {
            background-color: var(--secondary-color);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        .message img {
            max-width: 100%;
            border-radius: 6px;
            display: block;
        }

        .message iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 6px;
            display: block;
        }

        /* Caixa de Entrada de Mensagem */
        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        .chat-input-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            position: relative;
        }

        .chat-input-icons i:hover {
            color: var(--secondary-color);
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background-color: var(--gray-bg);
            transition: border 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--secondary-color);
            background-color: var(--primary-bg);
        }

        .chat-input-area button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .chat-input-area button:hover {
            background-color: var(--secondary-hover);
        }

        @media (max-width: 767px) {
            .mobile-show-chat .sidebar {
                display: none;
            }
            .mobile-show-chat .chat-area {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="app-title">
                    <i class="fa-solid fa-comments"></i>
                    <span>Conversas</span>
                </div>
                <div class="sidebar-actions">
                    <i class="fa-solid fa-user-plus" id="addContactHeaderBtn" title="Adicionar Contato"></i>
                </div>
            </div>

            <div class="top-tab-bar">
                <button class="tab-item active" onclick="switchTab('contatos')">Contatos</button>
                <button class="tab-item" onclick="switchTab('bloqueados')">Bloqueados</button>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar ou começar uma nova conversa" autocomplete="off">
                </div>
            </div>

            <div class="chat-list" id="chatList">
                </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header" id="chatHeader">
                <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="avatar" id="activeAvatar"><i class="fa-solid fa-user"></i></div>
                <div style="flex:1; min-width: 0;">
                    <div class="chat-name" id="activeName">Bem-vindo</div>
                    <div class="chat-last-msg" id="activeStatus" style="font-size: 12px;">offline</div>
                </div>
                <div class="sidebar-actions" style="position: relative;">
                    <i class="fa-solid fa-ellipsis-vertical" id="ellipsisBtn" style="cursor: pointer;"></i>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" onclick="togglePinChat()">
                            <i class="fa-solid fa-thumbtack" id="pinIcon"></i> <span id="pinText">Fixar contato</span>
                        </div>
                        <div class="dropdown-item" onclick="toggleBlockChat()">
                            <i class="fa-solid fa-ban" id="blockIcon"></i> <span id="blockText">Bloquear</span>
                        </div>
                        <div class="dropdown-item" onclick="deleteChat()" style="color: #e74c3c;">
                            <i class="fa-solid fa-trash" style="color: #e74c3c;"></i> Excluir contato
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div style="text-align: center; color: var(--text-muted); font-size: 15px;">Selecione um contato para conversar</div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-icons">
                    <i class="fa-solid fa-paperclip" id="attachBtn" title="Anexo"></i>
                    <div class="attachment-menu" id="attachmentMenu">
                        <div class="attachment-item" onclick="handleAttachmentSelection('Sticky')">
                            <i class="fa-solid fa-note-sticky"></i> Sticky
                        </div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('GIF')">
                            <i class="fa-solid fa-image"></i> GIFs
                        </div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Música')">
                            <i class="fa-solid fa-music"></i> Música
                        </div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Vídeo do YouTube')">
                            <i class="fa-brands fa-youtube"></i> Vídeo do YouTube
                        </div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Imagem')">
                            <i class="fa-solid fa-camera"></i> Imagem
                        </div>
                    </div>
                </div>
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="qr-modal" id="qrModal">
        <div class="qr-modal-content">
            <div class="qr-modal-header">
                <span id="qrModalMainTitle">Adicionar Contato</span>
                <i class="fa-solid fa-xmark" onclick="closeQrModal()"></i>
            </div>
            <div class="qr-modal-body">
                <div class="qr-tabs" id="qrTabsContainer">
                    <button class="qr-tab-btn active" id="tabScannerBtn" onclick="switchQrTab('scanner')">Escanear QR</button>
                    <button class="qr-tab-btn" id="tabMyCodeBtn" onclick="switchQrTab('mycode')">Meu Código</button>
                </div>

                <div class="qr-view-section active" id="scannerSection">
                    <div class="scanner-viewport" id="scannerViewport">
                        <div id="reader"></div>
                    </div>
                    <div class="code-input-container" id="desktopCodeInputContainer">
                        <label id="codeLabelText" for="contactCodeInput">Inserir código do contato:</label>
                        <input type="text" id="contactCodeInput" placeholder="Digite o ID ou nome do contato..." autocomplete="off">
                    </div>
                    <button class="qr-action-btn" onclick="submitAddContact()">Adicionar Contato</button>
                </div>

                <div class="qr-view-section" id="myCodeSection">
                    <div class="my-qr-box">
                        <div class="my-qr-code-render" id="myQrCodeContainer"></div>
                        <div class="my-qr-name">Meu Perfil - Chat Web</div>
                    </div>
                    <p style="font-size: 12px; color: var(--text-muted); text-align: center;">Peça para seus amigos escanearem este código para adicioná-lo.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="url-modal" id="urlModal">
        <div class="url-modal-content">
            <div class="url-modal-title" id="urlModalTitle">Inserir URL</div>
            <input type="text" id="urlInput" placeholder="Cole o link aqui..." autocomplete="off">
            <div class="url-modal-buttons">
                <button class="btn-cancel" onclick="closeUrlModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmUrlModal()">Enviar</button>
            </div>
        </div>
    </div>

    <div class="music-modal" id="musicModal">
        <div class="music-modal-content">
            <div class="music-modal-header">
                <span>Escolher música</span>
                <i class="fa-solid fa-xmark" onclick="closeMusicModal()"></i>
            </div>
            <div class="music-search-box">
                <input type="text" class="music-search-input" id="musicSearchInput" placeholder="Pesquisar músicas ou artistas..." autocomplete="off">
            </div>
            <div class="music-list" id="musicList"></div>
        </div>
    </div>

    <script>
        const chatsData = [
            { id: 1, name: "Maria Silva", lastMsg: "Combinado então!", avatar: "M", type: "contatos", pinned: false, messages: [
                { sender: "received", text: "Oi, tudo bem?" },
                { sender: "sent", text: "Tudo ótimo e com você?" },
                { sender: "received", text: "Combinado então!" }
            ]},
            { id: 2, name: "Carlos Souza", lastMsg: "Me liga quando puder.", avatar: "C", type: "contatos", pinned: false, messages: [
                { sender: "received", text: "Me liga quando puder." }
            ]},
            { id: 3, name: "Grupo de Projetos", lastMsg: "Ana: Atualizei o repositório.", avatar: "GP", type: "contatos", pinned: false, messages: [
                { sender: "received", text: "Ana: Atualizei o repositório." }
            ]},
            { id: 4, name: "Usuário Bloqueado", lastMsg: "Sem mensagens recentes", avatar: "UB", type: "bloqueados", pinned: false, messages: [
                { sender: "received", text: "Este contato está bloqueado." }
            ]}
        ];

        let currentTab = 'contatos';
        let currentChatId = null;
        let searchQuery = '';
        let activeAttachmentType = null;
        let musicSearchTimeout = null;
        let activePreviewAudio = null;
        let activeChatAudio = null; 
        let myQrCodeInitialized = false;
        let html5QrCodeScanner = null;

        const appContainer = document.getElementById('appContainer');
        const chatListEl = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messagesContainer');
        const activeName = document.getElementById('activeName');
        const activeAvatar = document.getElementById('activeAvatar');
        const activeStatus = document.getElementById('activeStatus');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('searchInput');
        const ellipsisBtn = document.getElementById('ellipsisBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const attachBtn = document.getElementById('attachBtn');
        const attachmentMenu = document.getElementById('attachmentMenu');
        const urlModal = document.getElementById('urlModal');
        const urlModalTitle = document.getElementById('urlModalTitle');
        const urlInput = document.getElementById('urlInput');
        const musicModal = document.getElementById('musicModal');
        const musicSearchInput = document.getElementById('musicSearchInput');
        const musicList = document.getElementById('musicList');
        const addContactHeaderBtn = document.getElementById('addContactHeaderBtn');
        const qrModal = document.getElementById('qrModal');
        const qrTabsContainer = document.getElementById('qrTabsContainer');
        const scannerViewport = document.getElementById('scannerViewport');
        const desktopCodeInputContainer = document.getElementById('desktopCodeInputContainer');
        const contactCodeInput = document.getElementById('contactCodeInput');
        const tabScannerBtn = document.getElementById('tabScannerBtn');
        const tabMyCodeBtn = document.getElementById('tabMyCodeBtn');
        const scannerSection = document.getElementById('scannerSection');
        const myCodeSection = document.getElementById('myCodeSection');

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChatList();
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            
            const filteredChats = chatsData.filter(chat => {
                const matchesTab = chat.type === currentTab;
                const matchesSearch = chat.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      chat.lastMsg.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTab && matchesSearch;
            });

            if (filteredChats.length === 0) {
                chatListEl.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Nenhum item encontrado</div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="avatar">${chat.avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name} ${chat.pinned ? '<i class="fa-solid fa-thumbtack" style="font-size: 11px; color: var(--secondary-color); margin-left: 5px;"></i>' : ''}</div>
                        <div class="chat-last-msg">${chat.lastMsg}</div>
                    </div>
                `;
                item.addEventListener('click', () => selectChat(chat.id));
                chatListEl.appendChild(item);
            });
        }

        function selectChat(id) {
            if (activeChatAudio) {
                activeChatAudio.pause();
                activeChatAudio = null;
            }
            currentChatId = id;
            const chat = chatsData.find(c => c.id === id);
            
            activeName.textContent = chat.name;
            activeAvatar.textContent = chat.avatar;
            activeStatus.textContent = "online";
            
            const pinText = document.getElementById('pinText');
            const blockText = document.getElementById('blockText');
            pinText.textContent = chat.pinned ? "Desfixar contato" : "Fixar contato";
            blockText.textContent = chat.type === 'bloqueados' ? "Desbloquear" : "Bloquear";

            messagesContainer.style.justifyContent = 'flex-start';
            messagesContainer.innerHTML = '';
            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender}`;
                if (msg.isHtml) {
                    msgDiv.innerHTML = msg.content;
                } else {
                    msgDiv.textContent = msg.text;
                }
                messagesContainer.appendChild(msgDiv);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            if (window.innerWidth <= 767) {
                appContainer.classList.add('mobile-show-chat');
            } else {
                appContainer.classList.add('desktop-has-chat');
            }
            
            renderChatList();
        }

        backBtn.addEventListener('click', () => {
            if (activeChatAudio) {
                activeChatAudio.pause();
                activeChatAudio = null;
            }
            appContainer.classList.remove('mobile-show-chat');
            currentChatId = null;
            appContainer.classList.remove('desktop-has-chat');
            activeName.textContent = "Bem-vindo";
            activeAvatar.innerHTML = '<i class="fa-solid fa-user"></i>';
            activeStatus.textContent = "offline";
            dropdownMenu.classList.remove('show');
            attachmentMenu.classList.remove('show');
            messagesContainer.style.justifyContent = 'center';
            messagesContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 15px;">Selecione um contato para conversar</div>';
            renderChatList();
        });

        ellipsisBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            attachmentMenu.classList.remove('show');
            if (currentChatId !== null) {
                dropdownMenu.classList.toggle('show');
            }
        });

        attachBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.remove('show');
            if (currentChatId !== null) {
                attachmentMenu.classList.toggle('show');
            }
        });

        window.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
            attachmentMenu.classList.remove('show');
        });

        function togglePinChat() {
            if (currentChatId === null) return;
            const chat = chatsData.find(c => c.id === currentChatId);
            chat.pinned = !chat.pinned;
            selectChat(currentChatId);
        }

        function toggleBlockChat() {
            if (currentChatId === null) return;
            const chat = chatsData.find(c => c.id === currentChatId);
            if (chat.type === 'contatos') {
                chat.type = 'bloqueados';
                currentTab = 'bloqueados';
                document.querySelectorAll('.tab-item').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.toLowerCase().includes('bloqueados'));
                });
            } else {
                chat.type = 'contatos';
                currentTab = 'contatos';
                document.querySelectorAll('.tab-item').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.toLowerCase().includes('contatos'));
                });
            }
            selectChat(currentChatId);
        }

        function deleteChat() {
            if (currentChatId === null) return;
            if (activeChatAudio) {
                activeChatAudio.pause();
                activeChatAudio = null;
            }
            const index = chatsData.findIndex(c => c.id === currentChatId);
            if (index !== -1) {
                chatsData.splice(index, 1);
            }
            currentChatId = null;
            appContainer.classList.remove('mobile-show-chat');
            appContainer.classList.remove('desktop-has-chat');
            activeName.textContent = "Bem-vindo";
            activeAvatar.innerHTML = '<i class="fa-solid fa-user"></i>';
            activeStatus.textContent = "offline";
            dropdownMenu.classList.remove('show');
            attachmentMenu.classList.remove('show');
            messagesContainer.style.justifyContent = 'center';
            messagesContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 15px;">Selecione um contato para conversar</div>';
            renderChatList();
        }

        /* --- Funcionalidade do Modal de Adicionar Contato com Câmera Real --- */
        addContactHeaderBtn.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
            attachmentMenu.classList.remove('show');
            openQrModal();
        });

        function openQrModal() {
            qrModal.classList.add('show');
            contactCodeInput.value = '';
            
            const isDesktop = window.innerWidth >= 768;
            if (isDesktop) {
                qrTabsContainer.style.display = 'none';
                scannerViewport.style.display = 'none';
                desktopCodeInputContainer.style.display = 'flex';
                switchQrTab('scanner');
            } else {
                qrTabsContainer.style.display = 'flex';
                scannerViewport.style.display = 'flex';
                desktopCodeInputContainer.style.display = 'none'; // No mobile usa a câmera real
                switchQrTab('scanner');
                initCameraScanner();
            }

            if (!myQrCodeInitialized) {
                const qrContainer = document.getElementById('myQrCodeContainer');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: "ContatoNovo_QR_" + Math.random().toString(36).substring(2, 7),
                    width: 130,
                    height: 130,
                    colorDark: "#2d3436",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                myQrCodeInitialized = true;
            }
        }

        function closeQrModal() {
            stopCameraScanner();
            qrModal.classList.remove('show');
        }

        function initCameraScanner() {
            if (window.innerWidth < 768 && !html5QrCodeScanner) {
                setTimeout(() => {
                    try {
                        html5QrCodeScanner = new Html5Qrcode("reader");
                        html5QrCodeScanner.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 150, height: 150 } },
                            (decodedText, decodedResult) => {
                                // Sucesso ao escanear código QR pela câmera real
                                stopCameraScanner();
                                addContactAndOpen(decodedText);
                            },
                            (errorMessage) => {
                                // Erros de varredura quadro a quadro podem ser ignorados silenciosamente
                            }
                        ).catch(err => {
                            console.warn("Falha ao iniciar a câmera, usando fallback manual se necessário", err);
                        });
                    } catch (e) {
                        console.error(e);
                    }
                }, 300);
            }
        }

        function stopCameraScanner() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    html5QrCodeScanner.clear();
                    html5QrCodeScanner = null;
                }).catch(err => {
                    html5QrCodeScanner = null;
                });
            }
        }

        function switchQrTab(tabName) {
            tabScannerBtn.classList.remove('active');
            tabMyCodeBtn.classList.remove('active');
            scannerSection.classList.remove('active');
            myCodeSection.classList.remove('active');

            if (tabName === 'scanner') {
                tabScannerBtn.classList.add('active');
                scannerSection.classList.add('active');
                if (window.innerWidth < 768) {
                    initCameraScanner();
                }
            } else {
                stopCameraScanner();
                tabMyCodeBtn.classList.add('active');
                myCodeSection.classList.add('active');
            }
        }

        function submitAddContact() {
            const codeVal = contactCodeInput.value.trim();
            if (!codeVal) {
                alert("Por favor, insira o código do contato.");
                return;
            }
            addContactAndOpen(codeVal);
        }

        function addContactAndOpen(contactNameOrCode) {
            const newId = chatsData.length > 0 ? Math.max(...chatsData.map(c => c.id)) + 1 : 1;
            const initials = contactNameOrCode.substring(0, 2).toUpperCase();
            
            chatsData.unshift({
                id: newId,
                name: contactNameOrCode,
                lastMsg: "Contato adicionado com sucesso",
                avatar: initials,
                type: "contatos",
                pinned: false,
                messages: [
                    { sender: "received", text: `Olá! Conectado via código: ${contactNameOrCode}` }
                ]
            });

            closeQrModal();
            renderChatList();
            selectChat(newId);
        }

        function handleAttachmentSelection(type) {
            attachmentMenu.classList.remove('show');
            if (currentChatId === null) return;

            if (type === 'Imagem' || type === 'Vídeo do YouTube') {
                activeAttachmentType = type;
                urlModalTitle.textContent = type === 'Imagem' ? 'Adicionar URL da Imagem' : 'Adicionar URL do Vídeo do YouTube';
                urlInput.value = '';
                urlModal.classList.add('show');
                urlInput.focus();
            } else if (type === 'Música') {
                openMusicModal();
            } else {
                sendAttachmentSimple(type);
            }
        }

        function closeUrlModal() {
            urlModal.classList.remove('show');
            activeAttachmentType = null;
        }

        function confirmUrlModal() {
            const url = urlInput.value.trim();
            if (!url) return;

            const chat = chatsData.find(c => c.id === currentChatId);
            let contentHtml = '';
            let lastMsgText = '';

            if (activeAttachmentType === 'Imagem') {
                contentHtml = `<img src="${url}" alt="Imagem enviada" onerror="this.outerHTML='[Erro ao carregar imagem]'"/>`;
                lastMsgText = '[Enviou Imagem]';
            } else if (activeAttachmentType === 'Vídeo do YouTube') {
                const videoId = extractYouTubeId(url);
                if (videoId) {
                    contentHtml = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                    lastMsgText = '[Enviou Vídeo do YouTube]';
                } else {
                    contentHtml = `https://downdetector.com.br/fora-do-ar/youtube/`;
                    lastMsgText = '[Enviou Vídeo do YouTube inválido]';
                }
            }

            chat.messages.push({ sender: 'sent', isHtml: true, content: contentHtml, text: lastMsgText });
            chat.lastMsg = `Você: ${lastMsgText}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = contentHtml;
            messagesContainer.appendChild(msgDiv);

            closeUrlModal();
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            renderChatList();
        }

        function extractYouTubeId(url) {
            let videoId = null;
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(url.split('?')[1]);
                videoId = urlParams.get('v');
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('youtube.com/embed/')[1]?.split('?')[0];
            }
            return videoId;
        }

        /* Funções de Música */
        function openMusicModal() {
            musicModal.classList.add('show');
            musicSearchInput.value = '';
            fetchItunesMusic('pop hits');
        }

        function closeMusicModal() {
            if (activePreviewAudio) {
                activePreviewAudio.pause();
                activePreviewAudio = null;
            }
            musicModal.classList.remove('show');
        }

        musicSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(musicSearchTimeout);
            musicSearchTimeout = setTimeout(() => {
                fetchItunesMusic(query || 'pop hits');
            }, 400);
        });

        async function fetchItunesMusic(term) {
            if (activePreviewAudio) {
                activePreviewAudio.pause();
                activePreviewAudio = null;
            }
            musicList.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Carregando músicas...</div>`;
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=20`);
                const data = await response.json();
                renderMusicList(data.results);
            } catch (error) {
                musicList.innerHTML = `<div style="padding: 20px; text-align: center; color: #e74c3c; font-size: 14px;">Erro ao carregar músicas.</div>`;
            }
        }

        function renderMusicList(tracks) {
            musicList.innerHTML = '';
            if (!tracks || tracks.length === 0) {
                musicList.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Nenhuma música encontrada</div>`;
                return;
            }

            tracks.forEach(track => {
                const item = document.createElement('div');
                item.className = 'music-item';
                const artworkUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '200x200bb') : '';
                
                item.innerHTML = `
                    <img src="${artworkUrl}" class="music-art" alt="Capa">
                    <div class="music-details" onclick="selectMusicItem(event, '${encodeURIComponent(JSON.stringify(track))}')">
                        <div class="music-title">${track.trackName}</div>
                        <div class="music-artist">${track.artistName}</div>
                    </div>
                    ${track.previewUrl ? `<button class="music-preview-btn" onclick="togglePreview(event, '${track.previewUrl}', this)"><i class="fa-solid fa-play"></i></button>` : ''}
                `;
                musicList.appendChild(item);
            });
        }

        function togglePreview(event, previewUrl, btnElement) {
            event.stopPropagation();
            if (activePreviewAudio && activePreviewAudio.src === previewUrl) {
                if (activePreviewAudio.paused) {
                    activePreviewAudio.play();
                    btnElement.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } else {
                    activePreviewAudio.pause();
                    btnElement.innerHTML = '<i class="fa-solid fa-play"></i>';
                }
            } else {
                if (activePreviewAudio) {
                    activePreviewAudio.pause();
                    document.querySelectorAll('.music-preview-btn').forEach(b => b.innerHTML = '<i class="fa-solid fa-play"></i>');
                }
                activePreviewAudio = new Audio(previewUrl);
                activePreviewAudio.play();
                btnElement.innerHTML = '<i class="fa-solid fa-pause"></i>';
                activePreviewAudio.onended = () => {
                    btnElement.innerHTML = '<i class="fa-solid fa-play"></i>';
                };
            }
        }

        function selectMusicItem(event, encodedTrack) {
            event.stopPropagation();
            const track = JSON.parse(decodeURIComponent(encodedTrack));
            sendSelectedMusic(track);
        }

        function sendSelectedMusic(track) {
            if (currentChatId === null) return;
            if (activePreviewAudio) {
                activePreviewAudio.pause();
                activePreviewAudio = null;
            }

            const artworkUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '200x200bb') : '';
            const previewUrl = track.previewUrl;
            const trackName = track.trackName;
            const artistName = track.artistName;

            const playerInstanceId = 'vinyl_' + Math.random().toString(36).substr(2, 9);

            const contentHtml = `
                <div class="vinyl-player-card">
                    <div class="vinyl-container">
                        <div class="vinyl-disc" id="disc_${playerInstanceId}">
                            <img src="${artworkUrl}" class="vinyl-center-art" alt="Centro">
                        </div>
                        <img src="${artworkUrl}" class="vinyl-album-cover" alt="Capa do Álbum">
                    </div>
                    <div class="vinyl-info">
                        <div class="vinyl-title">${trackName}</div>
                        <div class="vinyl-artist">${artistName}</div>
                        <div class="vinyl-controls">
                            ${previewUrl ? `<button class="vinyl-play-btn" id="btn_${playerInstanceId}" onclick="toggleChatVinyl('${previewUrl}', '${playerInstanceId}')"><i class="fa-solid fa-play"></i></button>` : '<div style="font-size:10px; color:var(--text-muted);">Indisponível</div>'}
                        </div>
                    </div>
                </div>
            `;
            const lastMsgText = `[Música: ${trackName} - ${artistName}]`;

            const chat = chatsData.find(c => c.id === currentChatId);
            chat.messages.push({ sender: 'sent', isHtml: true, content: contentHtml, text: lastMsgText });
            chat.lastMsg = `Você: ${lastMsgText}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = contentHtml;
            messagesContainer.appendChild(msgDiv);

            closeMusicModal();
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            renderChatList();
        }

        function toggleChatVinyl(previewUrl, instanceId) {
            const discEl = document.getElementById(`disc_${instanceId}`);
            const btnEl = document.getElementById(`btn_${instanceId}`);

            if (activeChatAudio && activeChatAudio.src === previewUrl) {
                if (activeChatAudio.paused) {
                    activeChatAudio.play();
                    discEl.classList.add('playing');
                    btnEl.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } else {
                    activeChatAudio.pause();
                    discEl.classList.remove('playing');
                    btnEl.innerHTML = '<i class="fa-solid fa-play"></i>';
                }
            } else {
                if (activeChatAudio) {
                    activeChatAudio.pause();
                    document.querySelectorAll('.vinyl-disc').forEach(d => d.classList.remove('playing'));
                    document.querySelectorAll('.vinyl-play-btn').forEach(b => b.innerHTML = '<i class="fa-solid fa-play"></i>');
                }
                activeChatAudio = new Audio(previewUrl);
                activeChatAudio.play();
                discEl.classList.add('playing');
                btnEl.innerHTML = '<i class="fa-solid fa-pause"></i>';

                activeChatAudio.onended = () => {
                    discEl.classList.remove('playing');
                    btnEl.innerHTML = '<i class="fa-solid fa-play"></i>';
                };
            }
        }

        function sendAttachmentSimple(type) {
            const text = `[Enviou ${type}]`;
            const chat = chatsData.find(c => c.id === currentChatId);
            chat.messages.push({ sender: 'sent', isHtml: false, text: text });
            chat.lastMsg = `Você: ${text}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            renderChatList();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderChatList();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || currentChatId === null) return;

            const chat = chatsData.find(c => c.id === currentChatId);
            chat.messages.push({ sender: 'sent', isHtml: false, text: text });
            chat.lastMsg = `Você: ${text}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv);

            messageInput.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            renderChatList();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        renderChatList();
    </script>
</body>
</html>
