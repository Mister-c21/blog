<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Web - GIFs & Stickers Estilo Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-color: #6c5ce7;
            --secondary-hover: #5b4be2;
            --light-violet: #f3f0ff;
            --gray-bg: #f8f9fa;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-violet);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: var(--primary-bg);
            overflow: hidden;
        }

        .sidebar {
            width: 100%;
            background-color: var(--primary-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            height: 100%;
        }

        @media (min-width: 768px) {
            .sidebar {
                width: 35%;
                min-width: 320px;
            }
        }

        .sidebar-header {
            padding: 18px 20px 10px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-header .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--secondary-color);
            font-size: 18px;
        }

        .sidebar-actions i {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.2s;
        }

        .sidebar-actions i:hover {
            color: var(--secondary-color);
        }

        .top-tab-bar {
            display: flex;
            gap: 20px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-item {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--secondary-color);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--secondary-color);
            border-radius: 2px 2px 0 0;
        }

        .search-container {
            padding: 12px 20px;
            background-color: var(--primary-bg);
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--gray-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 15px;
            gap: 10px;
        }

        .search-box:focus-within {
            border-color: var(--secondary-color);
            background-color: var(--primary-bg);
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            font-size: 14px;
            width: 100%;
            color: var(--text-main);
        }

        .chat-list {
            overflow-y: auto;
            flex: 1;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--gray-bg);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: var(--gray-bg);
        }

        .chat-item.active {
            background-color: var(--light-violet);
            border-left: 4px solid var(--secondary-color);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--light-violet);
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .chat-last-msg {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-area {
            display: none;
            flex-direction: column;
            flex: 1;
            background-color: var(--primary-bg);
            height: 100%;
        }

        @media (min-width: 768px) {
            .chat-area {
                display: flex !important;
            }
        }

        .chat-header {
            padding: 12px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--secondary-color);
            display: inline-block;
        }

        @media (min-width: 768px) {
            .back-btn {
                display: none;
            }
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 20px;
            top: 60px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
            border-radius: 8px;
            z-index: 100;
            width: 180px;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--light-violet);
            color: var(--secondary-color);
        }

        .attachment-menu {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 20px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
            border-radius: 12px;
            z-index: 100;
            width: 220px;
            overflow: hidden;
        }

        .attachment-menu.show {
            display: block;
        }

        .attachment-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }

        .attachment-item:hover {
            background-color: var(--light-violet);
            color: var(--secondary-color);
        }

        .attachment-item i {
            color: var(--secondary-color);
            width: 20px;
            text-align: center;
        }

        /* Modal Instagram (GIFs / Stickers) */
        .ig-media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 768px) {
            .ig-media-modal {
                align-items: center;
            }
        }

        .ig-media-modal.show {
            display: flex;
        }

        .ig-modal-content {
            background-color: var(--primary-bg);
            width: 100%;
            max-width: 460px;
            height: 75vh;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .ig-modal-content {
                border-radius: 16px;
                height: 600px;
            }
        }

        .ig-modal-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 16px;
        }

        .ig-modal-header i {
            cursor: pointer;
            color: var(--text-muted);
        }

        .ig-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .ig-tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }

        .ig-tab-btn.active {
            color: var(--secondary-color);
        }

        .ig-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--secondary-color);
        }

        .ig-search-container {
            padding: 12px 16px;
            background-color: var(--gray-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .ig-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background-color: var(--primary-bg);
        }

        .ig-grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: start;
        }

        .ig-media-item {
            background-color: var(--gray-bg);
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
        }

        .ig-media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Outros Modais (Scanner, URLs, Músicas) */
        .qr-modal, .url-modal, .music-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .qr-modal.show, .url-modal.show, .music-modal.show {
            display: flex;
        }

        .qr-modal-content, .url-modal-content {
            background-color: var(--primary-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scanner-viewport {
            width: 100%;
            height: 220px;
            background-color: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        .qr-action-btn, .url-modal-buttons button {
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .music-modal-content {
            background-color: var(--primary-bg);
            width: 100%;
            max-width: 450px;
            height: 75vh;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .music-modal-content {
                border-radius: 16px;
                height: 600px;
            }
        }

        .music-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .music-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
            cursor: pointer;
        }

        .music-item:hover {
            background-color: var(--gray-bg);
        }

        .music-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--gray-bg);
            justify-content: center;
            align-items: center;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.received {
            background-color: var(--primary-bg);
            color: var(--text-main);
            align-self: flex-start;
        }

        .message.sent {
            background-color: var(--secondary-color);
            color: #ffffff;
            align-self: flex-end;
        }

        .message img, .message iframe {
            max-width: 100%;
            border-radius: 6px;
            display: block;
        }

        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        .chat-input-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            background-color: var(--gray-bg);
        }

        .chat-input-area button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
        }

        @media (max-width: 767px) {
            .mobile-show-chat .sidebar {
                display: none;
            }
            .mobile-show-chat .chat-area {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="app-title"><i class="fa-solid fa-comments"></i><span>Conversas</span></div>
                <div class="sidebar-actions"><i class="fa-solid fa-user-plus" id="addContactHeaderBtn"></i></div>
            </div>
            <div class="top-tab-bar">
                <button class="tab-item active" onclick="switchTab('contatos')">Contatos</button>
                <button class="tab-item" onclick="switchTab('bloqueados')">Bloqueados</button>
            </div>
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar..." autocomplete="off">
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header" id="chatHeader">
                <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="avatar" id="activeAvatar"><i class="fa-solid fa-user"></i></div>
                <div style="flex:1; min-width: 0;">
                    <div class="chat-name" id="activeName">Bem-vindo</div>
                    <div class="chat-last-msg" id="activeStatus" style="font-size: 12px;">offline</div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div style="text-align: center; color: var(--text-muted);">Selecione um contato para conversar</div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-icons">
                    <i class="fa-solid fa-paperclip" id="attachBtn"></i>
                    <div class="attachment-menu" id="attachmentMenu">
                        <div class="attachment-item" onclick="handleAttachmentSelection('Sticky')"><i class="fa-solid fa-note-sticky"></i> Sticky</div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('GIF')"><i class="fa-solid fa-image"></i> GIFs</div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Música')"><i class="fa-solid fa-music"></i> Música</div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Vídeo do YouTube')"><i class="fa-brands fa-youtube"></i> Vídeo do YouTube</div>
                        <div class="attachment-item" onclick="handleAttachmentSelection('Imagem')"><i class="fa-solid fa-camera"></i> Imagem</div>
                    </div>
                </div>
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="ig-media-modal" id="igMediaModal">
        <div class="ig-modal-content">
            <div class="ig-modal-header">
                <span id="igModalTitle">Selecionar GIF</span>
                <i class="fa-solid fa-xmark" onclick="closeIgMediaModal()"></i>
            </div>
            <div class="ig-tabs">
                <button class="ig-tab-btn active" id="tabGifBtn" onclick="switchIgTab('gif')">GIFs</button>
                <button class="ig-tab-btn" id="tabStickerBtn" onclick="switchIgTab('sticker')">Stickers</button>
            </div>
            <div class="ig-search-container">
                <input type="text" class="ig-search-input" id="igSearchInput" placeholder="Pesquisar..." autocomplete="off">
            </div>
            <div class="ig-grid-container" id="igGridContainer"></div>
        </div>
    </div>

    <div class="qr-modal" id="qrModal">
        <div class="qr-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Escanear QR</span>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeQrModal()"></i>
            </div>
            <div class="scanner-viewport"><div id="reader"></div></div>
            <button class="qr-action-btn" onclick="closeQrModal()">Fechar</button>
        </div>
    </div>

    <div class="url-modal" id="urlModal">
        <div class="url-modal-content">
            <div id="urlModalTitle" style="font-weight:600;">Inserir URL</div>
            <input type="text" id="urlInput" placeholder="Cole o link..." autocomplete="off" style="padding:10px; border:1px solid var(--border-color); border-radius:8px;">
            <div class="url-modal-buttons" style="display:flex; gap:10px;">
                <button style="background:var(--gray-bg); color:var(--text-muted);" onclick="closeUrlModal()">Cancelar</button>
                <button onclick="confirmUrlModal()">Enviar</button>
            </div>
        </div>
    </div>

    <div class="music-modal" id="musicModal">
        <div class="music-modal-content">
            <div style="padding:16px 20px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color);">
                <span>Escolher música</span>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeMusicModal()"></i>
            </div>
            <div style="padding:12px 20px; background:var(--gray-bg);">
                <input type="text" id="musicSearchInput" placeholder="Pesquisar músicas..." autocomplete="off" style="width:100%; padding:10px; border-radius:20px; border:1px solid var(--border-color);">
            </div>
            <div class="music-list" id="musicList"></div>
        </div>
    </div>

    <script>
        const chatsData = [
            { id: 1, name: "Maria Silva", lastMsg: "Combinado então!", avatar: "M", type: "contatos", messages: [{ sender: "received", text: "Oi!" }] }
        ];

        let currentTab = 'contatos';
        let currentChatId = null;
        let searchQuery = '';
        let activeAttachmentType = null;
        let html5QrCodeScanner = null;
        let igCurrentType = 'gif';
        let igSearchTimeout = null;
        let activePreviewAudio = null;

        const appContainer = document.getElementById('appContainer');
        const chatListEl = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messagesContainer');
        const activeName = document.getElementById('activeName');
        const activeAvatar = document.getElementById('activeAvatar');
        const activeStatus = document.getElementById('activeStatus');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('searchInput');
        const attachBtn = document.getElementById('attachBtn');
        const attachmentMenu = document.getElementById('attachmentMenu');
        const igMediaModal = document.getElementById('igMediaModal');
        const igModalTitle = document.getElementById('igModalTitle');
        const tabGifBtn = document.getElementById('tabGifBtn');
        const tabStickerBtn = document.getElementById('tabStickerBtn');
        const igSearchInput = document.getElementById('igSearchInput');
        const igGridContainer = document.getElementById('igGridContainer');
        const qrModal = document.getElementById('qrModal');
        const urlModal = document.getElementById('urlModal');
        const urlInput = document.getElementById('urlInput');
        const musicModal = document.getElementById('musicModal');
        const musicSearchInput = document.getElementById('musicSearchInput');
        const musicList = document.getElementById('musicList');

        function switchTab(tab) {
            currentTab = tab;
            renderChatList();
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            chatsData.filter(c => c.type === currentTab).forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<div class="avatar">${chat.avatar}</div><div class="chat-info"><div class="chat-name">${chat.name}</div><div class="chat-last-msg">${chat.lastMsg}</div></div>`;
                item.addEventListener('click', () => selectChat(chat.id));
                chatListEl.appendChild(item);
            });
        }

        function selectChat(id) {
            currentChatId = id;
            const chat = chatsData.find(c => c.id === id);
            activeName.textContent = chat.name;
            activeAvatar.textContent = chat.avatar;
            activeStatus.textContent = "online";

            messagesContainer.style.justifyContent = 'flex-start';
            messagesContainer.innerHTML = '';
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}`;
                if (msg.isHtml) div.innerHTML = msg.content;
                else div.textContent = msg.text;
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (window.innerWidth <= 767) {
                appContainer.classList.add('mobile-show-chat');
                window.parent.postMessage('hideNav', '*'); // Esconde a barra inferior no mobile
            }
            renderChatList();
        }

        backBtn.addEventListener('click', () => {
            appContainer.classList.remove('mobile-show-chat');
            currentChatId = null;
            activeName.textContent = "Bem-vindo";
            activeAvatar.innerHTML = '<i class="fa-solid fa-user"></i>';
            activeStatus.textContent = "offline";
            messagesContainer.style.justifyContent = 'center';
            messagesContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted);">Selecione um contato para conversar</div>';
            window.parent.postMessage('showNav', '*'); // Mostra a barra inferior novamente no mobile
            renderChatList();
        });

        attachBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentChatId !== null) attachmentMenu.classList.toggle('show');
        });

        window.addEventListener('click', () => attachmentMenu.classList.remove('show'));

        function handleAttachmentSelection(type) {
            attachmentMenu.classList.remove('show');
            if (currentChatId === null) return;
            if (type === 'GIF') openIgMediaModal('gif');
            else if (type === 'Sticky') openIgMediaModal('sticker');
            else if (type === 'Imagem' || type === 'Vídeo do YouTube') {
                activeAttachmentType = type;
                urlInput.value = '';
                urlModal.classList.add('show');
            } else if (type === 'Música') openMusicModal();
        }

        document.getElementById('addContactHeaderBtn').addEventListener('click', () => {
            qrModal.classList.add('show');
            if (window.innerWidth < 768) {
                setTimeout(() => {
                    html5QrCodeScanner = new Html5Qrcode("reader");
                    html5QrCodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 150 }, (text) => {
                        closeQrModal();
                    }, () => {});
                }, 300);
            }
        });

        function closeQrModal() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => { html5QrCodeScanner.clear(); html5QrCodeScanner = null; }).catch(() => { html5QrCodeScanner = null; });
            }
            qrModal.classList.remove('show');
        }

        function openIgMediaModal(type) {
            igCurrentType = type;
            igMediaModal.classList.add('show');
            igSearchInput.value = '';
            tabGifBtn.classList.toggle('active', type === 'gif');
            tabStickerBtn.classList.toggle('active', type === 'sticker');
            fetchGiphy('', type);
        }

        function closeIgMediaModal() { igMediaModal.classList.remove('show'); }

        function switchIgTab(type) {
            igCurrentType = type;
            tabGifBtn.classList.toggle('active', type === 'gif');
            tabStickerBtn.classList.toggle('active', type === 'sticker');
            fetchGiphy(igSearchInput.value.trim(), type);
        }

        igSearchInput.addEventListener('input', (e) => {
            clearTimeout(igSearchTimeout);
            igSearchTimeout = setTimeout(() => fetchGiphy(e.target.value.trim(), igCurrentType), 400);
        });

        async function fetchGiphy(query, type) {
            igGridContainer.innerHTML = `<div style="grid-column:span 2; text-align:center; padding:20px; color:var(--text-muted);">Carregando...</div>`;
            const endpoint = query ? 
                `https://api.giphy.com/v1/${type === 'gif' ? 'gifs' : 'stickers'}/search?api_key=dc6zaTOxFJmzC&q=${encodeURIComponent(query)}&limit=20` :
                `https://api.giphy.com/v1/${type === 'gif' ? 'gifs' : 'stickers'}/trending?api_key=dc6zaTOxFJmzC&limit=20`;
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                igGridContainer.innerHTML = '';
                data.data.forEach(item => {
                    const url = item.images.fixed_height_downsampled?.url || item.images.original.url;
                    const div = document.createElement('div');
                    div.className = 'ig-media-item';
                    div.innerHTML = `<img src="${url}" loading="lazy">`;
                    div.onclick = () => sendMediaMessage(`<img src="${url}">`, type === 'gif' ? '[GIF]' : '[Sticker]');
                    igGridContainer.appendChild(div);
                });
            } catch (e) {
                igGridContainer.innerHTML = `<div style="grid-column:span 2; text-align:center; color:#e74c3c;">Erro ao carregar.</div>`;
            }
        }

        function sendMediaMessage(html, text) {
            const chat = chatsData.find(c => c.id === currentChatId);
            chat.messages.push({ sender: 'sent', isHtml: true, content: html, text });
            chat.lastMsg = `Você: ${text}`;
            closeIgMediaModal();
            selectChat(currentChatId);
        }

        function closeUrlModal() { urlModal.classList.remove('show'); }
        function confirmUrlModal() {
            const url = urlInput.value.trim();
            if (!url) return;
            const html = activeAttachmentType === 'Imagem' ? `<img src="${url}">` : `<iframe src="https://www.youtube.com/embed/${url.split('v=')[1] || ''}" allowfullscreen></iframe>`;
            sendMediaMessage(html, '[Mídia]');
            closeUrlModal();
        }

        function openMusicModal() { musicModal.classList.add('show'); fetchMusic('pop'); }
        function closeMusicModal() { if (activePreviewAudio) activePreviewAudio.pause(); musicModal.classList.remove('show'); }
        musicSearchInput.addEventListener('input', (e) => fetchMusic(e.target.value.trim() || 'pop'));

        async function fetchMusic(term) {
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=15`);
            const data = await res.json();
            musicList.innerHTML = '';
            data.results.forEach(track => {
                const item = document.createElement('div');
                item.className = 'music-item';
                item.innerHTML = `<img src="${track.artworkUrl100}" class="music-art"><div style="flex:1;"><div style="font-weight:600; font-size:14px;">${track.trackName}</div><div style="font-size:12px; color:var(--text-muted);">${track.artistName}</div></div>`;
                item.onclick = () => {
                    sendMediaMessage(`<div style="padding:10px; background:#fff; border-radius:8px; border:1px solid #ddd;">🎵 <b>${track.trackName}</b> - ${track.artistName}</div>`, '[Música]');
                    closeMusicModal();
                };
                musicList.appendChild(item);
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || currentChatId === null) return;
            const chat = chatsData.find(c => c.id === currentChatId);
            chat.messages.push({ sender: 'sent', isHtml: false, text });
            chat.lastMsg = `Você: ${text}`;
            messageInput.value = '';
            selectChat(currentChatId);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderChatList(); });

        renderChatList();
    </script>
</body>
</html>
