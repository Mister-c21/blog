<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens Anônimas - NGL Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';
        window.NostrTools = NostrTools;
        window.nostrHexToBytes = hexToBytes;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #8a2be2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .top-bar button {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .share-title {
            font-size: 18px;
            font-weight: 600;
            color: #8a2be2;
        }

        .card-preview {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #f3e8ff;
        }

        .card-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(138,43,226,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
        }

        .profile-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a2be2;
            font-size: 48px;
        }

        .main-text {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #f3e8ff, -1px -1px 0px #f3e8ff;
            transform: rotate(-2deg);
            z-index: 1;
            outline: none;
            cursor: text;
            padding: 5px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .main-text:focus {
            background: rgba(138, 43, 226, 0.08);
        }

        .card-actions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }

        .card-actions-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .control-panel {
            width: 100%;
            max-width: 400px;
            background: #f9f5ff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #f3e8ff;
        }

        .btn-share-main {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }

        .btn-share-main:active {
            transform: scale(0.98);
        }

        .messages-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .messages-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-header {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3e8ff;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #8a2be2;
        }

        .modal-close-btn {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .message-item {
            background: #f9f5ff;
            border: 1px solid #f3e8ff;
            padding: 16px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .message-item:hover {
            background: #f3e8ff;
        }

        .message-text {
            font-size: 16px;
            color: #4b0082;
            font-weight: 500;
        }

        .message-time {
            font-size: 12px;
            color: #9333ea;
            align-self: flex-end;
        }

        .detail-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 15, 17, 0.92);
            background-size: cover;
            background-position: center;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .detail-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 0;
        }

        .detail-close-btn {
            background: #1a1a1f;
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .detail-card {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: 10px 0;
        }

        .detail-card-top {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            padding: 30px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            display: none;
        }

        .detail-card-bottom {
            flex: 1;
            background-color: #1e1e24;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }

        .detail-tools {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 10px 0;
        }

        .detail-tool-btn {
            background: #27272e;
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-respond-main {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .send-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .send-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .send-card {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            border: 2px solid #f3e8ff;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            gap: 20px;
        }

        .send-prompt-text {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.2;
        }

        .send-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e9d5ff;
            border-radius: 15px;
            padding: 12px;
            font-size: 16px;
            color: #4b0082;
            resize: none;
            outline: none;
            background-color: #f9f5ff;
        }

        .send-textarea:focus {
            border-color: #8a2be2;
        }

        .btn-send-anon {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 0.1s;
        }

        .btn-send-anon:active {
            transform: scale(0.98);
        }

        .btn-send-anon:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="homeBtn" title="Ir para Home"><i class="fa-solid fa-house"></i></button>
        <span class="share-title">compartilhar</span>
        <button id="inboxBtn" title="Mensagens Recebidas"><i class="fa-solid fa-inbox"></i></button>
    </div>

    <div class="card-preview">
        <div class="profile-container" id="profileContainer">
            <div class="profile-placeholder" id="profilePlaceholder">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <div class="main-text" id="editableText" contenteditable="true" spellcheck="false">
            me mande<br>mensagens<br>anônimas!
        </div>

        <div class="card-actions-left">
            <button class="action-icon-btn" id="btnReset" title="Voltar para a mensagem padrão"><i class="fa-solid fa-rotate-left"></i></button>
        </div>

        <div class="card-actions">
            <button class="action-icon-btn" id="btnEdit"><i class="fa-solid fa-pen"></i></button>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-share-main" id="shareBtn">
            Compartilhe!
        </button>
    </div>

    <div class="messages-modal" id="messagesModal">
        <div class="modal-header">
            <span class="modal-title">Mensagens Recebidas</span>
            <button class="modal-close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-content" id="messagesListContainer"></div>
    </div>

    <div class="detail-modal" id="detailModal">
        <div class="detail-top-bar" id="detailTopBar">
            <button class="detail-close-btn" id="closeDetailBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="detail-card" id="captureCard">
            <div class="detail-card-top">send me anonymous messages...</div>
            <div class="detail-card-bottom" id="detailMessageText"></div>
        </div>

        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; align-items: center;" id="detailFooterContainer">
            <div class="detail-tools" id="detailToolsContainer">
                <button class="detail-tool-btn" id="detailColorBtn"><i class="fa-solid fa-palette"></i></button>
                <button class="detail-tool-btn" id="detailCameraBtn" title="Alterar fundo por URL"><i class="fa-solid fa-camera"></i></button>
            </div>
            <button class="btn-respond-main" id="respondBtn">
                responder
            </button>
        </div>
    </div>

    <div class="send-modal" id="sendModal">
        <div style="font-size: 20px; font-weight: 700; color: #8a2be2;">enviar mensagem anônima</div>
        <div class="send-card">
            <div class="send-prompt-text" id="sendPromptText">me mande mensagens anônimas!</div>
            <textarea class="send-textarea" id="anonMessageInput" placeholder="Escreva sua mensagem anônima..."></textarea>
        </div>
        <button class="btn-send-anon" id="sendAnonBtn">Enviar!</button>
    </div>

    <script>
        const RELAYS = [
            'wss://relay.damus.io',
            'wss://relay.nostr.band',
            'wss://nos.lol',
            'wss://relay.primal.net'
        ];
        const LOGIN_PAGE = '../Social.html';
        const SW_PATH = './ngl-sw.js';

        let globalUserPubkey = null;
        const seenEventIds = new Set();
        const activeSockets = [];
        let swRegistration = null;

        function getNostrSession() {
            try {
                return JSON.parse(localStorage.getItem('nostr_session') || 'null');
            } catch {
                return null;
            }
        }

        function checkNostrAuthFromCache() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const sessionRaw = localStorage.getItem('nostr_session');
            if (isLoggedIn !== 'true' || !sessionRaw) return null;
            try {
                const p = JSON.parse(sessionRaw);
                if (!p.privateKeyHex || !p.pubkey) throw new Error('invalid');
                return p;
            } catch {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('nostr_session');
                return null;
            }
        }

        function getPrivateKeyBytes() {
            const s = getNostrSession();
            if (!s?.privateKeyHex) return null;
            try {
                if (window.nostrHexToBytes) return window.nostrHexToBytes(s.privateKeyHex);
                const hex = s.privateKeyHex;
                const out = new Uint8Array(hex.length / 2);
                for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
                return out;
            } catch {
                return null;
            }
        }

        function waitForNostrTools(maxMs = 8000) {
            return new Promise(resolve => {
                if (window.NostrTools) return resolve(true);
                const t0 = Date.now();
                const id = setInterval(() => {
                    if (window.NostrTools || Date.now() - t0 > maxMs) {
                        clearInterval(id);
                        resolve(!!window.NostrTools);
                    }
                }, 80);
            });
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            try {
                swRegistration = await navigator.serviceWorker.register(SW_PATH, { scope: './' });
                await navigator.serviceWorker.ready;
                return swRegistration;
            } catch (e) {
                console.warn('SW não registrado:', e);
                return null;
            }
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window)) return false;
            if (Notification.permission === 'granted') return true;
            if (Notification.permission === 'denied') return false;
            const result = await Notification.requestPermission();
            return result === 'granted';
        }

        async function showAnonMessageNotification(text) {
            const title = 'Mensagem anônima recebida';
            const body = (text || 'Nova mensagem').slice(0, 160);
            const payload = {
                type: 'SHOW_NOTIFICATION',
                title,
                body,
                icon: './Src/FavicoLW.png',
                tag: 'ngl-anon-msg',
                url: window.location.href.split('?')[0]
            };

            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage(payload);
                return;
            }

            if (swRegistration && swRegistration.showNotification && Notification.permission === 'granted') {
                try {
                    await swRegistration.showNotification(title, {
                        body,
                        icon: payload.icon,
                        tag: payload.tag,
                        renotify: true,
                        data: { url: payload.url }
                    });
                    return;
                } catch (e) {
                    console.warn(e);
                }
            }

            if (Notification.permission === 'granted') {
                try {
                    const n = new Notification(title, { body, tag: 'ngl-anon-msg' });
                    n.onclick = () => {
                        window.focus();
                        const modal = document.getElementById('messagesModal');
                        if (modal) modal.classList.add('active');
                        n.close();
                    };
                } catch (e) {}
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'OPEN_INBOX') {
                    const modal = document.getElementById('messagesModal');
                    if (modal) modal.classList.add('active');
                }
            });
        }

        async function authenticateNostrUser() {
            const session = checkNostrAuthFromCache();
            if (!session) {
                alert('Você precisa estar logado no LoreSocial. Redirecionando…');
                window.location.replace(LOGIN_PAGE);
                return;
            }
            globalUserPubkey = session.pubkey;
            console.log('Autenticado via cache (nostr_session):', globalUserPubkey);
            await registerServiceWorker();
            await requestNotificationPermission();
            initNostrSession(globalUserPubkey);
        }

        function handleIncomingEvent(ev, pubkey) {
            if (!ev || !ev.id) return;

            if (ev.kind === 0 && ev.content) {
                try {
                    const profileData = JSON.parse(ev.content);
                    if (profileData.picture) {
                        const el = document.getElementById('profileContainer');
                        if (el) {
                            el.innerHTML = '<img src="' + escapeHtml(profileData.picture) + '" alt="Perfil" class="profile-pic" id="profileImg">';
                        }
                    }
                } catch (e) {}
                return;
            }

            if (ev.kind !== 1 || !ev.content) return;
            if (seenEventIds.has(ev.id)) return;
            seenEventIds.add(ev.id);

            const now = Math.floor(Date.now() / 1000);
            const created = ev.created_at || now;
            if (now - created > 86400) return;

            const pTags = (ev.tags || [])
                .filter(function (t) { return t[0] === 'p'; })
                .map(function (t) { return String(t[1] || '').toLowerCase(); });

            if (pTags.indexOf(String(pubkey).toLowerCase()) === -1) return;

            if (String(ev.pubkey || '').toLowerCase() === String(pubkey).toLowerCase()) return;

            const timeStr = new Date(created * 1000).toLocaleTimeString();
            const isRealtime = (now - created) < 120;
            addMessageToList(ev.content, timeStr, isRealtime);
        }

        function bindSocketHandlers(ws, url, pubkey) {
            const oneDayAgo = Math.floor(Date.now() / 1000) - 86400;

            ws.onopen = function () {
                console.log('Relay conectado:', url);
                const subId = 'ngl-' + Math.random().toString(36).slice(2, 10);
                ws.send(JSON.stringify([
                    'REQ', subId,
                    { kinds: [1], '#p': [pubkey], since: oneDayAgo, limit: 50 }
                ]));
                ws.send(JSON.stringify([
                    'REQ', subId + '-profile',
                    { kinds: [0], authors: [pubkey], limit: 1 }
                ]));
            };

            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data[0] === 'EVENT' && data[2]) {
                        handleIncomingEvent(data[2], pubkey);
                    }
                } catch (e) {
                    console.error('Erro no evento Nostr:', e);
                }
            };

            ws.onerror = function () {
                console.warn('Erro relay:', url);
            };

            ws.onclose = function () {
                console.warn('Relay caiu:', url, '— reconectando…');
                setTimeout(function () {
                    if (globalUserPubkey === pubkey) connectRelay(url, pubkey);
                }, 4000 + Math.random() * 2000);
            };
        }

        function connectRelay(url, pubkey) {
            for (let i = activeSockets.length - 1; i >= 0; i--) {
                const s = activeSockets[i];
                if (s._relayUrl === url && (s.readyState === WebSocket.OPEN || s.readyState === WebSocket.CONNECTING)) {
                    return;
                }
                if (s._relayUrl === url) {
                    try { s.close(); } catch (e) {}
                    activeSockets.splice(i, 1);
                }
            }
            try {
                const ws = new WebSocket(url);
                ws._relayUrl = url;
                activeSockets.push(ws);
                bindSocketHandlers(ws, url, pubkey);
            } catch (e) {
                console.error('Falha ao conectar', url, e);
                setTimeout(function () {
                    if (globalUserPubkey === pubkey) connectRelay(url, pubkey);
                }, 6000);
            }
        }

        function initNostrSession(pubkey) {
            activeSockets.forEach(function (ws) {
                try { ws.close(); } catch (e) {}
            });
            activeSockets.length = 0;
            RELAYS.forEach(function (url) {
                connectRelay(url, pubkey);
            });
        }

        function addMessageToList(text, timeStr, notify) {
            const box = document.getElementById('messagesListContainer');
            if (!box) return;

            const items = box.querySelectorAll('.message-item');
            for (let i = 0; i < items.length; i++) {
                if (items[i].getAttribute('data-msg') === text) {
                    if (notify) showAnonMessageNotification(text);
                    return;
                }
            }

            const newItem = document.createElement('div');
            newItem.className = 'message-item';
            newItem.setAttribute('data-msg', text);
            newItem.innerHTML =
                '<span class="message-text">' + escapeHtml(text) + '</span>' +
                '<span class="message-time">' + (timeStr || 'Agora') + '</span>';
            box.prepend(newItem);

            if (notify) showAnonMessageNotification(text);
        }

        async function signEventWithSession(event) {
            await waitForNostrTools();
            const sk = getPrivateKeyBytes();
            if (sk && window.NostrTools) {
                return window.NostrTools.finalizeEvent(event, sk);
            }
            if (window.nostr && window.nostr.signEvent) {
                return await window.nostr.signEvent(event);
            }
            throw new Error('Sem chave para assinar (faça login ou use extensão Nostr)');
        }

        function publishEventToRelays(event, timeoutMs) {
            timeoutMs = timeoutMs || 8000;
            return Promise.all(RELAYS.map(function (url) {
                return new Promise(function (resolve) {
                    var settled = false;
                    var ws;
                    function done(ok, reason) {
                        if (settled) return;
                        settled = true;
                        try { if (ws) ws.close(); } catch (e) {}
                        resolve({ url: url, ok: ok, reason: reason });
                    }
                    try {
                        ws = new WebSocket(url);
                        var timer = setTimeout(function () { done(false, 'timeout'); }, timeoutMs);
                        ws.onopen = function () {
                            ws.send(JSON.stringify(['EVENT', event]));
                        };
                        ws.onmessage = function (msg) {
                            try {
                                var data = JSON.parse(msg.data);
                                if (data[0] === 'OK' && data[1] === event.id) {
                                    clearTimeout(timer);
                                    done(!!data[2], data[3] || '');
                                }
                            } catch (e) {}
                        };
                        ws.onerror = function () {
                            clearTimeout(timer);
                            done(false, 'error');
                        };
                    } catch (e) {
                        done(false, String(e));
                    }
                });
            }));
        }

        async function sendAnonymousMessage(targetPubkey, messageContent) {
            const session = checkNostrAuthFromCache();
            let event = {
                kind: 1,
                created_at: Math.floor(Date.now() / 1000),
                tags: [
                    ['p', targetPubkey],
                    ['client', 'loresocial-ngl']
                ],
                content: messageContent
            };

            if (session && session.pubkey) {
                event.pubkey = session.pubkey;
                event = await signEventWithSession(event);
            } else if (window.nostr && window.nostr.signEvent) {
                event = await window.nostr.signEvent(event);
            } else {
                throw new Error('Para enviar de verdade, entre na conta LoreSocial ou use uma extensão Nostr (Alby/nos2x).');
            }

            const results = await publishEventToRelays(event);
            const accepted = results.filter(function (r) { return r.ok; });
            if (!accepted.length) {
                console.warn('Publish results:', results);
                throw new Error('Nenhum relay aceitou o evento. Tente novamente.');
            }
            console.log('Publicado em:', accepted.map(function (r) { return r.url; }));
            return event;
        }

        window.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPubkey = urlParams.get('u');
            const sharedText = urlParams.get('t');

            if (targetPubkey) {
                const sendModal = document.getElementById('sendModal');
                const sendPromptText = document.getElementById('sendPromptText');
                if (sharedText) {
                    sendPromptText.innerHTML = decodeURIComponent(sharedText).replace(/\n/g, '<br>');
                }
                sendModal.classList.add('active');

                document.getElementById('sendAnonBtn').addEventListener('click', async function () {
                    const messageContent = document.getElementById('anonMessageInput').value.trim();
                    if (!messageContent) {
                        alert('Por favor, escreva uma mensagem antes de enviar.');
                        return;
                    }
                    const btn = document.getElementById('sendAnonBtn');
                    btn.disabled = true;
                    btn.textContent = 'Enviando…';
                    try {
                        await sendAnonymousMessage(targetPubkey, messageContent);
                        alert('Mensagem anônima enviada com sucesso!');
                        document.getElementById('anonMessageInput').value = '';
                    } catch (err) {
                        console.error(err);
                        alert(err.message || 'Erro ao enviar mensagem.');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Enviar!';
                    }
                });
            } else {
                authenticateNostrUser();
            }
        });

        document.getElementById('homeBtn').addEventListener('click', function () {
            window.location.href = '../Bate-papo.html';
        });

        const inboxBtn = document.getElementById('inboxBtn');
        const messagesModal = document.getElementById('messagesModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        inboxBtn.addEventListener('click', function () {
            messagesModal.classList.add('active');
        });
        closeModalBtn.addEventListener('click', function () {
            messagesModal.classList.remove('active');
        });

        const detailModal = document.getElementById('detailModal');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const detailMessageText = document.getElementById('detailMessageText');
        const messagesListContainer = document.getElementById('messagesListContainer');

        messagesListContainer.addEventListener('click', function (e) {
            const item = e.target.closest('.message-item');
            if (item) {
                detailMessageText.innerText = item.getAttribute('data-msg');
                messagesModal.classList.remove('active');
                detailModal.classList.add('active');
            }
        });

        closeDetailBtn.addEventListener('click', function () {
            detailModal.classList.remove('active');
        });

        document.getElementById('detailCameraBtn').addEventListener('click', function () {
            const imgUrl = prompt('Cole a URL da imagem para o fundo do modal:');
            if (imgUrl && imgUrl.trim() !== '') {
                detailModal.style.backgroundImage = "url('" + imgUrl.trim() + "')";
            }
        });

        const detailCard = document.querySelector('.detail-card');
        const gradients = [
            'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #fbc531 0%, #e84118 100%)'
        ];
        let colorIndex = 0;
        document.getElementById('detailColorBtn').addEventListener('click', function () {
            colorIndex = (colorIndex + 1) % gradients.length;
            detailCard.style.background = gradients[colorIndex];
        });

        const respondBtn = document.getElementById('respondBtn');
        const detailTopBar = document.getElementById('detailTopBar');
        const detailFooterContainer = document.getElementById('detailFooterContainer');

        respondBtn.addEventListener('click', async function () {
            detailTopBar.style.display = 'none';
            detailFooterContainer.style.display = 'none';
            const originalBg = detailModal.style.backgroundColor;
            detailModal.style.backgroundColor = 'transparent';

            try {
                const canvas = await html2canvas(detailModal, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true
                });

                canvas.toBlob(async function (blob) {
                    if (!blob) return;
                    const file = new File([blob], 'mensagem-ngl.png', { type: 'image/png' });
                    let shared = false;

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'Mensagem Anônima',
                                text: 'Veja essa mensagem que recebi no NGL!',
                                files: [file]
                            });
                            shared = true;
                        } catch (err) {
                            if (err.name === 'AbortError') shared = true;
                        }
                    }

                    if (!shared) {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'mensagem-ngl.png';
                        link.click();
                        alert('Seu navegador não suporta o compartilhamento direto. A imagem foi baixada com sucesso!');
                    }
                }, 'image/png');
            } catch (error) {
                console.error('Erro ao gerar print da página:', error);
            } finally {
                detailTopBar.style.display = 'flex';
                detailFooterContainer.style.display = 'flex';
                detailModal.style.backgroundColor = originalBg;
            }
        });

        const editableText = document.getElementById('editableText');
        const defaultMessage = 'me mande<br>mensagens<br>anônimas!';

        document.getElementById('btnEdit').addEventListener('click', function () {
            editableText.focus();
        });

        document.getElementById('btnReset').addEventListener('click', function () {
            editableText.innerHTML = defaultMessage;
        });

        document.getElementById('shareBtn').addEventListener('click', async function () {
            const baseUrl = window.location.origin + window.location.pathname;
            const currentMessageText = editableText.innerHTML;

            if (!globalUserPubkey) {
                alert('Aguarde a autenticação Nostr via cache do navegador ser concluída para gerar seu link.');
                return;
            }

            const simplifiedLink = baseUrl + '?u=' + globalUserPubkey + '&t=' + encodeURIComponent(currentMessageText);

            try {
                await navigator.clipboard.writeText(simplifiedLink);
                alert('Link simplificado copiado para a área de transferência!');
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = simplifiedLink;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Link simplificado copiado com sucesso!');
            }
        });
    </script>
</body>
