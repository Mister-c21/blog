<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens Anônimas - NGL Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';
        window.NostrTools = NostrTools;
        window.nostrHexToBytes = hexToBytes;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #8a2be2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .top-bar button {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .share-title {
            font-size: 18px;
            font-weight: 600;
            color: #8a2be2;
        }

        .card-preview {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #f3e8ff;
        }

        .card-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(138,43,226,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
        }

        .profile-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a2be2;
            font-size: 48px;
        }

        .main-text {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #f3e8ff, -1px -1px 0px #f3e8ff;
            transform: rotate(-2deg);
            z-index: 1;
            outline: none;
            cursor: text;
            padding: 5px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .main-text:focus {
            background: rgba(138, 43, 226, 0.08);
        }

        .card-actions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }

        .card-actions-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .control-panel {
            width: 100%;
            max-width: 400px;
            background: #f9f5ff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #f3e8ff;
        }

        .btn-share-main {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }

        .btn-share-main:active {
            transform: scale(0.98);
        }

        .messages-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .messages-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-header {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3e8ff;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #8a2be2;
        }

        .modal-close-btn {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .message-item {
            background: #f9f5ff;
            border: 1px solid #f3e8ff;
            padding: 16px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .message-item:hover {
            background: #f3e8ff;
        }

        .message-text {
            font-size: 16px;
            color: #4b0082;
            font-weight: 500;
        }

        .message-time {
            font-size: 12px;
            color: #9333ea;
            align-self: flex-end;
        }

        .detail-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 15, 17, 0.92);
            background-size: cover;
            background-position: center;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .detail-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 0;
        }

        .detail-close-btn {
            background: #1a1a1f;
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .detail-card {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: 10px 0;
        }

        .detail-card-top {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            padding: 30px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            display: none;
        }

        .detail-card-bottom {
            flex: 1;
            background-color: #1e1e24;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }

        .detail-tools {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 10px 0;
        }

        .detail-tool-btn {
            background: #27272e;
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-respond-main {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .send-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .send-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .send-card {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            border: 2px solid #f3e8ff;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            gap: 20px;
        }

        .send-prompt-text {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.2;
        }

        .send-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e9d5ff;
            border-radius: 15px;
            padding: 12px;
            font-size: 16px;
            color: #4b0082;
            resize: none;
            outline: none;
            background-color: #f9f5ff;
        }

        .send-textarea:focus {
            border-color: #8a2be2;
        }

        .btn-send-anon {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 0.1s;
        }

        .btn-send-anon:active {
            transform: scale(0.98);
        }

        .btn-send-anon:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="homeBtn" title="Ir para Home"><i class="fa-solid fa-house"></i></button>
        <span class="share-title">compartilhar</span>
        <button id="inboxBtn" title="Mensagens Recebidas"><i class="fa-solid fa-inbox"></i></button>
    </div>

    <div class="card-preview">
        <div class="profile-container" id="profileContainer">
            <div class="profile-placeholder" id="profilePlaceholder">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <div class="main-text" id="editableText" contenteditable="true" spellcheck="false">
            me mande<br>mensagens<br>anônimas!
        </div>

        <div class="card-actions-left">
            <button class="action-icon-btn" id="btnReset" title="Voltar para a mensagem padrão"><i class="fa-solid fa-rotate-left"></i></button>
        </div>

        <div class="card-actions">
            <button class="action-icon-btn" id="btnEdit"><i class="fa-solid fa-pen"></i></button>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-share-main" id="shareBtn">Compartilhe!</button>
    </div>

    <div class="messages-modal" id="messagesModal">
        <div class="modal-header">
            <span class="modal-title">Mensagens Recebidas</span>
            <button class="modal-close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-content" id="messagesListContainer"></div>
    </div>

    <div class="detail-modal" id="detailModal">
        <div class="detail-top-bar" id="detailTopBar">
            <button class="detail-close-btn" id="closeDetailBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="detail-card" id="captureCard">
            <div class="detail-card-top">send me anonymous messages...</div>
            <div class="detail-card-bottom" id="detailMessageText"></div>
        </div>

        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; align-items: center;" id="detailFooterContainer">
            <div class="detail-tools" id="detailToolsContainer">
                <button class="detail-tool-btn" id="detailColorBtn"><i class="fa-solid fa-palette"></i></button>
                <button class="detail-tool-btn" id="detailCameraBtn" title="Alterar fundo por URL"><i class="fa-solid fa-camera"></i></button>
            </div>
            <button class="btn-respond-main" id="respondBtn">responder</button>
        </div>
    </div>

    <div class="send-modal" id="sendModal">
        <div style="font-size: 20px; font-weight: 700; color: #8a2be2;">enviar mensagem anônima</div>
        <div class="send-card">
            <div class="send-prompt-text" id="sendPromptText">me mande mensagens anônimas!</div>
            <textarea class="send-textarea" id="anonMessageInput" placeholder="Escreva sua mensagem anônima..."></textarea>
        </div>
        <button class="btn-send-anon" id="sendAnonBtn">Enviar!</button>
    </div>

    <script>
        const RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://relay.nostr.band',
            'wss://relay.primal.net'
        ];
        const LOGIN_PAGE = '../Social.html';
        const SW_PATH = './ngl-sw.js';
        const STORAGE_KEY = 'ngl_anon_messages_v1';

        let globalUserPubkey = null;
        let nostrPool = null;
        let liveSub = null;
        const seenEventIds = new Set();
        let swRegistration = null;

        function getNostrSession() {
            try {
                return JSON.parse(localStorage.getItem('nostr_session') || 'null');
            } catch {
                return null;
            }
        }

        function checkNostrAuthFromCache() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const sessionRaw = localStorage.getItem('nostr_session');
            if (isLoggedIn !== 'true' || !sessionRaw) return null;
            try {
                const p = JSON.parse(sessionRaw);
                if (!p.privateKeyHex || !p.pubkey) throw new Error('invalid');
                return p;
            } catch {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('nostr_session');
                return null;
            }
        }

        function getPrivateKeyBytes() {
            const s = getNostrSession();
            if (!s || !s.privateKeyHex) return null;
            try {
                if (window.nostrHexToBytes) return window.nostrHexToBytes(s.privateKeyHex);
                const hex = s.privateKeyHex;
                const out = new Uint8Array(hex.length / 2);
                for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
                return out;
            } catch {
                return null;
            }
        }

        function waitForNostrTools(maxMs) {
            maxMs = maxMs || 10000;
            return new Promise(function (resolve) {
                if (window.NostrTools) return resolve(true);
                var t0 = Date.now();
                var id = setInterval(function () {
                    if (window.NostrTools || Date.now() - t0 > maxMs) {
                        clearInterval(id);
                        resolve(!!window.NostrTools);
                    }
                }, 50);
            });
        }

        function normalizePubkey(pk) {
            if (!pk) return '';
            var s = String(pk).trim();
            try {
                if (s.indexOf('npub1') === 0 && window.NostrTools) {
                    var decoded = NostrTools.nip19.decode(s);
                    if (decoded.type === 'npub') s = decoded.data;
                }
            } catch (e) {}
            return s.toLowerCase();
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            try {
                swRegistration = await navigator.serviceWorker.register(SW_PATH, { scope: './' });
                await navigator.serviceWorker.ready;
                return swRegistration;
            } catch (e) {
                console.warn('[NGL] SW:', e);
                return null;
            }
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window)) return false;
            if (Notification.permission === 'granted') return true;
            if (Notification.permission === 'denied') return false;
            var result = await Notification.requestPermission();
            return result === 'granted';
        }

        async function showAnonMessageNotification(text) {
            var title = 'Mensagem anônima recebida';
            var body = (text || 'Nova mensagem').slice(0, 160);
            var payload = {
                type: 'SHOW_NOTIFICATION',
                title: title,
                body: body,
                icon: './Src/FavicoLW.png',
                tag: 'ngl-anon-msg',
                url: window.location.href.split('?')[0]
            };

            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage(payload);
                return;
            }

            if (swRegistration && swRegistration.showNotification && Notification.permission === 'granted') {
                try {
                    await swRegistration.showNotification(title, {
                        body: body,
                        icon: payload.icon,
                        tag: payload.tag,
                        renotify: true,
                        data: { url: payload.url }
                    });
                    return;
                } catch (e) {}
            }

            if (Notification.permission === 'granted') {
                try {
                    var n = new Notification(title, { body: body, tag: 'ngl-anon-msg' });
                    n.onclick = function () {
                        window.focus();
                        var modal = document.getElementById('messagesModal');
                        if (modal) modal.classList.add('active');
                        n.close();
                    };
                } catch (e) {}
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'OPEN_INBOX') {
                    var modal = document.getElementById('messagesModal');
                    if (modal) modal.classList.add('active');
                }
            });
        }

        function loadLocalMessages() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY + '_' + (globalUserPubkey || ''));
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveLocalMessage(entry) {
            if (!globalUserPubkey) return;
            var list = loadLocalMessages();
            if (list.some(function (m) { return m.id === entry.id; })) return;
            list.unshift(entry);
            localStorage.setItem(
                STORAGE_KEY + '_' + globalUserPubkey,
                JSON.stringify(list.slice(0, 100))
            );
        }

        function renderLocalMessages() {
            var list = loadLocalMessages();
            list.forEach(function (m) {
                if (m.id) seenEventIds.add(m.id);
                addMessageToList(m.content, m.timeStr, false, m.id, true);
            });
        }

        function addMessageToList(text, timeStr, notify, eventId, skipSave) {
            var box = document.getElementById('messagesListContainer');
            if (!box) return;

            if (eventId) {
                var existsId = box.querySelector('[data-id="' + eventId + '"]');
                if (existsId) {
                    if (notify) showAnonMessageNotification(text);
                    return;
                }
            }

            var items = box.querySelectorAll('.message-item');
            for (var i = 0; i < items.length; i++) {
                if (items[i].getAttribute('data-msg') === text && !eventId) {
                    if (notify) showAnonMessageNotification(text);
                    return;
                }
            }

            var newItem = document.createElement('div');
            newItem.className = 'message-item';
            newItem.setAttribute('data-msg', text);
            if (eventId) newItem.setAttribute('data-id', eventId);
            newItem.innerHTML =
                '<span class="message-text">' + escapeHtml(text) + '</span>' +
                '<span class="message-time">' + (timeStr || 'Agora') + '</span>';
            box.prepend(newItem);

            if (!skipSave && eventId) {
                saveLocalMessage({
                    id: eventId,
                    content: text,
                    timeStr: timeStr || 'Agora',
                    ts: Date.now()
                });
            }

            if (notify) showAnonMessageNotification(text);
        }

        function handleIncomingEvent(ev, myPubkey, fromLive) {
            if (!ev || !ev.id) return;

            if (ev.kind === 0 && ev.content) {
                try {
                    var profileData = JSON.parse(ev.content);
                    if (profileData.picture) {
                        var el = document.getElementById('profileContainer');
                        if (el) {
                            el.innerHTML =
                                '<img src="' + escapeHtml(profileData.picture) +
                                '" alt="Perfil" class="profile-pic" id="profileImg">';
                        }
                    }
                } catch (e) {}
                return;
            }

            if (ev.kind !== 1 || !ev.content) return;
            if (seenEventIds.has(ev.id)) return;

            var now = Math.floor(Date.now() / 1000);
            var created = ev.created_at || now;
            if (now - created > 86400) return;

            var my = normalizePubkey(myPubkey);
            var pTags = (ev.tags || [])
                .filter(function (t) { return t[0] === 'p'; })
                .map(function (t) { return normalizePubkey(t[1]); });

            if (pTags.indexOf(my) === -1) {
                console.log('[NGL] Evento ignorado (sem #p meu):', ev.id);
                return;
            }

            if (normalizePubkey(ev.pubkey) === my) return;

            seenEventIds.add(ev.id);
            var timeStr = new Date(created * 1000).toLocaleTimeString();
            var isRealtime = fromLive || (now - created) < 180;

            console.log('[NGL] Mensagem recebida:', ev.id, ev.content.slice(0, 40));
            addMessageToList(ev.content, timeStr, isRealtime, ev.id, false);
        }

        async function startReceiving(pubkey) {
            var ok = await waitForNostrTools();
            if (!ok) {
                console.error('[NGL] nostr-tools não carregou');
                alert('Biblioteca Nostr não carregou. Recarregue a página.');
                return;
            }

            var pk = normalizePubkey(pubkey);
            globalUserPubkey = pk;

            if (!nostrPool) nostrPool = new NostrTools.SimplePool();

            if (liveSub && typeof liveSub.close === 'function') {
                try { liveSub.close(); } catch (e) {}
            }

            var since = Math.floor(Date.now() / 1000) - 86400;
            console.log('[NGL] Buscando histórico para', pk);

            try {
                var past = await nostrPool.querySync(RELAYS, {
                    kinds: [1],
                    '#p': [pk],
                    since: since,
                    limit: 50
                });
                console.log('[NGL] Histórico bruto:', (past || []).length);
                (past || [])
                    .sort(function (a, b) { return (a.created_at || 0) - (b.created_at || 0); })
                    .forEach(function (ev) { handleIncomingEvent(ev, pk, false); });
            } catch (e) {
                console.error('[NGL] Erro histórico:', e);
            }

            try {
                var profileEv = await nostrPool.get(RELAYS, { kinds: [0], authors: [pk] });
                if (profileEv) handleIncomingEvent(profileEv, pk, false);
            } catch (e) {
                console.warn('[NGL] Perfil:', e);
            }

            try {
                liveSub = nostrPool.subscribeMany(
                    RELAYS,
                    [{
                        kinds: [1],
                        '#p': [pk],
                        since: Math.floor(Date.now() / 1000) - 30
                    }],
                    {
                        onevent: function (ev) { handleIncomingEvent(ev, pk, true); },
                        oneose: function () { console.log('[NGL] Subscription EOSE (ao vivo ativa)'); }
                    }
                );
                console.log('[NGL] Subscription ao vivo iniciada');
            } catch (e) {
                console.error('[NGL] Erro subscribe:', e);
            }
        }

        async function authenticateNostrUser() {
            var session = checkNostrAuthFromCache();
            if (!session) {
                alert('Você precisa estar logado no LoreSocial. Redirecionando…');
                window.location.replace(LOGIN_PAGE);
                return;
            }

            globalUserPubkey = normalizePubkey(session.pubkey);
            console.log('[NGL] Auth cache OK:', globalUserPubkey);

            renderLocalMessages();
            await registerServiceWorker();
            await requestNotificationPermission();
            await startReceiving(globalUserPubkey);
        }

        async function sendAnonymousMessage(targetPubkey, messageContent) {
            var ok = await waitForNostrTools();
            if (!ok) throw new Error('nostr-tools não carregou');

            var target = normalizePubkey(targetPubkey);
            if (!/^[0-9a-f]{64}$/.test(target)) {
                throw new Error('Pubkey de destino inválida.');
            }

            var sk = getPrivateKeyBytes();
            var signed;

            if (sk && window.NostrTools) {
                signed = NostrTools.finalizeEvent(
                    {
                        kind: 1,
                        created_at: Math.floor(Date.now() / 1000),
                        tags: [
                            ['p', target],
                            ['client', 'loresocial-ngl']
                        ],
                        content: messageContent
                    },
                    sk
                );
            } else if (window.nostr && window.nostr.signEvent) {
                signed = await window.nostr.signEvent({
                    kind: 1,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [
                        ['p', target],
                        ['client', 'loresocial-ngl']
                    ],
                    content: messageContent
                });
            } else {
                throw new Error(
                    'Para enviar, faça login no LoreSocial ou use extensão Nostr (Alby/nos2x).'
                );
            }

            if (!signed || !signed.id || !signed.sig) {
                throw new Error('Evento sem assinatura válida.');
            }

            console.log('[NGL] Publicando evento', signed.id, '→', target);

            if (!nostrPool) nostrPool = new NostrTools.SimplePool();

            var pubs = nostrPool.publish(RELAYS, signed);
            var pubList = Array.isArray(pubs) ? pubs : [pubs];
            var results = await Promise.allSettled(
                pubList.map(function (p) {
                    return Promise.race([
                        p,
                        new Promise(function (_, rej) {
                            setTimeout(function () { rej(new Error('timeout')); }, 10000);
                        })
                    ]);
                })
            );

            var okCount = results.filter(function (r) { return r.status === 'fulfilled'; }).length;
            console.log('[NGL] Publish results:', results);

            if (okCount === 0) {
                var accepted = 0;
                for (var i = 0; i < RELAYS.length; i++) {
                    var url = RELAYS[i];
                    try {
                        var acceptedOne = await new Promise(function (resolve) {
                            var done = false;
                            var ws = new WebSocket(url);
                            var t = setTimeout(function () {
                                if (!done) {
                                    done = true;
                                    try { ws.close(); } catch (e) {}
                                    resolve(false);
                                }
                            }, 8000);
                            ws.onopen = function () {
                                ws.send(JSON.stringify(['EVENT', signed]));
                            };
                            ws.onmessage = function (msg) {
                                try {
                                    var data = JSON.parse(msg.data);
                                    if (data[0] === 'OK' && data[1] === signed.id) {
                                        if (!done) {
                                            done = true;
                                            clearTimeout(t);
                                            try { ws.close(); } catch (e) {}
                                            resolve(!!data[2]);
                                        }
                                    }
                                } catch (e) {}
                            };
                            ws.onerror = function () {
                                if (!done) {
                                    done = true;
                                    clearTimeout(t);
                                    resolve(false);
                                }
                            };
                        });
                        if (acceptedOne) accepted++;
                    } catch (e) {}
                }
                if (!accepted) throw new Error('Nenhum relay aceitou o evento.');
            }

            console.log('[NGL] Publicado com sucesso');
            return signed;
        }

        window.addEventListener('DOMContentLoaded', function () {
            var urlParams = new URLSearchParams(window.location.search);
            var targetPubkey = urlParams.get('u');
            var sharedText = urlParams.get('t');

            if (targetPubkey) {
                var sendModal = document.getElementById('sendModal');
                var sendPromptText = document.getElementById('sendPromptText');
                if (sharedText) {
                    sendPromptText.innerHTML = decodeURIComponent(sharedText).replace(/\n/g, '<br>');
                }
                sendModal.classList.add('active');

                document.getElementById('sendAnonBtn').addEventListener('click', async function () {
                    var messageContent = document.getElementById('anonMessageInput').value.trim();
                    if (!messageContent) {
                        alert('Por favor, escreva uma mensagem antes de enviar.');
                        return;
                    }
                    var btn = document.getElementById('sendAnonBtn');
                    btn.disabled = true;
                    btn.textContent = 'Enviando…';
                    try {
                        await sendAnonymousMessage(targetPubkey, messageContent);
                        alert('Mensagem anônima enviada com sucesso!');
                        document.getElementById('anonMessageInput').value = '';
                    } catch (err) {
                        console.error('[NGL] Envio:', err);
                        alert(err.message || 'Erro ao enviar mensagem.');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Enviar!';
                    }
                });
            } else {
                authenticateNostrUser();
            }
        });

        document.getElementById('homeBtn').addEventListener('click', function () {
            window.location.href = '../Bate-papo.html';
        });

        var inboxBtn = document.getElementById('inboxBtn');
        var messagesModal = document.getElementById('messagesModal');
        var closeModalBtn = document.getElementById('closeModalBtn');

        inboxBtn.addEventListener('click', function () {
            messagesModal.classList.add('active');
        });
        closeModalBtn.addEventListener('click', function () {
            messagesModal.classList.remove('active');
        });

        var detailModal = document.getElementById('detailModal');
        var closeDetailBtn = document.getElementById('closeDetailBtn');
        var detailMessageText = document.getElementById('detailMessageText');
        var messagesListContainer = document.getElementById('messagesListContainer');

        messagesListContainer.addEventListener('click', function (e) {
            var item = e.target.closest('.message-item');
            if (item) {
                detailMessageText.innerText = item.getAttribute('data-msg');
                messagesModal.classList.remove('active');
                detailModal.classList.add('active');
            }
        });

        closeDetailBtn.addEventListener('click', function () {
            detailModal.classList.remove('active');
        });

        document.getElementById('detailCameraBtn').addEventListener('click', function () {
            var imgUrl = prompt('Cole a URL da imagem para o fundo do modal:');
            if (imgUrl && imgUrl.trim() !== '') {
                detailModal.style.backgroundImage = "url('" + imgUrl.trim() + "')";
            }
        });

        var detailCard = document.querySelector('.detail-card');
        var gradients = [
            'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #fbc531 0%, #e84118 100%)'
        ];
        var colorIndex = 0;
        document.getElementById('detailColorBtn').addEventListener('click', function () {
            colorIndex = (colorIndex + 1) % gradients.length;
            detailCard.style.background = gradients[colorIndex];
        });

        var respondBtn = document.getElementById('respondBtn');
        var detailTopBar = document.getElementById('detailTopBar');
        var detailFooterContainer = document.getElementById('detailFooterContainer');

        respondBtn.addEventListener('click', async function () {
            detailTopBar.style.display = 'none';
            detailFooterContainer.style.display = 'none';
            var originalBg = detailModal.style.backgroundColor;
            detailModal.style.backgroundColor = 'transparent';

            try {
                var canvas = await html2canvas(detailModal, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true
                });

                canvas.toBlob(async function (blob) {
                    if (!blob) return;
                    var file = new File([blob], 'mensagem-ngl.png', { type: 'image/png' });
                    var shared = false;

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'Mensagem Anônima',
                                text: 'Veja essa mensagem que recebi no NGL!',
                                files: [file]
                            });
                            shared = true;
                        } catch (err) {
                            if (err.name === 'AbortError') shared = true;
                        }
                    }

                    if (!shared) {
                        var link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'mensagem-ngl.png';
                        link.click();
                        alert('Imagem baixada com sucesso!');
                    }
                }, 'image/png');
            } catch (error) {
                console.error('Erro ao gerar print:', error);
            } finally {
                detailTopBar.style.display = 'flex';
                detailFooterContainer.style.display = 'flex';
                detailModal.style.backgroundColor = originalBg;
            }
        });

        var editableText = document.getElementById('editableText');
        var defaultMessage = 'me mande<br>mensagens<br>anônimas!';

        document.getElementById('btnEdit').addEventListener('click', function () {
            editableText.focus();
        });

        document.getElementById('btnReset').addEventListener('click', function () {
            editableText.innerHTML = defaultMessage;
        });

        document.getElementById('shareBtn').addEventListener('click', async function () {
            if (!globalUserPubkey) {
                alert('Aguarde a autenticação Nostr.');
                return;
            }
            var baseUrl = window.location.origin + window.location.pathname;
            var simplifiedLink =
                baseUrl +
                '?u=' +
                globalUserPubkey +
                '&t=' +
                encodeURIComponent(editableText.innerHTML);

            try {
                await navigator.clipboard.writeText(simplifiedLink);
                alert('Link copiado!');
            } catch (err) {
                var ta = document.createElement('textarea');
                ta.value = simplifiedLink;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Link copiado!');
            }
        });
    </script>
</body>
