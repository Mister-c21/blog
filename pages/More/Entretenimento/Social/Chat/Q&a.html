<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens Anônimas</title>
    <!-- Importação do FontAwesome para utilizar ícones vetoriais profissionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Importação do html2canvas para capturar o card em imagem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #8a2be2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .top-bar button {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .share-title {
            font-size: 18px;
            font-weight: 600;
            color: #8a2be2;
        }

        /* Card Container (Stories Preview) */
        .card-preview {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #f3e8ff;
        }

        /* Holographic overlay effect */
        .card-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(138,43,226,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .profile-container {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
        }

        /* Estilo para quando não houver imagem e renderizar o ícone de perfil */
        .profile-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            background-color: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a2be2;
            font-size: 48px;
        }

        .main-text {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #f3e8ff, -1px -1px 0px #f3e8ff;
            transform: rotate(-2deg);
            z-index: 1;
            outline: none;
            cursor: text;
            padding: 5px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .main-text:focus {
            background: rgba(138, 43, 226, 0.08);
        }

        .card-actions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }

        .card-actions-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        /* Bottom Control Panel */
        .control-panel {
            width: 100%;
            max-width: 400px;
            background: #f9f5ff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #f3e8ff;
        }

        .btn-share-main {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }

        .btn-share-main:active {
            transform: scale(0.98);
        }

        /* Modal de Mensagens Recebidas */
        .messages-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .messages-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-header {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3e8ff;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #8a2be2;
        }

        .modal-close-btn {
            background: #f3e8ff;
            border: none;
            color: #8a2be2;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .message-item {
            background: #f9f5ff;
            border: 1px solid #f3e8ff;
            padding: 16px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .message-item:hover {
            background: #f3e8ff;
        }

        .message-text {
            font-size: 16px;
            color: #4b0082;
            font-weight: 500;
        }

        .message-time {
            font-size: 12px;
            color: #9333ea;
            align-self: flex-end;
        }

        /* Sub-modal Estilo NGL */
        .detail-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 15, 17, 0.92);
            background-size: cover;
            background-position: center;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .detail-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 0;
        }

        .detail-close-btn {
            background: #1a1a1f;
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .detail-card {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: 10px 0;
        }

        .detail-card-top {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            padding: 30px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            display: none;
        }

        .detail-card-bottom {
            flex: 1;
            background-color: #1e1e24;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }

        .detail-tools {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 10px 0;
        }

        .detail-tool-btn {
            background: #27272e;
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-respond-main {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Estilos específicos para o Modal de Envio Anônimo Externo (quem acessa o link) */
        .send-modal {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .send-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .send-card {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 100%);
            border-radius: 25px;
            border: 2px solid #f3e8ff;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.15);
            gap: 20px;
        }

        .send-prompt-text {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #8a2be2;
            text-transform: lowercase;
            line-height: 1.2;
        }

        .send-textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e9d5ff;
            border-radius: 15px;
            padding: 12px;
            font-size: 16px;
            color: #4b0082;
            resize: none;
            outline: none;
            background-color: #f9f5ff;
        }

        .send-textarea:focus {
            border-color: #8a2be2;
        }

        .btn-send-anon {
            background: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 0.1s;
        }

        .btn-send-anon:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <button id="homeBtn" title="Ir para Home"><i class="fa-solid fa-house"></i></button>
        <span class="share-title">compartilhar</span>
        <button id="inboxBtn" title="Mensagens Recebidas"><i class="fa-solid fa-inbox"></i></button>
    </div>

    <!-- Card Preview (Stories style) -->
    <div class="card-preview">
        <div class="profile-container" id="profileContainer">
            <!-- Renderizado dinamicamente: ícone padrão se não logado ou foto se logado -->
            <div class="profile-placeholder" id="profilePlaceholder">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <div class="main-text" id="editableText" contenteditable="true" spellcheck="false">
            me mande<br>mensagens<br>anônimas!
        </div>

        <div class="card-actions-left">
            <button class="action-icon-btn" id="btnReset" title="Voltar para a mensagem padrão"><i class="fa-solid fa-rotate-left"></i></button>
        </div>

        <div class="card-actions">
            <button class="action-icon-btn" id="btnEdit"><i class="fa-solid fa-pen"></i></button>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <button class="btn-share-main" id="shareBtn">
            Compartilhe!
        </button>
    </div>

    <!-- Modal de Mensagens Recebidas -->
    <div class="messages-modal" id="messagesModal">
        <div class="modal-header">
            <span class="modal-title">Mensagens Recebidas</span>
            <button class="modal-close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-content" id="messagesListContainer">
            <!-- As mensagens direcionadas via link e válidas por 24h aparecerão aqui -->
        </div>
    </div>

    <!-- Sub-modal Detalhe Estilo NGL -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-top-bar" id="detailTopBar">
            <button class="detail-close-btn" id="closeDetailBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="detail-card" id="captureCard">
            <div class="detail-card-top">send me anonymous messages...</div>
            <div class="detail-card-bottom" id="detailMessageText">
                <!-- O conteúdo da mensagem selecionada será inserido aqui dinamicamente -->
            </div>
        </div>

        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; align-items: center;" id="detailFooterContainer">
            <div class="detail-tools" id="detailToolsContainer">
                <button class="detail-tool-btn" id="detailColorBtn"><i class="fa-solid fa-palette"></i></button>
                <button class="detail-tool-btn" id="detailCameraBtn" title="Alterar fundo por URL"><i class="fa-solid fa-camera"></i></button>
            </div>
            <button class="btn-respond-main" id="respondBtn">
                responder
            </button>
        </div>
    </div>

    <!-- Modal de Envio Anônimo para Visitantes (Bloqueado/Sem opção de fechar) -->
    <div class="send-modal" id="sendModal">
        <div style="font-size: 20px; font-weight: 700; color: #8a2be2;">enviar mensagem anônima</div>
        <div class="send-card">
            <div class="send-prompt-text" id="sendPromptText">me mande mensagens anônimas!</div>
            <textarea class="send-textarea" id="anonMessageInput" placeholder="Escreva sua mensagem anônima..."></textarea>
        </div>
        <button class="btn-send-anon" id="sendAnonBtn">Enviar!</button>
    </div>

    <script>
        // Conexão com a rede Nostr (Relays), validação estrita de mensagens direcionadas (#p) de até 24h e tratamento de login/ícone padrão
        const RELAYS = ['wss://relay.damus.io', 'wss://relay.nostr.band', 'wss://nos.lol'];
        let globalUserPubkey = null;
        
        async function connectNostrAndFetchProfile() {
            if (window.nostr && window.nostr.getPublicKey) {
                try {
                    globalUserPubkey = await window.nostr.getPublicKey();
                } catch (e) {
                    console.warn("Usuário negou acesso ao Nostr ou extensão indisponível:", e);
                }
            }

            RELAYS.forEach(url => {
                try {
                    const ws = new WebSocket(url);
                    ws.onopen = () => {
                        console.log(`Conectado ao Relay Nostr: ${url}`);
                        const subId = 'ngl-sub-' + Math.random().toString(36).substring(2, 9);
                        
                        if (globalUserPubkey) {
                            const oneDayAgo = Math.floor(Date.now() / 1000) - (24 * 60 * 60);
                            ws.send(JSON.stringify(["REQ", subId, { kinds: [1], '#p': [globalUserPubkey], since: oneDayAgo, limit: 50 }]));
                            ws.send(JSON.stringify(["REQ", subId + "-profile", { kinds: [0], authors: [globalUserPubkey], limit: 1 }]));
                        }
                    };
                    
                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data[0] === "EVENT") {
                                const ev = data[2];
                                if (ev) {
                                    if (ev.kind === 0 && ev.content) {
                                        try {
                                            const profileData = JSON.parse(ev.content);
                                            if (profileData.picture) {
                                                const profileContainer = document.getElementById('profileContainer');
                                                if (profileContainer) {
                                                    profileContainer.innerHTML = `<img src="${profileData.picture}" alt="Perfil" class="profile-pic" id="profileImg">`;
                                                }
                                            }
                                        } catch (err) {
                                            console.error("Erro ao analisar metadados do perfil Nostr", err);
                                        }
                                    }
                                    if (ev.kind === 1 && ev.content) {
                                        const now = Math.floor(Date.now() / 1000);
                                        const messageAge = now - ev.created_at;
                                        if (messageAge <= 86400) {
                                            addMessageToList(ev.content, new Date(ev.created_at * 1000).toLocaleTimeString());
                                        }
                                    }
                                }
                            }
                        } catch (e) {
                            console.error("Erro ao processar mensagem do Nostr", e);
                        }
                    };
                    ws.onerror = (err) => {
                        console.warn(`Erro no Relay ${url}:`, err);
                    };
                } catch (e) {
                    console.error(`Falha ao conectar no relay ${url}`, e);
                }
            });
        }

        function addMessageToList(text, timeStr) {
            const messagesListContainer = document.getElementById('messagesListContainer');
            const existingItems = messagesListContainer.querySelectorAll('.message-item');
            for (let item of existingItems) {
                if (item.getAttribute('data-msg') === text) return;
            }

            const newItem = document.createElement('div');
            newItem.className = 'message-item';
            newItem.setAttribute('data-msg', text);
            newItem.innerHTML = `
                <span class="message-text">${text}</span>
                <span class="message-time">${timeStr || 'Agora'}</span>
            `;
            messagesListContainer.prepend(newItem);
        }

        connectNostrAndFetchProfile();

        // Lógica de verificação de parâmetros na URL (Se acessado via link compartilhado)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPubkey = urlParams.get('u');
            const sharedText = urlParams.get('t');

            if (targetPubkey) {
                const sendModal = document.getElementById('sendModal');
                const sendPromptText = document.getElementById('sendPromptText');
                
                // Exibe a mensagem personalizada escolhida pelo usuário ou a padrão
                if (sharedText) {
                    sendPromptText.innerHTML = decodeURIComponent(sharedText).replace(/\n/g, '<br>');
                }

                sendModal.classList.add('active');

                // Lógica para envio da mensagem anônima via Nostr (Kind 1 direcionada ao pubkey)
                const sendAnonBtn = document.getElementById('sendAnonBtn');
                const anonMessageInput = document.getElementById('anonMessageInput');

                sendAnonBtn.addEventListener('click', async () => {
                    const messageContent = anonMessageInput.value.trim();
                    if (!messageContent) {
                        alert('Por favor, escreva uma mensagem antes de enviar.');
                        return;
                    }

                    // Monta o evento Nostr Kind 1 contendo a tag #p apontando para o dono do link
                    const event = {
                        kind: 1,
                        created_at: Math.floor(Date.now() / 1000),
                        tags: [["p", targetPubkey]],
                        content: messageContent,
                        pubkey: "" // Anônimo / Gerado dinamicamente se sem chave própria
                    };

                    let sentSuccessfully = false;

                    for (const url of RELAYS) {
                        try {
                            const ws = new WebSocket(url);
                            await new Promise((resolve, reject) => {
                                ws.onopen = () => {
                                    ws.send(JSON.stringify(["EVENT", event]));
                                    resolve();
                                };
                                ws.onerror = (err) => reject(err);
                                setTimeout(resolve, 2000);
                            });
                            ws.close();
                            sentSuccessfully = true;
                        } catch (err) {
                            console.warn(`Falha ao publicar no relay ${url}`, err);
                        }
                    }

                    alert('Mensagem anônima enviada com sucesso!');
                    anonMessageInput.value = '';
                });
            }
        });

        // Redirecionamento ao clicar no botão de Home
        const homeBtn = document.getElementById('homeBtn');
        homeBtn.addEventListener('click', () => {
            window.location.href = '../../Social.html';
        });

        // Funcionalidade do Modal de Mensagens Recebidas
        const inboxBtn = document.getElementById('inboxBtn');
        const messagesModal = document.getElementById('messagesModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        inboxBtn.addEventListener('click', () => {
            messagesModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            messagesModal.classList.remove('active');
        });

        // Funcionalidade do Sub-modal Detalhe e captura da mensagem clicada
        const detailModal = document.getElementById('detailModal');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const detailMessageText = document.getElementById('detailMessageText');
        const messagesListContainer = document.getElementById('messagesListContainer');

        messagesListContainer.addEventListener('click', (e) => {
            const item = e.target.closest('.message-item');
            if (item) {
                const messageContent = item.getAttribute('data-msg');
                detailMessageText.innerText = messageContent;
                messagesModal.classList.remove('active');
                detailModal.classList.add('active');
            }
        });

        closeDetailBtn.addEventListener('click', () => {
            detailModal.classList.remove('active');
        });

        // Funcionalidade do botão Câmera para alterar fundo por URL
        const detailCameraBtn = document.getElementById('detailCameraBtn');
        detailCameraBtn.addEventListener('click', () => {
            const imgUrl = prompt('Cole a URL da imagem para o fundo do modal:');
            if (imgUrl && imgUrl.trim() !== '') {
                detailModal.style.backgroundImage = `url('${imgUrl.trim()}')`;
            }
        });

        // Mudança simples de cor do card detalhado ao clicar no botão de paleta
        const detailColorBtn = document.getElementById('detailColorBtn');
        const detailCard = document.querySelector('.detail-card');
        const gradients = [
            'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #fbc531 0%, #e84118 100%)'
        ];
        let colorIndex = 0;

        detailColorBtn.addEventListener('click', () => {
            colorIndex = (colorIndex + 1) % gradients.length;
            detailCard.style.background = gradients[colorIndex];
        });

        // Funcionalidade do botão Responder para gerar imagem do card e acionar o Share API ou fallback de download com notificação
        const respondBtn = document.getElementById('respondBtn');
        const detailTopBar = document.getElementById('detailTopBar');
        const detailFooterContainer = document.getElementById('detailFooterContainer');

        respondBtn.addEventListener('click', async () => {
            detailTopBar.style.display = 'none';
            detailFooterContainer.style.display = 'none';
            const originalBg = detailModal.style.backgroundColor;
            detailModal.style.backgroundColor = 'transparent';

            try {
                const canvas = await html2canvas(detailModal, {
                    backgroundColor: null,
                    scale: 2,
                    useCORS: true
                });

                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const file = new File([blob], 'mensagem-ngl.png', { type: 'image/png' });
                        let shared = false;

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    title: 'Mensagem Anônima',
                                    text: 'Veja essa mensagem que recebi no NGL!',
                                    files: [file]
                                });
                                shared = true;
                            } catch (err) {
                                if (err.name === 'AbortError') {
                                    shared = true;
                                }
                            }
                        }

                        if (!shared) {
                            const link = document.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = 'mensagem-ngl.png';
                            link.click();
                            alert('Seu navegador não suporta o compartilhamento direto. A imagem foi baixada com sucesso!');
                        }
                    }
                }, 'image/png');
            } catch (error) {
                console.error('Erro ao gerar print da página:', error);
            } finally {
                detailTopBar.style.display = 'flex';
                detailFooterContainer.style.display = 'flex';
                detailModal.style.backgroundColor = originalBg;
            }
        });

        // Funcionalidade do botão Compartilhar principal: Copia o link simplificado com o identificador do usuário e a mensagem atual
        const shareBtn = document.getElementById('shareBtn');
        const editableText = document.getElementById('editableText');
        const btnEdit = document.getElementById('btnEdit');
        const btnReset = document.getElementById('btnReset');

        const defaultMessage = "me mande<br>mensagens<br>anônimas!";

        btnEdit.addEventListener('click', () => {
            editableText.focus();
        });

        btnReset.addEventListener('click', () => {
            editableText.innerHTML = defaultMessage;
        });

        shareBtn.addEventListener('click', async () => {
            const baseUrl = window.location.origin + window.location.pathname;
            const currentMessageText = editableText.innerHTML;
            // Gera o link simplificado contendo o identificador do usuário e o texto atual formatado
            const simplifiedLink = globalUserPubkey 
                ? `${baseUrl}?u=${globalUserPubkey}&t=${encodeURIComponent(currentMessageText)}` 
                : window.location.href;

            try {
                await navigator.clipboard.writeText(simplifiedLink);
                alert('Link simplificado copiado para a área de transferência!');
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = simplifiedLink;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Link simplificado copiado com sucesso!');
            }
        });
    </script>
</body>
</html>
