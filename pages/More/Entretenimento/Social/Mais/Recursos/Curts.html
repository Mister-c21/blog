<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curts Grid Feed - 12h</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFFFFF;         /* Cor Principal (Branco) */
            --secondary: #7C3AED;       /* Cor Secundária (Violeta) */
            --secondary-hover: #6D28D9; 
            --bg-color: #F8FAFC;        /* Fundo limpo e suave */
            --text-main: #1E293B;       
            --text-muted: #64748B;      
            --border-color: #E2E8F0;    
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container Principal do App */
        .app-wrapper {
            width: 100%;
            max-width: 480px; /* Padrão Mobile por padrão */
            background-color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.04);
        }

        /* Topo / Header */
        header {
            padding: 16px 20px;
            background: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        header h2 {
            font-size: 1.25rem;
            color: var(--secondary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .expiry-badge {
            font-size: 0.7rem;
            background: #EDE9FE;
            color: var(--secondary);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ==========================================
           GRID VERTICAL DE CURTS (MOBILE: 2 Colunas)
           ========================================== */
        .stories-container {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Colunas no Mobile */
            gap: 12px;
            padding-bottom: 40px; /* Removido o espaço grande do FAB, mantendo apenas respiro padrão */
        }

        /* Card Individual do Curt */
        .story-card {
            height: 220px; /* Altura ideal estilo curt vertical */
            border-radius: 16px;
            background-color: #E2E8F0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .story-card:active {
            transform: scale(0.97);
        }

        /* Card especial para criar curt */
        .story-card.create-story {
            background: var(--primary);
            border: 2px dashed var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .create-icon-wrapper {
            width: 48px;
            height: 48px;
            background: var(--secondary);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
        }

        .create-story span {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Imagem e Overlay do Curt */
        .story-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        }

        /* Elementos internos do card */
        .story-avatar {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--secondary);
            object-fit: cover;
        }

        .story-user-name {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            color: #FFFFFF;
            font-size: 0.85rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .story-time {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        /* Botão alternativo fixo no Header para desktop */
        .header-action-btn {
            background-color: var(--secondary);
            color: var(--primary);
            border: none;
            display: none; /* Oculto no mobile */
            align-items: center;
            justify-content: center;
            height: 36px;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .header-action-btn:hover {
            background-color: var(--secondary-hover);
        }

        /* ==========================================
           ADAPTAÇÃO UX PARA DESKTOP
           ========================================== */
        @media (min-width: 768px) {
            body {
                background-color: #EDE9FE; /* Fundo violeta bem suave para desktop */
                align-items: center;
                padding: 30px 0;
            }

            .app-wrapper {
                max-width: 700px; /* Largura expandida para melhor visualização em desktop */
                min-height: 85vh;
                border-radius: 20px;
                border: 1px solid var(--border-color);
                overflow: hidden;
            }

            /* No Desktop, a grade vertical ganha mais colunas (4 colunas) */
            .stories-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
                padding: 24px;
            }

            .story-card {
                height: 240px;
            }

            /* No Desktop, exibe o botão de ação no header substituindo o antigo comportamento */
            .header-action-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Topo -->
        <header>
            <h2><i class="fa-solid fa-circle-notch"></i> Curts 12h</h2>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="expiry-badge"><i class="fa-regular fa-clock"></i> Expiram em 12h</span>
                <!-- Botão adaptado para desktop no header -->
                <button class="header-action-btn" onclick="alert('Abrir criador de Curt!')" id="desktopActionBtn">
                    <i class="fa-solid fa-plus"></i> <span>Criar Curt</span>
                </button>
            </div>
        </header>

        <!-- Lista Vertical em Grade (Colunas) com rolagem natural de scroll para cima -->
        <main class="stories-container">
            
            <!-- Card de Criar Curt -->
            <div class="story-card create-story" onclick="alert('Abrir criador de Curt!')">
                <div class="create-icon-wrapper">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span>Novo Curt</span>
            </div>

            <!-- Curt 1 -->
            <div class="story-card" onclick="alert('Visualizar Curt de Ana')">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="story-bg" alt="Curt">
                <div class="story-overlay"></div>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="story-avatar" alt="Avatar">
                <span class="story-time">1h restantes</span>
                <span class="story-user-name">Ana Clara</span>
            </div>

            <!-- Curt 2 -->
            <div class="story-card" onclick="alert('Visualizar Curt de Lucas')">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80" class="story-bg" alt="Curt">
                <div class="story-overlay"></div>
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" class="story-avatar" alt="Avatar">
                <span class="story-time">3h restantes</span>
                <span class="story-user-name">Lucas Lima</span>
            </div>

            <!-- Curt 3 -->
            <div class="story-card" onclick="alert('Visualizar Curt de Beatriz')">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" class="story-bg" alt="Curt">
                <div class="story-overlay"></div>
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" class="story-avatar" alt="Avatar">
                <span class="story-time">6h restantes</span>
                <span class="story-user-name">Beatriz Souza</span>
            </div>

            <!-- Curt 4 -->
            <div class="story-card" onclick="alert('Visualizar Curt de Matheus')">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80" class="story-bg" alt="Curt">
                <div class="story-overlay"></div>
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80" class="story-avatar" alt="Avatar">
                <span class="story-time">9h restantes</span>
                <span class="story-user-name">Matheus Host</span>
            </div>

            <!-- Curt 5 -->
            <div class="story-card" onclick="alert('Visualizar Curt de Juliana')">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80" class="story-bg" alt="Curt">
                <div class="story-overlay"></div>
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" class="story-avatar" alt="Avatar">
                <span class="story-time">11h restantes</span>
                <span class="story-user-name">Juliana Paes</span>
            </div>

        </main>
    </div>
</body>
</html>
