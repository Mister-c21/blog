<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fics - LoreSpace</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#fff; color:#121212; font-family:'Nunito',sans-serif; padding-bottom:50px; }
        header { background:#f8f8f8; position:sticky; top:0; z-index:1000; border-bottom:1px solid #e0e0e0; }
        .navbar { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:15px 20px; }
        .logo { font-size:24px; font-weight:800; color:#8a2be2; text-decoration:none; }
        .nav-links { display:flex; gap:25px; list-style:none; }
        .nav-links a { color:#555; text-decoration:none; font-weight:600; font-size:15px; cursor:pointer; }
        .nav-links a:hover, .nav-links a.active { color:#121212; }
        .user-actions { display:flex; gap:15px; align-items:center; }
        .btn-post { background:#8a2be2; color:#fff; border:none; padding:6px 14px; border-radius:20px; font-weight:700; font-size:13px; text-transform:uppercase; text-decoration:none; display:flex; align-items:center; gap:6px; }
        .profile-container { width:38px; height:38px; border-radius:50%; overflow:hidden; border:2px solid #e0e0e0; cursor:pointer; }
        .profile-img { width:100%; height:100%; background-size:cover; background-position:center; }
        .days-nav { background:#f2f2f2; border-bottom:1px solid #e0e0e0; display:flex; overflow-x:auto; white-space:nowrap; }
        .day-tab { padding:15px 28px; color:#666; font-weight:600; font-size:14px; cursor:pointer; text-transform:uppercase; text-decoration:none; display:inline-block; flex-shrink:0; }
        .day-tab.active { color:#8a2be2; font-weight:800; font-size:16px; }
        .main-container { max-width:1200px; margin:0 auto; padding:20px; }
        .search-bar-wrapper { display:flex; align-items:center; background:#f2f2f2; border:1px solid #e0e0e0; border-radius:25px; padding:10px 20px; gap:12px; margin-bottom:25px; position:relative; }
        .search-input { border:none; background:transparent; outline:none; font-size:15px; width:100%; font-family:'Nunito',sans-serif; }
        .search-clear-btn {
            display: none;
            border: none;
            background: #ddd;
            color: #555;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            padding: 0;
            transition: background 0.15s, color 0.15s;
        }
        .search-clear-btn:hover { background: #ccc; color: #222; }
        .search-clear-btn.visible { display: flex; }
        .wattpad-feed { display:flex; flex-direction:column; gap:35px; }
        .feed-row { display:flex; flex-direction:column; gap:15px; }
        .row-header { display:flex; justify-content:space-between; align-items:center; }
        .row-title { font-size:20px; font-weight:800; }
        .see-more { font-size:14px; font-weight:700; color:#8a2be2; cursor:pointer; }
        .books-horizontal-scroll { display:flex; gap:20px; overflow-x:auto; padding-bottom:10px; }
        .wattpad-card { min-width:150px; max-width:150px; cursor:pointer; display:flex; flex-direction:column; gap:8px; flex-shrink:0; text-decoration:none; color:inherit; transition:transform .2s; }
        .wattpad-card:hover { transform:translateY(-4px); }
        .wattpad-cover { width:150px; height:225px; border-radius:4px; background-size:cover; background-position:center; background-color:#e0e0e0; box-shadow:0 4px 10px rgba(0,0,0,.1); }
        .wattpad-book-title { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000; justify-content:center; align-items:center; padding:20px; }
        .modal-overlay.active { display:flex; }
        .modal-content { background:#fff; width:100%; max-width:900px; max-height:85vh; border-radius:8px; display:flex; flex-direction:column; overflow:hidden; }
        .modal-header { padding:20px 25px; border-bottom:1px solid #e0e0e0; display:flex; justify-content:space-between; align-items:center; }
        .modal-title { font-size:20px; font-weight:800; }
        .modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:#666; }
        .modal-body { padding:25px; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:25px; }
        @media (max-width:768px) { .nav-links { display:none; } .modal-overlay { align-items:flex-end; padding:0; } .modal-content { max-height:80vh; border-radius:16px 16px 0 0; } }

        /* Skeleton loading */
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e4e4e4 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
            border-radius: 4px;
        }
        .skeleton-row-title {
            width: 140px;
            height: 22px;
            border-radius: 6px;
        }
        .skeleton-see-more {
            width: 60px;
            height: 14px;
            border-radius: 4px;
        }
        .skeleton-cover {
            width: 150px;
            height: 225px;
            border-radius: 4px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,.06);
        }
        .skeleton-book-title {
            width: 120px;
            height: 14px;
            border-radius: 4px;
            margin-top: 2px;
        }
        .skeleton-book-title.short { width: 90px; }
        .skeleton-card {
            min-width: 150px;
            max-width: 150px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div style="display:flex;align-items:center;gap:15px;">
                <a href="#" class="logo">Fics</a>
                <ul class="nav-links">
                    <li><a href="#" class="active">all</a></li>
                    <li><a onclick="openModal('Minhas Fics')">Minhas Fics</a></li>
                    <li><a onclick="openModal('Adicionadas recentemente')">Adicionadas recentemente</a></li>
                </ul>
            </div>
            <div class="user-actions">
                <a href="./Fics/Pages/N/Maker.html" class="btn-post">+ Criar</a>
                <div class="profile-container" id="profileContainer">
                    <div class="profile-img" id="profileImg" style="background-image:url('https://api.dicebear.com/7.x/bottts/svg?seed=Fics')"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="days-nav">
        <a href="../Index.html" class="day-tab">Home</a>
        <div class="day-tab active">all</div>
        <a onclick="openModal('Minhas Fics')" class="day-tab">Minhas Fics</a>
        <a onclick="openModal('Adicionadas recentemente')" class="day-tab">Adicionadas recentemente</a>
    </div>
    <div class="main-container">
        <div class="search-bar-wrapper">
            <i class="fa-solid fa-magnifying-glass" style="color:#888;flex-shrink:0;"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar histórias..." autocomplete="off">
            <button type="button" id="searchClearBtn" class="search-clear-btn" title="Limpar busca" aria-label="Limpar busca">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="wattpad-feed" id="wattpadFeed">
            <div class="feed-row">
                <div class="row-header">
                    <div class="skeleton skeleton-row-title"></div>
                    <div class="skeleton skeleton-see-more"></div>
                </div>
                <div class="books-horizontal-scroll">
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                </div>
            </div>
            <div class="feed-row">
                <div class="row-header">
                    <div class="skeleton skeleton-row-title" style="width:200px;"></div>
                    <div class="skeleton skeleton-see-more"></div>
                </div>
                <div class="books-horizontal-scroll">
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title short"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="seeMoreModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Título</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

        const LS_SALT = 'LS-369-7423-v1';
        const LS_MARKER = 'ls369';
        const LS_TAG_VALUE = 'x7k4m3';

        async function deriveLsKey() {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(LS_SALT), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('369'), iterations: 84000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }
        async function decryptFanfic(b64) {
            try {
                const key = await deriveLsKey();
                const binary = atob(b64);
                const packed = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) packed[i] = binary.charCodeAt(i);
                if (packed.length < 13) return null;
                const iv = packed.slice(0, 12);
                const data = packed.slice(12);
                const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                const obj = JSON.parse(new TextDecoder().decode(plain));
                if (obj.m !== LS_MARKER) return null;
                delete obj.m;
                return obj;
            } catch { return null; }
        }

        const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();

        let currentUserData = { pubkey: '', privateKey: null, nickname: '', avatarUrl: '' };
        let allFics = [], minhasFics = [], recentesFics = [];
        let currentSearchQuery = '';

        function getFicsSkeletonHtml(rows = 2, cardsPerRow = 6) {
            let html = '';
            for (let r = 0; r < rows; r++) {
                const titleW = r === 0 ? '140px' : '200px';
                let cards = '';
                for (let c = 0; c < cardsPerRow; c++) {
                    const short = c % 2 === 1 ? ' short' : '';
                    cards += `<div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-book-title${short}"></div></div>`;
                }
                html += `
                <div class="feed-row">
                    <div class="row-header">
                        <div class="skeleton skeleton-row-title" style="width:${titleW};"></div>
                        <div class="skeleton skeleton-see-more"></div>
                    </div>
                    <div class="books-horizontal-scroll">${cards}</div>
                </div>`;
            }
            return html;
        }

        function loadSessionFromNostr() {
            try {
                const s = JSON.parse(localStorage.getItem('nostr_session') || '{}');
                if (!s.privateKeyHex || !s.pubkey) return;
                currentUserData.privateKey = hexToBytes(s.privateKeyHex);
                currentUserData.pubkey = s.pubkey;
                currentUserData.nickname = (s.nickname || '').replace(/^@/, '');
                currentUserData.avatarUrl = s.avatarUrl || '';
            } catch (_) {}
        }
        function isUserLoggedIn() { return !!(currentUserData.privateKey && currentUserData.pubkey); }
        function updateProfileUI() {
            const img = document.getElementById('profileImg');
            if (!img) return;
            img.style.backgroundImage = `url('${currentUserData.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=Fics'}')`;
        }

        async function fetchLoreSpaceFics() {
            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [1],
                    '#t': [LS_TAG_VALUE],
                    limit: 200
                });
                if (!events?.length) return [];
                events.sort((a, b) => b.created_at - a.created_at);
                const fics = [];
                const seen = new Set();
                for (const ev of events) {
                    if (seen.has(ev.id)) continue;
                    const data = await decryptFanfic(ev.content);
                    if (!data) continue;
                    seen.add(ev.id);
                    fics.push({
                        id: ev.id,
                        titulo: data.titulo || 'Sem título',
                        autor: data.autor || 'Anônimo',
                        capa: data.capa || '',
                        capitulos: data.capitulos || [],
                        data: data.data || '',
                        pubkey: ev.pubkey,
                        created_at: ev.created_at
                    });
                }
                return fics;
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        function createCardHTML(fic) {
            const img = fic.capa || 'https://picsum.photos/300/450?random=999';
            const link = `./Fics/Pages/N/Read.html?id=${encodeURIComponent(fic.id)}`;
            return `<a href="${link}" class="wattpad-card">
                <div class="wattpad-cover" style="background-image:url('${img}')"></div>
                <span class="wattpad-book-title">${fic.titulo}</span>
            </a>`;
        }

        function filterFics(list, query) {
            if (!query) return list;
            const q = query.toLowerCase().trim();
            return list.filter(f =>
                (f.titulo || '').toLowerCase().includes(q) ||
                (f.autor || '').toLowerCase().includes(q)
            );
        }

        function updateClearButton() {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchClearBtn');
            if (!input || !btn) return;
            if (input.value.trim()) btn.classList.add('visible');
            else btn.classList.remove('visible');
        }

        function renderFeed() {
            const feed = document.getElementById('wattpadFeed');
            feed.innerHTML = '';

            const q = currentSearchQuery;

            if (q) {
                const results = filterFics(allFics, q);
                if (!results.length) {
                    feed.innerHTML = `<p style="color:#888;text-align:center;padding:40px 0;">Nenhum resultado para "<strong>${q.replace(/</g,'&lt;')}</strong>".</p>`;
                    return;
                }
                const row = document.createElement('div');
                row.className = 'feed-row';
                row.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">Resultados (${results.length})</h2>
                    </div>
                    <div class="books-horizontal-scroll">${results.map(createCardHTML).join('')}</div>`;
                feed.appendChild(row);
                return;
            }

            const addRow = (title, list) => {
                if (!list.length) return;
                const row = document.createElement('div');
                row.className = 'feed-row';
                row.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">${title}</h2>
                        <a class="see-more" onclick="openModal('${title}')">Ver tudo</a>
                    </div>
                    <div class="books-horizontal-scroll">${list.slice(0,12).map(createCardHTML).join('')}</div>`;
                feed.appendChild(row);
            };
            addRow('Em Alta', allFics);
            addRow('Adicionadas recentemente', recentesFics);
            if (isUserLoggedIn()) addRow('Minhas Fics', minhasFics);
            if (!feed.children.length) {
                feed.innerHTML = '<p style="color:#888;text-align:center;padding:40px 0;">Nenhuma fanfic encontrada.</p>';
            }
        }

        window.openModal = function(name) {
            const modal = document.getElementById('seeMoreModal');
            document.getElementById('modalTitle').textContent = name;
            const body = document.getElementById('modalBody');
            let list = allFics;
            if (name === 'Minhas Fics') list = minhasFics;
            else if (name === 'Adicionadas recentemente') list = recentesFics;
            body.innerHTML = list.length ? list.map(createCardHTML).join('') : '<p style="color:#888;grid-column:1/-1;text-align:center;">Nenhuma fic.</p>';
            modal.classList.add('active');
        };
        window.closeModal = () => document.getElementById('seeMoreModal').classList.remove('active');
        window.addEventListener('click', e => { if (e.target.id === 'seeMoreModal') closeModal(); });

        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');

        if (searchInput) {
            searchInput.addEventListener('input', () => {
                currentSearchQuery = searchInput.value.trim();
                updateClearButton();
                renderFeed();
            });
        }
        if (searchClearBtn) {
            searchClearBtn.addEventListener('click', () => {
                if (searchInput) searchInput.value = '';
                currentSearchQuery = '';
                updateClearButton();
                renderFeed();
                searchInput?.focus();
            });
        }

        loadSessionFromNostr();
        updateProfileUI();
        (async () => {
            const feed = document.getElementById('wattpadFeed');
            if (feed) feed.innerHTML = getFicsSkeletonHtml(2, 6);
            allFics = await fetchLoreSpaceFics();
            recentesFics = allFics.slice(0, 30);
            if (isUserLoggedIn()) minhasFics = allFics.filter(f => f.pubkey === currentUserData.pubkey);
            renderFeed();
        })();
    </script>
</body>
</html>
