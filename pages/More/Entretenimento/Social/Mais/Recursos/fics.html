<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fics - Leia Histórias em Quadrinhos Gratuitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #ffffff; color: #121212; font-family: 'Nunito', sans-serif; padding-bottom: 50px; }
        header { background-color: #f8f8f8; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e0e0e0; }
        .navbar { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 24px; font-weight: 800; color: #8a2be2; text-decoration: none; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: #555; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #121212; }
        .user-actions { display: flex; gap: 15px; align-items: center; }
        .btn-post { background-color: #8a2be2; color: #ffffff; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 13px; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .btn-post:hover { opacity: 0.9; }
        .profile-container { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 2px solid #e0e0e0; }
        .profile-container:hover { border-color: #8a2be2; }
        .profile-img { width: 100%; height: 100%; background-size: cover; background-position: center; }
        .days-nav { background-color: #f2f2f2; border-bottom: 1px solid #e0e0e0; display: flex; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; scrollbar-color: #8a2be2 #f2f2f2; }
        .days-nav::-webkit-scrollbar { height: 4px; }
        .day-tab { padding: 15px 28px; color: #666; font-weight: 600; font-size: 14px; cursor: pointer; text-transform: uppercase; text-decoration: none; border-bottom: 3px solid transparent; display: inline-block; flex-shrink: 0; }
        .day-tab:hover { color: #121212; }
        .day-tab.active { color: #8a2be2; font-weight: 800; font-size: 16px; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-bar-container { margin-bottom: 25px; margin-top: 10px; }
        .search-bar-wrapper { display: flex; align-items: center; background-color: #f2f2f2; border: 1px solid #e0e0e0; border-radius: 25px; padding: 10px 20px; gap: 12px; }
        .search-bar-wrapper:focus-within { border-color: #8a2be2; background-color: #ffffff; }
        .search-input { border: none; background: transparent; outline: none; font-size: 15px; width: 100%; font-family: 'Nunito', sans-serif; color: #121212; }
        .clear-search-btn { background: transparent; border: none; color: #666; font-size: 16px; cursor: pointer; display: none; }
        .wattpad-feed { display: flex; flex-direction: column; gap: 35px; margin-top: 20px; }
        .feed-row { display: flex; flex-direction: column; gap: 15px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; }
        .row-title { font-size: 20px; font-weight: 800; color: #121212; }
        .see-more { font-size: 14px; font-weight: 700; color: #8a2be2; text-decoration: none; cursor: pointer; }
        .see-more:hover { text-decoration: underline; }
        .books-horizontal-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: #8a2be2 #f2f2f2; }
        .books-horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .wattpad-card { min-width: 150px; max-width: 150px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; transition: transform 0.2s; text-decoration: none; color: inherit; }
        .wattpad-card:hover { transform: translateY(-4px); }
        .wattpad-cover { width: 150px; height: 225px; border-radius: 4px; background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-color: #e0e0e0; }
        .wattpad-book-title { font-size: 14px; font-weight: 700; color: #121212; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: #ffffff; width: 100%; max-width: 900px; max-height: 85vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 20px; font-weight: 800; }
        .modal-close { background: transparent; border: none; font-size: 20px; color: #666; cursor: pointer; }
        .modal-body { padding: 25px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 25px; }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .modal-overlay { align-items: flex-end; padding: 0; }
            .modal-content { max-height: 80vh; border-radius: 16px 16px 0 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo-area">
                <a href="#" class="logo">Fics</a>
                <ul class="nav-links">
                    <li><a href="#" class="active">all</a></li>
                    <li><a onclick="openModal('Minhas Fics')">Minhas Fics</a></li>
                    <li><a onclick="openModal('Adicionadas recentemente')">Adicionadas recentemente</a></li>
                </ul>
            </div>
            <div class="user-actions">
                <a href="./Fics/Pages/N/Maker.html" class="btn-post">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Criar
                </a>
                <div class="profile-container" id="profileContainer">
                    <div class="profile-img" id="profileImg" style="background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=Fics');"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="days-nav">
        <a href="../Index.html" class="day-tab">Home</a>
        <div class="day-tab active">all</div>
        <a onclick="openModal('Minhas Fics')" class="day-tab">Minhas Fics</a>
        <a onclick="openModal('Adicionadas recentemente')" class="day-tab">Adicionadas recentemente</a>
    </div>

    <div class="main-container">
        <div class="search-bar-container">
            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar histórias, autores...">
                <button id="clearSearchBtn" class="clear-search-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="wattpad-feed" id="wattpadFeed">
            <p style="color:#888; text-align:center; padding:40px 0;">Carregando fanfics da rede...</p>
        </div>
    </div>

    <div class="modal-overlay" id="seeMoreModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Título</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

        const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();

        let currentUserData = { pubkey: '', privateKey: null, nickname: '', avatarUrl: '' };
        let allFics = [];
        let minhasFics = [];
        let recentesFics = [];

        function loadSessionFromNostr() {
            try {
                const session = localStorage.getItem('nostr_session');
                if (!session) return;
                const parsed = JSON.parse(session);
                if (!parsed.privateKeyHex || !parsed.pubkey) return;
                currentUserData.privateKey = hexToBytes(parsed.privateKeyHex);
                currentUserData.pubkey = parsed.pubkey;
                currentUserData.nickname = (parsed.nickname || '').replace(/^@/, '');
                currentUserData.avatarUrl = parsed.avatarUrl || '';
            } catch(e){}
        }
        function isUserLoggedIn() { return !!(currentUserData.privateKey && currentUserData.pubkey); }

        function updateProfileUI() {
            const img = document.getElementById('profileImg');
            const container = document.getElementById('profileContainer');
            if (!img || !container) return;
            img.style.backgroundImage = `url('${currentUserData.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=Fics'}')`;
            container.title = currentUserData.nickname ? '@' + currentUserData.nickname : 'Perfil';
        }

        async function fetchLoreSpaceFics() {
            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [1],
                    '#t': ['LoreSpaceFics'],
                    limit: 200
                });
                if (!events?.length) return [];
                events.sort((a, b) => b.created_at - a.created_at);

                const fics = [];
                const seen = new Set();
                for (const ev of events) {
                    try {
                        const data = JSON.parse(ev.content || '{}');
                        if (data.type !== 'LoreSpaceFics') continue;
                        if (seen.has(ev.id)) continue;
                        seen.add(ev.id);

                        fics.push({
                            id: ev.id,                    // ID nativo do evento Nostr
                            titulo: data.titulo || 'Sem título',
                            autor: data.autor || 'Anônimo',
                            capa: data.capa || '',
                            capitulos: data.capitulos || [],
                            data: data.data || '',
                            pubkey: ev.pubkey,
                            created_at: ev.created_at
                        });
                    } catch(_){}
                }
                return fics;
            } catch(e) {
                console.error(e);
                return [];
            }
        }

        function createCardHTML(fic) {
            const imagem = fic.capa || 'https://picsum.photos/300/450?random=999';
            const link = `./Fics/Pages/N/Read.html?id=${encodeURIComponent(fic.id)}`;
            return `
                <a href="${link}" class="wattpad-card">
                    <div class="wattpad-cover" style="background-image: url('${imagem}');"></div>
                    <div class="wattpad-info">
                        <span class="wattpad-book-title">${fic.titulo}</span>
                    </div>
                </a>
            `;
        }

        function renderFeed() {
            const feed = document.getElementById('wattpadFeed');
            feed.innerHTML = '';

            if (allFics.length > 0) {
                const row = document.createElement('div');
                row.className = 'feed-row';
                row.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">Em Alta</h2>
                        <a class="see-more" onclick="openModal('Em Alta')">Ver tudo</a>
                    </div>
                    <div class="books-horizontal-scroll">
                        ${allFics.slice(0,12).map(createCardHTML).join('')}
                    </div>
                `;
                feed.appendChild(row);
            }

            if (recentesFics.length > 0) {
                const row = document.createElement('div');
                row.className = 'feed-row';
                row.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">Adicionadas recentemente</h2>
                        <a class="see-more" onclick="openModal('Adicionadas recentemente')">Ver tudo</a>
                    </div>
                    <div class="books-horizontal-scroll">
                        ${recentesFics.slice(0,12).map(createCardHTML).join('')}
                    </div>
                `;
                feed.appendChild(row);
            }

            if (isUserLoggedIn() && minhasFics.length > 0) {
                const row = document.createElement('div');
                row.className = 'feed-row';
                row.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">Minhas Fics</h2>
                        <a class="see-more" onclick="openModal('Minhas Fics')">Ver tudo</a>
                    </div>
                    <div class="books-horizontal-scroll">
                        ${minhasFics.slice(0,12).map(createCardHTML).join('')}
                    </div>
                `;
                feed.appendChild(row);
            }

            if (feed.children.length === 0) {
                feed.innerHTML = `<p style="color:#888;text-align:center;padding:40px 0;">Nenhuma fanfic encontrada ainda.</p>`;
            }
        }

        window.openModal = function(categoryName) {
            const modal = document.getElementById('seeMoreModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            title.textContent = categoryName;
            body.innerHTML = '';

            let lista = [];
            if (categoryName === 'Minhas Fics') lista = minhasFics;
            else if (categoryName === 'Adicionadas recentemente') lista = recentesFics;
            else lista = allFics;

            if (lista.length === 0) {
                body.innerHTML = '<p style="color:#888;grid-column:1/-1;text-align:center;">Nenhuma fic nesta categoria.</p>';
            } else {
                body.innerHTML = lista.map(createCardHTML).join('');
            }
            modal.classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('seeMoreModal').classList.remove('active');
        };

        window.addEventListener('click', e => {
            if (e.target.id === 'seeMoreModal') closeModal();
        });

        // Inicialização
        loadSessionFromNostr();
        updateProfileUI();

        (async () => {
            allFics = await fetchLoreSpaceFics();
            recentesFics = allFics.slice(0, 30);
            if (isUserLoggedIn()) {
                minhasFics = allFics.filter(f => f.pubkey === currentUserData.pubkey);
            }
            renderFeed();
        })();
    </script>
</body>
</html>
