<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fics - Leia Histórias em Quadrinhos Gratuitas</title>
    <!-- Fonte Nunito (padrão em plataformas modernas) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #121212;
            font-family: 'Nunito', sans-serif;
            padding-bottom: 50px;
        }

        /* --- HEADER / NAVEGAÇÃO --- */
        header {
            background-color: #f8f8f8;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #e0e0e0;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background-color: transparent;
            color: #8a2be2;
            padding: 0;
            border-radius: 0;
            letter-spacing: -1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #121212;
        }

        .user-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-post {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn-post:hover {
            opacity: 0.9;
        }

        .profile-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            transition: border-color 0.2s;
        }

        .profile-container:hover {
            border-color: #8a2be2;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* --- ABAS DE DIAS DA SEMANA --- */
        .days-nav {
            background-color: #f2f2f2;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            white-space: nowrap;
            max-width: 100%;
            scrollbar-width: thin;
            scrollbar-color: #8a2be2 #f2f2f2;
        }

        .days-nav::-webkit-scrollbar {
            height: 4px;
        }
        .days-nav::-webkit-scrollbar-track {
            background: #f2f2f2;
        }
        .days-nav::-webkit-scrollbar-thumb {
            background: #8a2be2;
            border-radius: 4px;
        }

        .day-tab {
            padding: 15px 28px;
            color: #666;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            display: inline-block;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .day-tab:hover {
            color: #121212;
        }

        .day-tab.active {
            color: #8a2be2;
            font-weight: 800;
            font-size: 16px;
            border-bottom-color: transparent;
            background-color: transparent;
        }

        /* --- CONTAINER PRINCIPAL --- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- BARRA DE BUSCA ANTES DO FEED --- */
        .search-bar-container {
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .search-bar-wrapper {
            display: flex;
            align-items: center;
            background-color: #f2f2f2;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            padding: 10px 20px;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .search-bar-wrapper:focus-within {
            border-color: #8a2be2;
            background-color: #ffffff;
        }

        .search-bar-wrapper i {
            color: #666;
            font-size: 16px;
        }

        .search-input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            width: 100%;
            font-family: 'Nunito', sans-serif;
            color: #121212;
        }

        .search-input::placeholder {
            color: #888;
        }

        /* Botão de limpar busca */
        .clear-search-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .clear-search-btn:hover {
            color: #121212;
        }

        /* --- ESTILO FEED ESTILO WATTPAD --- */
        .wattpad-feed {
            display: flex;
            flex-direction: column;
            gap: 35px;
            margin-top: 20px;
        }

        .feed-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .row-title {
            font-size: 20px;
            font-weight: 800;
            color: #121212;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-18 {
            background-color: #e50914;
            color: #ffffff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .see-more {
            font-size: 14px;
            font-weight: 700;
            color: #8a2be2;
            text-decoration: none;
            cursor: pointer;
        }

        .see-more:hover {
            text-decoration: underline;
        }

        .books-horizontal-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: #8a2be2 #f2f2f2;
        }

        .books-horizontal-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .books-horizontal-scroll::-webkit-scrollbar-track {
            background: #f2f2f2;
            border-radius: 4px;
        }
        .books-horizontal-scroll::-webkit-scrollbar-thumb {
            background: #8a2be2;
            border-radius: 4px;
        }

        .wattpad-card {
            min-width: 150px;
            max-width: 150px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .wattpad-card:hover {
            transform: translateY(-4px);
        }

        .wattpad-cover {
            width: 150px;
            height: 225px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .wattpad-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .wattpad-book-title {
            font-size: 14px;
            font-weight: 700;
            color: #121212;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- MENU FLUTUANTE / MODAL "VER TUDO" --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #121212;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #121212;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 25px;
            scrollbar-width: thin;
            scrollbar-color: #8a2be2 #f2f2f2;
        }

        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #f2f2f2;
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #8a2be2;
            border-radius: 4px;
        }

        /* --- RESPONSIVIDADE & MODAL "VER TUDO" NO MOBILE --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none; 
            }

            .modal-overlay {
                align-items: flex-end;
                padding: 0;
            }

            .modal-content {
                width: 100%;
                max-width: 100%;
                max-height: 80vh;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
                animation: slideUpMobile 0.25s ease-out;
            }

            @keyframes slideUpMobile {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }
        }
    </style>
</head>

    <!-- Menu Flutuante (Modal "Ver tudo") -->
    <div class="modal-overlay" id="seeMoreModal">
        <div class="modal-content">

                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo injetado via JavaScript -->
            </div>
        </div>
    </div>

    <script>

                    { id: "revolta-das-maquinas", titulo: "Revolta das Máquinas", imagem: "https://picsum.photos/300/450?random=82" },
                    { id: "dimensao-x", titulo: "Dimensão X", imagem: "https://picsum.photos/300/450?random=83" },
                    { id: "alem-da-terra", titulo: "Além da Terra", imagem: "https://picsum.photos/300/450?random=84" }
                ]
            },
            {
                categoria: "Fantasia",
                fics: [
                    { id: "reinos-de-cristal", titulo: "Reinos de Cristal", imagem: "https://picsum.photos/300/450?random=90" },
                    { id: "lenda-do-dragao", titulo: "A Lenda do Dragão", imagem: "https://picsum.photos/300/450?random=91" },

                    { id: "guardioes-da-floresta", titulo: "Guardiões da Floresta", imagem: "https://picsum.photos/300/450?random=93" },
                    { id: "trono-de-cinzas", titulo: "O Trono de Cinzas", imagem: "https://picsum.photos/300/450?random=94" }
                ]
            }
        ];

        // Função para renderizar o feed de forma dinâmica com URLs baseadas no ID
        function renderFeed() {
            const feedContainer = document.getElementById('wattpadFeed');
            feedContainer.innerHTML = '';

            categoriasData.forEach(item => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'feed-row';
                rowDiv.setAttribute('data-category', item.categoria);

                let cardsHtml = '';
                item.fics.forEach(fic => {
                    // Link gerado dinamicamente enviando o ID via parâmetro URL
                    const linkDinamico = `./Pages/N/Read.html?id=${fic.id}`;
                    
                    cardsHtml += `
                        <a href="${linkDinamico}" class="wattpad-card">
                            <div class="wattpad-cover" style="background-image: url('${fic.imagem}');"></div>
                            <div class="wattpad-info">
                                <span class="wattpad-book-title">${fic.titulo}</span>
                            </div>
                        </a>
                    `;
                });

                rowDiv.innerHTML = `
                    <div class="row-header">
                        <h2 class="row-title">${item.categoria}</h2>
                        <a class="see-more" onclick="openModal('${item.categoria}')">Ver tudo</a>
                    </div>
                    <div class="books-horizontal-scroll">
                        ${cardsHtml}
                    </div>
                `;

                feedContainer.appendChild(rowDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', renderFeed);

        const tabs = document.querySelectorAll('.day-tab:not(a)');
        const navLinksList = document.querySelectorAll('.nav-links a');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                navLinksList.forEach(l => l.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        navLinksList.forEach(link => {
            link.addEventListener('click', () => {
                navLinksList.forEach(l => l.classList.remove('active'));
                tabs.forEach(t => t.classList.remove('active'));
                link.classList.add('active');
            });
        });

        if (searchInput && clearSearchBtn) {
            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim().length > 0) {
                    clearSearchBtn.style.display = 'flex';
                } else {
                    clearSearchBtn.style.display = 'none';
                }
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.style.display = 'none';
                searchInput.focus();
            });
        }

        function openModal(categoryName) {
            const modal = document.getElementById('seeMoreModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            modalTitle.textContent = categoryName;
            modalBody.innerHTML = '';

            const row = document.querySelector(`.feed-row[data-category="${categoryName}"]`);
            if (row) {
                const cards = row.querySelectorAll('.wattpad-card');
                cards.forEach(card => {
                    const clonedCard = card.cloneNode(true);
                    modalBody.appendChild(clonedCard);
                });
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('seeMoreModal');
            modal.classList.remove('active');
        }

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('seeMoreModal');
            if (e.target === modal) {
                closeModal();
            }
        });
