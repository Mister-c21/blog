<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura | LoreSpace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary-violet:#8A2BE2; --primary-violet-hover:#7B1FA2; --light-violet:#F3E8FF;
            --bg-color:#FAFAFA; --text-color:#333; --text-muted:#717171; --card-bg:#fff; --border-color:#E0E0E0;
            --body-font:'Merriweather',serif; --font-size:1.125rem;
            --skeleton-bg:#E0E0E0; --skeleton-highlight:#F5F5F5;
        }
        [data-theme="dark"] {
            --bg-color:#121212; --text-color:#E0E0E0; --text-muted:#A0A0A0; --card-bg:#1E1E1E; --border-color:#2D2D2D;
            --light-violet:#2D1B4E; --skeleton-bg:#2A2A2A; --skeleton-highlight:#3A3A3A;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-color); color:var(--text-color); line-height:1.6; }
        @keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
        .skeleton { background:var(--skeleton-bg); background-image:linear-gradient(90deg,var(--skeleton-bg) 0,var(--skeleton-highlight) 40px,var(--skeleton-bg) 80px); background-size:600px 100%; animation:shimmer 1.6s infinite linear; border-radius:4px; }
        .skeleton-title { height:2.2rem; width:70%; margin:0 auto; }
        .skeleton-text { height:1.1rem; margin-bottom:18px; width:100%; }
        .reader-container { max-width:760px; margin:40px auto; padding:0 20px; }
        .chapter-header { margin-bottom:30px; text-align:center; border-bottom:1px solid var(--border-color); padding-bottom:20px; }
        .fic-title-small { font-size:.9rem; color:var(--primary-violet); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .chapter-title { font-size:2rem; font-weight:700; }
        .chapter-body { font-family:var(--body-font); font-size:var(--font-size); line-height:1.8; }
        .chapter-body p { margin-bottom:24px; text-align:justify; }
        .chapter-footer { margin-top:60px; border-top:1px solid var(--border-color); padding-top:30px; }
        .navigation-buttons { display:flex; justify-content:space-between; }
        .nav-page-btn { padding:10px 20px; border:1px solid var(--primary-violet); background:transparent; color:var(--primary-violet); border-radius:20px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; }
        .nav-page-btn:hover:not(:disabled) { background:var(--primary-violet); color:#fff; }
        .nav-page-btn:disabled { opacity:.5; cursor:not-allowed; }
        .fab-container { position:fixed; bottom:30px; right:30px; z-index:1000; }
        .fab-main-btn { width:56px; height:56px; background:var(--primary-violet); color:#fff; border:none; border-radius:50%; cursor:pointer; box-shadow:0 4px 12px rgba(138,43,226,.4); display:flex; align-items:center; justify-content:center; font-size:1.25rem; }
        .fab-tabbar { position:absolute; bottom:70px; right:0; background:var(--card-bg); border:1px solid var(--border-color); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.12); display:flex; flex-direction:column; gap:8px; padding:10px; opacity:0; visibility:hidden; transform:translateY(10px) scale(.95); transition:all .25s; min-width:180px; }
        .fab-container.active .fab-tabbar { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
        .fab-container.active .fab-main-btn { transform:rotate(90deg); }
        .tabbar-item { display:flex; align-items:center; gap:12px; padding:10px 14px; color:var(--text-color); text-decoration:none; font-size:.95rem; font-weight:500; border-radius:8px; background:none; border:none; width:100%; text-align:left; cursor:pointer; }
        .tabbar-item:hover { background:var(--light-violet); color:var(--primary-violet); }
        .tabbar-item i { color:var(--primary-violet); width:20px; text-align:center; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:2000; opacity:0; visibility:hidden; transition:all .3s; }
        .modal-overlay.active { opacity:1; visibility:visible; }
        .modal-card { background:var(--card-bg); border:1px solid var(--border-color); width:90%; max-width:480px; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.2); transform:translateY(20px); transition:transform .3s; }
        .modal-overlay.active .modal-card { transform:translateY(0); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:12px; }
        .modal-header h3 { font-size:1.2rem; display:flex; align-items:center; gap:8px; }
        .modal-close { background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted); }
        .creator-info { text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
        .creator-avatar { width:70px; height:70px; border-radius:50%; background:var(--light-violet); color:var(--primary-violet); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:bold; overflow:hidden; }
        .creator-avatar img { width:100%; height:100%; object-fit:cover; }
        .spotify-player-card { overflow:hidden; padding:0!important; background:#181818!important; color:#fff!important; }
        .spotify-bg-container { position:relative; padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden; }
        .spotify-bg-blurred { position:absolute; inset:0; background-size:cover; filter:blur(25px); opacity:.35; z-index:1; transform:scale(1.2); }
        .spotify-header-top,.spotify-content { position:relative; z-index:2; width:100%; }
        .spotify-header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .spotify-header-top h3 { font-size:.9rem; color:#B3B3B3; text-transform:uppercase; }
        .spotify-cover-img { width:180px; height:180px; border-radius:12px; object-fit:cover; margin-bottom:20px; background:#333; }
        .spotify-song-title { font-size:1.15rem; font-weight:700; margin-bottom:4px; }
        .spotify-song-artist { font-size:.85rem; color:#B3B3B3; margin-bottom:20px; }
        .spotify-progress-bar { width:100%; height:6px; background:rgba(255,255,255,.2); border-radius:3px; cursor:pointer; margin-bottom:6px; }
        .spotify-progress-fill { width:0; height:100%; background:#1DB954; border-radius:3px; }
        .spotify-times { display:flex; justify-content:space-between; font-size:.75rem; color:#B3B3B3; }
        .spotify-controls { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:5px; }
        .spotify-ctrl-btn { background:none; border:none; color:#B3B3B3; font-size:1.1rem; cursor:pointer; }
        .spotify-play-btn { width:48px; height:48px; background:#fff; color:#000; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .config-btn { flex:1; padding:8px; border:1px solid var(--border-color); background:var(--bg-color); border-radius:6px; cursor:pointer; }
        .config-btn.selected { border-color:var(--primary-violet); background:var(--light-violet); color:var(--primary-violet); font-weight:600; }
        .btn-modal { background:var(--primary-violet); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
        @media(max-width:600px){ .chapter-title{font-size:1.5rem} .modal-overlay{align-items:flex-end} .modal-card{width:100%;max-width:100%;border-radius:20px 20px 0 0} }
    </style>
</head>
<body>
    <main class="reader-container">
        <div class="chapter-header">
            <div class="fic-title-small" id="ficTitleSmall">Carregando...</div>
            <h1 class="chapter-title skeleton skeleton-title" id="mainChapterTitle"></h1>
        </div>
        <article class="chapter-body" id="mainChapterBody">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text" style="width:60%"></div>
        </article>
        <div class="chapter-footer">
            <div class="navigation-buttons">
                <button class="nav-page-btn" id="btnPrevChapter" disabled><i class="fa-solid fa-arrow-left"></i> Anterior</button>
                <button class="nav-page-btn" id="btnNextChapter" disabled>Próximo <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </main>

    <div class="fab-container" id="fabMenu">
        <div class="fab-tabbar">
            <a href="../../../fics.html" class="tabbar-item"><i class="fa-solid fa-house"></i> Home</a>
            <button class="tabbar-item" onclick="openModal('modalAudio')"><i class="fa-solid fa-headphones"></i> Audiodescrição</button>
            <button class="tabbar-item" onclick="openModal('modalComentarios')"><i class="fa-regular fa-comment"></i> Comentários</button>
            <button class="tabbar-item" onclick="downloadPdf()"><i class="fa-solid fa-download"></i> Baixar</button>
            <button class="tabbar-item" onclick="openModal('modalConfig')"><i class="fa-solid fa-gear"></i> Configurações</button>
            <button class="tabbar-item" onclick="openModal('modalCriador')"><i class="fa-solid fa-pen-nib"></i> Criador</button>
        </div>
        <button class="fab-main-btn" onclick="toggleFabMenu()"><i class="fa-solid fa-bars" id="fabIcon"></i></button>
    </div>

    <div class="modal-overlay" id="modalAudio">
        <div class="modal-card spotify-player-card">
            <div class="spotify-bg-container">
                <div class="spotify-bg-blurred" id="spotifyBgBlurred"></div>
                <div class="spotify-header-top">
                    <h3>Audiodescrição</h3>
                    <button class="modal-close" style="color:#fff" onclick="closeModal('modalAudio')">&times;</button>
                </div>
                <div class="spotify-content">
                    <img src="" class="spotify-cover-img" id="fanficCoverImg">
                    <div class="spotify-song-title" id="playerChapterTitle">Carregando...</div>
                    <div class="spotify-song-artist" id="playerArtist">—</div>
                    <div class="spotify-progress-bar" id="spotifyProgressBar" onclick="seekAudio(event)">
                        <div class="spotify-progress-fill" id="spotifyProgressFill"></div>
                    </div>
                    <div class="spotify-times"><span id="currentTimeText">00:00</span><span id="totalTimeText">00:00</span></div>
                    <div class="spotify-controls">
                        <button class="spotify-ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
                        <button class="spotify-ctrl-btn" onclick="skipTime(-10)"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="spotify-play-btn" onclick="togglePlayPause()"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
                        <button class="spotify-ctrl-btn" onclick="skipTime(10)"><i class="fa-solid fa-forward-step"></i></button>
                        <button class="spotify-ctrl-btn" id="repeatBtn" onclick="toggleRepeat()"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                    <div style="margin-top:18px;display:flex;justify-content:space-between;width:100%;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;">
                        <button onclick="changeChapter(-1)" style="background:none;border:none;color:#B3B3B3;cursor:pointer;font-size:.85rem;"><i class="fa-solid fa-chevron-left"></i> Cap. Anterior</button>
                        <span style="font-size:.8rem;color:#B3B3B3" id="chapterIndicator">—</span>
                        <button onclick="changeChapter(1)" style="background:none;border:none;color:#B3B3B3;cursor:pointer;font-size:.85rem;">Próximo Cap. <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalComentarios">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-regular fa-comment" style="color:var(--primary-violet)"></i> Comentários</h3>
                <button class="modal-close" onclick="closeModal('modalComentarios')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-muted);text-align:center;">Nenhum comentário ainda.</p>
                <textarea style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-color);color:var(--text-color)" rows="2" placeholder="Escreva um comentário..."></textarea>
                <button class="btn-modal">Publicar Comentário</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalConfig">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear" style="color:var(--primary-violet)"></i> Configurações</h3>
                <button class="modal-close" onclick="closeModal('modalConfig')">&times;</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom:12px">
                    <label style="font-size:.9rem;font-weight:600;color:var(--text-muted)">Tema</label>
                    <div style="display:flex;gap:10px;margin-top:6px">
                        <button class="config-btn selected" id="themeLight" onclick="setTheme('light')">Claro</button>
                        <button class="config-btn" id="themeDark" onclick="setTheme('dark')">Escuro</button>
                    </div>
                </div>
                <div style="margin-bottom:12px">
                    <label style="font-size:.9rem;font-weight:600;color:var(--text-muted)">Fonte</label>
                    <div style="display:flex;gap:10px;margin-top:6px">
                        <button class="config-btn selected" onclick="setFont('Merriweather',this)">Serifa</button>
                        <button class="config-btn" onclick="setFont('Inter',this)">Sans</button>
                        <button class="config-btn" onclick="setFont('Lora',this)">Lora</button>
                    </div>
                </div>
                <div>
                    <label style="font-size:.9rem;font-weight:600;color:var(--text-muted)">Tamanho</label>
                    <div style="display:flex;gap:10px;margin-top:6px">
                        <button class="config-btn" onclick="setFontSize('1rem')">Pequena</button>
                        <button class="config-btn selected" onclick="setFontSize('1.125rem')">Média</button>
                        <button class="config-btn" onclick="setFontSize('1.3rem')">Grande</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalCriador">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-nib" style="color:var(--primary-violet)"></i> Sobre o Criador</h3>
                <button class="modal-close" onclick="closeModal('modalCriador')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="creator-info">
                    <div class="creator-avatar" id="creatorAvatar">?</div>
                    <h4 id="creatorName">Carregando...</h4>
                    <p style="font-size:.9rem;color:var(--text-muted);max-width:300px" id="creatorBio">—</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

        const LS_SALT = 'LS-369-7423-v1';
        const LS_MARKER = 'ls369';
        const LS_TAG_VALUE = 'x7k4m3';
        const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();

        async function deriveLsKey() {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(LS_SALT), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('369'), iterations: 84000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }
        async function decryptFanfic(b64) {
            try {
                const key = await deriveLsKey();
                const binary = atob(b64);
                const packed = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) packed[i] = binary.charCodeAt(i);
                if (packed.length < 13) return null;
                const iv = packed.slice(0, 12);
                const data = packed.slice(12);
                const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                const obj = JSON.parse(new TextDecoder().decode(plain));
                if (obj.m !== LS_MARKER) return null;
                delete obj.m;
                return obj;
            } catch { return null; }
        }

        let currentFanfic = null, chaptersData = [], currentChapterIndex = 0;
        let authorProfile = { name: '', picture: '', about: '' };

        function getIdFromUrl() {
            return new URLSearchParams(window.location.search).get('id') || '';
        }

        async function fetchFanficById(targetId) {
            if (!targetId) return null;
            try {
                const events = await pool.querySync(RELAYS, { kinds: [1], '#t': [LS_TAG_VALUE], limit: 200 });
                if (!events?.length) return null;
                const ev = events.find(e => e.id === targetId);
                if (!ev) return null;
                const data = await decryptFanfic(ev.content);
                if (!data) return null;
                return {
                    id: ev.id,
                    titulo: data.titulo || 'Sem título',
                    autor: data.autor || 'Anônimo',
                    capa: data.capa || '',
                    capitulos: Array.isArray(data.capitulos) ? data.capitulos : [],
                    data: data.data || '',
                    pubkey: ev.pubkey
                };
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function fetchAuthorProfile(pubkey) {
            if (!pubkey) return;
            try {
                const events = await pool.querySync(RELAYS, { kinds: [0], authors: [pubkey], limit: 5 });
                if (!events?.length) return;
                events.sort((a, b) => b.created_at - a.created_at);
                let data = {};
                try { data = JSON.parse(events[0].content || '{}'); } catch (_) {}
                authorProfile.name = (data.display_name || data.name || '').trim() || currentFanfic?.autor || 'Anônimo';
                authorProfile.picture = data.picture || data.image || '';
                authorProfile.about = data.about || data.bio || '';
                updateCreatorUI();
            } catch (_) {}
        }

        function updateCreatorUI() {
            const name = authorProfile.name || currentFanfic?.autor || 'Anônimo';
            const bio = authorProfile.about || `Autor(a) de "${currentFanfic?.titulo || ''}"`;
            document.getElementById('creatorName').textContent = name;
            document.getElementById('creatorBio').textContent = bio;
            const el = document.getElementById('creatorAvatar');
            if (authorProfile.picture) {
                el.innerHTML = `<img src="${authorProfile.picture}" alt="${name}" onerror="this.parentElement.textContent='${name.charAt(0).toUpperCase()}'">`;
            } else {
                el.textContent = name.charAt(0).toUpperCase() || '?';
            }
        }

        function renderChapter(index) {
            if (!chaptersData.length) return;
            currentChapterIndex = Math.max(0, Math.min(index, chaptersData.length - 1));
            const chap = chaptersData[currentChapterIndex];
            document.getElementById('ficTitleSmall').textContent =
                `${currentFanfic.titulo}${currentFanfic.autor ? ' • ' + currentFanfic.autor : ''}`;
            const titleEl = document.getElementById('mainChapterTitle');
            titleEl.className = 'chapter-title';
            titleEl.textContent = chap.titulo || `Capítulo ${currentChapterIndex + 1}`;
            const bodyEl = document.getElementById('mainChapterBody');
            const texto = chap.conteudo || '';
            const pars = texto.split(/\n\s*\n/).filter(p => p.trim());
            bodyEl.innerHTML = pars.length
                ? pars.map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('')
                : `<p>${texto.replace(/\n/g, '<br>')}</p>`;
            document.getElementById('btnPrevChapter').disabled = currentChapterIndex === 0;
            document.getElementById('btnNextChapter').disabled = currentChapterIndex >= chaptersData.length - 1;
            document.getElementById('playerChapterTitle').textContent = chap.titulo || `Capítulo ${currentChapterIndex + 1}`;
            document.getElementById('playerArtist').textContent = `${currentFanfic.titulo} • ${currentFanfic.autor || 'Anônimo'}`;
            document.getElementById('chapterIndicator').textContent = `${currentChapterIndex + 1} / ${chaptersData.length}`;
            const cover = currentFanfic.capa || '';
            document.getElementById('fanficCoverImg').src = cover;
            document.getElementById('spotifyBgBlurred').style.backgroundImage = cover ? `url('${cover}')` : '';
            document.title = `${chap.titulo || 'Capítulo'} - ${currentFanfic.titulo} | LoreSpace`;
        }

        function setupNavigation() {
            document.getElementById('btnPrevChapter').onclick = () => {
                if (currentChapterIndex > 0) { stopAudioState(); renderChapter(currentChapterIndex - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            };
            document.getElementById('btnNextChapter').onclick = () => {
                if (currentChapterIndex < chaptersData.length - 1) { stopAudioState(); renderChapter(currentChapterIndex + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            };
        }

        (async () => {
            const id = getIdFromUrl();
            if (!id) {
                document.getElementById('ficTitleSmall').textContent = 'Erro';
                document.getElementById('mainChapterTitle').className = 'chapter-title';
                document.getElementById('mainChapterTitle').textContent = 'Fanfic não encontrada';
                document.getElementById('mainChapterBody').innerHTML = '<p>ID não informado.</p>';
                return;
            }
            currentFanfic = await fetchFanficById(id);
            if (!currentFanfic) {
                document.getElementById('ficTitleSmall').textContent = 'Erro';
                document.getElementById('mainChapterTitle').className = 'chapter-title';
                document.getElementById('mainChapterTitle').textContent = 'Fanfic não encontrada';
                document.getElementById('mainChapterBody').innerHTML = '<p>Não foi possível descriptografar esta fanfic.</p>';
                return;
            }
            fetchAuthorProfile(currentFanfic.pubkey);
            chaptersData = (currentFanfic.capitulos || []).map((c, i) => ({
                titulo: c.titulo || `Capítulo ${c.numero || i + 1}`,
                conteudo: c.conteudo || ''
            }));
            if (!chaptersData.length) chaptersData = [{ titulo: 'Capítulo 1', conteudo: 'Sem capítulos.' }];
            setupNavigation();
            updateCreatorUI();
            renderChapter(0);
        })();

        window.toggleFabMenu = function() {
            const fab = document.getElementById('fabMenu');
            const icon = document.getElementById('fabIcon');
            fab.classList.toggle('active');
            icon.className = fab.classList.contains('active') ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
        };
        window.addEventListener('click', e => {
            const fab = document.getElementById('fabMenu');
            if (!fab.contains(e.target) && fab.classList.contains('active')) {
                fab.classList.remove('active');
                document.getElementById('fabIcon').className = 'fa-solid fa-bars';
            }
        });
        window.openModal = id => {
            document.getElementById(id).classList.add('active');
            document.getElementById('fabMenu').classList.remove('active');
            document.getElementById('fabIcon').className = 'fa-solid fa-bars';
        };
        window.closeModal = id => document.getElementById(id).classList.remove('active');
        window.setTheme = t => {
            document.documentElement.setAttribute('data-theme', t);
            document.getElementById('themeLight').classList.toggle('selected', t === 'light');
            document.getElementById('themeDark').classList.toggle('selected', t === 'dark');
        };
        window.setFont = (f, btn) => {
            document.documentElement.style.setProperty('--body-font', f + ', serif');
            btn.parentElement.querySelectorAll('.config-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        };
        window.setFontSize = s => {
            document.documentElement.style.setProperty('--font-size', s);
            event.target.parentElement.querySelectorAll('.config-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        };

        window.downloadPdf = async function() {
            if (!currentFanfic || !chaptersData.length) return alert('Fanfic ainda não carregada.');
            document.getElementById('fabMenu').classList.remove('active');
            document.getElementById('fabIcon').className = 'fa-solid fa-bars';
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a5' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 18;
            const contentWidth = pageWidth - margin * 2;
            try {
                const imgSrc = document.getElementById('fanficCoverImg').src;
                if (imgSrc && imgSrc.length > 10) doc.addImage(imgSrc, 'JPEG', 0, 0, pageWidth, pageHeight);
                else throw new Error();
            } catch {
                doc.setFillColor(30, 20, 50);
                doc.rect(0, 0, pageWidth, pageHeight, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(18);
                doc.text(currentFanfic.titulo || 'Fanfic', pageWidth / 2, pageHeight / 2 - 10, { align: 'center' });
                doc.setFontSize(12);
                doc.text(currentFanfic.autor || 'Anônimo', pageWidth / 2, pageHeight / 2 + 5, { align: 'center' });
            }
            doc.addPage();
            doc.setTextColor(40, 40, 40);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('Sumário', margin, 22);
            doc.setDrawColor(138, 43, 226);
            doc.setLineWidth(0.6);
            doc.line(margin, 25, pageWidth - margin, 25);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(11);
            let y = 35;
            chaptersData.forEach((chap, idx) => {
                doc.text(chap.titulo || `Capítulo ${idx + 1}`, margin, y);
                doc.text(String(idx + 3), pageWidth - margin, y, { align: 'right' });
                y += 9;
            });
            y += 12;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(13);
            doc.text('Sobre o Autor', margin, y);
            doc.line(margin, y + 2, pageWidth - margin, y + 2);
            y += 10;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(11);
            doc.text(currentFanfic.autor || 'Anônimo', margin, y);
            doc.setFont('helvetica', 'italic');
            doc.setFontSize(8);
            doc.setTextColor(140, 140, 140);
            doc.text('Compartilhado em LoreSpace', pageWidth / 2, pageHeight - 10, { align: 'center' });
            chaptersData.forEach((chap, idx) => {
                doc.addPage();
                doc.setFont('helvetica', 'italic');
                doc.setFontSize(8);
                doc.setTextColor(130, 130, 130);
                doc.text(currentFanfic.titulo || '', margin, 12);
                doc.text(chap.titulo || `Capítulo ${idx + 1}`, pageWidth - margin, 12, { align: 'right' });
                doc.setDrawColor(220, 220, 220);
                doc.line(margin, 15, pageWidth - margin, 15);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.setTextColor(30, 30, 30);
                doc.text(chap.titulo || `Capítulo ${idx + 1}`, margin, 26);
                doc.setFont('times', 'normal');
                doc.setFontSize(10.5);
                doc.setTextColor(40, 40, 40);
                const lines = doc.splitTextToSize(chap.conteudo || '', contentWidth);
                let cursorY = 36;
                lines.forEach(line => {
                    if (cursorY > pageHeight - 18) { doc.addPage(); cursorY = 20; }
                    doc.text(line, margin, cursorY);
                    cursorY += 6.2;
                });
                doc.setFont('helvetica', 'italic');
                doc.setFontSize(8);
                doc.setTextColor(150, 150, 150);
                doc.text('Compartilhado em LoreSpace', pageWidth / 2, pageHeight - 8, { align: 'center' });
            });
            const safeName = (currentFanfic.titulo || 'fanfic').replace(/[^\w\s-]/g, '').replace(/\s+/g, '_').substring(0, 60);
            doc.save(safeName + '.pdf');
        };

        let isPlaying = false, speechSynth = window.speechSynthesis, elapsedSeconds = 0, estimatedTotalSeconds = 60, timerInterval = null;
        function formatTime(s) {
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
        }
        function updatePlayerUI() {
            document.getElementById('currentTimeText').textContent = formatTime(elapsedSeconds);
            document.getElementById('totalTimeText').textContent = formatTime(estimatedTotalSeconds);
            document.getElementById('spotifyProgressFill').style.width =
                (estimatedTotalSeconds ? Math.min((elapsedSeconds / estimatedTotalSeconds) * 100, 100) : 0) + '%';
        }
        function stopAudioState() {
            isPlaying = false;
            const icon = document.getElementById('playPauseIcon');
            if (icon) { icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); }
            clearInterval(timerInterval);
        }
        window.togglePlayPause = function() {
            if (!speechSynth || !chaptersData.length) return;
            const icon = document.getElementById('playPauseIcon');
            if (isPlaying) { speechSynth.cancel(); stopAudioState(); }
            else {
                const text = chaptersData[currentChapterIndex].conteudo || '';
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = 'pt-BR';
                estimatedTotalSeconds = Math.max(Math.floor(text.length / 15), 10);
                elapsedSeconds = 0;
                utt.onend = utt.onerror = stopAudioState;
                speechSynth.speak(utt);
                isPlaying = true;
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
                timerInterval = setInterval(() => {
                    if (elapsedSeconds < estimatedTotalSeconds) { elapsedSeconds++; updatePlayerUI(); }
                }, 1000);
            }
        };
        window.skipTime = a => {
            if (speechSynth) { speechSynth.cancel(); stopAudioState(); }
            elapsedSeconds = Math.max(0, Math.min(estimatedTotalSeconds, elapsedSeconds + a));
            updatePlayerUI();
        };
        window.seekAudio = e => {
            const rect = document.getElementById('spotifyProgressBar').getBoundingClientRect();
            elapsedSeconds = Math.floor(((e.clientX - rect.left) / rect.width) * estimatedTotalSeconds);
            updatePlayerUI();
            if (isPlaying) { speechSynth.cancel(); stopAudioState(); togglePlayPause(); }
        };
        window.changeChapter = d => {
            if (speechSynth) speechSynth.cancel();
            stopAudioState();
            let idx = currentChapterIndex + d;
            if (idx < 0) idx = chaptersData.length - 1;
            if (idx >= chaptersData.length) idx = 0;
            renderChapter(idx);
            elapsedSeconds = 0;
            updatePlayerUI();
        };
        window.toggleShuffle = () => document.getElementById('shuffleBtn').classList.toggle('active');
        window.toggleRepeat = () => document.getElementById('repeatBtn').classList.toggle('active');
        updatePlayerUI();
    </script>
</body>
</html>
