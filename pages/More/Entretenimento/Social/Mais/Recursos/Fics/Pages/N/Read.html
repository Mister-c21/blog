<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura - Fanfic | LoreSpace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary-violet: #8A2BE2;
            --primary-violet-hover: #7B1FA2;
            --light-violet: #F3E8FF;
            --bg-color: #FAFAFA;
            --text-color: #333333;
            --text-muted: #717171;
            --card-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --body-font: 'Merriweather', serif;
            --font-size: 1.125rem;
            --skeleton-bg: #E0E0E0;
            --skeleton-highlight: #F5F5F5;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #E0E0E0;
            --text-muted: #A0A0A0;
            --card-bg: #1E1E1E;
            --border-color: #2D2D2D;
            --light-violet: #2D1B4E;
            --skeleton-bg: #2A2A2A;
            --skeleton-highlight: #3A3A3A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        .skeleton {
            background: var(--skeleton-bg);
            background-image: linear-gradient(90deg, var(--skeleton-bg) 0px, var(--skeleton-highlight) 40px, var(--skeleton-bg) 80px);
            background-size: 600px 100%;
            animation: shimmer 1.6s infinite linear;
            border-radius: 4px;
        }

        .skeleton-title { height: 2.2rem; width: 70%; margin: 0 auto; border-radius: 6px; }
        .skeleton-text { height: 1.1rem; margin-bottom: 18px; width: 100%; }
        .skeleton-text:nth-child(even) { width: 85%; }

        .reader-container {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .chapter-header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .fic-title-small {
            font-size: 0.9rem;
            color: var(--primary-violet);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .chapter-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .chapter-body {
            font-family: var(--body-font);
            font-size: var(--font-size);
            line-height: 1.8;
            color: var(--text-color);
        }

        .chapter-body p {
            margin-bottom: 24px;
            text-align: justify;
        }

        .chapter-footer {
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
        }

        .nav-page-btn {
            padding: 10px 20px;
            border: 1px solid var(--primary-violet);
            background: transparent;
            color: var(--primary-violet);
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-page-btn:hover:not(:disabled) {
            background: var(--primary-violet);
            color: white;
        }

        .nav-page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .fab-main-btn {
            width: 56px;
            height: 56px;
            background-color: var(--primary-violet);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
        }

        .fab-main-btn i { transition: transform 0.3s ease; }
        .fab-main-btn:hover { background-color: var(--primary-violet-hover); }

        .fab-tabbar {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 180px;
        }

        .fab-container.active .fab-tabbar {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .fab-container.active .fab-main-btn { transform: rotate(90deg); }

        .tabbar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .tabbar-item:hover {
            background-color: var(--light-violet);
            color: var(--primary-violet);
        }

        .tabbar-item i {
            font-size: 1.1rem;
            color: var(--primary-violet);
            width: 20px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 480px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-card { transform: translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .modal-close:hover { color: var(--primary-violet); }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comment-input-box {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            resize: none;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .comment-input-box:focus { border-color: var(--primary-violet); }

        .comment-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .comment-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .comment-content { display: flex; flex-direction: column; }
        .comment-author {
            font-weight: 600;
            color: var(--primary-violet);
            margin-bottom: 2px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .config-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .config-options { display: flex; gap: 10px; }
        .config-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .config-btn.selected {
            border-color: var(--primary-violet);
            background: var(--light-violet);
            color: var(--primary-violet);
            font-weight: 600;
        }

        .btn-modal {
            background-color: var(--primary-violet);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn-modal:hover { background-color: var(--primary-violet-hover); }

        .creator-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .creator-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--light-violet);
            color: var(--primary-violet);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            overflow: hidden;
        }
        .creator-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .creator-socials {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .social-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            transition: opacity 0.2s;
        }
        .social-btn:hover { opacity: 0.9; }
        .social-instagram { background-color: #E1306C; }
        .social-twitter { background-color: #1DA1F2; }
        .social-wattpad { background-color: #FF7300; }

        .spotify-player-card {
            overflow: hidden;
            padding: 0 !important;
            background: #181818 !important;
            color: #FFFFFF !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .spotify-bg-container {
            position: relative;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .spotify-bg-blurred {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(25px);
            opacity: 0.35;
            z-index: 1;
            transform: scale(1.2);
        }

        .spotify-header-top, .spotify-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .spotify-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .spotify-header-top h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #B3B3B3;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .spotify-cover-img {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            background: #333;
        }

        .spotify-song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 4px;
        }

        .spotify-song-artist {
            font-size: 0.85rem;
            color: #B3B3B3;
            margin-bottom: 20px;
        }

        .spotify-progress-container { width: 100%; margin-bottom: 16px; }

        .spotify-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .spotify-progress-fill {
            width: 0%;
            height: 100%;
            background: #1DB954;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .spotify-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #B3B3B3;
        }

        .spotify-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
        }

        .spotify-ctrl-btn {
            background: none;
            border: none;
            color: #B3B3B3;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .spotify-ctrl-btn:hover, .spotify-ctrl-btn.active { color: #1DB954; }

        .spotify-play-btn {
            width: 48px;
            height: 48px;
            background: #FFFFFF;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            border: none;
        }

        .spotify-play-btn:hover { transform: scale(1.05); }

        @media(max-width: 600px) {
            .chapter-title { font-size: 1.5rem; }
            .modal-overlay { align-items: flex-end; }
            .modal-card {
                width: 100%;
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
                transform: translateY(100%);
                padding-bottom: 30px;
            }
            .modal-overlay.active .modal-card { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main class="reader-container">
        <div class="chapter-header">
            <div class="fic-title-small" id="ficTitleSmall">Carregando...</div>
            <h1 class="chapter-title skeleton skeleton-title" id="mainChapterTitle"></h1>
        </div>

        <article class="chapter-body" id="mainChapterBody">
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text" style="width: 60%;"></div>
        </article>

        <div class="chapter-footer">
            <div class="navigation-buttons">
                <button class="nav-page-btn" id="btnPrevChapter" disabled>
                    <i class="fa-solid fa-arrow-left"></i> Anterior
                </button>
                <button class="nav-page-btn" id="btnNextChapter" disabled>
                    Próximo <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </main>

    <div class="fab-container" id="fabMenu">
        <div class="fab-tabbar">
            <a href="../../../fics.html" class="tabbar-item">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <button class="tabbar-item" onclick="openModal('modalAudio')">
                <i class="fa-solid fa-headphones"></i> Audiodescrição
            </button>
            <button class="tabbar-item" onclick="openModal('modalComentarios')">
                <i class="fa-regular fa-comment"></i> Comentários
            </button>
            <button class="tabbar-item" onclick="downloadPdf()">
                <i class="fa-solid fa-download"></i> Baixar
            </button>
            <button class="tabbar-item" onclick="openModal('modalConfig')">
                <i class="fa-solid fa-gear"></i> Configurações
            </button>
            <button class="tabbar-item" onclick="openModal('modalCriador')">
                <i class="fa-solid fa-pen-nib"></i> Criador
            </button>
        </div>
        <button class="fab-main-btn" onclick="toggleFabMenu()" title="Menu de Opções">
            <i class="fa-solid fa-bars" id="fabIcon"></i>
        </button>
    </div>

    <!-- Modal Audiodescrição -->
    <div class="modal-overlay" id="modalAudio">
        <div class="modal-card spotify-player-card">
            <div class="spotify-bg-container">
                <div class="spotify-bg-blurred" id="spotifyBgBlurred"></div>
                <div class="spotify-header-top">
                    <h3>Audiodescrição</h3>
                    <button class="modal-close" style="color: #FFF;" onclick="closeModal('modalAudio')">&times;</button>
                </div>
                <div class="spotify-content">
                    <img src="" alt="Capa da Fanfic" class="spotify-cover-img" id="fanficCoverImg">
                    <div class="spotify-song-title" id="playerChapterTitle">Carregando...</div>
                    <div class="spotify-song-artist" id="playerArtist">—</div>

                    <div class="spotify-progress-container">
                        <div class="spotify-progress-bar" id="spotifyProgressBar" onclick="seekAudio(event)">
                            <div class="spotify-progress-fill" id="spotifyProgressFill"></div>
                        </div>
                        <div class="spotify-times">
                            <span id="currentTimeText">00:00</span>
                            <span id="totalTimeText">00:00</span>
                        </div>
                    </div>

                    <div class="spotify-controls">
                        <button class="spotify-ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aleatório"><i class="fa-solid fa-shuffle"></i></button>
                        <button class="spotify-ctrl-btn" onclick="skipTime(-10)" title="Retroceder 10s"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="spotify-play-btn" id="playPauseMainBtn" onclick="togglePlayPause()" title="Play/Pause"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
                        <button class="spotify-ctrl-btn" onclick="skipTime(10)" title="Avançar 10s"><i class="fa-solid fa-forward-step"></i></button>
                        <button class="spotify-ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetir"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>

                    <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: center; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
                        <button onclick="changeChapter(-1)" style="background:none; border:none; color:#B3B3B3; cursor:pointer; font-size:0.85rem;"><i class="fa-solid fa-chevron-left"></i> Cap. Anterior</button>
                        <span style="font-size: 0.8rem; color: #B3B3B3;" id="chapterIndicator">—</span>
                        <button onclick="changeChapter(1)" style="background:none; border:none; color:#B3B3B3; cursor:pointer; font-size:0.85rem;">Próximo Cap. <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Comentários -->
    <div class="modal-overlay" id="modalComentarios">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-regular fa-comment" style="color: var(--primary-violet);"></i> Comentários do Capítulo</h3>
                <button class="modal-close" onclick="closeModal('modalComentarios')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="comment-list" id="commentList">
                    <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Nenhum comentário ainda.</p>
                </div>
                <textarea class="comment-input-box" rows="2" placeholder="Escreva um comentário..."></textarea>
                <button class="btn-modal">Publicar Comentário</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurações -->
    <div class="modal-overlay" id="modalConfig">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-gear" style="color: var(--primary-violet);"></i> Configurações de Leitura</h3>
                <button class="modal-close" onclick="closeModal('modalConfig')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="config-group">
                    <label>Tema da Página</label>
                    <div class="config-options">
                        <button class="config-btn selected" id="themeLight" onclick="setTheme('light')">Claro</button>
                        <button class="config-btn" id="themeDark" onclick="setTheme('dark')">Escuro</button>
                    </div>
                </div>
                <div class="config-group">
                    <label>Fonte do Texto</label>
                    <div class="config-options">
                        <button class="config-btn selected" onclick="setFont('Merriweather', this)">Serifa</button>
                        <button class="config-btn" onclick="setFont('Inter', this)">Sans</button>
                        <button class="config-btn" onclick="setFont('Lora', this)">Lora</button>
                    </div>
                </div>
                <div class="config-group">
                    <label>Tamanho da Letra</label>
                    <div class="config-options">
                        <button class="config-btn" onclick="setFontSize('1rem')">Pequena</button>
                        <button class="config-btn selected" onclick="setFontSize('1.125rem')">Média</button>
                        <button class="config-btn" onclick="setFontSize('1.3rem')">Grande</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Criador -->
    <div class="modal-overlay" id="modalCriador">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-nib" style="color: var(--primary-violet);"></i> Sobre o Criador</h3>
                <button class="modal-close" onclick="closeModal('modalCriador')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="creator-info">
                    <div class="creator-avatar" id="creatorAvatar">?</div>
                    <h4 style="color: var(--text-color);" id="creatorName">Carregando...</h4>
                    <p style="font-size: 0.9rem; color: var(--text-muted);" id="creatorBio">—</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

        const RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://relay.nostr.band',
            'wss://relay.primal.net'
        ];
        const pool = new NostrTools.SimplePool();

        // Dados da fanfic carregada
        let currentFanfic = null;
        let chaptersData = [];
        let currentChapterIndex = 0;

        // ===================== BUSCA NA REDE =====================
        function getIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || '';
        }

        async function fetchFanficById(targetId) {
            if (!targetId) return null;

            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [1],
                    '#t': ['LoreSpaceFics'],
                    limit: 150
                });

                if (!events || !events.length) return null;

                events.sort((a, b) => b.created_at - a.created_at);

                for (const ev of events) {
                    try {
                        const data = JSON.parse(ev.content || '{}');
                        if (data.type !== 'LoreSpaceFics') continue;

                        const ficId = String(data.id || '');
                        const eventId = ev.id;

                        if (ficId === targetId || eventId === targetId) {
                            return {
                                id: ficId || eventId,
                                eventId: eventId,
                                titulo: data.titulo || 'Sem título',
                                autor: data.autor || 'Anônimo',
                                capa: data.capa || '',
                                capitulos: Array.isArray(data.capitulos) ? data.capitulos : [],
                                data: data.data || '',
                                pubkey: ev.pubkey
                            };
                        }
                    } catch (_) {}
                }
                return null;
            } catch (e) {
                console.error('Erro ao buscar fanfic:', e);
                return null;
            }
        }

        // ===================== RENDERIZAÇÃO =====================
        function renderChapter(index) {
            if (!chaptersData.length) return;

            currentChapterIndex = Math.max(0, Math.min(index, chaptersData.length - 1));
            const chap = chaptersData[currentChapterIndex];

            // Títulos
            document.getElementById('ficTitleSmall').textContent = currentFanfic.titulo + (currentFanfic.autor ? ' • ' + currentFanfic.autor : '');
            document.getElementById('mainChapterTitle').className = 'chapter-title';
            document.getElementById('mainChapterTitle').textContent = chap.titulo || `Capítulo ${currentChapterIndex + 1}`;

            // Corpo
            const bodyEl = document.getElementById('mainChapterBody');
            const texto = chap.conteudo || '';
            // Quebra por parágrafos (linhas em branco ou \n\n)
            const paragrafos = texto.split(/\n\s*\n/).filter(p => p.trim());
            if (paragrafos.length) {
                bodyEl.innerHTML = paragrafos.map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');
            } else {
                bodyEl.innerHTML = `<p>${texto.replace(/\n/g, '<br>')}</p>`;
            }

            // Navegação
            const btnPrev = document.getElementById('btnPrevChapter');
            const btnNext = document.getElementById('btnNextChapter');
            btnPrev.disabled = currentChapterIndex === 0;
            btnNext.disabled = currentChapterIndex >= chaptersData.length - 1;

            // Player
            document.getElementById('playerChapterTitle').textContent = chap.titulo || `Capítulo ${currentChapterIndex + 1}`;
            document.getElementById('playerArtist').textContent = currentFanfic.titulo + ' • ' + (currentFanfic.autor || 'Anônimo');
            document.getElementById('chapterIndicator').textContent = `${currentChapterIndex + 1} / ${chaptersData.length}`;

            // Capa
            const coverUrl = currentFanfic.capa || '';
            const coverImg = document.getElementById('fanficCoverImg');
            const bgBlur = document.getElementById('spotifyBgBlurred');
            if (coverUrl) {
                coverImg.src = coverUrl;
                bgBlur.style.backgroundImage = `url('${coverUrl}')`;
            }

            // Título da página
            document.title = `${chap.titulo || 'Capítulo'} - ${currentFanfic.titulo} | LoreSpace`;
        }

        function setupNavigation() {
            document.getElementById('btnPrevChapter').onclick = () => {
                if (currentChapterIndex > 0) {
                    stopAudioState();
                    renderChapter(currentChapterIndex - 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            document.getElementById('btnNextChapter').onclick = () => {
                if (currentChapterIndex < chaptersData.length - 1) {
                    stopAudioState();
                    renderChapter(currentChapterIndex + 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
        }

        // ===================== CRIADOR =====================
        function updateCreatorInfo() {
            const name = currentFanfic?.autor || 'Anônimo';
            document.getElementById('creatorName').textContent = name;
            document.getElementById('creatorBio').textContent = `Autor(a) de "${currentFanfic?.titulo || ''}"`;

            const avatarEl = document.getElementById('creatorAvatar');
            const initial = name.charAt(0).toUpperCase() || '?';
            avatarEl.textContent = initial;
        }

        // ===================== INICIALIZAÇÃO =====================
        (async () => {
            const id = getIdFromUrl();
            if (!id) {
                document.getElementById('ficTitleSmall').textContent = 'Erro';
                document.getElementById('mainChapterTitle').className = 'chapter-title';
                document.getElementById('mainChapterTitle').textContent = 'Fanfic não encontrada';
                document.getElementById('mainChapterBody').innerHTML = '<p>ID da fanfic não informado na URL.</p>';
                return;
            }

            currentFanfic = await fetchFanficById(id);

            if (!currentFanfic) {
                document.getElementById('ficTitleSmall').textContent = 'Erro';
                document.getElementById('mainChapterTitle').className = 'chapter-title';
                document.getElementById('mainChapterTitle').textContent = 'Fanfic não encontrada';
                document.getElementById('mainChapterBody').innerHTML = '<p>Não foi possível encontrar esta fanfic na rede Nostr.</p>';
                return;
            }

            // Normaliza capítulos
            chaptersData = (currentFanfic.capitulos || []).map((c, i) => ({
                titulo: c.titulo || `Capítulo ${c.numero || (i + 1)}`,
                conteudo: c.conteudo || ''
            }));

            if (!chaptersData.length) {
                chaptersData = [{ titulo: 'Capítulo 1', conteudo: 'Esta fanfic ainda não possui capítulos.' }];
            }

            setupNavigation();
            updateCreatorInfo();
            renderChapter(0);
        })();

        // ===================== CONTROLES DE UI (originais) =====================
        window.toggleFabMenu = function() {
            const fab = document.getElementById('fabMenu');
            const icon = document.getElementById('fabIcon');
            fab.classList.toggle('active');
            if (fab.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        };

        window.addEventListener('click', function(e) {
            const fab = document.getElementById('fabMenu');
            const icon = document.getElementById('fabIcon');
            if (!fab.contains(e.target) && fab.classList.contains('active')) {
                fab.classList.remove('active');
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });

        window.openModal = function(modalId) {
            document.getElementById(modalId).classList.add('active');
            document.getElementById('fabMenu').classList.remove('active');
            document.getElementById('fabIcon').className = 'fa-solid fa-bars';
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.remove('active');
        };

        window.setTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeLight').classList.toggle('selected', theme === 'light');
            document.getElementById('themeDark').classList.toggle('selected', theme === 'dark');
        };

        window.setFont = function(fontFamily, btnElement) {
            document.documentElement.style.setProperty('--body-font', fontFamily + ', serif');
            const parent = btnElement.parentElement;
            parent.querySelectorAll('.config-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
        };

        window.setFontSize = function(size) {
            document.documentElement.style.setProperty('--font-size', size);
            event.target.parentElement.querySelectorAll('.config-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        };

        // ===================== PDF =====================
        window.downloadPdf = async function() {
            if (!currentFanfic || !chaptersData.length) {
                alert('Fanfic ainda não carregada.');
                return;
            }

            document.getElementById('fabMenu').classList.remove('active');
            document.getElementById('fabIcon').className = 'fa-solid fa-bars';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a5' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 20;
            const contentWidth = pageWidth - (margin * 2);

            // Capa
            try {
                const imgData = document.getElementById('fanficCoverImg').src;
                if (imgData) {
                    doc.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                } else {
                    throw new Error('sem capa');
                }
            } catch(e) {
                doc.setFillColor(30, 20, 50);
                doc.rect(0, 0, pageWidth, pageHeight, "F");
                doc.setTextColor(255, 255, 255);
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(18);
                doc.text(currentFanfic.titulo || 'Fanfic', pageWidth / 2, pageHeight / 2, { align: "center" });
            }

            // Sumário
            doc.addPage();
            doc.setTextColor(40, 40, 40);
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(16);
            doc.text("Sumário", margin, 25);
            doc.setDrawColor(138, 43, 226);
            doc.setLineWidth(0.5);
            doc.line(margin, 28, pageWidth - margin, 28);

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(11);
            let summaryY = 38;
            chaptersData.forEach((item, idx) => {
                doc.text(item.titulo || `Capítulo ${idx + 1}`, margin, summaryY);
                doc.text(String(idx + 3), pageWidth - margin, summaryY, { align: "right" });
                summaryY += 10;
            });

            summaryY += 15;
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(14);
            doc.text("Sobre o Autor", margin, summaryY);
            doc.line(margin, summaryY + 3, pageWidth - margin, summaryY + 3);
            summaryY += 12;
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(11);
            doc.text(currentFanfic.autor || 'Anônimo', margin, summaryY);

            doc.setFont("Helvetica", "italic");
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text("Compartilhado em LoreSpace", pageWidth / 2, pageHeight - 12, { align: "center" });

            // Capítulos
            chaptersData.forEach((chap) => {
                doc.addPage();
                doc.setFont("Helvetica", "italic");
                doc.setFontSize(8);
                doc.setTextColor(140, 140, 140);
                doc.text(currentFanfic.titulo || '', margin, 12);
                doc.text(chap.titulo || '', pageWidth - margin, 12, { align: "right" });
                doc.setDrawColor(220, 220, 220);
                doc.setLineWidth(0.3);
                doc.line(margin, 15, pageWidth - margin, 15);

                doc.setFont("Helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(40, 40, 40);
                doc.text(chap.titulo || '', margin, 26);

                doc.setFont("Times", "normal");
                doc.setFontSize(10.5);
                doc.setTextColor(50, 50, 50);

                const splitText = doc.splitTextToSize(chap.conteudo || '', contentWidth);
                let cursorY = 36;
                const pageBottomLimit = pageHeight - 20;

                splitText.forEach(line => {
                    if (cursorY > pageBottomLimit) {
                        doc.addPage();
                        cursorY = 20;
                    }
                    doc.text(line, margin, cursorY);
                    cursorY += 6.5;
                });

                doc.setFont("Helvetica", "italic");
                doc.setFontSize(8);
                doc.setTextColor(150, 150, 150);
                doc.text("Compartilhado em LoreSpace", pageWidth / 2, pageHeight - 10, { align: "center" });
            });

            const safeName = (currentFanfic.titulo || 'fanfic').replace(/[^\w\s-]/g, '').replace(/\s+/g, '_');
            doc.save(safeName + '.pdf');
        };

        // ===================== ÁUDIO =====================
        let isPlaying = false;
        let speechSynth = window.speechSynthesis;
        let currentUtterance = null;
        let elapsedSeconds = 0;
        let estimatedTotalSeconds = 60;
        let timerInterval = null;

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updatePlayerUI() {
            document.getElementById('currentTimeText').innerText = formatTime(elapsedSeconds);
            document.getElementById('totalTimeText').innerText = formatTime(estimatedTotalSeconds);
            const percentage = estimatedTotalSeconds > 0 ? Math.min((elapsedSeconds / estimatedTotalSeconds) * 100, 100) : 0;
            document.getElementById('spotifyProgressFill').style.width = percentage + '%';
        }

        window.togglePlayPause = function() {
            if (!speechSynth) {
                alert("Seu navegador não suporta audiodescrição nativa.");
                return;
            }
            if (!chaptersData.length) return;

            const icon = document.getElementById('playPauseIcon');

            if (isPlaying) {
                speechSynth.cancel();
                stopAudioState();
            } else {
                const chap = chaptersData[currentChapterIndex];
                currentUtterance = new SpeechSynthesisUtterance(chap.conteudo || '');
                currentUtterance.lang = 'pt-BR';
                currentUtterance.rate = 1.0;

                estimatedTotalSeconds = Math.max(Math.floor((chap.conteudo || '').length / 15), 10);
                elapsedSeconds = 0;

                currentUtterance.onend = () => stopAudioState();
                currentUtterance.onerror = () => stopAudioState();

                speechSynth.speak(currentUtterance);
                isPlaying = true;
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');

                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (elapsedSeconds < estimatedTotalSeconds) {
                        elapsedSeconds++;
                        updatePlayerUI();
                    }
                }, 1000);
            }
        };

        function stopAudioState() {
            isPlaying = false;
            const icon = document.getElementById('playPauseIcon');
            if (icon) {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
            }
            clearInterval(timerInterval);
        }

        window.skipTime = function(amount) {
            if (speechSynth) {
                speechSynth.cancel();
                stopAudioState();
                elapsedSeconds += amount;
                if (elapsedSeconds < 0) elapsedSeconds = 0;
                if (elapsedSeconds > estimatedTotalSeconds) elapsedSeconds = estimatedTotalSeconds;
                updatePlayerUI();
            }
        };

        window.seekAudio = function(event) {
            const bar = document.getElementById('spotifyProgressBar');
            const rect = bar.getBoundingClientRect();
            const clickPosition = (event.clientX - rect.left) / rect.width;
            elapsedSeconds = Math.floor(clickPosition * estimatedTotalSeconds);
            updatePlayerUI();
            if (isPlaying) {
                speechSynth.cancel();
                stopAudioState();
                togglePlayPause();
            }
        };

        window.changeChapter = function(direction) {
            if (speechSynth) speechSynth.cancel();
            stopAudioState();

            let newIndex = currentChapterIndex + direction;
            if (newIndex < 0) newIndex = chaptersData.length - 1;
            if (newIndex >= chaptersData.length) newIndex = 0;

            renderChapter(newIndex);
            elapsedSeconds = 0;
            updatePlayerUI();
        };

        window.toggleShuffle = function() {
            document.getElementById('shuffleBtn').classList.toggle('active');
        };

        window.toggleRepeat = function() {
            document.getElementById('repeatBtn').classList.toggle('active');
        };

        updatePlayerUI();
    </script>
</body>
</html>
