<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrever Fanfic</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #8A2BE2;
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        main {
            flex: 1;
            max-width: 700px;
            width: 90%;
            margin: 30px auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="number"], textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            height: 250px;
            line-height: 1.5;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="file"] {
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="file"]:hover {
            border-color: var(--primary-color);
        }

        .preview-container {
            margin-top: 15px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 15px;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .preview-image {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #ddd;
            display: none;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9rem;
        }

        .toptabs-container {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .toptabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            color: #888888;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--text-color);
            font-weight: 700;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-publish {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 48px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.05rem;
            width: 100%;
            max-width: 350px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-publish:hover {
            background-color: #7b24cf;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        }

        .btn-publish:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.4);
        }

        .btn-nav-icon {
            color: var(--text-color);
            font-size: 1.2rem;
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .btn-nav-icon:hover {
            color: var(--primary-color);
        }

        @media (max-width: 600px) {
            main {
                width: 100%;
                margin: 0;
                border-radius: 0;
                border-left: none;
                border-right: none;
                padding: 20px 15px;
                min-height: calc(100vh - 60px);
            }
            header {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../../fics.html" class="btn-nav-icon" title="Voltar / Ir para outra página">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        
        <div class="logo">
            <i class="fa-solid fa-pen-nib"></i> Criar Nova História
        </div>
        
        <div style="width: 20px;"></div>
    </header>

    <main>
        <h1>Detalhes da Fanfic</h1>
        
        <form id="formPostagem" onsubmit="publicarFanfic(event)">
            <div class="form-group">
                <label for="titulo">Título da História</label>
                <input type="text" id="titulo" placeholder="Dê um título cativante..." required oninput="atualizarPreview()">
            </div>

            <div class="form-group file-upload-wrapper">
                <label for="capaArquivo">Imagem de Capa (Galeria)</label>
                <input type="file" id="capaArquivo" accept="image/*" onchange="carregarImagemPreview(event)">
            </div>

            <div class="form-group">
                <label>Pré-visualização do Card</label>
                <div class="preview-container">
                    <img id="previewImg" class="preview-image" alt="Capa da Fanfic">
                    <div class="preview-info">
                        <strong id="previewTitulo" style="color: var(--primary-color);">Título da História</strong>
                        <span id="previewAutor" style="color: #777; display: none;">Por Autor(a)</span>
                        <span style="font-size: 0.8rem; opacity: 0.7;">Exemplo de como aparecerá para os leitores.</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="qtdCapitulos">Quantidade de Capítulos (Máximo 21)</label>
                <input type="number" id="qtdCapitulos" min="1" max="21" value="1" oninput="gerarAbasCapitulos()" required>
            </div>

            <div class="toptabs-container" id="toptabsContainer"></div>

            <div class="form-group">
                <label id="labelTituloCap" for="tituloCapAtivo">Título do Capítulo 1</label>
                <input type="text" id="tituloCapAtivo" placeholder="Ex: O Início" required oninput="salvarCapituloAtual()">
            </div>

            <div class="form-group">
                <label id="labelConteudoCap" for="conteudoCapAtivo">Conteúdo do Capítulo 1</label>
                <textarea id="conteudoCapAtivo" placeholder="Cole aqui..." required oninput="salvarCapituloAtual()"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-publish">Publicar História</button>
            </div>
        </form>
    </main>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

        // ===================== SESSÃO DO USUÁRIO (igual Drive / página principal) =====================
        let currentUserData = {
            pubkey: '',
            privateKey: null,
            privateKeyHex: '',
            nickname: '',
            avatarUrl: ''
        };

        function loadSessionFromNostr() {
            try {
                const session = localStorage.getItem('nostr_session');
                if (!session) return;
                const parsed = JSON.parse(session);
                if (!parsed.privateKeyHex || !parsed.pubkey) return;

                currentUserData.privateKey = hexToBytes(parsed.privateKeyHex);
                currentUserData.privateKeyHex = parsed.privateKeyHex;
                currentUserData.pubkey = parsed.pubkey;
                currentUserData.nickname = (parsed.nickname || '').replace(/^@/, '');
                currentUserData.avatarUrl = parsed.avatarUrl || '';
            } catch (e) {
                console.error('Erro ao carregar sessão Nostr:', e);
            }
        }

        function isUserLoggedIn() {
            return !!(currentUserData.privateKey && currentUserData.pubkey);
        }

        loadSessionFromNostr();

        // ===================== UPLOAD DE ARQUIVO (mesmo protocolo do Drive) =====================
        const UPLOAD_URL = 'https://nostr.build/api/v2/upload/files';
        const BLOSSOM_SERVERS = [
            'https://blossom.primal.net',
            'https://cdn.satellite.earth',
            'https://blossom.band',
            'https://nostr.download'
        ];

        async function createNip98AuthHeader(url, method, privateKeyBytes) {
            const signed = NostrTools.finalizeEvent({
                kind: 27235,
                created_at: Math.floor(Date.now() / 1000),
                tags: [['u', url], ['method', method.toUpperCase()]],
                content: ''
            }, privateKeyBytes);
            return 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(signed))));
        }

        async function sha256Hex(buffer) {
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function createBlossomAuthHeader(fileSha256, privateKeyBytes) {
            const now = Math.floor(Date.now() / 1000);
            const signed = NostrTools.finalizeEvent({
                kind: 24242,
                created_at: now,
                tags: [['t', 'upload'], ['x', fileSha256], ['expiration', String(now + 120)]],
                content: ''
            }, privateKeyBytes);
            return 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(signed))));
        }

        function extractUploadUrl(data) {
            if (!data) return '';
            if (data.status === 'success' && Array.isArray(data.data) && data.data[0]) {
                return data.data[0].url || data.data[0].download_url || '';
            }
            if (data.url) return data.url;
            if (data.nip94_event && Array.isArray(data.nip94_event.tags)) {
                const urlTag = data.nip94_event.tags.find(t => t[0] === 'url');
                if (urlTag && urlTag[1]) return urlTag[1];
            }
            if (Array.isArray(data.data) && data.data[0] && data.data[0].url) return data.data[0].url;
            return '';
        }

        async function uploadViaBlossom(arrayBuffer, privateKeyBytes) {
            const hash = await sha256Hex(arrayBuffer);
            const auth = await createBlossomAuthHeader(hash, privateKeyBytes);
            const errors = [];

            for (const base of BLOSSOM_SERVERS) {
                try {
                    const endpoint = base.replace(/\/$/, '') + '/upload';
                    const res = await fetch(endpoint, {
                        method: 'PUT',
                        headers: {
                            'Authorization': auth,
                            'Content-Type': 'application/octet-stream'
                        },
                        body: arrayBuffer
                    });
                    const text = await res.text();
                    let data = null;
                    try { data = JSON.parse(text); } catch (_) {}

                    if (res.ok) {
                        let url = '';
                        if (data) {
                            url = data.url || '';
                            if (!url && data.nip94_event && Array.isArray(data.nip94_event.tags)) {
                                const t = data.nip94_event.tags.find(x => x[0] === 'url');
                                if (t) url = t[1];
                            }
                        }
                        if (!url) url = base.replace(/\/$/, '') + '/' + hash;
                        return url;
                    }
                    errors.push(base + ': ' + ((data && data.message) || (res.status + ' ' + text.slice(0, 80))));
                } catch (e) {
                    errors.push(base + ': ' + (e.message || e));
                }
            }
            throw new Error('Blossom falhou: ' + errors.join(' | '));
        }

        // Upload público da capa (sem criptografia, para qualquer um poder ver)
        async function uploadCoverImage(file) {
            if (!isUserLoggedIn()) {
                throw new Error('Você precisa estar logado para enviar a capa.');
            }

            const arrayBuffer = await file.arrayBuffer();

            // 1. Tenta nostr.build
            try {
                const formData = new FormData();
                formData.append('fileToUpload', file);

                const authHeader = await createNip98AuthHeader(UPLOAD_URL, 'POST', currentUserData.privateKey);
                const response = await fetch(UPLOAD_URL, {
                    method: 'POST',
                    headers: { 'Authorization': authHeader },
                    body: formData
                });

                const text = await response.text();
                let data = null;
                try { data = JSON.parse(text); } catch (_) {}

                if (response.ok && data && data.status !== 'error') {
                    const url = extractUploadUrl(data);
                    if (url) return url;
                }
            } catch (e) {
                console.warn('nostr.build falhou, tentando Blossom...', e);
            }

            // 2. Fallback Blossom
            return await uploadViaBlossom(arrayBuffer, currentUserData.privateKey);
        }

        // ===================== RESTANTE DO FORMULÁRIO =====================
        let imagemBase64Temp = '';
        let dadosCapitulos = [{ titulo: '', conteudo: '' }];
        let capituloAtivo = 0;

        const RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://relay.nostr.band',
            'wss://nostr.wine',
            'wss://relay.snort.social'
        ];

        function gerarAbasCapitulos() {
            const qtdInput = parseInt(document.getElementById('qtdCapitulos').value) || 1;
            const qtd = Math.max(1, Math.min(21, qtdInput));

            while (dadosCapitulos.length < qtd) {
                dadosCapitulos.push({ titulo: '', conteudo: '' });
            }
            if (dadosCapitulos.length > qtd) {
                dadosCapitulos = dadosCapitulos.slice(0, qtd);
            }

            if (capituloAtivo >= qtd) {
                capituloAtivo = qtd - 1;
            }

            renderizarAbas();
            carregarCapituloNaTela(capituloAtivo);
        }

        function renderizarAbas() {
            const container = document.getElementById('toptabsContainer');
            container.innerHTML = '';

            dadosCapitulos.forEach((cap, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `tab-btn ${index === capituloAtivo ? 'active' : ''}`;
                btn.innerText = `Capítulo ${index + 1}`;
                btn.onclick = () => mudarCapitulo(index);
                container.appendChild(btn);
            });
        }

        function salvarCapituloAtual() {
            dadosCapitulos[capituloAtivo].titulo = document.getElementById('tituloCapAtivo').value;
            dadosCapitulos[capituloAtivo].conteudo = document.getElementById('conteudoCapAtivo').value;
        }

        function mudarCapitulo(index) {
            salvarCapituloAtual();
            capituloAtivo = index;
            renderizarAbas();
            carregarCapituloNaTela(capituloAtivo);
        }

        function carregarCapituloNaTela(index) {
            document.getElementById('tituloCapAtivo').value = dadosCapitulos[index].titulo;
            document.getElementById('conteudoCapAtivo').value = dadosCapitulos[index].conteudo;
            document.getElementById('labelTituloCap').innerText = `Título do Capítulo ${index + 1}`;
            document.getElementById('labelConteudoCap').innerText = `Conteúdo do Capítulo ${index + 1}`;
        }

        window.onload = function() {
            gerarAbasCapitulos();
        };

        function atualizarPreview() {
            const titulo = document.getElementById('titulo').value;
            document.getElementById('previewTitulo').innerText = titulo ? titulo : "Título da História";
        }

        function carregarImagemPreview(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagemBase64Temp = e.target.result;
                    const imgElement = document.getElementById('previewImg');
                    imgElement.src = imagemBase64Temp;
                    imgElement.style.display = 'block';
                };
                reader.readAsDataURL(arquivo);
            }
        }

        // ===================== PUBLICAÇÃO =====================
        async function publicarNoNostr(fanfic) {
            if (!isUserLoggedIn()) {
                throw new Error('Você precisa estar logado com sua chave Nostr.\nFaça login na página principal primeiro.');
            }

            const content = JSON.stringify({
                type: 'LoreSpaceFics',
                ...fanfic
            });

            const eventTemplate = {
                kind: 1,
                created_at: Math.floor(Date.now() / 1000),
                tags: [
                    ['t', 'LoreSpaceFics'],
                    ['client', 'LoreSpaceFics']
                ],
                content: content
            };

            const signedEvent = NostrTools.finalizeEvent(eventTemplate, currentUserData.privateKey);

            const results = await Promise.allSettled(
                RELAYS.map(relayUrl => publicarEmRelay(relayUrl, signedEvent))
            );

            const sucessos = results.filter(r => r.status === 'fulfilled').length;

            if (sucessos === 0) {
                throw new Error('Não foi possível publicar em nenhum relay.');
            }

            return { signedEvent, sucessos, total: RELAYS.length };
        }

        function publicarEmRelay(relayUrl, event) {
            return new Promise((resolve, reject) => {
                const ws = new WebSocket(relayUrl);
                const timeout = setTimeout(() => {
                    ws.close();
                    reject(new Error('Timeout'));
                }, 8000);

                ws.onopen = () => {
                    ws.send(JSON.stringify(['EVENT', event]));
                };

                ws.onmessage = (msg) => {
                    try {
                        const data = JSON.parse(msg.data);
                        if (data[0] === 'OK' && data[1] === event.id) {
                            clearTimeout(timeout);
                            ws.close();
                            if (data[2] === true) {
                                resolve(true);
                            } else {
                                reject(new Error(data[3] || 'Relay rejeitou o evento'));
                            }
                        }
                    } catch (e) {}
                };

                ws.onerror = () => {
                    clearTimeout(timeout);
                    reject(new Error('Erro de conexão'));
                };
            });
        }

        window.publicarFanfic = async function(event) {
            event.preventDefault();
            salvarCapituloAtual();

            const btn = document.querySelector('.btn-publish');
            const textoOriginal = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Publicando...';

            try {
                if (!isUserLoggedIn()) {
                    throw new Error('Você precisa estar logado com sua chave Nostr.');
                }

                // ===== UPLOAD DA CAPA =====
                let capaUrl = '';
                const capaInput = document.getElementById('capaArquivo');
                const capaFile = capaInput.files && capaInput.files[0];

                if (capaFile) {
                    btn.innerText = 'Enviando capa...';
                    capaUrl = await uploadCoverImage(capaFile);
                }

                const capitulosFormatados = dadosCapitulos.map((cap, idx) => ({
                    numero: idx + 1,
                    titulo: cap.titulo,
                    conteudo: cap.conteudo
                }));

                const autor = currentUserData.nickname || 'Anônimo';

                const fanfic = {
                    id: Date.now(),
                    titulo: document.getElementById('titulo').value,
                    autor: autor,
                    capa: capaUrl,               // <-- agora é URL pública
                    capitulos: capitulosFormatados,
                    data: new Date().toLocaleDateString()
                };

                // Continua salvando no localStorage
                let listaFanfics = JSON.parse(localStorage.getItem('minhas_fanfics')) || [];
                listaFanfics.push(fanfic);
                localStorage.setItem('minhas_fanfics', JSON.stringify(listaFanfics));

                // Publica no Nostr
                btn.innerText = 'Publicando no Nostr...';
                const resultado = await publicarNoNostr(fanfic);

                alert(`Fanfic publicada com sucesso!\n\nAutor: ${autor}\nCapa: ${capaUrl ? 'enviada' : 'sem capa'}\nEnviada para ${resultado.sucessos} de ${resultado.total} relays.\nTag: LoreSpaceFics`);

                // Limpa o formulário
                document.getElementById('formPostagem').reset();
                document.getElementById('previewImg').style.display = 'none';
                imagemBase64Temp = '';
                dadosCapitulos = [{ titulo: '', conteudo: '' }];
                capituloAtivo = 0;
                document.getElementById('qtdCapitulos').value = 1;
                atualizarPreview();
                gerarAbasCapitulos();

            } catch (err) {
                console.error(err);
                alert('Erro ao publicar: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = textoOriginal;
            }
        };
    </script>
</body>
</html>
