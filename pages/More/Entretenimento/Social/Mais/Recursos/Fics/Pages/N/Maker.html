<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrever Fanfic</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color:#f8f9fa; --text-color:#333; --card-bg:#fff; --primary-color:#8A2BE2; --border-color:#e0e0e0; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Roboto',sans-serif; }
        body { background:var(--bg-color); color:var(--text-color); display:flex; flex-direction:column; min-height:100vh; }
        header { background:var(--card-bg); border-bottom:1px solid var(--border-color); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:1.3rem; font-weight:700; color:var(--primary-color); display:flex; align-items:center; gap:8px; }
        main { flex:1; max-width:700px; width:90%; margin:30px auto; background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:30px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        h1 { font-size:1.5rem; margin-bottom:25px; border-bottom:2px solid var(--primary-color); padding-bottom:10px; display:inline-block; }
        .form-group { margin-bottom:20px; display:flex; flex-direction:column; gap:8px; }
        label { font-weight:500; font-size:.95rem; }
        input[type="text"], input[type="number"], textarea { padding:12px; border:1px solid var(--border-color); border-radius:6px; font-size:1rem; outline:none; }
        input:focus, textarea:focus { border-color:var(--primary-color); }
        textarea { resize:vertical; height:250px; line-height:1.5; }
        input[type="file"] { padding:10px; border:1px dashed var(--border-color); border-radius:6px; background:var(--bg-color); cursor:pointer; }
        .preview-container { margin-top:15px; border:1px dashed var(--border-color); border-radius:6px; padding:15px; background:var(--bg-color); display:flex; align-items:center; gap:15px; }
        .preview-image { width:80px; height:110px; object-fit:cover; border-radius:4px; background:#ddd; display:none; }
        .toptabs-container { display:flex; gap:24px; overflow-x:auto; margin-bottom:20px; border-bottom:1px solid var(--border-color); scrollbar-width:none; }
        .toptabs-container::-webkit-scrollbar { display:none; }
        .tab-btn { background:none; border:none; padding:10px 0; font-size:1rem; font-weight:500; cursor:pointer; color:#888; position:relative; }
        .tab-btn.active { color:var(--text-color); font-weight:700; }
        .tab-btn.active::after { content:''; position:absolute; bottom:-1px; left:0; width:100%; height:2px; background:var(--text-color); }
        .btn-publish { background:var(--primary-color); color:#fff; border:none; padding:14px 48px; border-radius:50px; font-weight:600; cursor:pointer; font-size:1.05rem; width:100%; max-width:350px; }
        .btn-publish:hover { background:#7b24cf; }
        .btn-nav-icon { color:var(--text-color); font-size:1.2rem; text-decoration:none; }
        .form-actions { display:flex; justify-content:center; margin-top:30px; }
        @media (max-width:600px) { main { width:100%; margin:0; border-radius:0; padding:20px 15px; } header { padding:12px 15px; } }
    </style>
</head>
<body>
    <header>
        <a href="../../../fics.html" class="btn-nav-icon"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="logo"><i class="fa-solid fa-pen-nib"></i> Criar Nova História</div>
        <div style="width:20px"></div>
    </header>
    <main>
        <h1>Detalhes da Fanfic</h1>
        <form id="formPostagem">
            <div class="form-group">
                <label for="titulo">Título da História</label>
                <input type="text" id="titulo" placeholder="Dê um título cativante..." required>
            </div>
            <div class="form-group">
                <label for="capaArquivo">Imagem de Capa</label>
                <input type="file" id="capaArquivo" accept="image/*">
            </div>
            <div class="form-group">
                <label>Pré-visualização</label>
                <div class="preview-container">
                    <img id="previewImg" class="preview-image" alt="Capa">
                    <div><strong id="previewTitulo" style="color:var(--primary-color)">Título da História</strong></div>
                </div>
            </div>
            <div class="form-group">
                <label for="qtdCapitulos">Quantidade de Capítulos (Máx. 21)</label>
                <input type="number" id="qtdCapitulos" min="1" max="21" value="1" required>
            </div>
            <div class="toptabs-container" id="toptabsContainer"></div>
            <div class="form-group">
                <label id="labelTituloCap" for="tituloCapAtivo">Título do Capítulo 1</label>
                <input type="text" id="tituloCapAtivo" placeholder="Ex: O Início" required>
            </div>
            <div class="form-group">
                <label id="labelConteudoCap" for="conteudoCapAtivo">Conteúdo do Capítulo 1</label>
                <textarea id="conteudoCapAtivo" placeholder="Cole o texto..." required></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-publish" id="btnPublish">Publicar História</button>
            </div>
        </form>
    </main>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

        // ===== PROTOCOLO LoreSpace (3,6,9 + 7,4,3) =====
        const LS_SALT = 'LS-369-7423-v1';
        const LS_MARKER = 'ls369';
        const LS_TAG = ['t', 'x7k4m3'];

        async function deriveLsKey() {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(LS_SALT), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('369'), iterations: 84000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }
        async function encryptFanfic(obj) {
            const key = await deriveLsKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const plain = new TextEncoder().encode(JSON.stringify({ m: LS_MARKER, ...obj }));
            const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
            const packed = new Uint8Array(iv.length + cipher.byteLength);
            packed.set(iv, 0);
            packed.set(new Uint8Array(cipher), iv.length);
            let binary = '';
            for (let i = 0; i < packed.length; i += 0x8000) {
                binary += String.fromCharCode.apply(null, packed.subarray(i, i + 0x8000));
            }
            return btoa(binary);
        }

        let currentUserData = { pubkey: '', privateKey: null, nickname: '' };
        function loadSessionFromNostr() {
            try {
                const s = JSON.parse(localStorage.getItem('nostr_session') || '{}');
                if (!s.privateKeyHex || !s.pubkey) return;
                currentUserData.privateKey = hexToBytes(s.privateKeyHex);
                currentUserData.pubkey = s.pubkey;
                currentUserData.nickname = (s.nickname || '').replace(/^@/, '');
            } catch (_) {}
        }
        function isUserLoggedIn() { return !!(currentUserData.privateKey && currentUserData.pubkey); }
        loadSessionFromNostr();

        const UPLOAD_URL = 'https://nostr.build/api/v2/upload/files';
        const BLOSSOM_SERVERS = ['https://blossom.primal.net','https://cdn.satellite.earth','https://blossom.band','https://nostr.download'];
        const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://nostr.wine','wss://relay.snort.social'];

        async function createNip98AuthHeader(url, method, sk) {
            const signed = NostrTools.finalizeEvent({
                kind: 27235, created_at: Math.floor(Date.now()/1000),
                tags: [['u', url], ['method', method.toUpperCase()]], content: ''
            }, sk);
            return 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(signed))));
        }
        async function sha256Hex(buf) {
            const h = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
        }
        async function createBlossomAuthHeader(hash, sk) {
            const now = Math.floor(Date.now()/1000);
            const signed = NostrTools.finalizeEvent({
                kind: 24242, created_at: now,
                tags: [['t','upload'],['x',hash],['expiration',String(now+120)]], content: ''
            }, sk);
            return 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(signed))));
        }
        function extractUploadUrl(data) {
            if (!data) return '';
            if (data.status === 'success' && data.data?.[0]) return data.data[0].url || data.data[0].download_url || '';
            if (data.url) return data.url;
            if (data.nip94_event?.tags) {
                const t = data.nip94_event.tags.find(x => x[0] === 'url');
                if (t) return t[1];
            }
            return data.data?.[0]?.url || '';
        }
        async function uploadViaBlossom(buf, sk) {
            const hash = await sha256Hex(buf);
            const auth = await createBlossomAuthHeader(hash, sk);
            for (const base of BLOSSOM_SERVERS) {
                try {
                    const res = await fetch(base.replace(/\/$/,'') + '/upload', {
                        method: 'PUT', headers: { Authorization: auth, 'Content-Type': 'application/octet-stream' }, body: buf
                    });
                    const text = await res.text();
                    let data = null; try { data = JSON.parse(text); } catch (_) {}
                    if (res.ok) {
                        let url = data?.url || '';
                        if (!url && data?.nip94_event?.tags) {
                            const t = data.nip94_event.tags.find(x => x[0] === 'url');
                            if (t) url = t[1];
                        }
                        if (!url) url = base.replace(/\/$/,'') + '/' + hash;
                        return url;
                    }
                } catch (_) {}
            }
            throw new Error('Falha no upload da capa');
        }
        async function uploadCoverImage(file) {
            if (!isUserLoggedIn()) throw new Error('Faça login primeiro');
            const buf = await file.arrayBuffer();
            try {
                const fd = new FormData();
                fd.append('fileToUpload', file);
                const auth = await createNip98AuthHeader(UPLOAD_URL, 'POST', currentUserData.privateKey);
                const res = await fetch(UPLOAD_URL, { method: 'POST', headers: { Authorization: auth }, body: fd });
                const text = await res.text();
                let data = null; try { data = JSON.parse(text); } catch (_) {}
                if (res.ok && data?.status !== 'error') {
                    const url = extractUploadUrl(data);
                    if (url) return url;
                }
            } catch (_) {}
            return uploadViaBlossom(buf, currentUserData.privateKey);
        }

        let dadosCapitulos = [{ titulo: '', conteudo: '' }];
        let capituloAtivo = 0;

        function gerarAbasCapitulos() {
            const qtd = Math.max(1, Math.min(21, parseInt(document.getElementById('qtdCapitulos').value) || 1));
            while (dadosCapitulos.length < qtd) dadosCapitulos.push({ titulo: '', conteudo: '' });
            if (dadosCapitulos.length > qtd) dadosCapitulos = dadosCapitulos.slice(0, qtd);
            if (capituloAtivo >= qtd) capituloAtivo = qtd - 1;
            renderizarAbas();
            carregarCapituloNaTela(capituloAtivo);
        }
        function renderizarAbas() {
            const c = document.getElementById('toptabsContainer');
            c.innerHTML = '';
            dadosCapitulos.forEach((_, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'tab-btn' + (i === capituloAtivo ? ' active' : '');
                b.textContent = 'Capítulo ' + (i + 1);
                b.onclick = () => mudarCapitulo(i);
                c.appendChild(b);
            });
        }
        function salvarCapituloAtual() {
            dadosCapitulos[capituloAtivo].titulo = document.getElementById('tituloCapAtivo').value;
            dadosCapitulos[capituloAtivo].conteudo = document.getElementById('conteudoCapAtivo').value;
        }
        function mudarCapitulo(i) {
            salvarCapituloAtual();
            capituloAtivo = i;
            renderizarAbas();
            carregarCapituloNaTela(i);
        }
        function carregarCapituloNaTela(i) {
            document.getElementById('tituloCapAtivo').value = dadosCapitulos[i].titulo || '';
            document.getElementById('conteudoCapAtivo').value = dadosCapitulos[i].conteudo || '';
            document.getElementById('labelTituloCap').textContent = 'Título do Capítulo ' + (i + 1);
            document.getElementById('labelConteudoCap').textContent = 'Conteúdo do Capítulo ' + (i + 1);
        }
        function atualizarPreview() {
            document.getElementById('previewTitulo').textContent = document.getElementById('titulo').value || 'Título da História';
        }
        function carregarImagemPreview(e) {
            const f = e.target.files?.[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                const img = document.getElementById('previewImg');
                img.src = ev.target.result;
                img.style.display = 'block';
            };
            r.readAsDataURL(f);
        }

        function publicarEmRelay(url, event) {
            return new Promise((resolve, reject) => {
                const ws = new WebSocket(url);
                const t = setTimeout(() => { ws.close(); reject(); }, 8000);
                ws.onopen = () => ws.send(JSON.stringify(['EVENT', event]));
                ws.onmessage = msg => {
                    try {
                        const d = JSON.parse(msg.data);
                        if (d[0] === 'OK' && d[1] === event.id) {
                            clearTimeout(t); ws.close();
                            d[2] === true ? resolve() : reject();
                        }
                    } catch (_) {}
                };
                ws.onerror = () => { clearTimeout(t); reject(); };
            });
        }

        document.getElementById('qtdCapitulos').addEventListener('input', gerarAbasCapitulos);
        document.getElementById('titulo').addEventListener('input', atualizarPreview);
        document.getElementById('capaArquivo').addEventListener('change', carregarImagemPreview);
        document.getElementById('tituloCapAtivo').addEventListener('input', salvarCapituloAtual);
        document.getElementById('conteudoCapAtivo').addEventListener('input', salvarCapituloAtual);

        document.getElementById('formPostagem').addEventListener('submit', async e => {
            e.preventDefault();
            salvarCapituloAtual();
            const btn = document.getElementById('btnPublish');
            const orig = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Publicando...';
            try {
                if (!isUserLoggedIn()) throw new Error('Faça login com sua chave Nostr');
                let capaUrl = '';
                const capaFile = document.getElementById('capaArquivo').files?.[0];
                if (capaFile) {
                    btn.textContent = 'Enviando capa...';
                    capaUrl = await uploadCoverImage(capaFile);
                }
                const fanfic = {
                    titulo: document.getElementById('titulo').value,
                    autor: currentUserData.nickname || 'Anônimo',
                    capa: capaUrl,
                    capitulos: dadosCapitulos.map((c, i) => ({ numero: i + 1, titulo: c.titulo, conteudo: c.conteudo })),
                    data: new Date().toLocaleDateString()
                };
                btn.textContent = 'Criptografando...';
                const encrypted = await encryptFanfic(fanfic);
                const eventTemplate = {
                    kind: 1,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [LS_TAG, ['client', 'ls369']],
                    content: encrypted
                };
                const signed = NostrTools.finalizeEvent(eventTemplate, currentUserData.privateKey);
                btn.textContent = 'Publicando no Nostr...';
                const results = await Promise.allSettled(RELAYS.map(u => publicarEmRelay(u, signed)));
                const ok = results.filter(r => r.status === 'fulfilled').length;
                if (!ok) throw new Error('Nenhum relay aceitou o evento');
                alert('Fanfic publicada com sucesso (criptografada)!\nRelays: ' + ok + '/' + RELAYS.length);
                document.getElementById('formPostagem').reset();
                document.getElementById('previewImg').style.display = 'none';
                dadosCapitulos = [{ titulo: '', conteudo: '' }];
                capituloAtivo = 0;
                document.getElementById('qtdCapitulos').value = 1;
                atualizarPreview();
                gerarAbasCapitulos();
            } catch (err) {
                console.error(err);
                alert('Erro: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = orig;
            }
        });
        gerarAbasCapitulos();
    </script>
</body>
</html>
