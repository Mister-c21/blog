<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escrever Fanfic</title>
    <!-- Fonte Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #8A2BE2; /* Violeta */
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topo simples */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Container do Formulário */
        main {
            flex: 1;
            max-width: 700px;
            width: 90%;
            margin: 30px auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="number"], textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            height: 250px;
            line-height: 1.5;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="file"] {
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="file"]:hover {
            border-color: var(--primary-color);
        }

        /* Estilo da Pré-visualização */
        .preview-container {
            margin-top: 15px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 15px;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .preview-image {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #ddd;
            display: none;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9rem;
        }

        /* Container Toptabs Horizontal estilo TikTok */
        .toptabs-container {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none; /* Firefox */
        }

        .toptabs-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            color: #888888;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--text-color);
            font-weight: 700;
        }

        /* Indicador de aba ativa no estilo TikTok (linha inferior) */
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-publish {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 48px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.05rem;
            width: 100%;
            max-width: 350px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-publish:hover {
            background-color: #7b24cf;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        }

        .btn-publish:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.4);
        }

        /* Estilo do botão de navegação (apenas ícone à esquerda) */
        .btn-nav-icon {
            color: var(--text-color);
            font-size: 1.2rem;
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .btn-nav-icon:hover {
            color: var(--primary-color);
        }

        /* Ajustes para dispositivos móveis */
        @media (max-width: 600px) {
            main {
                width: 100%;
                margin: 0;
                border-radius: 0;
                border-left: none;
                border-right: none;
                padding: 20px 15px;
                min-height: calc(100vh - 60px);
            }
            header {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- Botão de navegação (ícone à esquerda) -->
        <a href="../../../fics.html" class="btn-nav-icon" title="Voltar / Ir para outra página">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        
        <div class="logo">
            <i class="fa-solid fa-pen-nib"></i> Criar Nova História
        </div>
        
        <!-- Elemento vazio apenas para manter o alinhamento central da logo se necessário, ou oculto -->
        <div style="width: 20px;"></div>
    </header>

    <main>
        <h1>Detalhes da Fanfic</h1>
        
        <form id="formPostagem" onsubmit="publicarFanfic(event)">
            <div class="form-group">
                <label for="titulo">Título da História</label>
                <input type="text" id="titulo" placeholder="Dê um título cativante..." required oninput="atualizarPreview()">
            </div>

            <div class="form-group file-upload-wrapper">
                <label for="capaArquivo">Imagem de Capa (Galeria)</label>
                <input type="file" id="capaArquivo" accept="image/*" onchange="carregarImagemPreview(event)">
            </div>

            <!-- Bloco de Pré-visualização -->
            <div class="form-group">
                <label>Pré-visualização do Card</label>
                <div class="preview-container">
                    <img id="previewImg" class="preview-image" alt="Capa da Fanfic">
                    <div class="preview-info">
                        <strong id="previewTitulo" style="color: var(--primary-color);">Título da História</strong>
                        <span id="previewAutor" style="color: #777; display: none;">Por Autor(a)</span>
                        <span style="font-size: 0.8rem; opacity: 0.7;">Exemplo de como aparecerá para os leitores.</span>
                    </div>
                </div>
            </div>

            <!-- Seleção de Quantidade de Capítulos -->
            <div class="form-group">
                <label for="qtdCapitulos">Quantidade de Capítulos (Máximo 21)</label>
                <input type="number" id="qtdCapitulos" min="1" max="21" value="1" oninput="gerarAbasCapitulos()" required>
            </div>

            <!-- Barra Horizontal de Toptabs estilo TikTok -->
            <div class="toptabs-container" id="toptabsContainer"></div>

            <!-- Campos do Capítulo Ativo -->
            <div class="form-group">
                <label id="labelTituloCap" for="tituloCapAtivo">Título do Capítulo 1</label>
                <input type="text" id="tituloCapAtivo" placeholder="Ex: O Início" required oninput="salvarCapituloAtual()">
            </div>

            <div class="form-group">
                <label id="labelConteudoCap" for="conteudoCapAtivo">Conteúdo do Capítulo 1</label>
                <textarea id="conteudoCapAtivo" placeholder="Cole aqui..." required oninput="salvarCapituloAtual()"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-publish">Publicar História</button>
            </div>
        </form>
    </main>

    <script>
        let imagemBase64Temp = '';
        let dadosCapitulos = [{ titulo: '', conteudo: '' }];
        let capituloAtivo = 0;

        function gerarAbasCapitulos() {
            const qtdInput = parseInt(document.getElementById('qtdCapitulos').value) || 1;
            const qtd = Math.max(1, Math.min(21, qtdInput));

            // Ajusta o array de dados mantendo o que já foi digitado se possível
            while (dadosCapitulos.length < qtd) {
                dadosCapitulos.push({ titulo: '', conteudo: '' });
            }
            if (dadosCapitulos.length > qtd) {
                dadosCapitulos = dadosCapitulos.slice(0, qtd);
            }

            if (capituloAtivo >= qtd) {
                capituloAtivo = qtd - 1;
            }

            renderizarAbas();
            carregarCapituloNaTela(capituloAtivo);
        }

        function renderizarAbas() {
            const container = document.getElementById('toptabsContainer');
            container.innerHTML = '';

            dadosCapitulos.forEach((cap, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `tab-btn ${index === capituloAtivo ? 'active' : ''}`;
                btn.innerText = `Capítulo ${index + 1}`;
                btn.onclick = () => mudarCapitulo(index);
                container.appendChild(btn);
            });
        }

        function salvarCapituloAtual() {
            dadosCapitulos[capituloAtivo].titulo = document.getElementById('tituloCapAtivo').value;
            dadosCapitulos[capituloAtivo].conteudo = document.getElementById('conteudoCapAtivo').value;
        }

        function mudarCapitulo(index) {
            salvarCapituloAtual();
            capituloAtivo = index;
            renderizarAbas();
            carregarCapituloNaTela(capituloAtivo);
        }

        function carregarCapituloNaTela(index) {
            document.getElementById('tituloCapAtivo').value = dadosCapitulos[index].titulo;
            document.getElementById('conteudoCapAtivo').value = dadosCapitulos[index].conteudo;
            document.getElementById('labelTituloCap').innerText = `Título do Capítulo ${index + 1}`;
            document.getElementById('labelConteudoCap').innerText = `Conteúdo do Capítulo ${index + 1}`;
        }

        window.onload = function() {
            gerarAbasCapitulos();
        };

        function atualizarPreview() {
            const titulo = document.getElementById('titulo').value;
            document.getElementById('previewTitulo').innerText = titulo ? titulo : "Título da História";
        }

        function carregarImagemPreview(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagemBase64Temp = e.target.result;
                    const imgElement = document.getElementById('previewImg');
                    imgElement.src = imagemBase64Temp;
                    imgElement.style.display = 'block';
                };
                reader.readAsDataURL(arquivo);
            }
        }

        function publicarFanfic(event) {
            event.preventDefault();
            salvarCapituloAtual();

            const capitulosFormatados = dadosCapitulos.map((cap, idx) => ({
                numero: idx + 1,
                titulo: cap.titulo,
                conteudo: cap.conteudo
            }));

            const fanfic = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value,
                autor: 'Anônimo',
                capa: imagemBase64Temp,
                capitulos: capitulosFormatados,
                data: new Date().toLocaleDateString()
            };

            let listaFanfics = JSON.parse(localStorage.getItem('minhas_fanfics')) || [];
            listaFanfics.push(fanfic);
            
            localStorage.setItem('minhas_fanfics', JSON.stringify(listaFanfics));

            alert('Fanfic publicada com sucesso com todos os capítulos!');
            document.getElementById('formPostagem').reset();
            document.getElementById('previewImg').style.display = 'none';
            imagemBase64Temp = '';
            dadosCapitulos = [{ titulo: '', conteudo: '' }];
            capituloAtivo = 0;
            document.getElementById('qtdCapitulos').value = 1;
            atualizarPreview();
            gerarAbasCapitulos();
        }
    </script>
</body>
</html>
