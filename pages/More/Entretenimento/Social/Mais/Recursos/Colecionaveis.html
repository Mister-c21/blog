<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de Figurinhas - Curts</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFFFFF;         /* Cor Principal (Branco) */
            --secondary: #7C3AED;       /* Cor Secundária (Violeta) */
            --secondary-hover: #6D28D9; 
            --bg-color: #F8FAFC;        /* Fundo limpo e suave */
            --text-main: #1E293B;       
            --text-muted: #64748B;      
            --border-color: #E2E8F0;    
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container Principal do App */
        .app-wrapper {
            width: 100%;
            max-width: 480px; /* Padrão Mobile por padrão */
            background-color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.04);
        }

        /* Topo / Header */
        header {
            padding: 16px 20px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        header h2 {
            font-size: 1.15rem;
            color: var(--secondary);
            font-weight: 700;
        }

        /* Conteúdo Principal */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Banner de Progresso */
        .stats-banner {
            background: linear-gradient(135deg, #EDE9FE 0%, #F5F3FF 100%);
            border: 1px solid #DDD6FE;
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stats-info h3 {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .stats-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stats-badge {
            background: var(--secondary);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .section-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Grid de Figurinhas Mais Verticalizadas */
        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .sticker-card {
            background: var(--primary);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden; /* Garante que a imagem preencha os cantos arredondados */
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 260px; /* Aumentado para dar o formato bem verticalizado */
        }

        .sticker-card.collected {
            border-color: #DDD6FE;
        }

        .sticker-card.collected.epic {
            border-color: #7C3AED;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
        }

        .sticker-card.missing {
            border-style: dashed;
            border-color: #CBD5E1;
            background: #F1F5F9;
        }

        /* Imagem preenchendo todo o espaço do card */
        .sticker-img-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #E2E8F0;
            z-index: 1;
        }

        .sticker-card.missing .sticker-img-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F1F5F9;
        }

        .sticker-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Faz a imagem ocupar 100% sem distorcer proporcionalmente */
        }

        .sticker-card.missing .sticker-img-container i {
            font-size: 2.5rem;
            color: #94A3B8;
        }

        /* Sobreposição de Gradiente Escuro na base para legibilidade dos textos sobre a imagem */
        .sticker-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        .sticker-number {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #FFFFFF;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 3;
        }

        .status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            color: #FFFFFF;
        }

        .sticker-card.collected.epic .status-tag {
            background: var(--secondary);
            color: var(--primary);
        }

        /* Detalhes posicionados na parte inferior sobre a imagem */
        .sticker-details {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 3;
            color: #FFFFFF;
        }

        .sticker-details h4 {
            font-size: 0.95rem;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .sticker-details p {
            font-size: 0.75rem;
            color: #E2E8F0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Cores de texto customizadas para cards faltando */
        .sticker-card.missing .sticker-details h4,
        .sticker-card.missing .sticker-details p {
            color: var(--text-main);
            text-shadow: none;
            text-align: center;
        }

        .sticker-card.missing .sticker-details {
            position: relative;
            margin-top: auto;
            margin-bottom: 16px;
            z-index: 3;
        }

        /* ==========================================
           ADAPTAÇÃO UX PARA DESKTOP
           ========================================== */
        @media (min-width: 768px) {
            body {
                background-color: #EDE9FE;
                align-items: center;
                padding: 30px 0;
            }

            .app-wrapper {
                max-width: 650px;
                min-height: 85vh;
                border-radius: 20px;
                border: 1px solid var(--border-color);
                overflow: hidden;
            }

            .stickers-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }

            .sticker-card {
                height: 290px;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Topo -->
        <header>
            <h2>Álbum de Figurinhas</h2>
        </header>

        <!-- Conteúdo -->
        <div class="content">
            
            <!-- Banner de Progresso -->
            <div class="stats-banner">
                <div class="stats-info">
                    <h3>Coleção Oficial</h3>
                    <p>4 de 6 figurinhas coladas</p>
                </div>
                <div class="stats-badge">
                    <i class="fa-solid fa-layer-group"></i> 66%
                </div>
            </div>

            <div class="section-header">
                <span class="section-label">Figurinhas do Álbum</span>
                <span class="section-count">Colecionados</span>
            </div>

            <!-- Grid de Figurinhas -->
            <div class="stickers-grid">
                
                <!-- Figurinha 1 (Adquirida / Comum) -->
                <div class="sticker-card collected" onclick="alert('Figurinha #01: Aprendiz de Curts - Adquirida!')">
                    <span class="sticker-number">#01</span>
                    <span class="status-tag">Colada</span>
                    <div class="sticker-img-container">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Figurinha 1">
                    </div>
                    <div class="sticker-overlay"></div>
                    <div class="sticker-details">
                        <h4>Aprendiz</h4>
                        <p>Comum</p>
                    </div>
                </div>

                <!-- Figurinha 2 (Adquirida / Épica) -->
                <div class="sticker-card collected epic" onclick="alert('Figurinha #02 ÉPICA: Mestre da Magia - Rara!')">
                    <span class="sticker-number">#02 ✨</span>
                    <span class="status-tag">Épico</span>
                    <div class="sticker-img-container">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80" alt="Figurinha 2">
                    </div>
                    <div class="sticker-overlay"></div>
                    <div class="sticker-details">
                        <h4>Mestre Arcano</h4>
                        <p>2d 16h restantes</p>
                    </div>
                </div>

                <!-- Figurinha 3 (Adquirida / Comum) -->
                <div class="sticker-card collected" onclick="alert('Figurinha #03: Guardião do Feed - Adquirida!')">
                    <span class="sticker-number">#03</span>
                    <span class="status-tag">Colada</span>
                    <div class="sticker-img-container">
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80" alt="Figurinha 3">
                    </div>
                    <div class="sticker-overlay"></div>
                    <div class="sticker-details">
                        <h4>Guardião</h4>
                        <p>Comum</p>
                    </div>
                </div>

                <!-- Figurinha 4 (Adquirida / Comum) -->
                <div class="sticker-card collected" onclick="alert('Figurinha #04: Viajante Estelar - Adquirida!')">
                    <span class="sticker-number">#04</span>
                    <span class="status-tag">Colada</span>
                    <div class="sticker-img-container">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80" alt="Figurinha 4">
                    </div>
                    <div class="sticker-overlay"></div>
                    <div class="sticker-details">
                        <h4>Viajante</h4>
                        <p>Incomum</p>
                    </div>
                </div>

                <!-- Figurinha 5 (Faltante) -->
                <div class="sticker-card missing" onclick="alert('Figurinha #05 Faltante: Encontre pacotes na comunidade para colar!')">
                    <span class="sticker-number" style="background: rgba(0,0,0,0.1); color: var(--text-main);">#05</span>
                    <span class="status-tag" style="background: rgba(0,0,0,0.1); color: var(--text-main);">Faltando</span>
                    <div class="sticker-img-container">
                        <i class="fa-solid fa-question"></i>
                    </div>
                    <div class="sticker-details">
                        <h4>???</h4>
                        <p>Bloqueado</p>
                    </div>
                </div>

                <!-- Figurinha 6 (Faltante) -->
                <div class="sticker-card missing" onclick="alert('Figurinha #06 Faltante: Encontre pacotes na comunidade para colar!')">
                    <span class="sticker-number" style="background: rgba(0,0,0,0.1); color: var(--text-main);">#06</span>
                    <span class="status-tag" style="background: rgba(0,0,0,0.1); color: var(--text-main);">Faltando</span>
                    <div class="sticker-img-container">
                        <i class="fa-solid fa-question"></i>
                    </div>
                    <div class="sticker-details">
                        <h4>???</h4>
                        <p>Bloqueado</p>
                    </div>
                </div>

            </div>

        </div>
    </div>
</body>
</html>
