<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',
                        secondary: '#7C3AED',
                        secondaryDark: '#6D28D9',
                        darkBg: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-800 font-sans antialiased min-h-screen flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between">
        
        <div class="p-5 pb-10">
            
            <div class="flex items-center space-x-3 mb-6">
                <a href="../../Index.html" class="text-slate-700 text-lg hover:text-secondary transition flex items-center justify-center">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="text-xl font-bold tracking-wide">Ranking</h1>
            </div>

            <div class="flex space-x-2 mb-6">
                <button id="tab-all" type="button" class="bg-secondary text-white text-xs font-semibold px-5 py-2 rounded-full shadow-sm transition">
                    Todos
                </button>
                <button id="tab-friends" type="button" class="bg-slate-100 text-slate-600 text-xs font-semibold px-5 py-2 rounded-full hover:bg-slate-200 transition">
                    Amigos
                </button>
            </div>

            <div id="ranking-list" class="space-y-4">
                <p class="text-xs text-slate-400 text-center py-8">Carregando ranking da rede…</p>
            </div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

        const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.nostr.band', 'wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();
        const REWARDS_KIND = 30078;
        const REWARDS_D_TAG = 'violet-rewards-v1';
        const FALLBACK_AVATAR = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed || 'user')}`;

        let myPubkey = '';
        let rankingRows = [];      // ranking global
        let contactPubkeys = new Set(); // contatos (kind 3)
        let activeTab = 'all';     // 'all' | 'friends'

        function toNum(v, fallback) {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        }

        function loadMyPubkey() {
            try {
                const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
                myPubkey = session.pubkey || '';
            } catch (_) {
                myPubkey = '';
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function truncateName(name, max = 22) {
            const s = String(name || '');
            if (s.length <= max) return s;
            return s.slice(0, max - 1) + '…';
        }

        /**
         * Lista de contatos do usuário (NIP-02, kind 3).
         * Tags "p" = pubkeys seguidos.
         */
        async function fetchMyContacts() {
            contactPubkeys = new Set();
            if (!myPubkey) return contactPubkeys;

            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [3],
                    authors: [myPubkey],
                    limit: 5
                });
                if (!events || !events.length) return contactPubkeys;

                events.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
                const latest = events[0];
                (latest.tags || []).forEach(tag => {
                    if (tag[0] === 'p' && tag[1] && /^[0-9a-f]{64}$/i.test(tag[1])) {
                        contactPubkeys.add(tag[1].toLowerCase());
                    }
                });
            } catch (e) {
                console.error('Falha ao buscar contatos (kind 3):', e);
            }
            return contactPubkeys;
        }

        async function fetchRewardsRanking() {
            const events = await pool.querySync(RELAYS, {
                kinds: [REWARDS_KIND],
                '#d': [REWARDS_D_TAG],
                limit: 200
            });

            const byAuthor = new Map();

            (events || []).forEach(ev => {
                if (!ev || !ev.pubkey || !ev.content) return;
                let data = null;
                try {
                    data = JSON.parse(ev.content);
                } catch (_) {
                    return;
                }
                if (!data || data.v !== 1) return;

                const level = Math.max(1, Math.floor(toNum(data.level, 1)));
                const xp = Math.max(0, toNum(data.xp, 0));
                const updatedAt = toNum(data.updatedAt, (ev.created_at || 0) * 1000);

                const prev = byAuthor.get(ev.pubkey);
                if (!prev || updatedAt >= prev.updatedAt || (ev.created_at || 0) >= (prev.created_at || 0)) {
                    byAuthor.set(ev.pubkey, {
                        pubkey: ev.pubkey,
                        level,
                        xp,
                        updatedAt,
                        created_at: ev.created_at || 0,
                        name: '',
                        picture: ''
                    });
                }
            });

            return Array.from(byAuthor.values());
        }

        async function fetchProfiles(pubkeys) {
            if (!pubkeys.length) return new Map();
            const profiles = new Map();
            const chunkSize = 40;

            for (let i = 0; i < pubkeys.length; i += chunkSize) {
                const chunk = pubkeys.slice(i, i + chunkSize);
                try {
                    const events = await pool.querySync(RELAYS, {
                        kinds: [0],
                        authors: chunk,
                        limit: chunk.length * 3
                    });
                    const latestByAuthor = new Map();
                    (events || []).forEach(ev => {
                        const prev = latestByAuthor.get(ev.pubkey);
                        if (!prev || (ev.created_at || 0) > (prev.created_at || 0)) {
                            latestByAuthor.set(ev.pubkey, ev);
                        }
                    });
                    latestByAuthor.forEach((ev, pk) => {
                        let data = {};
                        try { data = JSON.parse(ev.content || '{}'); } catch (_) {}
                        const name = (data.display_name || data.name || '').trim().replace(/^@/, '');
                        const picture = data.picture || data.image || '';
                        profiles.set(pk, { name, picture });
                    });
                } catch (e) {
                    console.warn('Falha ao buscar perfis:', e);
                }
            }
            return profiles;
        }

        function sortRanking(rows) {
            return rows.slice().sort((a, b) => {
                if (b.level !== a.level) return b.level - a.level;
                if (b.xp !== a.xp) return b.xp - a.xp;
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });
        }

        function medalHtml(position) {
            if (position === 1) {
                return `<div class="w-8 flex justify-center text-amber-500 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            if (position === 2) {
                return `<div class="w-8 flex justify-center text-slate-400 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            if (position === 3) {
                return `<div class="w-8 flex justify-center text-amber-700 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            return `<div class="w-8 flex justify-center text-slate-700 font-bold text-xs">${position}º</div>`;
        }

        function borderClass(position) {
            if (position === 1) return 'border-2 border-secondary';
            if (position === 2) return 'border-2 border-slate-300';
            if (position === 3) return 'border-2 border-amber-700/50';
            return '';
        }

        function getVisibleRows() {
            if (activeTab === 'friends') {
                return rankingRows.filter(r => contactPubkeys.has(String(r.pubkey).toLowerCase()));
            }
            return rankingRows;
        }

        function renderRanking(rows) {
            const list = document.getElementById('ranking-list');
            if (!list) return;

            if (!rows.length) {
                if (activeTab === 'friends') {
                    if (!myPubkey) {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Faça login com sua conta Nostr para ver o ranking dos seus contatos.
                            </p>`;
                    } else if (contactPubkeys.size === 0) {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Você ainda não tem contatos na rede (lista kind 3 vazia).
                            </p>`;
                    } else {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Nenhum dos seus contatos aparece no ranking ainda.<br>
                                <span class="text-[10px]">Eles precisam resgatar XP em Recompensas.</span>
                            </p>`;
                    }
                } else {
                    list.innerHTML = `
                        <p class="text-xs text-slate-400 text-center py-8">
                            Nenhum usuário com recompensas na rede ainda.<br>
                            <span class="text-[10px]">Resgate XP na página de Recompensas para aparecer aqui.</span>
                        </p>`;
                }
                return;
            }

            let html = '';
            rows.forEach((u, idx) => {
                const pos = idx + 1;
                const name = truncateName(u.name || ('@' + u.pubkey.slice(0, 10) + '…'));
                const avatar = u.picture || FALLBACK_AVATAR(u.pubkey);
                const isMe = myPubkey && u.pubkey === myPubkey;
                const highlight = isMe ? ' ring-2 ring-secondary/40' : '';

                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl${highlight}">
                        <div class="flex items-center space-x-3">
                            ${medalHtml(pos)}
                            <div class="relative">
                                <div class="w-11 h-11 rounded-full bg-violet-200 overflow-hidden ${borderClass(pos)}">
                                    <img src="${escapeHtml(avatar)}" alt="Avatar" class="w-full h-full object-cover"
                                         onerror="this.onerror=null;this.src='${FALLBACK_AVATAR(u.pubkey)}'">
                                </div>
                                <span class="absolute -bottom-1 -right-1 bg-secondary text-white text-[9px] font-bold px-1 rounded-full border border-white">${u.level}</span>
                            </div>
                            <div>
                                <h3 class="text-xs font-bold text-slate-900">${escapeHtml(name)}${isMe ? ' <span class="text-secondary font-semibold">(você)</span>' : ''}</h3>
                                <div class="flex items-center space-x-3 mt-1 text-[10px] text-slate-500 font-medium">
                                    <span title="XP atual"><i class="fa-solid fa-bolt mr-1 text-violet-400"></i>${u.xp} XP</span>
                                    <span title="Nível"><i class="fa-solid fa-star mr-1 text-amber-500"></i>${u.level}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-slate-400 text-xs">
                            <i class="fa-solid fa-minus"></i>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function setTab(tab) {
            activeTab = tab;
            const tabAll = document.getElementById('tab-all');
            const tabFriends = document.getElementById('tab-friends');
            const activeCls = 'bg-secondary text-white text-xs font-semibold px-5 py-2 rounded-full shadow-sm transition';
            const idleCls = 'bg-slate-100 text-slate-600 text-xs font-semibold px-5 py-2 rounded-full hover:bg-slate-200 transition';

            if (tab === 'all') {
                if (tabAll) tabAll.className = activeCls;
                if (tabFriends) tabFriends.className = idleCls;
            } else {
                if (tabFriends) tabFriends.className = activeCls;
                if (tabAll) tabAll.className = idleCls;
            }
            renderRanking(getVisibleRows());
        }

        async function loadRanking() {
            const list = document.getElementById('ranking-list');
            if (list && activeTab === 'all') {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Carregando ranking da rede…</p>`;
            }

            try {
                // Contatos e ranking em paralelo
                const [, rows] = await Promise.all([
                    fetchMyContacts(),
                    fetchRewardsRanking()
                ]);

                const profiles = await fetchProfiles(rows.map(r => r.pubkey));
                rows.forEach(r => {
                    const p = profiles.get(r.pubkey);
                    if (p) {
                        if (p.name) r.name = p.name;
                        if (p.picture) r.picture = p.picture;
                    }
                });

                rankingRows = sortRanking(rows);
                renderRanking(getVisibleRows());
            } catch (e) {
                console.error(e);
                if (list) {
                    list.innerHTML = `<p class="text-xs text-rose-400 text-center py-8">Falha ao carregar ranking. Tente novamente.</p>`;
                }
            }
        }

        document.getElementById('tab-all')?.addEventListener('click', () => setTab('all'));
        document.getElementById('tab-friends')?.addEventListener('click', () => setTab('friends'));

        loadMyPubkey();
        loadRanking();
        setInterval(loadRanking, 60000);
    </script>
</body>
</html>
