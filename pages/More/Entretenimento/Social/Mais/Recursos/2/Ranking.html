<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',
                        secondary: '#7C3AED',
                        secondaryDark: '#6D28D9',
                        darkBg: '#F8FAFC',
                        blueviolet: '#8a2be2',
                        ghost: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
            border-radius: 0.5rem;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* UX Exclusivo para Desktop: Tela Cheia (Full Width/Height), sem bordas arredondadas */
        @media (min-width: 768px) {
            body {
                background: linear-gradient(135deg, #7c3aed15 0%, #8a2be220 50%, #f8fafc 100%);
                background-attachment: fixed;
            }
            .desktop-container-ux {
                max-width: 100% !important;
                width: 100% !important;
                min-height: 100vh !important;
                margin: 0 !important;
                border-radius: 0 !important;
                background: rgba(255, 255, 255, 0.82);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: none !important;
                box-shadow: none !important;
            }
            .desktop-content-wrapper {
                max-width: 1200px;
                margin: 0 auto;
            }
            .desktop-grid-header {
                display: grid;
                grid-template-columns: 4rem 4rem 1fr 10rem 9rem;
                align-items: center;
                gap: 1rem;
                padding: 1rem 1.5rem;
                font-size: 0.8rem;
                font-weight: 700;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                border-bottom: 1px solid rgba(226, 232, 240, 0.8);
                margin-bottom: 0.75rem;
            }
            .desktop-row-ux {
                display: grid;
                grid-template-columns: 4rem 4rem 1fr 10rem 9rem;
                align-items: center;
                gap: 1rem;
                padding: 1rem 1.5rem;
                background: rgba(248, 250, 252, 0.6);
                border: 1px solid rgba(226, 232, 240, 0.6);
                border-radius: 0.75rem;
                transition: all 0.2s ease;
            }
            .desktop-row-ux:hover {
                background: rgba(255, 255, 255, 0.95);
                border-color: rgba(138, 43, 226, 0.3);
                transform: translateY(-2px);
                box-shadow: 0 8px 20px -6px rgba(124, 58, 237, 0.1);
            }
        }
    </style>
</head>
<body class="bg-darkBg text-slate-800 font-sans antialiased min-h-screen flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between desktop-container-ux">
        
        <div class="p-5 md:p-10 pb-10 desktop-content-wrapper w-full">
            
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <a href="../../Index.html" class="text-slate-700 text-lg hover:text-secondary transition flex items-center justify-center">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                    <h1 class="text-xl md:text-3xl font-extrabold tracking-wide text-slate-900">Ranking</h1>
                </div>
                <!-- Elemento decorativo visual exclusivo para desktop -->
                <div class="hidden md:flex items-center space-x-2 text-xs font-semibold px-4 py-2 rounded-full bg-blueviolet/10 text-blueviolet border border-blueviolet/20">
                    <i class="fa-solid fa-trophy"></i>
                    <span>Painel Global em Tempo Real</span>
                </div>
            </div>

            <div class="flex space-x-2 mb-6">
                <button id="tab-all" type="button" class="bg-secondary text-white text-xs font-semibold px-5 py-2 rounded-full shadow-sm transition">
                    Todos
                </button>
                <button id="tab-friends" type="button" class="bg-slate-100 text-slate-600 text-xs font-semibold px-5 py-2 rounded-full hover:bg-slate-200 transition">
                    Amigos
                </button>
            </div>

            <!-- Cabeçalho de colunas exclusivo para Desktop -->
            <div class="desktop-grid-header hidden md:grid">
                <div class="text-center">Pos</div>
                <div>Avatar</div>
                <div>Usuário</div>
                <div class="text-center">XP Total</div>
                <div class="text-center">Nível</div>
            </div>

            <div id="ranking-list" class="space-y-4">
                <!-- skeleton inicial -->
            </div>
        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

        const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.nostr.band', 'wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();
        const REWARDS_KIND = 30078;
        const REWARDS_D_TAG = 'violet-rewards-v1';
        const FALLBACK_AVATAR = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed || 'user')}`;

        let myPubkey = '';
        let rankingRows = [];      // ranking global
        let contactPubkeys = new Set(); // contatos (kind 3)
        let activeTab = 'all';     // 'all' | 'friends'

        function toNum(v, fallback) {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        }

        function loadMyPubkey() {
            try {
                const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
                myPubkey = session.pubkey || '';
            } catch (_) {
                myPubkey = '';
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function truncateName(name, max = 22) {
            const s = String(name || '');
            if (s.length <= max) return s;
            return s.slice(0, max - 1) + '…';
        }

        async function fetchMyContacts() {
            contactPubkeys = new Set();
            if (!myPubkey) return contactPubkeys;

            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [3],
                    authors: [myPubkey],
                    limit: 5
                });
                if (!events || !events.length) return contactPubkeys;

                events.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
                const latest = events[0];
                (latest.tags || []).forEach(tag => {
                    if (tag[0] === 'p' && tag[1] && /^[0-9a-f]{64}$/i.test(tag[1])) {
                        contactPubkeys.add(tag[1].toLowerCase());
                    }
                });
            } catch (e) {
                console.error('Falha ao buscar contatos (kind 3):', e);
            }
            return contactPubkeys;
        }

        async function fetchRewardsRanking() {
            const events = await pool.querySync(RELAYS, {
                kinds: [REWARDS_KIND],
                '#d': [REWARDS_D_TAG],
                limit: 200
            });

            const byAuthor = new Map();

            (events || []).forEach(ev => {
                if (!ev || !ev.pubkey || !ev.content) return;
                let data = null;
                try {
                    data = JSON.parse(ev.content);
                } catch (_) {
                    return;
                }
                if (!data || data.v !== 1) return;

                const level = Math.max(1, Math.floor(toNum(data.level, 1)));
                const xp = Math.max(0, toNum(data.xp, 0));
                const updatedAt = toNum(data.updatedAt, (ev.created_at || 0) * 1000);

                const prev = byAuthor.get(ev.pubkey);
                if (!prev || updatedAt >= prev.updatedAt || (ev.created_at || 0) >= (prev.created_at || 0)) {
                    byAuthor.set(ev.pubkey, {
                        pubkey: ev.pubkey,
                        level,
                        xp,
                        updatedAt,
                        created_at: ev.created_at || 0,
                        name: '',
                        picture: ''
                    });
                }
            });

            return Array.from(byAuthor.values());
        }

        async function fetchProfiles(pubkeys) {
            if (!pubkeys.length) return new Map();
            const profiles = new Map();
            const chunkSize = 40;

            for (let i = 0; i < pubkeys.length; i += chunkSize) {
                const chunk = pubkeys.slice(i, i + chunkSize);
                try {
                    const events = await pool.querySync(RELAYS, {
                        kinds: [0],
                        authors: chunk,
                        limit: chunk.length * 3
                    });
                    const latestByAuthor = new Map();
                    (events || []).forEach(ev => {
                        const prev = latestByAuthor.get(ev.pubkey);
                        if (!prev || (ev.created_at || 0) > (prev.created_at || 0)) {
                            latestByAuthor.set(ev.pubkey, ev);
                        }
                    });
                    latestByAuthor.forEach((ev, pk) => {
                        let data = {};
                        try { data = JSON.parse(ev.content || '{}'); } catch (_) {}
                        const name = (data.display_name || data.name || '').trim().replace(/^@/, '');
                        const picture = data.picture || data.image || '';
                        profiles.set(pk, { name, picture });
                    });
                } catch (e) {
                    console.warn('Falha ao buscar perfis:', e);
                }
            }
            return profiles;
        }

        function sortRanking(rows) {
            return rows.slice().sort((a, b) => {
                if (b.level !== a.level) return b.level - a.level;
                if (b.xp !== a.xp) return b.xp - a.xp;
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });
        }

        function medalHtml(position) {
            if (position === 1) {
                return `<div class="w-8 flex justify-center text-amber-500 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            if (position === 2) {
                return `<div class="w-8 flex justify-center text-slate-400 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            if (position === 3) {
                return `<div class="w-8 flex justify-center text-amber-700 font-black text-lg"><i class="fa-solid fa-medal text-xl"></i></div>`;
            }
            return `<div class="w-8 flex justify-center text-slate-700 font-bold text-xs">${position}º</div>`;
        }

        function borderClass(position) {
            if (position === 1) return 'border-2 border-secondary';
            if (position === 2) return 'border-2 border-slate-300';
            if (position === 3) return 'border-2 border-amber-700/50';
            return '';
        }

        function getVisibleRows() {
            if (activeTab === 'friends') {
                return rankingRows.filter(r => contactPubkeys.has(String(r.pubkey).toLowerCase()));
            }
            return rankingRows;
        }

        function skeletonHtml(count = 5) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl md:hidden">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 flex justify-center"><div class="skeleton w-5 h-5 rounded"></div></div>
                            <div class="relative"><div class="skeleton w-11 h-11 rounded-full"></div></div>
                            <div class="space-y-2"><div class="skeleton h-3 w-28"></div><div class="skeleton h-2.5 w-20"></div></div>
                        </div>
                        <div class="skeleton w-4 h-4 rounded"></div>
                    </div>
                    <!-- Skeleton exclusivo para desktop -->
                    <div class="hidden md:grid desktop-row-ux animate-pulse">
                        <div class="flex justify-center"><div class="skeleton w-6 h-6 rounded"></div></div>
                        <div><div class="skeleton w-11 h-11 rounded-full"></div></div>
                        <div class="space-y-2"><div class="skeleton h-4 w-48"></div><div class="skeleton h-3 w-32"></div></div>
                        <div class="flex justify-center"><div class="skeleton h-4 w-20"></div></div>
                        <div class="flex justify-center"><div class="skeleton h-6 w-16 rounded-full"></div></div>
                    </div>
                `;
            }
            return html;
        }

        function showSkeleton() {
            const list = document.getElementById('ranking-list');
            if (list) list.innerHTML = skeletonHtml(5);
        }

        function renderRanking(rows) {
            const list = document.getElementById('ranking-list');
            if (!list) return;

            if (!rows.length) {
                if (activeTab === 'friends') {
                    if (!myPubkey) {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Faça login com sua conta Nostr para ver o ranking dos seus contatos.
                            </p>`;
                    } else if (contactPubkeys.size === 0) {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Você ainda não tem contatos na rede (lista kind 3 vazia).
                            </p>`;
                    } else {
                        list.innerHTML = `
                            <p class="text-xs text-slate-400 text-center py-8">
                                Nenhum dos seus contatos aparece no ranking ainda.<br>
                                <span class="text-[10px]">Eles precisam resgatar XP em Recompensas.</span>
                            </p>`;
                    }
                } else {
                    list.innerHTML = `
                        <p class="text-xs text-slate-400 text-center py-8">
                            Nenhum usuário com recompensas na rede ainda.<br>
                            <span class="text-[10px]">Resgate XP na página de Recompensas para aparecer aqui.</span>
                        </p>`;
                }
                return;
            }

            let html = '';
            rows.forEach((u, idx) => {
                const pos = idx + 1;
                const name = truncateName(u.name || ('@' + u.pubkey.slice(0, 10) + '…'));
                const avatar = u.picture || FALLBACK_AVATAR(u.pubkey);
                const isMe = myPubkey && u.pubkey === myPubkey;
                const highlight = isMe ? ' ring-2 ring-secondary/40' : '';

                // Layout Mobile Original
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl md:hidden${highlight}">
                        <div class="flex items-center space-x-3">
                            ${medalHtml(pos)}
                            <div class="relative">
                                <div class="w-11 h-11 rounded-full bg-violet-200 overflow-hidden ${borderClass(pos)}">
                                    <img src="${escapeHtml(avatar)}" alt="Avatar" class="w-full h-full object-cover"
                                         onerror="this.onerror=null;this.src='${FALLBACK_AVATAR(u.pubkey)}'">
                                </div>
                                <span class="absolute -bottom-1 -right-1 bg-secondary text-white text-[9px] font-bold px-1 rounded-full border border-white">${u.level}</span>
                            </div>
                            <div>
                                <h3 class="text-xs font-bold text-slate-900">${escapeHtml(name)}${isMe ? ' <span class="text-secondary font-semibold">(você)</span>' : ''}</h3>
                                <div class="flex items-center space-x-3 mt-1 text-[10px] text-slate-500 font-medium">
                                    <span title="XP atual"><i class="fa-solid fa-bolt mr-1 text-violet-400"></i>${u.xp} XP</span>
                                    <span title="Nível"><i class="fa-solid fa-star mr-1 text-amber-500"></i>${u.level}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-slate-400 text-xs">
                            <i class="fa-solid fa-minus"></i>
                        </div>
                    </div>
                `;

                // Layout UX Exclusivo para Desktop (Grid em largura total)
                html += `
                    <div class="hidden md:grid desktop-row-ux ${isMe ? 'border-secondary/60 bg-purple-50/60 shadow-sm' : ''}">
                        <div class="flex justify-center">${medalHtml(pos)}</div>
                        <div>
                            <div class="w-11 h-11 rounded-full bg-violet-200 overflow-hidden shadow-sm ${borderClass(pos)}">
                                <img src="${escapeHtml(avatar)}" alt="Avatar" class="w-full h-full object-cover"
                                     onerror="this.onerror=null;this.src='${FALLBACK_AVATAR(u.pubkey)}'">
                            </div>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                                ${escapeHtml(name)}
                                ${isMe ? '<span class="bg-secondary text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">Você</span>' : ''}
                            </h3>
                            <p class="text-xs text-slate-400 font-mono mt-0.5">${u.pubkey}</p>
                        </div>
                        <div class="text-center font-bold text-slate-700 text-sm flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-bolt text-violet-500"></i>
                            <span>${u.xp.toLocaleString()} <span class="text-xs font-normal text-slate-400">XP</span></span>
                        </div>
                        <div class="flex justify-center">
                            <span class="inline-flex items-center gap-1.5 bg-amber-500/10 text-amber-700 border border-amber-500/20 px-3.5 py-1 rounded-full text-xs font-extrabold shadow-sm">
                                <i class="fa-solid fa-star text-amber-500"></i>
                                Nível ${u.level}
                            </span>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function setTab(tab) {
            activeTab = tab;
            const tabAll = document.getElementById('tab-all');
            const tabFriends = document.getElementById('tab-friends');
            const activeCls = 'bg-secondary text-white text-xs font-semibold px-5 py-2 rounded-full shadow-sm transition';
            const idleCls = 'bg-slate-100 text-slate-600 text-xs font-semibold px-5 py-2 rounded-full hover:bg-slate-200 transition';

            if (tab === 'all') {
                if (tabAll) tabAll.className = activeCls;
                if (tabFriends) tabFriends.className = idleCls;
            } else {
                if (tabFriends) tabFriends.className = activeCls;
                if (tabAll) tabAll.className = idleCls;
            }
            renderRanking(getVisibleRows());
        }

        async function loadRanking() {
            showSkeleton();

            try {
                const [, rows] = await Promise.all([
                    fetchMyContacts(),
                    fetchRewardsRanking()
                ]);

                const profiles = await fetchProfiles(rows.map(r => r.pubkey));
                rows.forEach(r => {
                    const p = profiles.get(r.pubkey);
                    if (p) {
                        if (p.name) r.name = p.name;
                        if (p.picture) r.picture = p.picture;
                    }
                });

                rankingRows = sortRanking(rows);
                renderRanking(getVisibleRows());
            } catch (e) {
                console.error(e);
                const list = document.getElementById('ranking-list');
                if (list) {
                    list.innerHTML = `<p class="text-xs text-rose-400 text-center py-8">Falha ao carregar ranking. Tente novamente.</p>`;
                }
            }
        }

        document.getElementById('tab-all')?.addEventListener('click', () => setTab('all'));
        document.getElementById('tab-friends')?.addEventListener('click', () => setTab('friends'));

        loadMyPubkey();
        loadRanking();
        setInterval(loadRanking, 60000);
    </script>
</body>
</html>
