<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallPulse - 4K & UHD Wallpapers</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ffffff',
                        secondary: '#8a2be2', // blueviolet
                        'violet-dark': '#581c87',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: ghostwhite;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(138, 43, 226, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .glow-violet {
            box-shadow: 0 0 35px rgba(138, 43, 226, 0.25);
        }
        /* Custom scrollbar for horizontal categories */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-gray-900 font-sans antialiased selection:bg-secondary selection:text-white flex flex-col min-h-screen">

    <!-- HEADER / APP BAR -->
    <header class="w-full px-4 md:px-6 py-4 flex justify-between items-center max-w-7xl mx-auto z-30 sticky top-0 bg-ghostwhite/90 backdrop-blur-md border-b border-gray-200/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-secondary/15 flex items-center justify-center border border-secondary/30 glow-violet shrink-0">
                <i data-lucide="image" class="w-5 h-5 text-secondary"></i>
            </div>
            <div>
                <span class="font-bold text-lg md:text-xl tracking-tight text-gray-900 block leading-tight">Plano de fundo</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleFavoritesModal()" class="relative p-2.5 rounded-xl glass-card hover:bg-gray-100 transition-all border border-gray-200 text-gray-700 hover:text-secondary shrink-0">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span id="fav-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-secondary text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-md hidden">0</span>
            </button>
            <a href="index.html" class="p-2.5 rounded-xl glass-card hover:bg-gray-100 transition-all text-gray-700 hover:text-secondary border border-gray-200 hover:border-secondary shrink-0" title="Home">
                <i data-lucide="home" class="w-5 h-5"></i>
            </a>
            <!-- PROFILE DROPDOWN CONTAINER -->
            <div class="relative">
                <button onclick="toggleProfileMenu()" class="p-2.5 rounded-xl glass-card hover:bg-gray-100 transition-all text-gray-700 hover:text-secondary border border-gray-200 hover:border-secondary shrink-0" title="Perfil">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>
                <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 rounded-2xl glass-card border border-gray-200 shadow-xl hidden flex-col py-2 z-40 bg-white/95 backdrop-blur-md">
                    <button onclick="handleMenuOption('postar')" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-secondary/10 hover:text-secondary transition-colors text-left w-full">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Postar</span>
                    </button>
                    <button onclick="handleMenuOption('meus-planos')" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-secondary/10 hover:text-secondary transition-colors text-left w-full">
                        <i data-lucide="image" class="w-4 h-4"></i>
                        <span>Meus planos de fundo</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN APP INTERFACE -->
    <main class="flex-grow max-w-7xl mx-auto px-4 md:px-6 py-8 flex flex-col w-full z-10">
        
        <!-- SEARCH BAR -->
        <div class="relative w-full max-w-2xl mx-auto mb-8">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                <i data-lucide="search" class="w-5 h-5"></i>
            </span>
            <input type="text" id="search-input" oninput="handleSearchInput()" placeholder="Pesquisar papéis de parede 4K, natureza, carros..." class="w-full pl-12 pr-12 py-3.5 rounded-2xl glass-card border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-sm shadow-sm">
            <button id="clear-search-btn" onclick="clearSearch()" class="absolute inset-y-0 right-0 hidden items-center pr-4 text-gray-400 hover:text-gray-700 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- CATEGORIES HORIZONTAL SCROLL -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-4 px-1">
                <h2 class="text-lg font-bold text-gray-900 tracking-tight">Categorias</h2>
            </div>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 px-1" id="categories-container">
                <button onclick="filterCategory('all')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 bg-secondary text-white shadow-md shadow-secondary/20 border border-secondary">Todos</button>
                <button onclick="filterCategory('Natureza')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Natureza</button>
                <button onclick="filterCategory('Carros')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Carros</button>
                <button onclick="filterCategory('Abstrato')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Abstrato</button>
                <button onclick="filterCategory('Espaço')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Espaço</button>
                <button onclick="filterCategory('Cyberpunk')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Cyberpunk</button>
                <button onclick="filterCategory('Minimalista')" class="cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary">Minimalista</button>
            </div>
        </div>

        <!-- WALLPAPERS GRID -->
        <div class="mb-4 px-1">
            <h2 class="text-lg font-bold text-gray-900 tracking-tight mb-4">Em Alta (4K / UHD)</h2>
        </div>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6 w-full" id="wallpapers-grid">
            <!-- Populated via JS -->
        </div>

    </main>

    <!-- WALLPAPER PREVIEW MODAL -->
    <div id="preview-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="glass-card w-full md:max-w-lg rounded-t-3xl md:rounded-3xl overflow-hidden border border-gray-200 shadow-2xl bg-white flex flex-col relative max-h-[90vh]">
            <button onclick="closePreview()" class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black/70 transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="relative w-full h-72 md:h-96 bg-gray-900 flex items-center justify-center overflow-hidden">
                <img id="modal-img" src="" alt="Wallpaper Preview" class="w-full h-full object-cover">
                <span id="modal-cat-tag" class="absolute bottom-4 left-4 px-3 py-1 rounded-full text-xs font-bold bg-black/60 text-white backdrop-blur-md border border-white/20"></span>
            </div>

            <div class="p-6 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 id="modal-title" class="text-lg font-bold text-gray-900">Título do Wallpaper</h3>
                        <p class="text-xs text-gray-500">Resolução Real: 3840 x 2160 (4K Ultra HD)</p>
                    </div>
                    <button id="modal-fav-btn" onclick="toggleCurrentFavorite()" class="w-12 h-12 rounded-2xl glass-card flex items-center justify-center border border-gray-200 text-gray-700 hover:text-secondary transition-all">
                        <i data-lucide="heart" class="w-6 h-6"></i>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="editWallpaper()" class="py-3 px-4 rounded-xl font-semibold bg-gray-100 hover:bg-gray-200 text-gray-800 transition-all flex items-center justify-center gap-2 border border-gray-200 text-sm">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                        <span>Editar</span>
                    </button>
                    <button onclick="downloadWallpaper()" class="py-3 px-4 rounded-xl font-semibold bg-secondary hover:bg-purple-700 text-white transition-all flex items-center justify-center gap-2 shadow-lg shadow-secondary/30 text-sm">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Baixar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- POSTAR MODAL -->
    <div id="post-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="glass-card w-full md:max-w-md rounded-t-3xl md:rounded-3xl overflow-hidden border border-gray-200 shadow-2xl bg-white flex flex-col relative max-h-[90vh]">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-secondary"></i>
                    <span>Postar Novo Plano de Fundo</span>
                </h3>
                <button onclick="closeModal('post-modal')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500 hover:text-gray-900">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-6 flex flex-col gap-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Título</label>
                    <input type="text" id="post-title" placeholder="Ex: Paisagem Noturna" class="w-full px-4 py-3 rounded-xl glass-card border border-gray-200 text-sm focus:outline-none focus:border-secondary">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Categoria</label>
                    <select id="post-category" class="w-full px-4 py-3 rounded-xl glass-card border border-gray-200 text-sm focus:outline-none focus:border-secondary bg-white">
                        <option>Natureza</option>
                        <option>Carros</option>
                        <option>Abstrato</option>
                        <option>Espaço</option>
                        <option>Cyberpunk</option>
                        <option>Minimalista</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Selecionar Imagem do Dispositivo</label>
                    <input type="file" id="post-file-input" accept="image/*" onchange="previewSelectedImage(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-secondary/10 file:text-secondary hover:file:bg-secondary/20 cursor-pointer">
                </div>
                <div id="image-preview-container" class="hidden relative w-full h-40 rounded-xl overflow-hidden border border-gray-200">
                    <img id="image-preview" src="" class="w-full h-full object-cover">
                </div>
                <button onclick="submitPost()" class="w-full py-3 rounded-xl bg-secondary hover:bg-purple-700 text-white font-semibold transition-all shadow-md text-sm mt-2">
                    Publicar Wallpaper
                </button>
            </div>
        </div>
    </div>

    <!-- MEUS PLANOS DE FUNDO MODAL -->
    <div id="my-wallpapers-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="glass-card w-full md:max-w-xl rounded-t-3xl md:rounded-3xl overflow-hidden border border-gray-200 shadow-2xl bg-white flex flex-col max-h-[85vh]">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i data-lucide="image" class="w-5 h-5 text-secondary"></i>
                    <span>Meus Planos de Fundo Postados</span>
                </h3>
                <button onclick="closeModal('my-wallpapers-modal')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500 hover:text-gray-900">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">
                <div id="my-wallpapers-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="relative rounded-xl overflow-hidden aspect-[9/16] glass-card border border-gray-200 group">
                        <img src="https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                        <div class="absolute bottom-2 left-2 right-2 text-white">
                            <h5 class="text-xs font-bold truncate">Aurora Boreal</h5>
                            <span class="text-[10px] text-gray-300">Ativo</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FAVORITES DRAWER / MODAL -->
    <div id="fav-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="glass-card w-full md:max-w-2xl rounded-t-3xl md:rounded-3xl overflow-hidden border border-gray-200 shadow-2xl bg-white flex flex-col max-h-[85vh]">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i data-lucide="heart" class="w-5 h-5 text-secondary"></i>
                    <span>Meus Favoritos</span>
                </h3>
                <button onclick="toggleFavoritesModal()" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500 hover:text-gray-900">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">
                <div id="fav-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Favs populated via JS -->
                </div>
                <div id="empty-favs" class="text-center py-12 hidden">
                    <i data-lucide="heart-off" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
                    <p class="text-gray-500 text-sm">Nenhum wallpaper favoritado ainda.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 border border-white/10 text-sm font-medium">
        <i data-lucide="check-circle" class="w-5 h-5 text-secondary"></i>
        <span id="toast-text">Ação realizada com sucesso!</span>
    </div>

    <script>
        // Wallpapers Dataset
        const wallpapers = [
            { id: 1, title: 'Aurora Boreal Cósmica', category: 'Natureza', url: 'https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 2, title: 'Supercar Neon Night', category: 'Carros', url: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 3, title: 'Nebulosa Andromeda', category: 'Espaço', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 4, title: 'Cyber City Tokyo', category: 'Cyberpunk', url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 5, title: 'Minimalist Sunset Gradient', category: 'Minimalista', url: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 6, title: 'Floresta Mística com Nevoeiro', category: 'Natureza', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 7, title: 'Geometric Dark Abstract', category: 'Abstrato', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' },
            { id: 8, title: 'Classic Muscle Car', category: 'Carros', url: 'https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?q=80&w=1000&auto=format&fit=crop', resolution: '4K UHD' }
        ];

        let currentCategory = 'all';
        let favorites = [];
        let activeWallpaper = null;
        let tempSelectedImageUrl = '';

        // Initialize Lucide icons
        lucide.createIcons();
        renderWallpapers(wallpapers);

        function renderWallpapers(list) {
            const grid = document.getElementById('wallpapers-grid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <i data-lucide="search-x" class="w-12 h-12 text-gray-400 mx-auto mb-3"></i>
                        <p class="text-gray-500 text-sm">Nenhum wallpaper encontrado.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.forEach(wp => {
                const isFav = favorites.includes(wp.id);
                const card = document.createElement('div');
                card.className = 'group relative rounded-2xl overflow-hidden glass-card aspect-[9/16] cursor-pointer shadow-md hover:shadow-xl transition-all duration-300 border border-gray-200';
                card.onclick = () => openPreview(wp);
                
                card.innerHTML = `
                    <img src="${wp.url}" alt="${wp.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-80 group-hover:opacity-90 transition-opacity"></div>
                    
                    <div class="absolute top-3 right-3 z-10">
                        <button onclick="event.stopPropagation(); toggleFavorite(${wp.id})" class="w-9 h-9 rounded-xl glass-card flex items-center justify-center border border-white/20 text-white hover:bg-white/20 transition-all ${isFav ? 'bg-secondary text-white border-secondary' : ''}">
                            <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-current text-white' : ''}"></i>
                        </button>
                    </div>

                    <div class="absolute bottom-3 left-3 right-3 text-white">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-secondary/80 backdrop-blur-sm mb-1 inline-block">${wp.resolution}</span>
                        <h4 class="text-sm font-bold truncate">${wp.title}</h4>
                        <p class="text-[11px] text-gray-300">${wp.category}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            
            // Update buttons state
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 glass-card text-gray-700 hover:border-secondary';
            });
            event.target.className = 'cat-btn px-5 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition-all shrink-0 bg-secondary text-white shadow-md shadow-secondary/20 border border-secondary';

            filterWallpapers();
        }

        function toggleProfileMenu() {
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.classList.toggle('hidden');
            dropdown.classList.toggle('flex');
        }

        function handleMenuOption(option) {
            toggleProfileMenu();
            if (option === 'postar') {
                const modal = document.getElementById('post-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else if (option === 'meus-planos') {
                const modal = document.getElementById('my-wallpapers-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempSelectedImageUrl = e.target.result;
                    const previewImg = document.getElementById('image-preview');
                    previewImg.src = tempSelectedImageUrl;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function submitPost() {
            const titleInput = document.getElementById('post-title').value.trim();
            const categorySelect = document.getElementById('post-category').value;

            if (!titleInput) {
                showToast('Por favor, insira um título.');
                return;
            }
            if (!tempSelectedImageUrl) {
                showToast('Por favor, selecione uma imagem do dispositivo.');
                return;
            }

            const newWallpaper = {
                id: wallpapers.length + 1,
                title: titleInput,
                category: categorySelect,
                url: tempSelectedImageUrl,
                resolution: '4K UHD'
            };

            wallpapers.unshift(newWallpaper);
            filterWallpapers();

            // Add to "meus planos de fundo" grid
            const myGrid = document.getElementById('my-wallpapers-grid');
            const card = document.createElement('div');
            card.className = 'relative rounded-xl overflow-hidden aspect-[9/16] glass-card border border-gray-200 group';
            card.innerHTML = `
                <img src="${tempSelectedImageUrl}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                <div class="absolute bottom-2 left-2 right-2 text-white">
                    <h5 class="text-xs font-bold truncate">${titleInput}</h5>
                    <span class="text-[10px] text-gray-300">Ativo</span>
                </div>
            `;
            myGrid.appendChild(card);

            // Reset form
            document.getElementById('post-title').value = '';
            document.getElementById('post-file-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            tempSelectedImageUrl = '';

            closeModal('post-modal');
            showToast('Wallpaper postado com sucesso!');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('profile-dropdown');
            const profileBtn = dropdown.previousElementSibling;
            if (!dropdown.contains(e.target) && !profileBtn.contains(e.target)) {
                dropdown.classList.add('hidden');
                dropdown.classList.remove('flex');
            }
        });

        function handleSearchInput() {
            const query = document.getElementById('search-input').value;
            const clearBtn = document.getElementById('clear-search-btn');
            
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                clearBtn.classList.add('flex');
            } else {
                clearBtn.classList.remove('flex');
                clearBtn.classList.add('hidden');
            }
            
            filterWallpapers();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('clear-search-btn').classList.remove('flex');
            document.getElementById('clear-search-btn').classList.add('hidden');
            filterWallpapers();
        }

        function filterWallpapers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = wallpapers.filter(wp => {
                const matchesCat = currentCategory === 'all' || wp.category.toLowerCase() === currentCategory.toLowerCase();
                const matchesQuery = wp.title.toLowerCase().includes(query) || wp.category.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderWallpapers(filtered);
        }

        function openPreview(wp) {
            activeWallpaper = wp;
            document.getElementById('modal-img').src = wp.url;
            document.getElementById('modal-title').innerText = wp.title;
            document.getElementById('modal-cat-tag').innerText = `${wp.category} • ${wp.resolution}`;
            
            updateModalFavIcon();
            
            const modal = document.getElementById('preview-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePreview() {
            const modal = document.getElementById('preview-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('Removido dos favoritos');
            } else {
                favorites.push(id);
                showToast('Adicionado aos favoritos');
            }
            updateFavBadge();
            filterWallpapers();
            if (activeWallpaper && activeWallpaper.id === id) {
                updateModalFavIcon();
            }
        }

        function toggleCurrentFavorite() {
            if (activeWallpaper) {
                toggleFavorite(activeWallpaper.id);
            }
        }

        function updateModalFavIcon() {
            const btn = document.getElementById('modal-fav-btn');
            const isFav = favorites.includes(activeWallpaper.id);
            if (isFav) {
                btn.className = 'w-12 h-12 rounded-2xl bg-secondary text-white flex items-center justify-center border border-secondary shadow-md transition-all';
                btn.innerHTML = '<i data-lucide="heart" class="w-6 h-6 fill-current"></i>';
            } else {
                btn.className = 'w-12 h-12 rounded-2xl glass-card flex items-center justify-center border border-gray-200 text-gray-700 hover:text-secondary transition-all';
                btn.innerHTML = '<i data-lucide="heart" class="w-6 h-6"></i>';
            }
            lucide.createIcons();
        }

        function updateFavBadge() {
            const badge = document.getElementById('fav-badge');
            if (favorites.length > 0) {
                badge.innerText = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleFavoritesModal() {
            const modal = document.getElementById('fav-modal');
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                renderFavoritesList();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function renderFavoritesList() {
            const grid = document.getElementById('fav-grid');
            const empty = document.getElementById('empty-favs');
            grid.innerHTML = '';

            const favItems = wallpapers.filter(wp => favorites.includes(wp.id));

            if (favItems.length === 0) {
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            favItems.forEach(wp => {
                const card = document.createElement('div');
                card.className = 'relative rounded-xl overflow-hidden aspect-[9/16] cursor-pointer group shadow-sm border border-gray-200';
                card.onclick = () => { toggleFavoritesModal(); openPreview(wp); };
                card.innerHTML = `
                    <img src="${wp.url}" alt="${wp.title}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                    <div class="absolute bottom-2 left-2 right-2 text-white">
                        <h5 class="text-xs font-bold truncate">${wp.title}</h5>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function editWallpaper() {
            showToast('Abrindo editor de imagem...');
            closePreview();
        }

        function downloadWallpaper() {
            showToast('Download do arquivo 4K UHD iniciado!');
            closePreview();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
