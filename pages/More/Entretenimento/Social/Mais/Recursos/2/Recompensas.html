<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recompensas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',
                        secondary: '#7C3AED',
                        secondaryDark: '#6D28D9',
                        darkBg: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkBg text-slate-800 font-sans antialiased min-h-screen flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between">
        
        <div class="p-5 pb-10">
            
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <a href="../../Index.html" class="text-slate-700 text-lg hover:text-secondary transition flex items-center justify-center">
                        <i class="fa-solid fa-chevron-left"></i>
                    </a>
                    <h1 class="text-xl font-bold tracking-wide">Recompensas</h1>
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 mb-8 shadow-sm">
                <div class="flex items-center space-x-3.5 mb-3">
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Recompensas" alt="Foto de perfil" title="Minha Conta" class="w-12 h-12 rounded-full object-cover border-2 border-secondary bg-violet-50">
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <h3 id="user-nickname" class="text-sm font-bold text-slate-900">@usuário</h3>
                            <span id="user-level" class="text-xs font-bold text-secondary bg-violet-100 px-2 py-0.5 rounded-full">Nível 1</span>
                        </div>
                        <p id="user-xp-label" class="text-[11px] text-slate-400 mt-0.5">0 / 1000 XP para o Nível 2</p>
                    </div>
                </div>
                <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div id="xp-progress-bar" class="bg-secondary h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
                </div>
            </div>

            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-base text-slate-900">Minha frequência</h2>
                    <span id="freq-cycle-hint" class="text-[10px] text-slate-400">Ciclo de 7 dias</span>
                </div>

                <div id="frequency-days" class="flex space-x-2.5 overflow-x-auto no-scrollbar pb-2 mb-4"></div>

                <button id="claim-freq-btn" onclick="claimFrequencyReward()" class="w-full bg-slate-100 text-slate-400 font-semibold py-3 rounded-xl cursor-not-allowed transition">
                    Pegar recompensa
                </button>
            </div>

            <div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-base text-slate-900">Missões diárias</h2>
                    <span id="missions-reset-hint" class="text-[10px] text-slate-400">Renovam em 24h</span>
                </div>

                <div id="missions-list" class="space-y-3"></div>
            </div>

        </div>
    </div>

    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

        const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.nostr.band', 'wss://relay.primal.net'];
        const pool = new NostrTools.SimplePool();
        const FALLBACK_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=Recompensas';
        const REWARDS_KIND = 30078;
        const REWARDS_D_TAG = 'violet-rewards-v1';
        const XP_PER_LEVEL = 1000;
        const DAY_REWARDS = [200, 250, 300, 350, 400, 450, 500];
        const LIVE_POLL_MS = 20000;

        const DEFAULT_MISSIONS = [
            { id: 'share', title: 'Compartilhar a plataforma', icon: 'fa-share-nodes', target: 1, progress: 0, xp: 100, actionLabel: 'Compartilhar', done: false, live: false },
            { id: 'posts', title: 'Postar 10 posts', icon: 'fa-pen-to-square', target: 10, progress: 0, xp: 150, actionLabel: 'Atualizar', done: false, live: true },
            { id: 'time', title: 'Ficar 30 min na plataforma', icon: 'fa-clock', target: 30, progress: 0, xp: 120, actionLabel: 'Concluir', done: false, unit: 'min', live: false },
            { id: 'interact', title: 'Interagir com 70 posts', icon: 'fa-heart', target: 70, progress: 0, xp: 200, actionLabel: 'Atualizar', done: false, live: true }
        ];

        let currentUserData = { pubkey: '', privateKey: null, privateKeyHex: '', nickname: '', avatarUrl: '' };
        let liveSyncing = false;

        let state = {
            xp: 0,
            level: 1,
            cycleStartDate: null,
            claimedDays: {},
            missedDays: {},
            lastFreqCheckDate: null,
            missionsDate: null,
            missions: JSON.parse(JSON.stringify(DEFAULT_MISSIONS)),
            updatedAt: 0
        };

        /** Garante número válido (nunca null/NaN) */
        function toNum(v, fallback) {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        }

        /** Normaliza xp/level após qualquer load ou merge */
        function sanitizeXpState() {
            state.xp = Math.max(0, toNum(state.xp, 0));
            state.level = Math.max(1, Math.floor(toNum(state.level, 1)));
            // Se xp >= 1000 por dado corrompido, sobe níveis
            while (state.xp >= XP_PER_LEVEL) {
                state.xp -= XP_PER_LEVEL;
                state.level += 1;
            }
        }

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function startOfTodayUnix() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return Math.floor(d.getTime() / 1000);
        }

        function daysBetween(a, b) {
            const da = new Date(a + 'T12:00:00');
            const db = new Date(b + 'T12:00:00');
            return Math.floor((db - da) / 86400000);
        }

        function addDays(dateStr, n) {
            const d = new Date(dateStr + 'T12:00:00');
            d.setDate(d.getDate() + n);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function loadSessionFromNostr() {
            try {
                const session = localStorage.getItem('nostr_session');
                if (!session) return;
                const parsed = JSON.parse(session);
                if (!parsed.pubkey) return;
                currentUserData.pubkey = parsed.pubkey || '';
                currentUserData.privateKeyHex = parsed.privateKeyHex || '';
                if (parsed.privateKeyHex) {
                    try { currentUserData.privateKey = hexToBytes(parsed.privateKeyHex); } catch (_) {}
                }
                currentUserData.nickname = (parsed.nickname || '').replace(/^@/, '');
                currentUserData.avatarUrl = parsed.avatarUrl || '';
            } catch (e) {
                console.error('Erro ao carregar sessão Nostr:', e);
            }
        }

        function isLoggedIn() {
            return !!(currentUserData.privateKey && currentUserData.pubkey);
        }

        function updateProfileUI() {
            const img = document.getElementById('user-avatar');
            const nameEl = document.getElementById('user-nickname');
            if (img) {
                img.src = currentUserData.avatarUrl || FALLBACK_AVATAR;
                img.title = currentUserData.nickname
                    ? '@' + currentUserData.nickname
                    : (currentUserData.pubkey ? '@' + currentUserData.pubkey.slice(0, 10) + '…' : 'Minha Conta');
                img.onerror = function () { this.onerror = null; this.src = FALLBACK_AVATAR; };
            }
            if (nameEl) {
                if (currentUserData.nickname) nameEl.textContent = '@' + currentUserData.nickname;
                else if (currentUserData.pubkey) nameEl.textContent = '@' + currentUserData.pubkey.slice(0, 10) + '…';
                else nameEl.textContent = '@usuário';
            }
        }

        async function fetchMyProfileFromNetwork() {
            if (!currentUserData.pubkey) return;
            try {
                const events = await pool.querySync(RELAYS, { kinds: [0], authors: [currentUserData.pubkey], limit: 5 });
                if (!events || !events.length) return;
                events.sort((a, b) => b.created_at - a.created_at);
                let data = {};
                try { data = JSON.parse(events[0].content || '{}'); } catch (_) {}
                const name = (data.display_name || data.name || '').trim().replace(/^@/, '');
                const picture = data.picture || data.image || '';
                if (name) currentUserData.nickname = name;
                if (picture) currentUserData.avatarUrl = picture;
                try {
                    const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
                    if (session.pubkey) {
                        if (currentUserData.nickname) session.nickname = '@' + currentUserData.nickname;
                        if (currentUserData.avatarUrl) session.avatarUrl = currentUserData.avatarUrl;
                        localStorage.setItem('nostr_session', JSON.stringify(session));
                    }
                } catch (_) {}
                updateProfileUI();
            } catch (e) {
                console.error('Falha ao buscar perfil Nostr:', e);
            }
        }

        function storageKey() {
            return currentUserData.pubkey
                ? 'violet_rewards_' + currentUserData.pubkey
                : 'violet_rewards_guest';
        }

        function loadStateLocal() {
            try {
                const raw = localStorage.getItem(storageKey());
                if (!raw) return;
                const parsed = JSON.parse(raw);
                state = { ...state, ...parsed };
                sanitizeXpState();
                if (!Array.isArray(state.missions) || state.missions.length !== DEFAULT_MISSIONS.length) {
                    state.missions = JSON.parse(JSON.stringify(DEFAULT_MISSIONS));
                } else {
                    state.missions = state.missions.map((m, i) => ({
                        ...DEFAULT_MISSIONS[i],
                        progress: toNum(m.progress, 0),
                        done: !!m.done
                    }));
                }
                if (!state.claimedDays || typeof state.claimedDays !== 'object') state.claimedDays = {};
                if (!state.missedDays || typeof state.missedDays !== 'object') state.missedDays = {};
            } catch (e) {
                console.error(e);
                sanitizeXpState();
            }
        }

        function saveStateLocal() {
            sanitizeXpState();
            state.updatedAt = Date.now();
            localStorage.setItem(storageKey(), JSON.stringify(state));
        }

        async function publishRewardsToNetwork() {
            if (!isLoggedIn()) return false;
            try {
                sanitizeXpState();
                const content = JSON.stringify({
                    v: 1,
                    xp: toNum(state.xp, 0),
                    level: toNum(state.level, 1),
                    cycleStartDate: state.cycleStartDate,
                    claimedDays: state.claimedDays || {},
                    missedDays: state.missedDays || {},
                    lastFreqCheckDate: state.lastFreqCheckDate,
                    missionsDate: state.missionsDate,
                    missions: state.missions.map(m => ({
                        id: m.id,
                        progress: toNum(m.progress, 0),
                        done: !!m.done
                    })),
                    updatedAt: state.updatedAt
                });
                const event = NostrTools.finalizeEvent({
                    kind: REWARDS_KIND,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [
                        ['d', REWARDS_D_TAG],
                        ['client', 'violet-rewards']
                    ],
                    content
                }, currentUserData.privateKey);
                await Promise.any(pool.publish(RELAYS, event));
                return true;
            } catch (e) {
                console.error('Falha ao publicar recompensas na rede:', e);
                return false;
            }
        }

        async function fetchRewardsFromNetwork() {
            if (!isLoggedIn()) return null;
            try {
                const events = await pool.querySync(RELAYS, {
                    kinds: [REWARDS_KIND],
                    authors: [currentUserData.pubkey],
                    '#d': [REWARDS_D_TAG],
                    limit: 5
                });
                if (!events || !events.length) return null;
                events.sort((a, b) => b.created_at - a.created_at);
                for (const ev of events) {
                    try {
                        const data = JSON.parse(ev.content || '{}');
                        if (data && data.v === 1) return data;
                    } catch (_) {}
                }
                return null;
            } catch (e) {
                console.error('Falha ao buscar recompensas da rede:', e);
                return null;
            }
        }

        async function persistAndSync() {
            saveStateLocal();
            await publishRewardsToNetwork();
        }

        function applyXp(amount) {
            sanitizeXpState();
            const add = toNum(amount, 0);
            if (add <= 0) return;
            state.xp = toNum(state.xp, 0) + add;
            while (state.xp >= XP_PER_LEVEL) {
                state.xp -= XP_PER_LEVEL;
                state.level = toNum(state.level, 1) + 1;
            }
            sanitizeXpState();
        }

        function updateXpUI() {
            sanitizeXpState();
            const xp = toNum(state.xp, 0);
            const level = toNum(state.level, 1);
            const levelEl = document.getElementById('user-level');
            const labelEl = document.getElementById('user-xp-label');
            const bar = document.getElementById('xp-progress-bar');
            if (levelEl) levelEl.textContent = 'Nível ' + level;
            if (labelEl) labelEl.textContent = xp + ' / ' + XP_PER_LEVEL + ' XP para o Nível ' + (level + 1);
            if (bar) bar.style.width = Math.min(100, (xp / XP_PER_LEVEL) * 100) + '%';
        }

        function ensureFrequencyCycle() {
            const today = todayStr();
            if (!state.cycleStartDate || daysBetween(state.cycleStartDate, today) >= 7) {
                state.cycleStartDate = today;
                state.claimedDays = {};
                state.missedDays = {};
                state.lastFreqCheckDate = today;
            }
            if (!state.claimedDays || typeof state.claimedDays !== 'object') state.claimedDays = {};
            if (!state.missedDays || typeof state.missedDays !== 'object') state.missedDays = {};
            const dayIndex = daysBetween(state.cycleStartDate, today);
            for (let i = 0; i < dayIndex; i++) {
                const dayNum = String(i + 1);
                if (!state.claimedDays[dayNum] && !state.missedDays[dayNum]) {
                    state.missedDays[dayNum] = true;
                }
            }
            state.lastFreqCheckDate = today;
        }

        function currentCycleDay() {
            if (!state.cycleStartDate) return 1;
            const idx = daysBetween(state.cycleStartDate, todayStr());
            if (idx < 0) return 1;
            if (idx >= 7) return 7;
            return idx + 1;
        }

        function canClaimToday() {
            const day = currentCycleDay();
            const dayKey = String(day);
            if (state.claimedDays[dayKey] || state.missedDays[dayKey]) return false;
            return true;
        }

        function renderFrequency() {
            ensureFrequencyCycle();
            const container = document.getElementById('frequency-days');
            const btn = document.getElementById('claim-freq-btn');
            if (!container) return;

            const currentDay = currentCycleDay();
            let html = '';

            for (let i = 1; i <= 7; i++) {
                const key = String(i);
                const xp = DAY_REWARDS[i - 1];
                const claimed = !!state.claimedDays[key];
                const missed = !!state.missedDays[key];
                const isToday = i === currentDay;

                let classes = 'rounded-xl p-3.5 flex flex-col items-center justify-center min-w-[75px] flex-shrink-0 ';
                let icon = '';
                let xpClass = 'text-xs font-bold';
                let dayClass = 'text-[10px] mt-1';

                if (claimed) {
                    classes += 'bg-secondary text-white shadow-sm';
                    icon = '<i class="fa-solid fa-check mb-1.5 text-sm"></i>';
                    dayClass += ' opacity-80';
                } else if (missed) {
                    classes += 'bg-slate-100 border border-slate-200 text-slate-400 opacity-60';
                    icon = '<i class="fa-solid fa-xmark mb-1.5 text-sm text-red-400"></i>';
                    xpClass += ' line-through';
                    dayClass += ' text-slate-400';
                } else if (isToday) {
                    classes += 'bg-violet-50 border-2 border-secondary text-slate-700';
                    icon = i === 7
                        ? '<i class="fa-solid fa-gift text-secondary mb-1.5 text-sm"></i>'
                        : '<i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>';
                    dayClass += ' text-secondary font-semibold';
                } else {
                    classes += 'bg-slate-50 border border-slate-200 text-slate-600';
                    icon = i === 7
                        ? '<i class="fa-solid fa-gift text-secondary mb-1.5 text-sm"></i>'
                        : '<i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>';
                    dayClass += ' text-slate-400';
                }

                html += `
                    <div class="${classes}">
                        ${icon}
                        <span class="${xpClass}">${xp}xp</span>
                        <span class="${dayClass}">Dia ${i}</span>
                    </div>
                `;
            }
            container.innerHTML = html;

            if (btn) {
                if (canClaimToday()) {
                    const day = currentCycleDay();
                    const xp = DAY_REWARDS[day - 1];
                    btn.disabled = false;
                    btn.className = 'w-full bg-secondary text-white font-semibold py-3 rounded-xl hover:bg-secondaryDark transition shadow-sm cursor-pointer';
                    btn.textContent = 'Pegar recompensa (+' + xp + ' XP)';
                } else {
                    const day = currentCycleDay();
                    const key = String(day);
                    btn.disabled = true;
                    btn.className = 'w-full bg-slate-100 text-slate-400 font-semibold py-3 rounded-xl cursor-not-allowed transition';
                    if (state.claimedDays[key]) btn.textContent = 'Recompensa de hoje já resgatada';
                    else if (state.missedDays[key]) btn.textContent = 'Recompensa perdida';
                    else btn.textContent = 'Pegar recompensa';
                }
            }

            const hint = document.getElementById('freq-cycle-hint');
            if (hint && state.cycleStartDate) {
                const end = addDays(state.cycleStartDate, 6);
                hint.textContent = 'Ciclo: ' + state.cycleStartDate.slice(5) + ' → ' + end.slice(5);
            }
        }

        window.claimFrequencyReward = async function () {
            ensureFrequencyCycle();
            if (!canClaimToday()) return;
            const day = currentCycleDay();
            const key = String(day);
            const xpGain = toNum(DAY_REWARDS[day - 1], 0);
            state.claimedDays[key] = todayStr();
            applyXp(xpGain);
            updateXpUI();
            renderFrequency();
            await persistAndSync();
            alert('+' + xpGain + ' XP resgatados do Dia ' + day + '!');
        };

        function ensureMissionsDay() {
            const today = todayStr();
            if (state.missionsDate !== today) {
                state.missionsDate = today;
                state.missions = JSON.parse(JSON.stringify(DEFAULT_MISSIONS));
            }
        }

        async function fetchLiveMissionCounts() {
            if (!currentUserData.pubkey) {
                return { posts: 0, interactions: 0 };
            }
            const since = startOfTodayUnix();
            try {
                const [notes, reactions] = await Promise.all([
                    pool.querySync(RELAYS, {
                        kinds: [1],
                        authors: [currentUserData.pubkey],
                        since,
                        limit: 50
                    }),
                    pool.querySync(RELAYS, {
                        kinds: [7],
                        authors: [currentUserData.pubkey],
                        since,
                        limit: 100
                    })
                ]);
                const postIds = new Set((notes || []).map(e => e.id));
                const reactIds = new Set((reactions || []).map(e => e.id));
                return { posts: postIds.size, interactions: reactIds.size };
            } catch (e) {
                console.error('Falha ao buscar metadados de posts/interações:', e);
                return { posts: 0, interactions: 0 };
            }
        }

        async function syncLiveMissionsFromNetwork(silent) {
            if (!currentUserData.pubkey || liveSyncing) return;
            liveSyncing = true;
            try {
                ensureMissionsDay();
                const counts = await fetchLiveMissionCounts();
                let changed = false;

                state.missions.forEach(m => {
                    if (m.id === 'posts') {
                        const next = Math.min(m.target, counts.posts);
                        if (next !== m.progress) {
                            m.progress = next;
                            changed = true;
                        }
                    }
                    if (m.id === 'interact') {
                        const next = Math.min(m.target, counts.interactions);
                        if (next !== m.progress) {
                            m.progress = next;
                            changed = true;
                        }
                    }
                    if ((m.id === 'posts' || m.id === 'interact') && m.progress >= m.target && !m.done) {
                        m.done = true;
                        applyXp(toNum(m.xp, 0));
                        changed = true;
                    }
                });

                if (changed) {
                    updateXpUI();
                    renderMissions();
                    await persistAndSync();
                } else {
                    renderMissions();
                }
            } finally {
                liveSyncing = false;
            }
        }

        function renderMissions() {
            ensureMissionsDay();
            const list = document.getElementById('missions-list');
            if (!list) return;

            let html = '';
            state.missions.forEach((m, idx) => {
                const unit = m.unit || '';
                let progressText = '';
                if (m.target > 1) {
                    progressText = `<p class="text-[11px] text-slate-400">(${toNum(m.progress, 0)}/${m.target}${unit ? ' ' + unit : ''})</p>`;
                }

                const done = m.done || m.progress >= m.target;
                const isLive = !!m.live;

                let btnClass, btnLabel, btnDisabled, btnOnclick;

                if (done) {
                    btnClass = 'bg-slate-200 text-slate-400 text-xs font-semibold px-4 py-2 rounded-xl cursor-not-allowed';
                    btnLabel = 'Concluída';
                    btnDisabled = 'disabled';
                    btnOnclick = '';
                } else if (isLive) {
                    btnClass = 'bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm';
                    btnLabel = liveSyncing ? 'Sincronizando…' : 'Atualizar';
                    btnDisabled = liveSyncing ? 'disabled' : '';
                    btnOnclick = 'onclick="refreshLiveMissions()"';
                } else {
                    btnClass = 'bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm';
                    btnLabel = m.actionLabel;
                    btnDisabled = '';
                    btnOnclick = `onclick="advanceMission(${idx})"`;
                }

                html += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid ${m.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">${m.title}</h3>
                                ${progressText}
                            </div>
                        </div>
                        <button ${btnDisabled} ${btnOnclick} class="${btnClass}">
                            ${btnLabel}
                        </button>
                    </div>
                `;
            });
            list.innerHTML = html;

            const hint = document.getElementById('missions-reset-hint');
            if (hint) hint.textContent = 'Renovam em 24h · ' + todayStr();
        }

        window.advanceMission = async function (idx) {
            ensureMissionsDay();
            const m = state.missions[idx];
            if (!m || m.live || m.done || m.progress >= m.target) return;

            if (m.id === 'share') {
                m.progress = m.target;
            } else if (m.id === 'time') {
                m.progress = Math.min(m.target, toNum(m.progress, 0) + 5);
            }

            if (m.progress >= m.target && !m.done) {
                m.done = true;
                applyXp(toNum(m.xp, 0));
                updateXpUI();
                alert('Missão concluída! +' + toNum(m.xp, 0) + ' XP');
            }

            renderMissions();
            await persistAndSync();
        };

        window.refreshLiveMissions = async function () {
            if (!currentUserData.pubkey) {
                alert('Faça login com sua conta Nostr para sincronizar posts e interações.');
                return;
            }
            await syncLiveMissionsFromNetwork(false);
        };

        async function init() {
            loadSessionFromNostr();
            updateProfileUI();
            loadStateLocal();
            sanitizeXpState();

            if (isLoggedIn() || currentUserData.pubkey) {
                await fetchMyProfileFromNetwork();
                if (isLoggedIn()) {
                    const remote = await fetchRewardsFromNetwork();
                    if (remote && (toNum(remote.updatedAt, 0) > toNum(state.updatedAt, 0))) {
                        // Merge seguro: nunca sobrescreve com null
                        if (remote.xp != null) state.xp = toNum(remote.xp, state.xp);
                        if (remote.level != null) state.level = toNum(remote.level, state.level);
                        sanitizeXpState();
                        if (remote.cycleStartDate) state.cycleStartDate = remote.cycleStartDate;
                        if (remote.claimedDays) state.claimedDays = remote.claimedDays;
                        if (remote.missedDays) state.missedDays = remote.missedDays;
                        if (remote.lastFreqCheckDate) state.lastFreqCheckDate = remote.lastFreqCheckDate;
                        if (remote.missionsDate) state.missionsDate = remote.missionsDate;
                        if (Array.isArray(remote.missions)) {
                            state.missions = DEFAULT_MISSIONS.map(def => {
                                const r = remote.missions.find(x => x.id === def.id);
                                return r ? { ...def, progress: toNum(r.progress, 0), done: !!r.done } : { ...def };
                            });
                        }
                        state.updatedAt = toNum(remote.updatedAt, state.updatedAt);
                        saveStateLocal();
                    }
                }
            }

            // Se a rede trouxe xp null no passado, reconstrói a partir dos claimedDays locais
            sanitizeXpState();
            if (toNum(state.xp, 0) === 0 && state.claimedDays && Object.keys(state.claimedDays).length > 0) {
                // Não recalcula XP antigo automaticamente (já pode ter subido de nível);
                // só garante que não fica null na UI
            }

            ensureFrequencyCycle();
            ensureMissionsDay();
            updateXpUI();
            renderFrequency();
            renderMissions();

            if (currentUserData.pubkey) {
                await syncLiveMissionsFromNetwork(true);
            }

            setInterval(() => {
                if (currentUserData.pubkey) {
                    syncLiveMissionsFromNetwork(true);
                }
            }, LIVE_POLL_MS);

            setInterval(() => {
                const beforeMissed = JSON.stringify(state.missedDays);
                const beforeMissions = state.missionsDate;
                ensureFrequencyCycle();
                ensureMissionsDay();
                if (JSON.stringify(state.missedDays) !== beforeMissed || state.missionsDate !== beforeMissions) {
                    renderFrequency();
                    renderMissions();
                    persistAndSync();
                }
            }, 60 * 1000);
        }

        init();
    </script>
</body>
</html>
