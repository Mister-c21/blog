<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recompensas</title>
    <!-- Tailwind CSS CDN para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',      // Branco
                        secondary: '#7C3AED',    // Violeta (Roxo vibrante)
                        secondaryDark: '#6D28D9',// Violeta escuro para hover
                        darkBg: '#F8FAFC',       // Fundo levemente acinzentado para contraste
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ocultar barra de rolagem padrão mas manter funcionalidade de scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-800 font-sans antialiased min-h-screen flex justify-center">

    <!-- Container principal simulando tela de aplicativo mobile -->
    <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between">
        
        <!-- Conteúdo da Página -->
        <div class="p-5 pb-10">
            
            <!-- Cabeçalho (Com o Contador de Moedas) -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <button class="text-slate-700 text-lg hover:text-secondary transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h1 class="text-xl font-bold tracking-wide">Recompensas</h1>
                </div>
                
                <!-- Contador de moedas no topo -->
                <div class="flex items-center space-x-1.5 bg-amber-50 px-3.5 py-1.5 rounded-full border border-amber-200/50 shadow-sm">
                    <i class="fa-solid fa-coins text-amber-500 text-sm"></i>
                    <span class="text-sm font-extrabold text-amber-800">0</span>
                </div>
            </div>

            <!-- Seção: Minha Frequência (Scroll horizontal até o Dia 7) -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-base text-slate-900">Minha frequência</h2>
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-bell text-slate-400"></i>
                        <!-- Switch toggle personalizado com violeta -->
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" value="" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
                        </label>
                    </div>
                </div>

                <!-- Container com Scroll Horizontal para os Dias 1 a 7 -->
                <div class="flex space-x-2.5 overflow-x-auto no-scrollbar pb-2 mb-4">
                    <!-- Dia 1 (Concluído) -->
                    <div class="bg-secondary text-white rounded-xl p-3.5 flex flex-col items-center justify-center min-w-[75px] shadow-sm flex-shrink-0">
                        <i class="fa-solid fa-check mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">200xp</span>
                        <span class="text-[10px] opacity-80 mt-1">Dia 1</span>
                    </div>
                    <!-- Dia 2 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">250xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 2</span>
                    </div>
                    <!-- Dia 3 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">300xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 3</span>
                    </div>
                    <!-- Dia 4 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">350xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 4</span>
                    </div>
                    <!-- Dia 5 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">400xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 5</span>
                    </div>
                    <!-- Dia 6 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-star text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">450xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 6</span>
                    </div>
                    <!-- Dia 7 -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex flex-col items-center justify-center text-slate-600 min-w-[75px] flex-shrink-0">
                        <i class="fa-solid fa-gift text-secondary mb-1.5 text-sm"></i>
                        <span class="text-xs font-bold">500xp</span>
                        <span class="text-[10px] text-slate-400 mt-1">Dia 7</span>
                    </div>
                </div>

                <!-- Botão de Recompensa -->
                <button class="w-full bg-slate-100 text-slate-400 font-semibold py-3 rounded-xl cursor-not-allowed transition">
                    Pegar recompensa
                </button>
            </div>

            <!-- Seção: Missões Diárias (Novas missões atualizadas) -->
            <div>
                <h2 class="font-bold text-base text-slate-900 mb-4">Missões diárias</h2>

                <div class="space-y-3">
                    <!-- Missão 1: Seguir nossas redes -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">Seguir nossas redes</h3>
                            </div>
                        </div>
                        <button class="bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm">
                            Seguir
                        </button>
                    </div>

                    <!-- Missão 2: Compartilhar a plataforma -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid fa-share-nodes"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">Compartilhar a plataforma</h3>
                            </div>
                        </div>
                        <button class="bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm">
                            Compartilhar
                        </button>
                    </div>

                    <!-- Missão 3: Postar 10 posts -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">Postar 10 posts</h3>
                                <p class="text-[11px] text-slate-400">(0/10)</p>
                            </div>
                        </div>
                        <button class="bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm">
                            Postar
                        </button>
                    </div>

                    <!-- Missão 4: Ficar 30 minutos na plataforma -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid fa-clock"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">Ficar 30 min na plataforma</h3>
                                <p class="text-[11px] text-slate-400">(0/30 min)</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5 bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200/50">
                            <span class="text-xs font-bold text-amber-700">+15</span>
                            <i class="fa-solid fa-coins text-amber-500 text-xs"></i>
                        </div>
                    </div>

                    <!-- Missão 5: Interagir com 70 posts -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-slate-100/60 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-violet-100 text-secondary flex items-center justify-center">
                                <i class="fa-solid fa-heart"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-800">Interagir com 70 posts</h3>
                                <p class="text-[11px] text-slate-400">(0/70)</p>
                            </div>
                        </div>
                        <button class="bg-secondary text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-secondaryDark transition shadow-sm">
                            Interagir
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
