 <script>
 // ========== AUTENTICAÇÃO NOSTR ==========
 (function checkNostrAuth() {
 const LOGIN_PAGE = './Social.html';
 const isLoggedIn = localStorage.getItem('isLoggedIn');
 const session = localStorage.getItem('nostr_session');

 function redirectOutOfIframe(url) {
 try {
 if (window.top && window.top !== window.self) {
 window.top.location.replace(url);
 } else {
 window.location.replace(url);
 }
 } catch (e) {
 window.location.replace(url);
 }
 }

 if (isLoggedIn !== 'true' || !session) {
 redirectOutOfIframe(LOGIN_PAGE);
 return;
 }
 try {
 const p = JSON.parse(session);
 if (!p.privateKeyHex || !p.pubkey) throw new Error('invalid');
 } catch {
 localStorage.removeItem('isLoggedIn');
 localStorage.removeItem('nostr_session');
 redirectOutOfIframe(LOGIN_PAGE);
 }
 })();

 const NOSTR_RELAYS = [
 'wss://relay.damus.io',
 'wss://nos.lol',
 'wss://relay.primal.net',
 'wss://relay.nostr.band'
 ];

 let nostrPool = null;
 let currentUserPubkey = null;

 function getNostrSession() {
 try {
 return JSON.parse(localStorage.getItem('nostr_session') || 'null');
 } catch {
 return null;
 }
 }

 function waitForNostrTools(maxMs = 6000) {
 return new Promise(resolve => {
 if (window.NostrTools) return resolve(true);
 const t0 = Date.now();
 const id = setInterval(() => {
 if (window.NostrTools || Date.now() - t0 > maxMs) {
 clearInterval(id);
 resolve(!!window.NostrTools);
 }
 }, 100);
 });
 }

 async function fetchNostrProfile(pubkey) {
 if (!pubkey || !window.NostrTools) return { name: '', picture: '', about: '' };
 try {
 if (!nostrPool) nostrPool = new NostrTools.SimplePool();
 const ev = await nostrPool.get(NOSTR_RELAYS, { kinds: [0], authors: [pubkey] });
 if (!ev?.content) return { name: '', picture: '', about: '' };
 const d = JSON.parse(ev.content);
 return {
 name: d.name || d.display_name || '',
 picture: d.picture || d.image || '',
 about: d.about || ''
 };
 } catch {
 return { name: '', picture: '', about: '' };
 }
 }

 function formatDisplayName(name, pubkey) {
 if (name && String(name).trim()) {
 const n = String(name).trim();
 return n.startsWith('@') ? n : '@' + n;
 }
 return pubkey ? '@' + pubkey.substring(0, 10) + '…' : '@usuario';
 }

 function updateUserHeader(profile, pubkey) {
 const nameEl = document.getElementById('userDisplayName');
 const avatarEl = document.getElementById('userAvatar');
 const fallbackEl = document.getElementById('userAvatarFallback');

 const displayName = formatDisplayName(profile.name, pubkey);
 nameEl.textContent = displayName;

 if (profile.picture) {
 avatarEl.src = profile.picture;
 avatarEl.classList.remove('hidden');
 fallbackEl.classList.add('hidden');
 avatarEl.onerror = () => {
 avatarEl.classList.add('hidden');
 fallbackEl.classList.remove('hidden');
 fallbackEl.textContent = displayName.replace('@', '').substring(0, 2).toUpperCase();
 };
 } else {
 avatarEl.classList.add('hidden');
 fallbackEl.classList.remove('hidden');
 fallbackEl.textContent = displayName.replace('@', '').substring(0, 2).toUpperCase();
 }
 }

 async function bootNostrUser() {
 const session = getNostrSession();
 if (!session?.pubkey) return;

 currentUserPubkey = session.pubkey;
 await waitForNostrTools();

 if (!window.NostrTools) {
 document.getElementById('userDisplayName').textContent = formatDisplayName('', currentUserPubkey);
 return;
 }

 try {
 nostrPool = new NostrTools.SimplePool();
 const profile = await fetchNostrProfile(currentUserPubkey);
 updateUserHeader(profile, currentUserPubkey);
 } catch (e) {
 console.warn('Erro ao carregar perfil Nostr:', e);
 document.getElementById('userDisplayName').textContent = formatDisplayName('', currentUserPubkey);
 }
 }

 bootNostrUser();

 // ========== SIDEBAR MOBILE ==========
 function openMobileSidebar() {
 const sidebar = document.getElementById('sidebar');
 const overlay = document.getElementById('sidebarOverlay');
 sidebar.classList.remove('-translate-x-full');
 overlay.classList.remove('hidden');
 }

 function closeMobileSidebar() {
 const sidebar = document.getElementById('sidebar');
 const overlay = document.getElementById('sidebarOverlay');
 sidebar.classList.add('-translate-x-full');
 if (window.innerWidth >= 768) {
 sidebar.classList.remove('-translate-x-full');
 }
 overlay.classList.add('hidden');
 }

 window.addEventListener('resize', () => {
 if (window.innerWidth >= 768) {
 document.getElementById('sidebar').classList.remove('-translate-x-full');
 document.getElementById ('sidebarOverlay').classList.add('hidden');
 } else {
 document.getElementById('sidebar').classList.add('-translate-x-full');
 }
 });

 // ========== BUSCA ==========
 function clearSearch() {
 const input = document.getElementById('searchInput');
 const btn = document.getElementById('clearSearchBtn');
 if (input) {
 input.value = '';
 input.focus();
 }
 if (btn) btn.classList.add('hidden');
 }

 function toggleClearSearchBtn() {
 const input = document.getElementById('searchInput');
 const btn = document.getElementById('clearSearchBtn');
 if (!input || !btn) return;
 if (input.value.trim().length > 0) {
 btn.classList.remove('hidden');
 } else {
 btn.classList.add('hidden');
 }
 }

 document.addEventListener('DOMContentLoaded', () => {
 const input = document.getElementById('searchInput');
 if (input) {
 input.addEventListener('input', toggleClearSearchBtn);
 }
 });

 // ========== FUNÇÕES DO CLOUDBOX ==========
 function triggerUpload() {
 document.getElementById('fileInput').click();
 }

 function switchTab(tabName) {
 document.getElementById('content-imagens').classList.add('hidden');
 document.getElementById('content-videos').classList.add('hidden');
 document.getElementById('tab-imagens').className = "font-medium text-gray-500 hover:text-secondary pb-2 transition";
 document.getElementById('tab-videos').className = "font-medium text-gray-500 hover:text-secondary pb-2 transition";
 document.getElementById('content-' + tabName).classList.remove('hidden');
 document.getElementById('tab-' + tabName).className = "font-bold text-secondary border-b-2 border-secondary pb-2 transition";
 }

 function openViewer(src, type, name, size, date) {
 const modal = document.getElementById('fileViewerModal');
 const container = document.getElementById('viewerContentContainer');
 container.innerHTML = '';

 if (type === 'image') {
 container.innerHTML = `<img src="${src}" class="max-h-[75vh] max-w-full object-contain rounded-md" alt="Visualização">`;
 } else {
 container.innerHTML = `<video src="${src}" class="max-h-[75vh] max-w-full rounded-md" controls autoplay playsinline></video>`;
 }

 if (date) {
 const modalDate = document.getElementById('modalDate');
 if (modalDate) modalDate.textContent = date;
 }

 modal.classList.remove('hidden');
 }

 function closeViewer() {
 const modal = document.getElementById('fileViewerModal');
 modal.classList.add('hidden');
 const container = document.getElementById('viewerContentContainer');
 const video = container.querySelector('video');
 if (video) {
 video.pause();
 video.removeAttribute('src');
 video.load();
 }
 container.innerHTML = '';
 }

 function openInfoPanel(name, size, date, type) {
 document.getElementById('infoName').innerText = name;
 document.getElementById('infoSize').innerText = size;
 document.getElementById('infoDate').innerText = date;
 document.getElementById('infoType').innerText = type;
 document.getElementById('infoPanel').classList.remove('translate-y-full');
 }

 function closeInfoPanel() {
 document.getElementById('infoPanel').classList.add('translate-y-full');
 }

 let touchStartY = 0;
 let touchEndY = 0;
 const infoPanel = document.getElementById('infoPanel');

 infoPanel.addEventListener('touchstart', (e) => {
 touchStartY = e.touches[0].clientY;
 }, { passive: true });

 infoPanel.addEventListener('touchmove', (e) => {
 touchEndY = e.touches[0].clientY;
 }, { passive: true });

 infoPanel.addEventListener('touchend', () => {
 if (touchEndY - touchStartY > 50) closeInfoPanel();
 touchStartY = 0;
 touchEndY = 0;
 });

 function handleFileUpload(event) {
 const files = event.target.files;
 if (files.length === 0) return;

 for (let i = 0; i < files.length; i++) {
 const file = files[i];
 const fileSize = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
 const fileName = file.name;
 const fileDate = 'Hoje';
 const objectUrl = URL.createObjectURL(file);
 const safeName = fileName.replace(/'/g, "\\'");

 if (file.name.match(/\.(jpg|png|jpeg|gif|webp|bmp)$/i)) {
 const container = document.querySelector('#content-imagens > div > div');
 const card = document.createElement('div');
 card.className = "relative group aspect-square bg-gray-100 overflow-hidden rounded-lg cursor-pointer";
 card.onclick = () => openViewer(objectUrl, 'image', fileName, fileSize, fileDate);
 card.innerHTML = `
 <img src="${objectUrl}" alt="${safeName}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
 <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex justify-between p-2 items-start" onclick="event.stopPropagation()">
 <span class="text-[10px] text-white bg-black/40 px-1.5 py-0.5 rounded">${fileSize}</span>
 <div class="flex space-x-1">
 <button onclick="openInfoPanel('${safeName}', '${fileSize}', '${fileDate}', 'Imagem')" class="text-white hover:text-violet-300 bg-black/40 p-1 rounded" title="Informações"><i class="fa-solid fa-circle-info text-xs"></i></button>
 </div>
 </div>
 `;
 container.prepend(card);
 } else if (file.name.match(/\.(mp4|mov|avi|webm|mkv)$/i)) {
 const container = document.querySelector('#content-videos > div > div');
 const card = document.createElement('div');
 card.className = "relative group aspect-square bg-gray-900 overflow-hidden rounded-lg cursor-pointer flex items-center justify-center";
 card.onclick = () => openViewer(objectUrl, 'video', fileName, fileSize, fileDate);
 card.innerHTML = `
 <video src="${objectUrl}" class="w-full h-full object-cover" muted preload="metadata"></video>
 <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
 <div class="bg-black/50 rounded-full w-10 h-10 flex items-center justify-center">
 <i class="fa-solid fa-play text-white text-sm"></i>
 </div>
 </div>
 <div class="absolute top-2 right-2 text-white bg-black/60 px-1.5 py-0.5 rounded text-[10px] flex items-center space-x-1">
 <i class="fa-solid fa-play text-[8px]"></i>
 <span>Vídeo</span>
 </div>
 <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex justify-end p-2 items-start space-x-1" onclick="event.stopPropagation()">
 <button onclick="openInfoPanel('${safeName}', '${fileSize}', '${fileDate}', 'Vídeo')" class="text-white hover:text-violet-300 bg-black/40 p-1 rounded" title="Informações"><i class="fa-solid fa-circle-info text-xs"></i></button>
 </div>
 `;
 container.prepend(card);
 } else {
 URL.revokeObjectURL(objectUrl);
 alert('Por favor, envie apenas arquivos de imagem (jpg, png, gif, webp) ou vídeo (mp4, mov, webm).');
 }
 }

 event.target.value = '';
 }
