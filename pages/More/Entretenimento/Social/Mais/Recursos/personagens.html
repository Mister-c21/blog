<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatIA - Converse com Personagens</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',      // Branco
                        secondary: '#7C3AED',    // Violeta (Violet-600)
                        secondaryHover: '#6D28D9', // Violeta mais escuro
                        darkText: '#1F2937'      // Cinza escuro para textos
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-darkText font-sans h-screen w-screen overflow-hidden flex">

    <!-- BARRA LATERAL (LISTA DE PERSONAGENS IA) -->
    <aside class="w-80 bg-primary border-r border-gray-200 flex flex-col h-full z-10">
        <!-- Topo da Barra -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-secondary text-white p-2 rounded-xl text-lg font-bold">🤖</span>
                <h1 class="font-black text-secondary text-lg tracking-tight">Chat<span class="text-darkText font-light">IA</span></h1>
            </div>
            <span class="text-[10px] bg-secondary/10 text-secondary font-bold px-2 py-1 rounded-full uppercase">Pro</span>
        </div>

        <!-- Busca de Personagens -->
        <div class="p-3">
            <input 
                type="text" 
                placeholder="Buscar personagem..." 
                class="w-full bg-gray-50 border border-gray-200 focus:border-secondary focus:bg-white focus:outline-none rounded-xl px-3 py-2 text-xs transition"
            >
        </div>

        <!-- Lista de Personagens -->
        <div class="flex-1 overflow-y-auto px-3 flex flex-col gap-1 pb-4">
            
            <!-- Personagem 1 (Ativo por padrão) -->
            <button onclick="switchCharacter('Luna', '✨', 'Especialista em criatividade, arte e ideias mágicas.', 'Olá! Eu sou a Luna. O que vamos criar juntos hoje?')" 
                id="char-Luna"
                class="character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition bg-secondary/10 border border-secondary/20 text-left group">
                <div class="w-12 h-12 bg-purple-100 rounded-2xl flex items-center justify-center text-2xl shrink-0 shadow-inner">
                    👩‍🎨
                </div>
                <div class="overflow-hidden">
                    <div class="flex justify-between items-center w-full">
                        <h3 class="font-bold text-sm text-darkText truncate">Luna (Criativa)</h3>
                        <span class="text-[10px] text-gray-400">Agora</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate">Olá! Eu sou a Luna...</p>
                </div>
            </button>

            <!-- Personagem 2 -->
            <button onclick="switchCharacter('Kuro', '🚀', 'Seu mentor de tecnologia, programação e inovação.', 'Fala aí! Pronto para programar ou resolver algum bug complexo?')" 
                id="char-Kuro"
                class="character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition hover:bg-gray-50 border border-transparent text-left group">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-2xl shrink-0 shadow-inner">
                    👨‍💻
                </div>
                <div class="overflow-hidden">
                    <div class="flex justify-between items-center w-full">
                        <h3 class="font-bold text-sm text-darkText truncate">Kuro (Tech Dev)</h3>
                        <span class="text-[10px] text-gray-400">10m</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate">Fala aí! Pronto para programar...</p>
                </div>
            </button>

            <!-- Personagem 3 -->
            <button onclick="switchCharacter('Aria', '🧘‍♀️', 'Especialista em bem-estar, conversas profundas e conselhos.', 'Namastê. Como está o seu coração e a sua mente neste momento?')" 
                id="char-Aria"
                class="character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition hover:bg-gray-50 border border-transparent text-left group">
                <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center text-2xl shrink-0 shadow-inner">
                    🌸
                </div>
                <div class="overflow-hidden">
                    <div class="flex justify-between items-center w-full">
                        <h3 class="font-bold text-sm text-darkText truncate">Aria (Mindfulness)</h3>
                        <span class="text-[10px] text-gray-400">1h</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate">Namastê. Como está o seu...</p>
                </div>
            </button>

            <!-- Personagem 4 -->
            <button onclick="switchCharacter('Zack', '🔥', 'Gamer competitivo, sarcástico e super divertido.', 'E aí, noob! Vai encarar uma partida ou veio só conversar?')" 
                id="char-Zack"
                class="character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition hover:bg-gray-50 border border-transparent text-left group">
                <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center text-2xl shrink-0 shadow-inner">
                    🎮
                </div>
                <div class="overflow-hidden">
                    <div class="flex justify-between items-center w-full">
                        <h3 class="font-bold text-sm text-darkText truncate">Zack (Gamer)</h3>
                        <span class="text-[10px] text-gray-400">Ontem</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate">E aí, noob! Vai encarar...</p>
                </div>
            </button>

        </div>
    </aside>

    <!-- ÁREA PRINCIPAL DE CHAT -->
    <main class="flex-1 flex flex-col h-full bg-gray-50 overflow-hidden">
        
        <!-- CABEÇALHO DO CHAT -->
        <header class="bg-primary border-b border-gray-200 px-6 py-3.5 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <div id="header-avatar" class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center text-xl shadow-sm">
                    👩‍🎨
                </div>
                <div>
                    <h2 id="header-name" class="font-bold text-darkText text-sm">Luna (Criativa)</h2>
                    <p id="header-desc" class="text-[11px] text-gray-400">Especialista em criatividade, arte e ideias mágicas.</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-medium text-gray-500">IA Online</span>
            </div>
        </header>

        <!-- MENSAGENS -->
        <div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
            <!-- Mensagem Inicial do Personagem -->
            <div class="flex items-end gap-2">
                <div id="msg-avatar" class="w-8 h-8 bg-purple-100 rounded-xl flex items-center justify-center text-sm shrink-0">
                    👩‍🎨
                </div>
                <div class="max-w-[70%] bg-white border border-gray-200 p-3.5 rounded-2xl rounded-bl-none shadow-sm text-sm text-darkText">
                    <span id="initial-msg">Olá! Eu sou a Luna. O que vamos criar juntos hoje?</span>
                </div>
            </div>
        </div>

        <!-- DIGITAÇÃO DE MENSAGEM -->
        <div class="bg-primary border-t border-gray-200 p-4">
            <form id="chat-form" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex gap-2">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Escreva sua mensagem para a IA..." 
                    autocomplete="off"
                    class="flex-1 bg-gray-50 border border-gray-200 focus:border-secondary focus:bg-white focus:outline-none rounded-2xl px-4 py-3 text-sm transition"
                >
                <button 
                    type="submit" 
                    class="bg-secondary hover:bg-secondaryHover text-white font-semibold px-6 py-3 rounded-2xl transition duration-200 shadow-lg shadow-secondary/20 flex items-center justify-center text-sm">
                    Enviar
                </button>
            </form>
        </div>

    </main>

    <!-- JAVASCRIPT DO SISTEMA DE CHAT -->
    <script>
        let currentCharacter = {
            name: "Luna (Criativa)",
            avatar: "👩‍🎨",
            desc: "Especialista em criatividade, arte e ideias mágicas.",
            welcome: "Olá! Eu sou a Luna. O que vamos criar juntos hoje?",
            id: "Luna"
        };

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');

        function switchCharacter(name, icon, desc, welcome) {
            currentCharacter = { name, avatar: icon, desc, welcome, id: name.split(' ')[0] };

            // Atualiza Header
            document.getElementById('header-name').innerText = name;
            document.getElementById('header-desc').innerText = desc;
            document.getElementById('header-avatar').innerText = icon;

            // Atualiza Estilo da Sidebar (Ativo/Inativo)
            document.querySelectorAll('.character-btn').forEach(btn => {
                btn.className = "character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition hover:bg-gray-50 border border-transparent text-left group";
            });
            document.getElementById(`char-${currentCharacter.id}`).className = "character-btn w-full p-3 rounded-2xl flex items-center gap-3 transition bg-secondary/10 border border-secondary/20 text-left group";

            // Limpa o chat e insere a mensagem de boas-vindas do novo personagem
            chatBox.innerHTML = `
                <div class="flex items-end gap-2">
                    <div class="w-8 h-8 bg-purple-100 rounded-xl flex items-center justify-center text-sm shrink-0">
                        ${icon}
                    </div>
                    <div class="max-w-[70%] bg-white border border-gray-200 p-3.5 rounded-2xl rounded-bl-none shadow-sm text-sm text-darkText">
                        ${welcome}
                    </div>
                </div>
            `;
        }

        function appendMessage(sender, text, isMe = false, avatar = "🤖") {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-end gap-2 ${isMe ? 'justify-end' : 'justify-start'}`;

            if (!isMe) {
                const avatarDiv = document.createElement('div');
                avatarDiv.className = "w-8 h-8 bg-purple-100 rounded-xl flex items-center justify-center text-sm shrink-0";
                avatarDiv.innerText = avatar;
                messageDiv.appendChild(avatarDiv);
            }

            const bubble = document.createElement('div');
            bubble.className = `max-w-[70%] p-3.5 rounded-2xl text-sm shadow-sm ${
                isMe 
                ? 'bg-secondary text-white rounded-br-none shadow-secondary/10' 
                : 'bg-white border border-gray-200 text-darkText rounded-bl-none'
            }`;
            bubble.innerText = text;
            messageDiv.appendChild(bubble);

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage(event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // Envia mensagem do usuário
            appendMessage('Você', text, true);
            messageInput.value = '';

            // Simula resposta da IA baseada no personagem ativo
            setTimeout(() => {
                let resposta = "Entendi perfeitamente! Me conte mais sobre isso.";
                
                if (currentCharacter.id === 'Luna') {
                    const respostasLuna = ["Que ideia fascinante! Podemos explorar texturas e cores nisso.", "Adorei! Isso daria um excelente conceito visual.", "Incrível criatividade! Como você imaginou o próximo passo?"];
                    resposta = respostasLuna[Math.floor(Math.random() * respostasLuna.length)];
                } else if (currentCharacter.id === 'Kuro') {
                    const respostasKuro = ["Isso parece um problema de lógica interessante. Já tentou refatorar essa parte?", "Código limpo e direto ao ponto! Vamos estruturar a arquitetura disso.", "Sem erros por enquanto, bora testar a performance!"];
                    resposta = respostasKuro[Math.floor(Math.random() * respostasKuro.length)];
                } else if (currentCharacter.id === 'Aria') {
                    const respostasAria = ["Respire fundo... Cada passo no seu próprio ritmo é um progresso.", "Compreendo seus sentimentos. O autoconhecimento é uma jornada linda.", "Busque o equilíbrio interior e tudo ficará mais claro."];
                    resposta = respostasAria[Math.floor(Math.random() * respostasAria.length)];
                } else if (currentCharacter.id === 'Zack') {
                    const respostasZack = ["Caramba, essa foi boa! Mas será que você tanka o próximo nível?", "Ez demais! Joga muito.", "Mandou mal nessa jogada hein, foca no objetivo!"];
                    resposta = respostasZack[Math.floor(Math.random() * respostasZack.length)];
                }

                appendMessage(currentCharacter.name, resposta, false, currentCharacter.avatar);
            }, 1200);
        }
    </script>
</body>
</html>
