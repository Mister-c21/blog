<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatAleatório - Vídeo Chamada</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',      // Branco
                        secondary: '#7C3AED',    // Violeta (Violet-600)
                        secondaryHover: '#6D28D9', // Violeta mais escuro
                        darkText: '#1F2937'      // Cinza escuro para textos
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-darkText h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- CONTEÚDO PRINCIPAL (TELA DE VÍDEO CHAMADA ESTILO INSTAGRAM) -->
    <main class="relative flex-1 w-full h-full flex flex-col overflow-hidden bg-primary">
        
        <!-- VÍDEO DO ESTRANHO (Tela Cheia / Fundo) -->
        <div class="absolute inset-0 bg-gray-900 flex items-center justify-center overflow-hidden">
            <div class="text-gray-500 flex flex-col items-center z-0">
                <svg class="w-20 h-20 mb-2 opacity-30 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <!-- Status de Conexão no topo -->
            <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full z-20">
                <div id="stranger-status" class="text-white font-medium animate-pulse text-xs tracking-wider uppercase">
                    Procurando por alguém...
                </div>
            </div>
        </div>

        <!-- SEU VÍDEO (Miniatura flutuante estilo Instagram/FaceTime no canto superior direito) -->
        <div class="absolute top-6 right-6 w-28 h-40 sm:w-36 sm:h-48 bg-gray-800 rounded-2xl border-2 border-white/20 shadow-2xl overflow-hidden flex items-center justify-center z-30 transition-all">
            <span class="absolute top-2 left-2 bg-black/50 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm">Você</span>
            <div class="text-gray-400 flex flex-col items-center">
                <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
        </div>

        <!-- CAMADA DE CONTROLES (Flutuantes na parte inferior) -->
        <div class="absolute bottom-0 left-0 right-0 p-6 flex items-center justify-center z-30 bg-gradient-to-t from-black/80 via-black/40 to-transparent">
            
            <!-- Botão de Pular Centralizado / Destacado -->
            <button id="skip-btn" onclick="handleSkip()" class="bg-secondary hover:bg-secondaryHover text-white font-semibold px-8 py-4 rounded-2xl transition duration-200 text-base flex items-center justify-center gap-2 shadow-xl shadow-secondary/30">
                <span>Pular Conversa</span>
                <span class="text-xs bg-white/20 px-2 py-0.5 rounded">Esc</span>
            </button>

        </div>

    </main>

    <!-- JAVASCRIPT DE SIMULAÇÃO -->
    <script>
        const strangerStatus = document.getElementById('stranger-status');

        // Simula o status inicial de conexão
        setTimeout(() => {
            strangerStatus.innerText = "Conectado";
            strangerStatus.classList.remove("animate-pulse", "text-white");
            strangerStatus.classList.add("text-emerald-400");
        }, 2000);

        function handleSkip() {
            strangerStatus.innerText = "Procurando por alguém...";
            strangerStatus.className = "text-white font-medium animate-pulse text-xs tracking-wider uppercase";

            setTimeout(() => {
                strangerStatus.innerText = "Conectado";
                strangerStatus.classList.remove("animate-pulse", "text-white");
                strangerStatus.classList.add("text-emerald-400");
            }, 2000);
        }
    </script>
</body>
</html>
