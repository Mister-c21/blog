<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePlay - Links</title>
    <link rel="icon" type="image/png" href="./Src/FavicoLP.png">
    <link rel="apple-touch-icon" href="./Src/FavicoLP.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffffff',
                        secondary: '#7c3aed',
                        gblue: '#1a0dab',
                        ggreen: '#006621',
                        gtext: '#4d5156',
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
        body {
            background: #fff;
            color: #202124;
            font-family: Arial, Helvetica, sans-serif;
        }

        .sidebar-link.active {
            background: #f5f3ff;
            color: #7c3aed;
            font-weight: 600;
        }
        .chip {
            white-space: nowrap;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            background: #f1f3f4;
            color: #3c4043;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .chip:hover { background: #e8eaed; }
        .chip.active {
            background: #7c3aed;
            color: #fff;
            border-color: #7c3aed;
        }

        /* Barra de busca mais estreita */
        #searchBoxGoogle {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-radius: 24px;
            border: 1px solid transparent;
            transition: box-shadow 0.15s;
            width: 100%;
            max-width: 280px;
        }
        @media (min-width: 640px) {
            #searchBoxGoogle { max-width: 360px; }
        }
        @media (min-width: 1024px) {
            #searchBoxGoogle { max-width: 420px; }
        }

        /* Resultado estilo Google */
        .g-result {
            max-width: 652px;
            width: 100%;
            margin-bottom: 1.75rem;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .g-result:hover .g-title {
            text-decoration: underline;
        }
        .g-cite {
            color: #202124;
            font-size: 14px;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .g-cite .url-path {
            color: #4d5156;
        }
        .g-title {
            color: #1a0dab;
            font-size: 20px;
            line-height: 1.3;
            font-weight: 400;
            margin: 2px 0 3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        @media (max-width: 640px) {
            .g-title { font-size: 18px; }
        }
        .g-snippet {
            color: #4d5156;
            font-size: 14px;
            line-height: 1.58;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .g-favicon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f1f3f4;
            object-fit: contain;
            flex-shrink: 0;
        }
        .g-meta {
            font-size: 12px;
            color: #70757a;
        }
        .g-badge {
            font-size: 11px;
            color: #7c3aed;
            background: #f5f3ff;
            padding: 1px 8px;
            border-radius: 9999px;
            font-weight: 600;
        }
    </style>
</head>

    <script type="module">
    import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

    const RELAYS = [
        'wss://relay.damus.io',
        'wss://nos.lol',
        'wss://relay.nostr.band',
        'wss://relay.primal.net'
    ];

    const MEDIA_EXT = /\.(png|jpe?g|gif|webp|avif|bmp|mp4|webm|mov|m4v|ogg|mp3|wav|pdf)(\?[^\s]*)?$/i;

    const pool = new NostrTools.SimplePool();
    const profileCache = new Map();

    let allLinks = [];
    let filteredLinks = [];
    let oldestTimestamp = Math.floor(Date.now() / 1000);
    let isLoading = false;
    let activeFilter = '';

    window.closeSidebar = function() {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    };
    document.getElementById('menuToggle')?.addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.toggle('hidden');
    });

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
    }

    function setStatus(html) {
        const el = document.getElementById('statusBar');
        if (el) el.innerHTML = html;
    }

    function timeAgo(ts) {
        const s = Math.floor(Date.now() / 1000) - ts;
        if (s < 60) return 'agora';
        if (s < 3600) return Math.floor(s / 60) + ' min atrás';
        if (s < 86400) return Math.floor(s / 3600) + ' h atrás';
        if (s < 604800) return Math.floor(s / 86400) + ' dias atrás';
        return new Date(ts * 1000).toLocaleDateString('pt-BR');
    }

    function parseUrlParts(url) {
        try {
            const u = new URL(url);
            const host = u.hostname.replace(/^www\./, '');
            let path = u.pathname + u.search;
            if (path.length > 48) path = path.slice(0, 45) + '…';
            return { host, path: path === '/' ? '' : path, origin: u.origin, href: u.href };
        } catch {
            return { host: url.slice(0, 40), path: '', origin: '', href: url };
        }
    }

    function faviconUrl(url) {
        try {
            const host = new URL(url).hostname;
            return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
        } catch {
            return '';
        }
    }

    function makeTitle(content, url) {
        const clean = String(content || '')
            .replace(/https?:\/\/[^\s]+/gi, '')
            .replace(/\s+/g, ' ')
            .trim();
        if (clean.length >= 12) {
            return clean.length > 70 ? clean.slice(0, 67) + '…' : clean;
        }
        const { host, path } = parseUrlParts(url);
        return host + (path || '');
    }

    function makeSnippet(content, url) {
        let clean = String(content || '')
            .replace(url, '')
            .replace(/https?:\/\/[^\s]+/gi, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        if (!clean) return 'Link compartilhado na rede Nostr. Clique para abrir o site.';
        if (clean.length > 180) clean = clean.slice(0, 177) + '…';
        return clean;
    }

    function extractWebLinks(ev) {
        const urls = new Set();
        const content = ev.content || '';
        const matches = content.match(/https?:\/\/[^\s<>"']+/gi) || [];
        matches.forEach(u => {
            const clean = u.replace(/[.,;:!?)]+$/, '');
            if (MEDIA_EXT.test(clean)) return;
            if (!/^https?:\/\//i.test(clean)) return;
            urls.add(clean);
        });
        if (ev.tags) {
            ev.tags.forEach(tag => {
                if ((tag[0] === 'r' || tag[0] === 'url') && tag[1] && /^https?:\/\//i.test(tag[1]) && !MEDIA_EXT.test(tag[1])) {
                    urls.add(tag[1].split(/\s/)[0]);
                }
            });
        }
        return Array.from(urls);
    }

    function eventHashtags(ev) {
        const tags = new Set();
        (ev.tags || []).forEach(t => {
            if (t[0] === 't' && t[1]) tags.add(String(t[1]).toLowerCase());
        });
        const m = String(ev.content || '').match(/#[\p{L}\p{N}_]+/gu) || [];
        m.forEach(h => tags.add(h.slice(1).toLowerCase()));
        return tags;
    }

    async function fetchProfiles(pubkeys) {
        const missing = pubkeys.filter(pk => pk && !profileCache.has(pk));
        if (!missing.length) return;
        try {
            const events = await pool.querySync(RELAYS, {
                kinds: [0],
                authors: missing,
                limit: missing.length
            });
            const latest = new Map();
            (events || []).forEach(ev => {
                const prev = latest.get(ev.pubkey);
                if (!prev || ev.created_at > prev.created_at) latest.set(ev.pubkey, ev);
            });
            latest.forEach((ev, pubkey) => {
                try {
                    const data = JSON.parse(ev.content || '{}');
                    profileCache.set(pubkey, {
                        name: data.name || data.display_name || '',
                        picture: data.picture || data.image || ''
                    });
                } catch {
                    profileCache.set(pubkey, { name: '', picture: '' });
                }
            });
            missing.forEach(pk => {
                if (!profileCache.has(pk)) profileCache.set(pk, { name: '', picture: '' });
            });
        } catch (e) {
            console.error(e);
        }
    }

    function displayName(pubkey) {
        const p = profileCache.get(pubkey);
        if (p?.name) return '@' + p.name;
        return '@' + pubkey.slice(0, 10) + '…';
    }

    async function fetchLinkEvents(until) {
        const filters = [
            { kinds: [1], limit: 100, ...(until ? { until } : {}) }
        ];
        const results = await Promise.allSettled(
            filters.map(f => pool.querySync(RELAYS, f))
        );
        const map = new Map();
        results.forEach(r => {
            if (r.status === 'fulfilled' && r.value) {
                r.value.forEach(ev => map.set(ev.id, ev));
            }
        });
        return Array.from(map.values());
    }

    function eventsToLinkItems(events) {
        const items = [];
        events.forEach(ev => {
            const urls = extractWebLinks(ev);
            if (!urls.length) return;
            urls.forEach((url, i) => {
                items.push({
                    id: ev.id + (i ? '-' + i : ''),
                    eventId: ev.id,
                    pubkey: ev.pubkey,
                    created_at: ev.created_at,
                    content: ev.content || '',
                    url,
                    tags: eventHashtags(ev)
                });
            });
        });
        return items;
    }

    async function loadInitial() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span class="ml-1">Buscando links nos relays Nostr...</span>`);

        try {
            const events = await fetchLinkEvents();
            const items = eventsToLinkItems(events);
            items.sort((a, b) => b.created_at - a.created_at);

            const seen = new Set();
            allLinks = items.filter(v => {
                if (seen.has(v.url)) return false;
                seen.add(v.url);
                return true;
            });

            if (allLinks.length) {
                oldestTimestamp = Math.min(...allLinks.map(v => v.created_at));
            }

            await fetchProfiles([...new Set(allLinks.map(v => v.pubkey))]);
            applyFilter(activeFilter);
            document.getElementById('loadMoreWrap').classList.remove('hidden');

            if (!allLinks.length) {
                setStatus(`<span class="text-gray-500">Nenhum link encontrado. Tente carregar mais.</span>`);
            } else {
                setStatus('');
            }
        } catch (e) {
            console.error(e);
            setStatus(`<span class="text-amber-600">Falha ao conectar aos relays. Recarregue a página.</span>`);
        } finally {
            isLoading = false;
        }
    }

    window.loadMoreLinks = async function() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span class="ml-1">Carregando mais resultados...</span>`);
        try {
            const events = await fetchLinkEvents(oldestTimestamp - 1);
            const items = eventsToLinkItems(events);
            const seen = new Set(allLinks.map(v => v.url));
            const newOnes = items.filter(v => !seen.has(v.url));
            if (newOnes.length) {
                oldestTimestamp = Math.min(oldestTimestamp, ...newOnes.map(v => v.created_at));
                allLinks = allLinks.concat(newOnes).sort((a, b) => b.created_at - a.created_at);
                await fetchProfiles([...new Set(newOnes.map(v => v.pubkey))]);
            }
            applyFilter(activeFilter);
            setStatus('');
        } catch (e) {
            console.error(e);
        } finally {
            isLoading = false;
        }
    };

    function applyFilter(tag) {
        activeFilter = (tag || '').toLowerCase();
        if (!activeFilter) {
            filteredLinks = allLinks.slice();
        } else {
            filteredLinks = allLinks.filter(v => {
                if (v.tags.has(activeFilter)) return true;
                const host = parseUrlParts(v.url).host.toLowerCase();
                return (v.content || '').toLowerCase().includes(activeFilter) || host.includes(activeFilter);
            });
        }
        renderResults();
    }

    window.filterByTag = function(tag) {
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.toggle('active', (c.dataset.filter || '') === (tag || ''));
        });
        applyFilter(tag);
        closeSidebar();
    };

    window.setChipFilter = function(btn, tag) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(tag);
    };

    window.searchLinks = function() {
        const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase().replace(/^#/, '');
        if (!q) {
            applyFilter('');
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', !c.dataset.filter));
            return;
        }
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        filteredLinks = allLinks.filter(v => {
            const name = (profileCache.get(v.pubkey)?.name || '').toLowerCase();
            const host = parseUrlParts(v.url).host.toLowerCase();
            return v.tags.has(q) ||
                (v.content || '').toLowerCase().includes(q) ||
                name.includes(q) ||
                host.includes(q) ||
                v.url.toLowerCase().includes(q);
        });
        renderResults();
    };

    function renderResults() {
        const box = document.getElementById('linkResults');
        const stats = document.getElementById('resultsStats');

        if (!filteredLinks.length) {
            stats.classList.add('hidden');
            box.innerHTML = `
                <div class="py-12 text-gray-500 text-sm max-w-[652px]">
                    <p class="font-medium text-gray-800 mb-1">Nenhum resultado encontrado</p>
                    <p>Tente outra palavra-chave ou carregue mais links da rede.</p>
                </div>`;
            return;
        }

        stats.classList.remove('hidden');
        stats.textContent = `Aproximadamente ${filteredLinks.length} resultado(s) · links da rede Nostr`;

        box.innerHTML = filteredLinks.map(v => {
            const parts = parseUrlParts(v.url);
            const title = makeTitle(v.content, v.url);
            const snippet = makeSnippet(v.content, v.url);
            const fav = faviconUrl(v.url);
            const author = displayName(v.pubkey);
            const when = timeAgo(v.created_at);

            return `
            <article class="g-result">
                <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener noreferrer" class="block group">
                    <div class="flex items-center gap-2 mb-0.5 min-w-0">
                        <img class="g-favicon" src="${escapeHtml(fav)}" alt=""
                             onerror="this.style.visibility='hidden'">
                        <div class="min-w-0 flex-1">
                            <div class="g-cite">
                                <span class="font-normal">${escapeHtml(parts.host)}</span>
                                ${parts.path ? `<span class="url-path"> › ${escapeHtml(parts.path.replace(/^\//, ''))}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <h3 class="g-title group-hover:underline">${escapeHtml(title)}</h3>
                    <p class="g-snippet">${escapeHtml(snippet)}</p>
                </a>
                <div class="g-meta mt-1.5 flex flex-wrap items-center gap-2">
                    <span>${escapeHtml(when)}</span>
                    <span>·</span>
                    <span>compartilhado por ${escapeHtml(author)}</span>
                    <span class="g-badge">Nostr</span>
                </div>
            </article>`;
        }).join('');
    }

    window.addEventListener('scroll', () => {
        if (isLoading) return;
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 400) {
            loadMoreLinks();
        }
    });

    function loadSessionAvatar() {
        try {
            const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
            if (session.avatarUrl) {
                const el = document.getElementById('userAvatarHeader');
                if (el) el.innerHTML = `<img src="${escapeHtml(session.avatarUrl)}" class="w-full h-full object-cover" alt="">`;
            }
        } catch {}
    }

    loadSessionAvatar();
    loadInitial();
    </script>
</body>
</html>
