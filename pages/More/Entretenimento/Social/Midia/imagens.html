 <script type="module">
 import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';

 const RELAYS = [
 'wss://relay.damus.io',
 'wss://nos.lol',
 'wss://relay.nostr.band',
 'wss://relay.primal.net'
 ];

 const IMAGE_EXT = /\.(png|jpe?g|gif|webp|avif|bmp)(\?[^\s]*)?$/i;
 const pool = new NostrTools.SimplePool();
 const profileCache = new Map();

 let allImages = [];
 let filteredImages = [];
 let oldestTimestamp = Math.floor(Date.now() / 1000);
 let isLoading = false;
 let activeFilter = '';
 let scrollYBeforeModal = 0;

 function isMobile() {
 return window.matchMedia('(max-width: 767px)').matches;
 }

 window.closeSidebar = function() {
 document.getElementById('sidebar').classList.add('-translate-x-full');
 document.getElementById('sidebarOverlay').classList.add('hidden');
 };
 document.getElementById('menuToggle')?.addEventListener('click', () => {
 document.getElementById('sidebar').classList.toggle('-translate-x-full');
 document.getElementById('sidebarOverlay').classList.toggle('hidden');
 });

 function escapeHtml(text) {
 const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
 return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
 }

 function setStatus(html) {
 const el = document.getElementById('statusBar');
 if (el) el.innerHTML = html;
 }

 function timeAgo(ts) {
 const s = Math.floor(Date.now() / 1000) - ts;
 if (s < 60) return 'agora';
 if (s < 3600) return Math.floor(s / 60) + ' min';
 if (s < 86400) return Math.floor(s / 3600) + ' h';
 if (s < 604800) return Math.floor(s / 86400) + ' d';
 return new Date(ts * 1000).toLocaleDateString('pt-BR');
 }

 function extractCaption(content, max = 100) {
 const clean = String(content || '')
 .replace(/https?:\/\/[^\s]+/gi, '')
 .replace(/\s+/g, ' ')
 .trim();
 if (!clean) return '';
 return clean.length > max ? clean.slice(0, max) + '…' : clean;
 }

 function extractImageUrls(ev) {
 const urls = new Set();
 if (ev.tags) {
 ev.tags.forEach(tag => {
 if ((tag[0] === 'image' || tag[0] === 'url' || tag[0] === 'r') && tag[1] && IMAGE_EXT.test(tag[1])) {
 urls.add(tag[1].split(/\s/)[0]);
 }
 if (tag[0] === 'imeta') {
 tag.forEach(part => {
 const m = String(part).match(/url\s+(https?:\/\/\S+)/i);
 if (m && IMAGE_EXT.test(m[1])) urls.add(m[1]);
 });
 }
 });
 }
 const content = ev.content || '';
 const matches = content.match(/https?:\/\/[^\s<>"']+/gi) || [];
 matches.forEach(u => {
 const clean = u.replace(/[.,;:!?)]+$/, '');
 if (IMAGE_EXT.test(clean)) urls.add(clean);
 });
 return Array.from(urls);
 }

 function eventHashtags(ev) {
 const tags = new Set();
 (ev.tags || []).forEach(t => {
 if (t[0] === 't' && t[1]) tags.add(String(t[1]).toLowerCase());
 });
 const m = String(ev.content || '').match(/#[\p{L}\p{N}_]+/gu) || [];
 m.forEach(h => tags.add(h.slice(1).toLowerCase()));
 return tags;
 }

 async function fetchProfiles(pubkeys) {
 const missing = pubkeys.filter(pk => pk && !profileCache.has(pk));
 if (!missing.length) return;
 try {
 const events = await pool.querySync(RELAYS, {
 kinds: [0],
 authors: missing,
 limit: missing.length
 });
 const latest = new Map();
 (events || []).forEach(ev => {
 const prev = latest.get(ev.pubkey);
 if (!prev || ev.created_at > prev.created_at) latest.set(ev.pubkey, ev);
 });
 latest.forEach((ev, pubkey) => {
 try {
 const data = JSON.parse(ev.content || '{}');
 profileCache.set(pubkey, {
 name: data.name || data.display_name || '',
 picture: data.picture || data.image || ''
 });
 } catch {
 profileCache.set(pubkey, { name: '', picture: '' });
 }
 });
 missing.forEach(pk => {
 if (!profileCache.has(pk)) profileCache.set(pk, { name: '', picture: '' });
 });
 } catch (e) {
 console.error('Perfis:', e);
 }
 }

 function displayName(pubkey) {
 const p = profileCache.get(pubkey);
 if (p?.name) return '@' + p.name;
 return '@' + pubkey.slice(0, 10) + '…';
 }

 function avatarHtml(pubkey, sizeClass = 'w-7 h-7') {
 const pic = profileCache.get(pubkey)?.picture;
 if (pic) {
 return `<img src="${escapeHtml(pic)}" class="${sizeClass} rounded-full object-cover" alt="" loading="lazy"
 onerror="this.outerHTML='<div class=\\'${sizeClass} rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center\\'><i class=\\'fa-solid fa-user text-[10px] text-secondary\\'></i></div>'">`;
 }
 return `<div class="${sizeClass} rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center shrink-0"><i class="fa-solid fa-user text-[10px] text-secondary"></i></div>`;
 }

 async function fetchImageEvents(until) {
 const filters = [
 { kinds: [1], limit: 100, ...(until ? { until } : {}) },
 { kinds: [1], '#t': ['art'], limit: 40, ...(until ? { until } : {}) },
 { kinds: [1], '#t': ['photography'], limit: 30, ...(until ? { until } : {}) },
 { kinds: [1], '#t': ['image'], limit: 30, ...(until ? { until } : {}) }
 ];
 const results = await Promise.allSettled(
 filters.map(f => pool.querySync(RELAYS, f))
 );
 const map = new Map();
 results.forEach(r => {
 if (r.status === 'fulfilled' && r.value) {
 r.value.forEach(ev => map.set(ev.id, ev));
 }
 });
 return Array.from(map.values());
 }

 function eventsToImageItems(events) {
 const items = [];
 events.forEach(ev => {
 const urls = extractImageUrls(ev);
 if (!urls.length) return;
 urls.forEach((url, i) => {
 items.push({
 id: ev.id + (i ? '-' + i : ''),
 eventId: ev.id,
 pubkey: ev.pubkey,
 created_at: ev.created_at,
 content: ev.content || '',
 imageUrl: url,
 tags: eventHashtags(ev)
 });
 });
 });
 return items;
 }

 async function loadInitial() {
 if (isLoading) return;
 isLoading = true;
 setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary shrink-0"></i><span class="truncate">Buscando imagens nos relays...</span>`);

 try {
 const events = await fetchImageEvents();
 const items = eventsToImageItems(events);
 items.sort((a, b) => b.created_at - a.created_at);

 const seen = new Set();
 allImages = items.filter(v => {
 if (seen.has(v.imageUrl)) return false;
 seen.add(v.imageUrl);
 return true;
 });

 if (allImages.length) {
 oldestTimestamp = Math.min(...allImages.map(v => v.created_at));
 }

 await fetchProfiles([...new Set(allImages.map(v => v.pubkey))]);
 applyFilter(activeFilter);
 document.getElementById('loadMoreWrap').classList.remove('hidden');

 if (!allImages.length) {
 setStatus(`<i class="fa-solid fa-image text-gray-400 shrink-0"></i><span class="truncate">Nenhuma imagem encontrada. Tente carregar mais.</span>`);
 } else {
 setStatus(`<span class="text-gray-500 truncate">${filteredImages.length} imagem(ns) · rede Nostr</span>`);
 }
 } catch (e) {
 console.error(e);
 setStatus(`<i class="fa-solid fa-triangle-exclamation text-amber-500 shrink-0"></i><span class="truncate">Falha ao conectar. Recarregue a página.</span>`);
 } finally {
 isLoading = false;
 }
 }

 window.loadMoreImages = async function() {
 if (isLoading) return;
 isLoading = true;
 setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary shrink-0"></i><span class="truncate">Carregando mais...</span>`);
 try {
 const events = await fetchImageEvents(oldestTimestamp - 1);
 const items = eventsToImageItems(events);
 const seen = new Set(allImages.map(v => v.imageUrl));
 const newOnes = items.filter(v => !seen.has(v.imageUrl));
 if (newOnes.length) {
 oldestTimestamp = Math.min(oldestTimestamp, ...newOnes.map(v => v.created_at));
 allImages = allImages.concat(newOnes).sort((a, b) => b.created_at - a.created_at);
 await fetchProfiles([...new Set(newOnes.map(v => v.pubkey))]);
 }
 applyFilter(activeFilter);
 setStatus(`<span class="text-gray-500 truncate">${filteredImages.length} imagem(ns)</span>`);
 } catch (e) {
 console.error(e);
 } finally {
 isLoading = false;
 }
 };

 function applyFilter(tag) {
 activeFilter = (tag || '').toLowerCase();
 if (!activeFilter) {
 filteredImages = allImages.slice();
 } else {
 filteredImages = allImages.filter(v => {
 if (v.tags.has(activeFilter)) return true;
 return (v.content || '').toLowerCase().includes(activeFilter);
 });
 }
 renderMasonry();
 }

 window.filterByTag = function(tag) {
 document.querySelectorAll('.chip').forEach(c => {
 c.classList.toggle('active', (c.dataset.filter || '') === (tag || ''));
 });
 applyFilter(tag);
 setStatus(`<span class="text-gray-500 truncate">${filteredImages.length} imagem(ns)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
 closeSidebar();
 };

 window.setChipFilter = function(btn, tag) {
 document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
 btn.classList.add('active');
 applyFilter(tag);
 setStatus(`<span class="text-gray-500 truncate">${filteredImages.length} imagem(ns)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
 };

 window.searchImages = function() {
 const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase().replace(/^#/, '');
 if (!q) {
 applyFilter('');
 document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', !c.dataset.filter));
 return;
 }
 document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
 filteredImages = allImages.filter(v => {
 const name = (profileCache.get(v.pubkey)?.name || '').toLowerCase();
 return v.tags.has(q) ||
 (v.content || '').toLowerCase().includes(q) ||
 name.includes(q) ||
 v.imageUrl.toLowerCase().includes(q);
 });
 renderMasonry();
 setStatus(`<span class="text-gray-500 truncate">${filteredImages.length} resultado(s) para “${escapeHtml(q)}”</span>`);
 };

 function renderMasonry() {
 const grid = document.getElementById('imageMasonry');
 if (!filteredImages.length) {
 grid.innerHTML = `
 <div style="column-span: all;" class="text-center py-16 text-gray-400">
 <i class="fa-solid fa-image text-4xl mb-3 opacity-50"></i>
 <p class="text-sm">Nenhuma imagem neste filtro.</p>
 </div>`;
 return;
 }

 grid.innerHTML = filteredImages.map(v => {
 const caption = extractCaption(v.content, 80);
 const name = displayName(v.pubkey);
 return `
 <article class="pin-card group" onclick="openImageModal('${escapeHtml(v.id)}')">
 <div class="relative">
 <img src="${escapeHtml(v.imageUrl)}" alt="${escapeHtml(caption || 'Imagem Nostr')}" loading="lazy"
 onerror="this.closest('.pin-card').style.display='none'">
 <div class="pin-overlay absolute inset-0 pointer-events-none flex flex-col justify-end p-3">
 <p class="text-white text-xs font-medium line-clamp-2 drop-shadow break-words">${escapeHtml(caption || name)}</p>
 </div>
 </div>
 <div class="flex items-center gap-2 px-2.5 py-2 min-w-0">
 ${avatarHtml(v.pubkey)}
 <div class="min-w-0 flex-1">
 <p class="text-[11px] font-semibold text-gray-800 truncate">${escapeHtml(name)}</p>
 <p class="text-[10px] text-gray-400 truncate">${timeAgo(v.created_at)}</p>
 </div>
 </div>
 </article>`;
 }).join('');
 }

 window.openImageModal = function(id) {
 const v = allImages.find(x => x.id === id) || filteredImages.find(x => x.id === id);
 if (!v) return;

 const modal = document.getElementById('imageModal');
 const panel = document.getElementById('imageModalPanel');
 panel.style.transform = '';
 panel.classList.remove('dragging');

 document.getElementById('modalImage').src = v.imageUrl;
 document.getElementById('modalAuthor').textContent = displayName(v.pubkey);
 document.getElementById('modalDate').textContent = timeAgo(v.created_at) + ' · Nostr';
 document.getElementById('modalCaption').textContent = extractCaption(v.content, 400) || 'Sem legenda';
 document.getElementById('modalAvatar').innerHTML = avatarHtml(v.pubkey, 'w-9 h-9');
 document.getElementById('modalOpenOriginal').href = v.imageUrl;

 scrollYBeforeModal = window.scrollY;
 document.body.classList.add('modal-open');
 document.body.style.top = `-${scrollYBeforeModal}px`;

 modal.classList.add('open');
 modal.setAttribute('aria-hidden', 'false');
 };

 window.closeImageModal = function() {
 const modal = document.getElementById('imageModal');
 const panel = document.getElementById('imageModalPanel');

 document.getElementById('modalImage').removeAttribute('src');
 panel.style.transform = '';
 panel.classList.remove('dragging');

 modal.classList.remove('open');
 modal.setAttribute('aria-hidden', 'true');

 document.body.classList.remove('modal-open');
 document.body.style.top = '';
 window.scrollTo(0, scrollYBeforeModal);
 };

 document.addEventListener('keydown', (e) => {
 if (e.key === 'Escape' && !isMobile()) closeImageModal();
 });

 (function setupMobileSwipeClose() {
 const panel = document.getElementById('imageModalPanel');
 const handle = document.getElementById('modalDragHandle');
 if (!panel || !handle) return;

 let startY = 0;
 let currentY = 0;
 let dragging = false;

 function onStart(clientY) {
 if (!isMobile()) return;
 if (!document.getElementById('imageModal').classList.contains('open')) return;
 dragging = true;
 startY = clientY;
 currentY = 0;
 panel.classList.add('dragging');
 }

 function onMove(clientY) {
 if (!dragging) return;
 currentY = Math.max(0, clientY - startY);
 panel.style.transform = `translateY(${currentY}px)`;
 }

 function onEnd() {
 if (!dragging) return;
 dragging = false;
 panel.classList.remove('dragging');
 const threshold = Math.min(140, window.innerHeight * 0.22);
 if (currentY >= threshold) {
 panel.style.transition = 'transform 0.28s ease-out';
 panel.style.transform = 'translateY(100%)';
 setTimeout(() => {
 panel.style.transition = '';
 closeImageModal();
 }, 280);
 } else {
 panel.style.transition = 'transform 0.25s ease-out';
 panel.style.transform = 'translateY(0)';
 setTimeout(() => {
 panel.style.transition = '';
 panel.style.transform = '';
 }, 250);
 }
 currentY = 0;
 }

 [handle, panel.querySelector('.border-b.border-gray-100')].forEach(el => {
 if (!el) return;
 el.addEventListener('touchstart', (e) => { if (e.touches[0]) onStart(e.touches[0].clientY); }, { passive: true });
 el.addEventListener('touchmove', (e) => { if (dragging && e.touches[0]) onMove(e.touches[0].clientY); }, { passive: true });
 el.addEventListener('touchend', onEnd);
 el.addEventListener('touchcancel', onEnd);
 });
 })();

 window.addEventListener('scroll', () => {
 if (isLoading) return;
 if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 400) {
 loadMoreImages();
 }
 });

 function loadSessionAvatar() {
 try {
 const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
 if (session.avatarUrl) {
 const el = document.getElementById('userAvatarHeader');
 if (el) el.innerHTML = `<img src="${escapeHtml(session.avatarUrl)}" class="w-full h-full object-cover" alt="">`;
 }
 } catch {}
 }

 loadSessionAvatar();
 loadInitial();
 </script>
</body>
