<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePlay - Vídeos</title>
    <link rel="icon" type="image/png" href="./Src/FavicoLP.png">
    <link rel="apple-touch-icon" href="./Src/FavicoLP.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffffff',
                        secondary: '#7c3aed',
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            background: #ffffff;
            color: #1f2937;
        }
        .video-thumb {
            aspect-ratio: 16 / 9;
            background: #f3f4f6;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }
        .video-thumb video,
        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-thumb .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .video-card:hover .play-overlay { opacity: 1; }
        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .sidebar-link.active {
            background: #f5f3ff;
            color: #7c3aed;
            font-weight: 600;
        }
        .chip {
            white-space: nowrap;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .chip:hover { background: #e5e7eb; }
        .chip.active {
            background: #7c3aed;
            color: #ffffff;
        }

        /* ========== Modal fullscreen + slide mobile ========== */
        #videoModal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #videoModal.open {
            opacity: 1;
            pointer-events: auto;
        }
        #videoModalBackdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(2px);
        }
        #videoModalPanel {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            max-height: 100%;
            margin: 0;
            background: #ffffff;
            border-radius: 0;
            border: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: none;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
        }
        #videoModal.open #videoModalPanel {
            transform: translateY(0);
        }
        /* Desktop: centralizado com cantos leves, ainda quase tela cheia */
        @media (min-width: 768px) {
            #videoModal {
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            #videoModalPanel {
                width: 100%;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                transform: translateY(100%);
            }
            #videoModal.open #videoModalPanel {
                transform: translateY(0);
            }
        }
        #videoModalPanel.dragging {
            transition: none;
        }
        #videoModalPlayer {
            flex-shrink: 0;
            background: #000;
        }
        #videoModalPlayer video {
            width: 100%;
            max-height: min(56vh, 100%);
            background: #000;
            display: block;
        }
        @media (max-width: 767px) {
            #videoModalPlayer video {
                max-height: 42vh;
            }
        }
        /* Handle de arraste (mobile) */
        #modalDragHandle {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 4px;
            cursor: grab;
            touch-action: none;
            user-select: none;
            flex-shrink: 0;
        }
        @media (max-width: 767px) {
            #modalDragHandle {
                display: flex;
            }
        }
        #modalDragHandle .handle-bar {
            width: 40px;
            height: 4px;
            border-radius: 9999px;
            background: #d1d5db;
        }
        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
            left: 0;
            right: 0;
        }
        /* No mobile: esconder botão X — fecha só com swipe */
        @media (max-width: 767px) {
            #modalCloseBtn {
                display: none !important;
            }
        }
    </style>
</head>

    <script type="module">
    import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
    import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

    const RELAYS = [
        'wss://relay.damus.io',
        'wss://nos.lol',
        'wss://relay.nostr.band',
        'wss://relay.primal.net'
    ];

    const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogg)(\?[^\s]*)?$/i;
    const pool = new NostrTools.SimplePool();
    const profileCache = new Map();

    let allVideos = [];
    let filteredVideos = [];
    let oldestTimestamp = Math.floor(Date.now() / 1000);
    let isLoading = false;
    let activeFilter = '';
    let currentPlayingId = null;
    let scrollYBeforeModal = 0;

    function isMobile() {
        return window.matchMedia('(max-width: 767px)').matches;
    }

    window.closeSidebar = function() {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    };
    document.getElementById('menuToggle')?.addEventListener('click', () => {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        sb.classList.toggle('-translate-x-full');
        ov.classList.toggle('hidden');
    });

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
    }

    function setStatus(html) {
        const el = document.getElementById('statusBar');
        if (el) el.innerHTML = html;
    }

    function timeAgo(ts) {
        const s = Math.floor(Date.now() / 1000) - ts;
        if (s < 60) return 'agora';
        if (s < 3600) return Math.floor(s / 60) + ' min';
        if (s < 86400) return Math.floor(s / 3600) + ' h';
        if (s < 604800) return Math.floor(s / 86400) + ' d';
        return new Date(ts * 1000).toLocaleDateString('pt-BR');
    }

    function extractTitle(content, max = 80) {
        const clean = String(content || '')
            .replace(/https?:\/\/[^\s]+/gi, '')
            .replace(/\s+/g, ' ')
            .trim();
        if (!clean) return 'Vídeo Nostr';
        return clean.length > max ? clean.slice(0, max) + '…' : clean;
    }

    function extractVideoUrls(ev) {
        const urls = new Set();
        if (ev.tags) {
            ev.tags.forEach(tag => {
                if ((tag[0] === 'video' || tag[0] === 'url' || tag[0] === 'r' || tag[0] === 'imeta') && tag[1] && VIDEO_EXT.test(tag[1])) {
                    urls.add(tag[1].split(/\s/)[0]);
                }
                if (tag[0] === 'imeta') {
                    tag.forEach(part => {
                        const m = String(part).match(/url\s+(https?:\/\/\S+)/i);
                        if (m && VIDEO_EXT.test(m[1])) urls.add(m[1]);
                    });
                }
            });
        }
        const content = ev.content || '';
        const matches = content.match(/https?:\/\/[^\s<>"']+/gi) || [];
        matches.forEach(u => {
            const clean = u.replace(/[.,;:!?)]+$/, '');
            if (VIDEO_EXT.test(clean)) urls.add(clean);
        });
        return Array.from(urls);
    }

    function eventHashtags(ev) {
        const tags = new Set();
        (ev.tags || []).forEach(t => {
            if (t[0] === 't' && t[1]) tags.add(String(t[1]).toLowerCase());
        });
        const m = String(ev.content || '').match(/#[\p{L}\p{N}_]+/gu) || [];
        m.forEach(h => tags.add(h.slice(1).toLowerCase()));
        return tags;
    }

    async function fetchProfiles(pubkeys) {
        const missing = pubkeys.filter(pk => pk && !profileCache.has(pk));
        if (!missing.length) return;
        try {
            const events = await pool.querySync(RELAYS, {
                kinds: [0],
                authors: missing,
                limit: missing.length
            });
            const latest = new Map();
            (events || []).forEach(ev => {
                const prev = latest.get(ev.pubkey);
                if (!prev || ev.created_at > prev.created_at) latest.set(ev.pubkey, ev);
            });
            latest.forEach((ev, pubkey) => {
                try {
                    const data = JSON.parse(ev.content || '{}');
                    profileCache.set(pubkey, {
                        name: data.name || data.display_name || '',
                        picture: data.picture || data.image || ''
                    });
                } catch {
                    profileCache.set(pubkey, { name: '', picture: '' });
                }
            });
            missing.forEach(pk => {
                if (!profileCache.has(pk)) profileCache.set(pk, { name: '', picture: '' });
            });
        } catch (e) {
            console.error('Perfis:', e);
        }
    }

    function displayName(pubkey) {
        const p = profileCache.get(pubkey);
        if (p?.name) return '@' + p.name;
        return '@' + pubkey.slice(0, 10) + '…';
    }

    function avatarHtml(pubkey, sizeClass = 'w-9 h-9') {
        const pic = profileCache.get(pubkey)?.picture;
        if (pic) {
            return `<img src="${escapeHtml(pic)}" class="${sizeClass} rounded-full object-cover" alt="" loading="lazy"
                onerror="this.outerHTML='<div class=\\'${sizeClass} rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center\\'><i class=\\'fa-solid fa-user text-xs text-secondary\\'></i></div>'">`;
        }
        return `<div class="${sizeClass} rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center shrink-0"><i class="fa-solid fa-user text-xs text-secondary"></i></div>`;
    }

    async function fetchVideoEvents(until) {
        const filters = [
            { kinds: [1], limit: 80, ...(until ? { until } : {}) },
            { kinds: [1], '#t': ['video'], limit: 40, ...(until ? { until } : {}) },
            { kinds: [1], '#t': ['videos'], limit: 20, ...(until ? { until } : {}) }
        ];
        const results = await Promise.allSettled(
            filters.map(f => pool.querySync(RELAYS, f))
        );
        const map = new Map();
        results.forEach(r => {
            if (r.status === 'fulfilled' && r.value) {
                r.value.forEach(ev => map.set(ev.id, ev));
            }
        });
        return Array.from(map.values());
    }

    function eventsToVideoItems(events) {
        const items = [];
        events.forEach(ev => {
            const urls = extractVideoUrls(ev);
            if (!urls.length) return;
            urls.forEach((url, i) => {
                items.push({
                    id: ev.id + (i ? '-' + i : ''),
                    eventId: ev.id,
                    pubkey: ev.pubkey,
                    created_at: ev.created_at,
                    content: ev.content || '',
                    videoUrl: url,
                    tags: eventHashtags(ev)
                });
            });
        });
        return items;
    }

    async function loadInitial() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span>Buscando vídeos nos relays...</span>`);

        try {
            const events = await fetchVideoEvents();
            const items = eventsToVideoItems(events);
            items.sort((a, b) => b.created_at - a.created_at);

            const seen = new Set();
            allVideos = items.filter(v => {
                if (seen.has(v.videoUrl)) return false;
                seen.add(v.videoUrl);
                return true;
            });

            if (allVideos.length) {
                oldestTimestamp = Math.min(...allVideos.map(v => v.created_at));
            }

            const pubs = [...new Set(allVideos.map(v => v.pubkey))];
            await fetchProfiles(pubs);

            applyFilter(activeFilter);
            document.getElementById('loadMoreWrap').classList.remove('hidden');

            if (!allVideos.length) {
                setStatus(`<i class="fa-solid fa-video-slash text-gray-400"></i><span>Nenhum vídeo encontrado. Tente carregar mais ou outro filtro.</span>`);
            } else {
                setStatus(`<span class="text-gray-500">${filteredVideos.length} vídeo(s) · rede Nostr</span>`);
            }
        } catch (e) {
            console.error(e);
            setStatus(`<i class="fa-solid fa-triangle-exclamation text-amber-500"></i><span>Falha ao conectar. Recarregue a página.</span>`);
        } finally {
            isLoading = false;
        }
    }

    window.loadMoreVideos = async function() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span>Carregando mais...</span>`);
        try {
            const events = await fetchVideoEvents(oldestTimestamp - 1);
            const items = eventsToVideoItems(events);
            const seen = new Set(allVideos.map(v => v.videoUrl));
            const newOnes = items.filter(v => !seen.has(v.videoUrl));
            if (newOnes.length) {
                oldestTimestamp = Math.min(oldestTimestamp, ...newOnes.map(v => v.created_at));
                allVideos = allVideos.concat(newOnes).sort((a, b) => b.created_at - a.created_at);
                await fetchProfiles([...new Set(newOnes.map(v => v.pubkey))]);
            }
            applyFilter(activeFilter);
            setStatus(`<span class="text-gray-500">${filteredVideos.length} vídeo(s)</span>`);
        } catch (e) {
            console.error(e);
        } finally {
            isLoading = false;
        }
    };

    function applyFilter(tag) {
        activeFilter = (tag || '').toLowerCase();
        if (!activeFilter) {
            filteredVideos = allVideos.slice();
        } else {
            filteredVideos = allVideos.filter(v => {
                if (v.tags.has(activeFilter)) return true;
                return (v.content || '').toLowerCase().includes(activeFilter);
            });
        }
        renderGrid();
        if (currentPlayingId) renderRelated();
    }

    window.filterByTag = function(tag) {
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.toggle('active', (c.dataset.filter || '') === (tag || ''));
        });
        applyFilter(tag);
        setStatus(`<span class="text-gray-500">${filteredVideos.length} vídeo(s)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
        closeSidebar();
    };

    window.setChipFilter = function(btn, tag) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(tag);
        setStatus(`<span class="text-gray-500">${filteredVideos.length} vídeo(s)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
    };

    window.searchVideos = function() {
        const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase().replace(/^#/, '');
        if (!q) {
            applyFilter('');
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', !c.dataset.filter));
            return;
        }
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        filteredVideos = allVideos.filter(v => {
            const name = (profileCache.get(v.pubkey)?.name || '').toLowerCase();
            return v.tags.has(q) ||
                (v.content || '').toLowerCase().includes(q) ||
                name.includes(q) ||
                v.videoUrl.toLowerCase().includes(q);
        });
        renderGrid();
        setStatus(`<span class="text-gray-500">${filteredVideos.length} resultado(s) para “${escapeHtml(q)}”</span>`);
    };

    function renderGrid() {
        const grid = document.getElementById('videoGrid');
        if (!filteredVideos.length) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-16 text-gray-400">
                    <i class="fa-solid fa-video-slash text-4xl mb-3 opacity-50"></i>
                    <p class="text-sm">Nenhum vídeo neste filtro.</p>
                </div>`;
            return;
        }

        grid.innerHTML = filteredVideos.map(v => {
            const title = extractTitle(v.content);
            const name = displayName(v.pubkey);
            return `
            <article class="video-card cursor-pointer group bg-white rounded-2xl border border-gray-100 p-2 shadow-sm hover:shadow-md hover:border-secondary/20 transition" onclick="playVideo('${escapeHtml(v.id)}')">
                <div class="video-thumb border border-gray-100">
                    <video src="${escapeHtml(v.videoUrl)}" muted preload="metadata" playsinline
                           onloadeddata="this.currentTime=0.1"></video>
                    <div class="play-overlay">
                        <div class="w-12 h-12 rounded-full bg-secondary/90 flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-play text-white ml-0.5"></i>
                        </div>
                    </div>
                    <span class="duration-badge"><i class="fa-solid fa-play text-[9px] mr-1"></i>Vídeo</span>
                </div>
                <div class="flex gap-3 mt-3 px-1 pb-1">
                    ${avatarHtml(v.pubkey)}
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-semibold text-gray-900 line-clamp-2 leading-snug group-hover:text-secondary transition">${escapeHtml(title)}</h3>
                        <p class="text-xs text-gray-500 mt-1 truncate">${escapeHtml(name)}</p>
                        <p class="text-[11px] text-gray-400">${timeAgo(v.created_at)}</p>
                    </div>
                </div>
            </article>`;
        }).join('');
    }

    function renderRelated() {
        const list = document.getElementById('relatedList');
        if (!list) return;
        const others = filteredVideos.filter(v => v.id !== currentPlayingId).slice(0, 12);
        list.innerHTML = others.map(v => `
            <button type="button" onclick="playVideo('${escapeHtml(v.id)}')"
                    class="flex gap-2 w-full text-left hover:bg-gray-50 rounded-lg p-1.5 transition border border-transparent hover:border-gray-100">
                <div class="w-40 shrink-0 aspect-video rounded-lg overflow-hidden bg-gray-100 border border-gray-100">
                    <video src="${escapeHtml(v.videoUrl)}" muted preload="metadata" class="w-full h-full object-cover"
                           onloadeddata="this.currentTime=0.1"></video>
                </div>
                <div class="min-w-0 flex-1 py-0.5">
                    <p class="text-xs font-semibold text-gray-900 line-clamp-2 leading-snug">${escapeHtml(extractTitle(v.content, 60))}</p>
                    <p class="text-[11px] text-gray-500 mt-1 truncate">${escapeHtml(displayName(v.pubkey))}</p>
                    <p class="text-[10px] text-gray-400">${timeAgo(v.created_at)}</p>
                </div>
            </button>
        `).join('') || '<p class="text-xs text-gray-400">Nenhum outro vídeo.</p>';
    }

    window.playVideo = function(id) {
        const v = allVideos.find(x => x.id === id) || filteredVideos.find(x => x.id === id);
        if (!v) return;
        currentPlayingId = v.id;

        const modal = document.getElementById('videoModal');
        const panel = document.getElementById('videoModalPanel');
        const playerEl = document.getElementById('videoModalPlayer');

        panel.style.transform = '';
        panel.classList.remove('dragging');

        playerEl.innerHTML = `
            <video src="${escapeHtml(v.videoUrl)}" controls autoplay playsinline></video>`;

        document.getElementById('playerTitle').textContent = extractTitle(v.content, 120);
        document.getElementById('playerAuthor').textContent = displayName(v.pubkey);
        document.getElementById('playerDate').textContent = timeAgo(v.created_at) + ' · Nostr';
        document.getElementById('playerDescription').textContent = v.content || '';
        document.getElementById('playerAvatar').innerHTML = avatarHtml(v.pubkey, 'w-10 h-10');

        renderRelated();

        scrollYBeforeModal = window.scrollY;
        document.body.classList.add('modal-open');
        document.body.style.top = `-${scrollYBeforeModal}px`;

        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
    };

    window.closePlayer = function() {
        currentPlayingId = null;
        const modal = document.getElementById('videoModal');
        const panel = document.getElementById('videoModalPanel');
        const playerEl = document.getElementById('videoModalPlayer');

        const vid = playerEl?.querySelector('video');
        if (vid) {
            vid.pause();
            vid.removeAttribute('src');
            vid.load();
        }
        if (playerEl) playerEl.innerHTML = '';

        panel.style.transform = '';
        panel.classList.remove('dragging');

        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');

        document.body.classList.remove('modal-open');
        document.body.style.top = '';
        window.scrollTo(0, scrollYBeforeModal);
    };

    // Desktop: Esc fecha. Mobile: NÃO fecha com Esc (só swipe).
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !isMobile()) closePlayer();
    });

    // ——— Swipe para baixo no mobile (única forma de fechar) ———
    (function setupMobileSwipeClose() {
        const panel = document.getElementById('videoModalPanel');
        const handle = document.getElementById('modalDragHandle');
        if (!panel || !handle) return;

        let startY = 0;
        let currentY = 0;
        let dragging = false;

        function onStart(clientY) {
            if (!isMobile()) return;
            if (!document.getElementById('videoModal').classList.contains('open')) return;
            dragging = true;
            startY = clientY;
            currentY = 0;
            panel.classList.add('dragging');
        }

        function onMove(clientY) {
            if (!dragging) return;
            const dy = clientY - startY;
            // só arrasta para baixo
            currentY = Math.max(0, dy);
            panel.style.transform = `translateY(${currentY}px)`;
        }

        function onEnd() {
            if (!dragging) return;
            dragging = false;
            panel.classList.remove('dragging');

            const threshold = Math.min(140, window.innerHeight * 0.22);
            if (currentY >= threshold) {
                // anima até o fundo e fecha
                panel.style.transition = 'transform 0.28s ease-out';
                panel.style.transform = 'translateY(100%)';
                setTimeout(() => {
                    panel.style.transition = '';
                    closePlayer();
                }, 280);
            } else {
                // volta para cima
                panel.style.transition = 'transform 0.25s ease-out';
                panel.style.transform = 'translateY(0)';
                setTimeout(() => {
                    panel.style.transition = '';
                    panel.style.transform = '';
                }, 250);
            }
            currentY = 0;
        }

        handle.addEventListener('touchstart', (e) => {
            if (e.touches[0]) onStart(e.touches[0].clientY);
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
            if (!dragging || !e.touches[0]) return;
            onMove(e.touches[0].clientY);
        }, { passive: true });

        handle.addEventListener('touchend', onEnd);
        handle.addEventListener('touchcancel', onEnd);

        // Também permite iniciar o arraste no cabeçalho (área do título)
        const headerBar = panel.querySelector('.border-b.border-gray-100');
        if (headerBar) {
            headerBar.addEventListener('touchstart', (e) => {
                if (e.touches[0]) onStart(e.touches[0].clientY);
            }, { passive: true });
            headerBar.addEventListener('touchmove', (e) => {
                if (!dragging || !e.touches[0]) return;
                onMove(e.touches[0].clientY);
            }, { passive: true });
            headerBar.addEventListener('touchend', onEnd);
            headerBar.addEventListener('touchcancel', onEnd);
        }
    })();

    function loadSessionAvatar() {
        try {
            const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
            if (session.avatarUrl) {
                const el = document.getElementById('userAvatarHeader');
                if (el) el.innerHTML = `<img src="${escapeHtml(session.avatarUrl)}" class="w-full h-full object-cover" alt="">`;
            }
        } catch {}
    }

    loadSessionAvatar();
    loadInitial();
    </script>
</body>
