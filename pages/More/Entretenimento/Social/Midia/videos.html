<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePlay - Vídeos</title>
    <link rel="icon" type="image/png" href="./Src/FavicoLP.png">
    <link rel="apple-touch-icon" href="./Src/FavicoLP.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffffff',
                        secondary: '#7c3aed',
                        yt: {
                            bg: '#0f0f0f',
                            card: '#212121',
                            hover: '#272727',
                            text: '#f1f1f1',
                            muted: '#aaaaaa',
                            border: '#303030'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background: #0f0f0f; color: #f1f1f1; }
        .video-thumb {
            aspect-ratio: 16 / 9;
            background: #212121;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }
        .video-thumb video,
        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-thumb .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .video-card:hover .play-overlay { opacity: 1; }
        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .sidebar-link.active {
            background: #272727;
            font-weight: 600;
        }
        #mainPlayer video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
        }
        .chip {
            white-space: nowrap;
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            background: #272727;
            color: #f1f1f1;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .chip:hover { background: #3f3f3f; }
        .chip.active {
            background: #f1f1f1;
            color: #0f0f0f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top bar estilo YouTube -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-md border-b border-[#303030]">
        <div class="flex items-center gap-3 px-3 md:px-4 h-14">
            <button type="button" id="menuToggle" class="w-10 h-10 rounded-full hover:bg-[#272727] flex items-center justify-center text-yt-text md:hidden" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="Index.html" class="flex items-center gap-2 shrink-0 mr-2">
                <i class="fa-solid fa-feather text-secondary text-xl"></i>
                <span class="font-bold text-lg tracking-tight hidden sm:inline">Lore<span class="text-secondary">Videos</span></span>
            </a>

            <div class="flex-1 max-w-2xl mx-auto flex items-center gap-2">
                <div class="flex flex-1 items-center bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-secondary/60">
                    <input type="search" id="searchInput" placeholder="Pesquisar vídeos Nostr..."
                           class="flex-1 bg-transparent px-4 py-2 text-sm text-yt-text placeholder:text-yt-muted outline-none"
                           onkeydown="if(event.key==='Enter') searchVideos()">
                    <button type="button" onclick="searchVideos()" class="px-4 py-2 bg-[#222] hover:bg-[#333] border-l border-[#303030] text-yt-muted">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-1 shrink-0">
                <a href="Index.html" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-[#272727] text-sm text-yt-muted hover:text-white transition" title="Voltar ao Feed">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden lg:inline">Feed</span>
                </a>
                <a href="imagens.html" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-[#272727] text-sm text-yt-muted hover:text-white transition">
                    <i class="fa-solid fa-image"></i>
                    <span class="hidden lg:inline">Imagens</span>
                </a>
                <div id="userAvatarHeader" class="w-8 h-8 rounded-full bg-[#303030] flex items-center justify-center text-secondary text-sm overflow-hidden ml-1">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 min-h-0">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:sticky top-14 left-0 z-40 h-[calc(100vh-3.5rem)] w-60 bg-[#0f0f0f] border-r border-[#303030] p-3 transform -translate-x-full md:translate-x-0 transition-transform duration-200 overflow-y-auto no-scrollbar">
            <nav class="space-y-1">
                <a href="Index.html" class="sidebar-link flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition">
                    <i class="fa-solid fa-house w-5 text-center"></i> Início (Feed)
                </a>
                <a href="videos.html" class="sidebar-link active flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition">
                    <i class="fa-solid fa-play w-5 text-center text-secondary"></i> Vídeos
                </a>
                <a href="imagens.html" class="sidebar-link flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition">
                    <i class="fa-solid fa-image w-5 text-center"></i> Imagens
                </a>
                <div class="border-t border-[#303030] my-3"></div>
                <p class="px-3 text-[11px] uppercase tracking-wider text-yt-muted font-semibold mb-1">Explorar</p>
                <button type="button" onclick="filterByTag('')" class="sidebar-link w-full flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition text-left">
                    <i class="fa-solid fa-fire w-5 text-center"></i> Em alta
                </button>
                <button type="button" onclick="filterByTag('nostr')" class="sidebar-link w-full flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition text-left">
                    <i class="fa-solid fa-hashtag w-5 text-center"></i> #nostr
                </button>
                <button type="button" onclick="filterByTag('video')" class="sidebar-link w-full flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm text-yt-text hover:bg-[#272727] transition text-left">
                    <i class="fa-solid fa-film w-5 text-center"></i> #video
                </button>
            </nav>
            <p class="px-3 mt-6 text-[11px] text-yt-muted">Vídeos da rede Nostr · LoreSocial</p>
        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden" onclick="closeSidebar()"></div>

        <!-- Conteúdo principal -->
        <main class="flex-1 min-w-0 p-3 md:p-5 pb-20">
            <!-- Chips de filtro -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-1">
                <button type="button" class="chip active" data-filter="" onclick="setChipFilter(this, '')">Todos</button>
                <button type="button" class="chip" data-filter="nostr" onclick="setChipFilter(this, 'nostr')">Nostr</button>
                <button type="button" class="chip" data-filter="bitcoin" onclick="setChipFilter(this, 'bitcoin')">Bitcoin</button>
                <button type="button" class="chip" data-filter="video" onclick="setChipFilter(this, 'video')">Video</button>
                <button type="button" class="chip" data-filter="music" onclick="setChipFilter(this, 'music')">Música</button>
                <button type="button" class="chip" data-filter="art" onclick="setChipFilter(this, 'art')">Arte</button>
            </div>

            <!-- Player em destaque (quando um vídeo é selecionado) -->
            <section id="playerSection" class="hidden mb-6">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
                    <div class="xl:col-span-2 space-y-3">
                        <div id="mainPlayer" class="bg-black rounded-xl overflow-hidden border border-[#303030]">
                            <!-- video injetado via JS -->
                        </div>
                        <h1 id="playerTitle" class="text-lg md:text-xl font-bold text-yt-text leading-snug"></h1>
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                <div id="playerAvatar" class="w-10 h-10 rounded-full bg-[#303030] flex items-center justify-center overflow-hidden shrink-0"></div>
                                <div class="min-w-0">
                                    <p id="playerAuthor" class="font-semibold text-sm truncate"></p>
                                    <p id="playerDate" class="text-xs text-yt-muted"></p>
                                </div>
                            </div>
                            <button type="button" onclick="closePlayer()" class="px-3 py-1.5 rounded-full bg-[#272727] hover:bg-[#3f3f3f] text-xs font-medium">
                                <i class="fa-solid fa-xmark mr-1"></i> Fechar player
                            </button>
                        </div>
                        <div id="playerDescription" class="text-sm text-yt-muted bg-[#212121] rounded-xl p-3 whitespace-pre-wrap break-words max-h-40 overflow-y-auto"></div>
                    </div>
                    <div class="xl:col-span-1">
                        <h2 class="text-sm font-semibold text-yt-muted mb-3 uppercase tracking-wide">Mais vídeos</h2>
                        <div id="relatedList" class="space-y-3 max-h-[70vh] overflow-y-auto no-scrollbar"></div>
                    </div>
                </div>
            </section>

            <!-- Grade de vídeos -->
            <section id="gridSection">
                <div id="statusBar" class="flex items-center gap-2 text-sm text-yt-muted mb-4">
                    <i class="fa-solid fa-spinner fa-spin text-secondary"></i>
                    <span>Conectando aos relays Nostr...</span>
                </div>
                <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-6">
                    <!-- cards -->
                </div>
                <div id="loadMoreWrap" class="hidden text-center py-8">
                    <button type="button" onclick="loadMoreVideos()" class="px-5 py-2.5 rounded-full bg-[#272727] hover:bg-[#3f3f3f] text-sm font-medium transition">
                        Carregar mais
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
    import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
    import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

    const RELAYS = [
        'wss://relay.damus.io',
        'wss://nos.lol',
        'wss://relay.nostr.band',
        'wss://relay.primal.net'
    ];

    const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogg)(\?[^\s]*)?$/i;
    const pool = new NostrTools.SimplePool();
    const profileCache = new Map();

    let allVideos = [];
    let filteredVideos = [];
    let oldestTimestamp = Math.floor(Date.now() / 1000);
    let isLoading = false;
    let activeFilter = '';
    let currentPlayingId = null;

    // ——— UI helpers ———
    window.closeSidebar = function() {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
    };
    document.getElementById('menuToggle')?.addEventListener('click', () => {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        sb.classList.toggle('-translate-x-full');
        ov.classList.toggle('hidden');
    });

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
    }

    function setStatus(html) {
        const el = document.getElementById('statusBar');
        if (el) el.innerHTML = html;
    }

    function timeAgo(ts) {
        const s = Math.floor(Date.now() / 1000) - ts;
        if (s < 60) return 'agora';
        if (s < 3600) return Math.floor(s / 60) + ' min';
        if (s < 86400) return Math.floor(s / 3600) + ' h';
        if (s < 604800) return Math.floor(s / 86400) + ' d';
        return new Date(ts * 1000).toLocaleDateString('pt-BR');
    }

    function extractTitle(content, max = 80) {
        const clean = String(content || '')
            .replace(/https?:\/\/[^\s]+/gi, '')
            .replace(/\s+/g, ' ')
            .trim();
        if (!clean) return 'Vídeo Nostr';
        return clean.length > max ? clean.slice(0, max) + '…' : clean;
    }

    // Extrai URLs de vídeo de tags e conteúdo
    function extractVideoUrls(ev) {
        const urls = new Set();
        if (ev.tags) {
            ev.tags.forEach(tag => {
                if ((tag[0] === 'video' || tag[0] === 'url' || tag[0] === 'r' || tag[0] === 'imeta') && tag[1] && VIDEO_EXT.test(tag[1])) {
                    urls.add(tag[1].split(/\s/)[0]);
                }
                // imeta: url https://...
                if (tag[0] === 'imeta') {
                    tag.forEach(part => {
                        const m = String(part).match(/url\s+(https?:\/\/\S+)/i);
                        if (m && VIDEO_EXT.test(m[1])) urls.add(m[1]);
                    });
                }
            });
        }
        const content = ev.content || '';
        const matches = content.match(/https?:\/\/[^\s<>"']+/gi) || [];
        matches.forEach(u => {
            const clean = u.replace(/[.,;:!?)]+$/, '');
            if (VIDEO_EXT.test(clean)) urls.add(clean);
        });
        return Array.from(urls);
    }

    function eventHashtags(ev) {
        const tags = new Set();
        (ev.tags || []).forEach(t => {
            if (t[0] === 't' && t[1]) tags.add(String(t[1]).toLowerCase());
        });
        const m = String(ev.content || '').match(/#[\p{L}\p{N}_]+/gu) || [];
        m.forEach(h => tags.add(h.slice(1).toLowerCase()));
        return tags;
    }

    // ——— Perfis ———
    async function fetchProfiles(pubkeys) {
        const missing = pubkeys.filter(pk => pk && !profileCache.has(pk));
        if (!missing.length) return;
        try {
            const events = await pool.querySync(RELAYS, {
                kinds: [0],
                authors: missing,
                limit: missing.length
            });
            const latest = new Map();
            (events || []).forEach(ev => {
                const prev = latest.get(ev.pubkey);
                if (!prev || ev.created_at > prev.created_at) latest.set(ev.pubkey, ev);
            });
            latest.forEach((ev, pubkey) => {
                try {
                    const data = JSON.parse(ev.content || '{}');
                    profileCache.set(pubkey, {
                        name: data.name || data.display_name || '',
                        picture: data.picture || data.image || ''
                    });
                } catch {
                    profileCache.set(pubkey, { name: '', picture: '' });
                }
            });
            missing.forEach(pk => {
                if (!profileCache.has(pk)) profileCache.set(pk, { name: '', picture: '' });
            });
        } catch (e) {
            console.error('Perfis:', e);
        }
    }

    function displayName(pubkey) {
        const p = profileCache.get(pubkey);
        if (p?.name) return '@' + p.name;
        return '@' + pubkey.slice(0, 10) + '…';
    }

    function avatarHtml(pubkey, sizeClass = 'w-9 h-9') {
        const pic = profileCache.get(pubkey)?.picture;
        if (pic) {
            return `<img src="${escapeHtml(pic)}" class="${sizeClass} rounded-full object-cover" alt="" loading="lazy"
                onerror="this.outerHTML='<div class=\\'${sizeClass} rounded-full bg-[#303030] flex items-center justify-center\\'><i class=\\'fa-solid fa-user text-xs text-secondary\\'></i></div>'">`;
        }
        return `<div class="${sizeClass} rounded-full bg-[#303030] flex items-center justify-center shrink-0"><i class="fa-solid fa-user text-xs text-secondary"></i></div>`;
    }

    // ——— Fetch vídeos ———
    async function fetchVideoEvents(until) {
        const filters = [
            { kinds: [1], limit: 80, ...(until ? { until } : {}) },
            { kinds: [1], '#t': ['video'], limit: 40, ...(until ? { until } : {}) },
            { kinds: [1], '#t': ['videos'], limit: 20, ...(until ? { until } : {}) }
        ];
        const results = await Promise.allSettled(
            filters.map(f => pool.querySync(RELAYS, f))
        );
        const map = new Map();
        results.forEach(r => {
            if (r.status === 'fulfilled' && r.value) {
                r.value.forEach(ev => map.set(ev.id, ev));
            }
        });
        return Array.from(map.values());
    }

    function eventsToVideoItems(events) {
        const items = [];
        events.forEach(ev => {
            const urls = extractVideoUrls(ev);
            if (!urls.length) return;
            urls.forEach((url, i) => {
                items.push({
                    id: ev.id + (i ? '-' + i : ''),
                    eventId: ev.id,
                    pubkey: ev.pubkey,
                    created_at: ev.created_at,
                    content: ev.content || '',
                    videoUrl: url,
                    tags: eventHashtags(ev)
                });
            });
        });
        return items;
    }

    async function loadInitial() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span>Buscando vídeos nos relays...</span>`);

        try {
            const events = await fetchVideoEvents();
            const items = eventsToVideoItems(events);
            items.sort((a, b) => b.created_at - a.created_at);

            // dedupe por URL
            const seen = new Set();
            allVideos = items.filter(v => {
                if (seen.has(v.videoUrl)) return false;
                seen.add(v.videoUrl);
                return true;
            });

            if (allVideos.length) {
                oldestTimestamp = Math.min(...allVideos.map(v => v.created_at));
            }

            const pubs = [...new Set(allVideos.map(v => v.pubkey))];
            await fetchProfiles(pubs);

            applyFilter(activeFilter);
            document.getElementById('loadMoreWrap').classList.remove('hidden');

            if (!allVideos.length) {
                setStatus(`<i class="fa-solid fa-video-slash text-yt-muted"></i><span>Nenhum vídeo encontrado. Tente carregar mais ou outro filtro.</span>`);
            } else {
                setStatus(`<span class="text-yt-muted">${filteredVideos.length} vídeo(s) · rede Nostr</span>`);
            }
        } catch (e) {
            console.error(e);
            setStatus(`<i class="fa-solid fa-triangle-exclamation text-amber-500"></i><span>Falha ao conectar. Recarregue a página.</span>`);
        } finally {
            isLoading = false;
        }
    }

    window.loadMoreVideos = async function() {
        if (isLoading) return;
        isLoading = true;
        setStatus(`<i class="fa-solid fa-spinner fa-spin text-secondary"></i><span>Carregando mais...</span>`);
        try {
            const events = await fetchVideoEvents(oldestTimestamp - 1);
            const items = eventsToVideoItems(events);
            const seen = new Set(allVideos.map(v => v.videoUrl));
            const newOnes = items.filter(v => !seen.has(v.videoUrl));
            if (newOnes.length) {
                oldestTimestamp = Math.min(oldestTimestamp, ...newOnes.map(v => v.created_at));
                allVideos = allVideos.concat(newOnes).sort((a, b) => b.created_at - a.created_at);
                await fetchProfiles([...new Set(newOnes.map(v => v.pubkey))]);
            }
            applyFilter(activeFilter);
            setStatus(`<span class="text-yt-muted">${filteredVideos.length} vídeo(s)</span>`);
        } catch (e) {
            console.error(e);
        } finally {
            isLoading = false;
        }
    };

    function applyFilter(tag) {
        activeFilter = (tag || '').toLowerCase();
        if (!activeFilter) {
            filteredVideos = allVideos.slice();
        } else {
            filteredVideos = allVideos.filter(v => {
                if (v.tags.has(activeFilter)) return true;
                return (v.content || '').toLowerCase().includes(activeFilter);
            });
        }
        renderGrid();
        renderRelated();
    }

    window.filterByTag = function(tag) {
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.toggle('active', (c.dataset.filter || '') === (tag || ''));
        });
        applyFilter(tag);
        setStatus(`<span class="text-yt-muted">${filteredVideos.length} vídeo(s)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
        closeSidebar();
    };

    window.setChipFilter = function(btn, tag) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(tag);
        setStatus(`<span class="text-yt-muted">${filteredVideos.length} vídeo(s)${tag ? ' · #' + escapeHtml(tag) : ''}</span>`);
    };

    window.searchVideos = function() {
        const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase().replace(/^#/, '');
        if (!q) {
            applyFilter('');
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', !c.dataset.filter));
            return;
        }
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        filteredVideos = allVideos.filter(v => {
            const name = (profileCache.get(v.pubkey)?.name || '').toLowerCase();
            return v.tags.has(q) ||
                (v.content || '').toLowerCase().includes(q) ||
                name.includes(q) ||
                v.videoUrl.toLowerCase().includes(q);
        });
        renderGrid();
        setStatus(`<span class="text-yt-muted">${filteredVideos.length} resultado(s) para “${escapeHtml(q)}”</span>`);
    };

    function renderGrid() {
        const grid = document.getElementById('videoGrid');
        if (!filteredVideos.length) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-16 text-yt-muted">
                    <i class="fa-solid fa-video-slash text-4xl mb-3 opacity-50"></i>
                    <p class="text-sm">Nenhum vídeo neste filtro.</p>
                </div>`;
            return;
        }

        grid.innerHTML = filteredVideos.map(v => {
            const title = extractTitle(v.content);
            const name = displayName(v.pubkey);
            return `
            <article class="video-card cursor-pointer group" onclick="playVideo('${escapeHtml(v.id)}')">
                <div class="video-thumb">
                    <video src="${escapeHtml(v.videoUrl)}" muted preload="metadata" playsinline
                           onloadeddata="this.currentTime=0.1"></video>
                    <div class="play-overlay">
                        <div class="w-12 h-12 rounded-full bg-secondary/90 flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-play text-white ml-0.5"></i>
                        </div>
                    </div>
                    <span class="duration-badge"><i class="fa-solid fa-play text-[9px] mr-1"></i>Vídeo</span>
                </div>
                <div class="flex gap-3 mt-3">
                    ${avatarHtml(v.pubkey)}
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-semibold text-yt-text line-clamp-2 leading-snug group-hover:text-secondary transition">${escapeHtml(title)}</h3>
                        <p class="text-xs text-yt-muted mt-1 truncate">${escapeHtml(name)}</p>
                        <p class="text-[11px] text-yt-muted">${timeAgo(v.created_at)}</p>
                    </div>
                </div>
            </article>`;
        }).join('');
    }

    function renderRelated() {
        const list = document.getElementById('relatedList');
        if (!list) return;
        const others = filteredVideos.filter(v => v.id !== currentPlayingId).slice(0, 12);
        list.innerHTML = others.map(v => `
            <button type="button" onclick="playVideo('${escapeHtml(v.id)}')"
                    class="flex gap-2 w-full text-left hover:bg-[#212121] rounded-lg p-1.5 transition">
                <div class="w-40 shrink-0 aspect-video rounded-lg overflow-hidden bg-[#212121]">
                    <video src="${escapeHtml(v.videoUrl)}" muted preload="metadata" class="w-full h-full object-cover"
                           onloadeddata="this.currentTime=0.1"></video>
                </div>
                <div class="min-w-0 flex-1 py-0.5">
                    <p class="text-xs font-semibold line-clamp-2 leading-snug">${escapeHtml(extractTitle(v.content, 60))}</p>
                    <p class="text-[11px] text-yt-muted mt-1 truncate">${escapeHtml(displayName(v.pubkey))}</p>
                    <p class="text-[10px] text-yt-muted">${timeAgo(v.created_at)}</p>
                </div>
            </button>
        `).join('') || '<p class="text-xs text-yt-muted">Nenhum outro vídeo.</p>';
    }

    window.playVideo = function(id) {
        const v = allVideos.find(x => x.id === id) || filteredVideos.find(x => x.id === id);
        if (!v) return;
        currentPlayingId = v.id;

        const section = document.getElementById('playerSection');
        const gridSection = document.getElementById('gridSection');
        section.classList.remove('hidden');

        document.getElementById('mainPlayer').innerHTML = `
            <video src="${escapeHtml(v.videoUrl)}" controls autoplay playsinline class="w-full"></video>`;
        document.getElementById('playerTitle').textContent = extractTitle(v.content, 120);
        document.getElementById('playerAuthor').textContent = displayName(v.pubkey);
        document.getElementById('playerDate').textContent = timeAgo(v.created_at) + ' · Nostr';
        document.getElementById('playerDescription').textContent = v.content || '';
        document.getElementById('playerAvatar').innerHTML = avatarHtml(v.pubkey, 'w-10 h-10');

        renderRelated();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.closePlayer = function() {
        currentPlayingId = null;
        document.getElementById('playerSection').classList.add('hidden');
        document.getElementById('mainPlayer').innerHTML = '';
    };

    // Sessão (avatar no header, se logado)
    function loadSessionAvatar() {
        try {
            const session = JSON.parse(localStorage.getItem('nostr_session') || '{}');
            if (session.avatarUrl) {
                const el = document.getElementById('userAvatarHeader');
                if (el) el.innerHTML = `<img src="${escapeHtml(session.avatarUrl)}" class="w-full h-full object-cover" alt="">`;
            }
        } catch {}
    }

    loadSessionAvatar();
    loadInitial();
    </script>
</body>
</html>
