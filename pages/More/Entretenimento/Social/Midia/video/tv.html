<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePlay - TV</title>
    <link rel="icon" type="image/png" href="../Src/FavicoLP.png">
    <link rel="apple-touch-icon" href="../Src/FavicoLP.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffffff',
                        secondary: '#7c3aed',
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            background: #ffffff;
            color: #1f2937;
        }
        .channel-thumb {
            aspect-ratio: 16 / 9;
            background: #f3f4f6;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }
        .channel-thumb video,
        .channel-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .live-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-800">

    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-200">
        <div class="flex items-center gap-3 px-3 md:px-4 h-14">
            <a href="videos.html" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-700 shrink-0" title="Voltar para Vídeos">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <a href="../Social.html" class="flex items-center gap-2 shrink-0 mr-2">
                <i class="fa-solid fa-tv text-secondary text-xl"></i>
                <span class="font-bold text-lg tracking-tight hidden sm:inline text-gray-900">Lore<span class="text-secondary">TV</span></span>
            </a>
            <div class="flex-1 min-w-0"></div>
            <div class="flex items-center gap-1 shrink-0">
                <a href="videos.html" class="px-3 py-1.5 rounded-full hover:bg-gray-100 text-sm text-gray-700 hover:text-secondary transition">
                    <i class="fa-solid fa-play mr-1"></i> Vídeos
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 min-w-0 p-3 md:p-6 bg-gray-50 max-w-7xl mx-auto w-full">
        <div class="mb-6">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">Canais de TV ao Vivo</h1>
            <p class="text-sm text-gray-500 mt-1">Transmissões contínuas e canais parceiros da rede.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm hover:shadow-md transition">
                <div class="channel-thumb">
                    <span class="live-badge"><i class="fa-solid fa-circle text-[6px] mr-1 animate-pulse"></i> Ao Vivo</span>
                    <div class="w-full h-full bg-gray-900 flex items-center justify-center text-white">
                        <i class="fa-solid fa-satellite-dish text-4xl text-secondary"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <h3 class="text-sm font-semibold text-gray-900">Canal Principal LoreTV</h3>
                    <p class="text-xs text-gray-500 mt-1">Programação variada 24 horas.</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm hover:shadow-md transition">
                <div class="channel-thumb">
                    <span class="live-badge"><i class="fa-solid fa-circle text-[6px] mr-1 animate-pulse"></i> Ao Vivo</span>
                    <div class="w-full h-full bg-gray-900 flex items-center justify-center text-white">
                        <i class="fa-solid fa-film text-4xl text-secondary"></i>
                    </div>
                </div>
                <div class="mt-3">
                    <h3 class="text-sm font-semibold text-gray-900">Lore Cine & Séries</h3>
                    <p class="text-xs text-gray-500 mt-1">Filmes independentes e exibições especiais.</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
