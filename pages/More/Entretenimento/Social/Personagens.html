<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Personagens — LoreSocial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';
        window.NostrTools = NostrTools;
        window.nostrHexToBytes = hexToBytes;
    </script>
    <script type="module">
        import * as webllm from 'https://esm.sh/@mlc-ai/web-llm@0.2.78';
        window.webllm = webllm;
    </script>
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-color: #6c5ce7;
            --secondary-hover: #5b4be2;
            --light-violet: #f3f0ff;
            --gray-bg: #f8f9fa;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
            --chat-wallpaper: #efeae2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        body {
            background: var(--light-violet);
            display: flex; justify-content: center; align-items: stretch;
        }
        .app-container {
            display: flex; width: 100%; height: 100%; height: 100dvh; max-height: 100dvh;
            background: var(--primary-bg); overflow: hidden;
        }
        @media (min-width: 900px) {
            .app-container {
                width: 100%;
                max-width: none;
                margin: 0;
                box-shadow: none;
            }
        }
        .sidebar {
            width: 100%; background: var(--primary-bg);
            display: flex; flex-direction: column;
            border-right: 1px solid var(--border-color);
            height: 100%; min-height: 0;
        }
        @media (min-width: 768px) {
            .sidebar { width: 38%; min-width: 320px; max-width: 420px; }
        }
        .sidebar-header {
            flex-shrink: 0; padding: 14px 16px 10px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--primary-bg);
        }
        .sidebar-header-left {
            display: flex; align-items: center; gap: 12px; min-width: 0;
        }
        .sidebar-header-left .back-net {
            background: none; border: none; color: var(--text-muted);
            font-size: 18px; cursor: pointer; padding: 4px;
        }
        .sidebar-header-left .back-net:hover { color: var(--secondary-color); }
        .app-title {
            display: flex; align-items: center; gap: 10px;
            color: var(--secondary-color); font-size: 18px; font-weight: 600;
        }
        .sidebar-actions { display: flex; align-items: center; gap: 12px; }
        .sidebar-actions .icon-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 18px; cursor: pointer; padding: 6px; border-radius: 50%;
        }
        .sidebar-actions .icon-btn:hover {
            color: var(--secondary-color); background: var(--light-violet);
        }
        .top-tab-bar {
            flex-shrink: 0; display: flex; gap: 6px;
            padding: 0 12px 10px; border-bottom: 1px solid var(--border-color);
            overflow-x: auto; scrollbar-width: none;
        }
        .top-tab-bar::-webkit-scrollbar { display: none; }
        .tab-item {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            cursor: pointer; background: var(--gray-bg); border: none;
            padding: 8px 14px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
        }
        .tab-item.active { color: #fff; background: var(--secondary-color); }
        .search-container { flex-shrink: 0; padding: 10px 14px; }
        .search-box {
            display: flex; align-items: center; gap: 10px;
            background: var(--gray-bg); border: 1px solid transparent;
            border-radius: 8px; padding: 8px 12px;
        }
        .search-box:focus-within {
            border-color: var(--secondary-color); background: #fff;
        }
        .search-box i { color: var(--text-muted); font-size: 13px; }
        .search-box input {
            border: none; background: none; outline: none;
            font-size: 14px; width: 100%; color: var(--text-main);
        }
        .chat-list {
            overflow-y: auto; flex: 1; min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .chat-list.hidden { display: none; }
        .char-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; cursor: pointer;
            border-bottom: 1px solid var(--gray-bg);
            transition: background 0.15s;
        }
        .char-item:hover { background: var(--gray-bg); }
        .char-item.active {
            background: var(--light-violet);
            border-left: 3px solid var(--secondary-color);
        }
        .char-avatar {
            width: 49px; height: 49px; border-radius: 50%;
            background: var(--light-violet); color: var(--secondary-color);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px; flex-shrink: 0; overflow: hidden;
        }
        .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .char-info { flex: 1; min-width: 0; }
        .char-name-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin-bottom: 3px;
        }
        .char-name {
            font-size: 16px; font-weight: 500; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .char-meta {
            font-size: 13px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .char-tone {
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            background: var(--light-violet); color: var(--secondary-color); flex-shrink: 0;
        }
        .empty {
            padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 14px;
        }
        .panel-criar {
            flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch;
            display: none;
        }
        .panel-criar.show { display: block; }
        .form-wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .form-wrap > label:not(.img-pick):not(.tone-opt) {
            font-size: 13px; font-weight: 600; color: var(--text-main);
        }
        .form-wrap input, .form-wrap textarea {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-color);
            border-radius: 10px; outline: none; font-size: 14px; background: var(--gray-bg);
        }
        .form-wrap textarea { min-height: 100px; resize: vertical; }
        .form-wrap input:focus, .form-wrap textarea:focus {
            border-color: var(--secondary-color); background: #fff;
        }

        /* Estilos de fala — scroll horizontal estável (sem cards cortados) */
        .tone-options {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            padding: 4px 2px 10px;
            margin: 0;
        }
        .tone-options::-webkit-scrollbar { height: 4px; }
        .tone-options::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .tone-opt {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            background: var(--gray-bg);
            flex: 0 0 auto;
            width: 168px;
            min-width: 168px;
            max-width: 168px;
            min-height: 108px;
            scroll-snap-align: start;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .tone-opt.selected {
            border-color: var(--secondary-color);
            background: var(--light-violet);
            box-shadow: 0 0 0 1px rgba(108, 92, 231, 0.25);
        }
        .tone-opt input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            flex-shrink: 0;
            accent-color: var(--secondary-color);
            cursor: pointer;
        }
        .tone-opt .tone-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            min-width: 0;
        }
        .tone-opt strong {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tone-opt span {
            display: block;
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.35;
            overflow: hidden;
            max-height: 3.9em;
            word-break: break-word;
        }

        .img-pick {
            width: 100%; aspect-ratio: 1; max-width: 140px; margin: 0 auto;
            border-radius: 16px; background: var(--gray-bg); border: 1px dashed var(--border-color);
            display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;
        }
        .img-pick img { width: 100%; height: 100%; object-fit: cover; }
        .img-pick span { font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px; }
        input[type="file"] { display: none; }
        .primary-btn {
            width: 100%; padding: 12px; background: var(--secondary-color); color: #fff;
            border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px;
        }
        .primary-btn:disabled { opacity: 0.5; }
        .status { font-size: 12px; color: var(--text-muted); text-align: center; }
        .status.error { color: #e74c3c; }
        .status.ok { color: #00b894; }

        .chat-area {
            display: none; flex-direction: column; flex: 1;
            background: var(--primary-bg); height: 100%; min-height: 0; overflow: hidden;
        }
        @media (min-width: 768px) {
            .chat-area { display: flex !important; }
        }
        .chat-header {
            flex-shrink: 0; padding: 10px 16px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background: var(--primary-bg); z-index: 5; min-height: 60px;
        }
        .chat-header .back-btn {
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: var(--secondary-color); padding: 4px; display: none;
        }
        @media (max-width: 767px) {
            .chat-header .back-btn { display: flex; align-items: center; }
        }
        .chat-header .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--light-violet); color: var(--secondary-color);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; overflow: hidden; flex-shrink: 0;
        }
        .chat-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header-meta { flex: 1; min-width: 0; }
        .chat-header-name {
            font-size: 16px; font-weight: 600; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-header-sub {
            font-size: 12px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .model-status {
            font-size: 11px; color: var(--text-muted);
            padding: 6px 16px 0; line-height: 1.35; flex-shrink: 0;
            background: var(--chat-wallpaper);
        }
        .model-progress-wrap {
            margin: 4px 16px 0; height: 3px; background: rgba(0,0,0,0.08);
            border-radius: 4px; overflow: hidden; display: none; flex-shrink: 0;
        }
        .model-progress-wrap.show { display: block; }
        .model-progress-bar {
            height: 100%; width: 0%; background: var(--secondary-color);
            border-radius: 4px; transition: width 0.25s ease;
        }
        .messages-container {
            flex: 1; min-height: 0; padding: 12px 16px 16px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
            background-color: var(--chat-wallpaper);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(108, 92, 231, 0.03) 0%, transparent 35%);
            -webkit-overflow-scrolling: touch;
        }
        .messages-container.welcome { justify-content: center; align-items: center; }
        .welcome-placeholder {
            text-align: center; color: var(--text-muted); padding: 24px; max-width: 360px;
        }
        .welcome-placeholder i {
            font-size: 48px; color: var(--secondary-color); opacity: 0.35; margin-bottom: 12px;
        }
        .welcome-placeholder h2 {
            font-size: 18px; font-weight: 500; color: var(--text-main); margin-bottom: 8px;
        }
        .welcome-placeholder p { font-size: 14px; line-height: 1.45; }
        .bubble {
            max-width: 75%; padding: 8px 12px 6px;
            border-radius: 8px; font-size: 14.2px; line-height: 1.45;
            word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.06);
        }
        @media (min-width: 768px) { .bubble { max-width: 65%; } }
        .bubble.user {
            align-self: flex-end; background: #d9fdd3;
            color: var(--text-main); border-top-right-radius: 2px; margin-left: auto;
        }
        .bubble.bot {
            align-self: flex-start; background: #fff;
            color: var(--text-main); border-top-left-radius: 2px;
        }
        .bubble.sys {
            align-self: center; background: rgba(255,255,255,0.85);
            color: var(--text-muted); font-size: 12px; text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06); max-width: 90%;
            border-radius: 8px; padding: 6px 12px; margin: 8px 0;
        }
        .chat-input-area {
            flex-shrink: 0; padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: #f0f2f5; display: flex; align-items: center; gap: 10px;
            border-top: 1px solid var(--border-color);
        }
        .chat-input-area input {
            flex: 1; padding: 11px 16px; border: none; border-radius: 24px;
            outline: none; font-size: 15px; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .chat-input-area input:focus { box-shadow: 0 0 0 1px var(--secondary-color); }
        .chat-input-area button {
            background: var(--secondary-color); color: #fff; border: none;
            width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .chat-input-area button:hover { background: var(--secondary-hover); }
        @media (max-width: 767px) {
            .mobile-show-chat .sidebar { display: none; }
            .mobile-show-chat .chat-area {
                display: flex !important; width: 100%; height: 100%; height: 100dvh;
            }
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-left">
                <button type="button" class="back-net" onclick="goBack()" title="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="app-title">
                    <i class="fa-solid fa-masks-theater"></i>
                    <span>Personagens</span>
                </div>
            </div>
            <div class="sidebar-actions">
                <button type="button" class="icon-btn" title="Criar personagem" onclick="showCreate()">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>
        <div class="top-tab-bar">
            <button type="button" class="tab-item active" data-tab="rede" onclick="switchPanel('rede')">Na rede</button>
            <button type="button" class="tab-item" data-tab="meus" onclick="switchPanel('meus')">Meus</button>
            <button type="button" class="tab-item" data-tab="criar" onclick="switchPanel('criar')">Novo</button>
        </div>
        <div class="search-container" id="searchContainer">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar personagem" autocomplete="off">
            </div>
        </div>
        <div class="chat-list" id="panelRede"></div>
        <div class="chat-list hidden" id="panelMeus"></div>
        <div class="panel-criar" id="panelCriar">
            <div class="form-wrap">
                <label class="img-pick" id="imgPickLabel">
                    <span id="imgPickText"><i class="fa-solid fa-image" style="font-size:24px;display:block;margin-bottom:6px;"></i>Foto do personagem</span>
                    <img id="imgPreview" style="display:none;" alt="">
                    <input type="file" id="charImage" accept="image/*">
                </label>
                <label>Nome</label>
                <input type="text" id="charName" placeholder="Nome do personagem" maxlength="40" autocomplete="off">
                <label>Personalidade (descrição)</label>
                <textarea id="charPersonality" placeholder="Quem é, como age, gostos, história..."></textarea>
                <label>Estilo de fala</label>
                <div class="tone-options">
                    <label class="tone-opt selected" data-tone="contidas">
                        <input type="radio" name="tone" value="contidas" checked>
                        <div class="tone-body">
                            <strong>Contidas</strong>
                            <span>Linguagem sóbria, respeitosa e comedida.</span>
                        </div>
                    </label>
                    <label class="tone-opt" data-tone="euforicas">
                        <input type="radio" name="tone" value="euforicas">
                        <div class="tone-body">
                            <strong>Eufóricas</strong>
                            <span>Energéticas, animadas e expressivas.</span>
                        </div>
                    </label>
                    <label class="tone-opt" data-tone="eroticas">
                        <input type="radio" name="tone" value="eroticas">
                        <div class="tone-body">
                            <strong>Eróticas</strong>
                            <span>Mais sensuais e provocantes (conteúdo adulto).</span>
                        </div>
                    </label>
                </div>
                <button type="button" class="primary-btn" id="createBtn" onclick="createCharacter()">Publicar personagem</button>
                <p class="status" id="createStatus">Imagem via Blossom (Nostr). Metadados na rede.</p>
            </div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header" id="chatHeaderBar">
            <button type="button" class="back-btn" id="backBtn" onclick="closeCharChat()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="avatar" id="chatAv"><i class="fa-solid fa-masks-theater"></i></div>
            <div class="chat-header-meta">
                <div class="chat-header-name" id="chatName">Personagens IA</div>
                <div class="chat-header-sub" id="chatSub">Selecione um personagem</div>
            </div>
        </div>
        <p class="model-status" id="modelStatus" style="display:none;">Modelo quantizado: aguardando…</p>
        <div class="model-progress-wrap" id="modelProgressWrap">
            <div class="model-progress-bar" id="modelProgressBar"></div>
        </div>
        <div class="messages-container welcome" id="chatMsgs">
            <div class="welcome-placeholder" id="welcomePlaceholder">
                <i class="fa-solid fa-masks-theater"></i>
                <h2>Personagens LoreSocial</h2>
                <p>Escolha um personagem na lista ao lado para conversar. A IA roda quantizada no seu aparelho.</p>
            </div>
        </div>
        <div class="chat-input-area" id="chatInputArea" style="display:none;">
            <input type="text" id="chatInput" placeholder="Digite uma mensagem..." autocomplete="off">
            <button type="button" id="chatSend" onclick="sendCharMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function auth() {
    try {
        const s = JSON.parse(localStorage.getItem('nostr_session') || 'null');
        if (localStorage.getItem('isLoggedIn') !== 'true' || !s?.privateKeyHex || !s?.pubkey) {
            window.location.replace('../Social.html');
        }
    } catch { window.location.replace('../Social.html'); }
})();

const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net', 'wss://relay.nostr.band'];
const BLOSSOM_SERVERS = ['https://blossom.primal.net', 'https://cdn.nostrcheck.me', 'https://blossom.oxtr.dev'];
const CHAR_KIND = 30079;
const MODEL_ID = 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC';
const MODEL_HF_BASE = 'https://huggingface.co/mlc-ai/Qwen2.5-0.5B-Instruct-q4f16_1-MLC/resolve/main/';
const MODEL_PACK_KIND = 30080;
const MODEL_PEER_KIND = 20081;
const MODEL_MANIFEST_D = 'loresocial-model-shared-' + MODEL_ID;
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];

let pool = null;
let networkChars = [];
let myChars = [];
let profileCache = new Map();
let currentChar = null;
let currentCharId = null;
let engine = null;
let modelLoading = false;
let modelSyncRunning = false;
let chatHistory = [];
let searchQuery = '';
let currentPanel = 'rede';

const modelBlobMap = new Map();
const localPartIndex = new Map();
const peerRtc = new Map();
let fetchPatched = false;
let originalFetch = null;
let peerSub = null;
let networkProfile = null;

const appContainer = document.getElementById('appContainer');

function goBack() { window.location.href = './Bate-papo.html'; }
function getSession() {
    try { return JSON.parse(localStorage.getItem('nostr_session') || 'null'); } catch { return null; }
}
function getSk() {
    const s = getSession();
    if (!s?.privateKeyHex) return null;
    if (window.nostrHexToBytes) return window.nostrHexToBytes(s.privateKeyHex);
    const hex = s.privateKeyHex;
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
}
function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toneLabel(t) {
    if (t === 'euforicas') return 'Eufóricas';
    if (t === 'eroticas') return 'Eróticas';
    return 'Contidas';
}
function systemPromptFor(char) {
    const tone = char.tone || 'contidas';
    let style = 'Fale de forma contida, educada e moderada.';
    if (tone === 'euforicas') style = 'Fale de forma eufórica, animada, energética e expressiva, com entusiasmo.';
    if (tone === 'eroticas') style = 'Fale de forma sensual e provocante, no tom erótico combinado, sem sair do personagem.';
    return `Você é o personagem "${char.name}".
Personalidade e background: ${char.personality || 'Personagem fictício.'}

async function sha256Hex(buf) {
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function uploadBlossom(file, sk) {
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    const now = Math.floor(Date.now() / 1000);
    const authEvent = NostrTools.finalizeEvent({
        kind: 24242,
        created_at: now,
        tags: [['t', 'upload'], ['x', hash], ['expiration', String(now + 300)]],
        content: 'Upload character image'
    }, sk);
    const authHeader = 'Nostr ' + btoa(JSON.stringify(authEvent));
    for (const base of BLOSSOM_SERVERS) {
        try {
            const res = await fetch(base.replace(/\/$/, '') + '/upload', {
                method: 'PUT',
                headers: { Authorization: authHeader, 'Content-Type': file.type || 'image/jpeg' },
                body: buf
            });
            if (!res.ok) continue;
            const data = await res.json().catch(() => ({}));
            const url = data.url || (base.replace(/\/$/, '') + '/' + hash);
            if (url) return { url, hash };
        } catch {}
    }
    throw new Error('Falha no upload da imagem (Blossom).');
}

async function fetchProfile(pubkey) {
    const pk = String(pubkey).toLowerCase();
    if (profileCache.has(pk)) return profileCache.get(pk);
    try {
        if (!pool) pool = new NostrTools.SimplePool();
        const ev = await pool.get(RELAYS, { kinds: [0], authors: [pubkey] });
        let name = '', picture = '';
        if (ev?.content) {
            const d = JSON.parse(ev.content);
            name = d.display_name || d.name || '';
            picture = d.picture || d.image || '';
        }
        const p = { name, picture };
        profileCache.set(pk, p);
        return p;
    } catch {
        const p = { name: '', picture: '' };
        profileCache.set(pk, p);
        return p;
    }
}

function parseCharEvent(ev) {
    try {
        const data = JSON.parse(ev.content);
        if (!data || data.lore !== 1 || data.type !== 'character') return null;
        return {
            id: ev.id,
            pubkey: ev.pubkey,
            name: data.name || 'Personagem',
            personality: data.personality || '',
            image: data.image || '',
            tone: data.tone || 'contidas',
            d: (ev.tags || []).find(t => t[0] === 'd')?.[1] || '',
            created_at: ev.created_at
        };
    } catch { return null; }
}

function renderCharList(containerId, list) {
    const el = document.getElementById(containerId);
    let filtered = list;
    if (searchQuery) {
        filtered = list.filter(c =>
            (c.name || '').toLowerCase().includes(searchQuery) ||
            (c.creatorName || '').toLowerCase().includes(searchQuery) ||
            (c.personality || '').toLowerCase().includes(searchQuery)
        );
    }
    if (!filtered.length) {
        el.innerHTML = '<div class="empty">' + (searchQuery ? 'Nenhum resultado.' : 'Nenhum personagem encontrado.') + '</div>';
        return;
    }
    el.innerHTML = filtered.map(c => {
        const creator = c.creatorName ? `@${escapeHtml(c.creatorName)}` : (c.pubkey || '').slice(0, 10) + '…';
        const av = c.image
            ? `<img src="${escapeHtml(c.image)}" alt="">`
            : escapeHtml((c.name || '?').substring(0, 2).toUpperCase());
        const preview = escapeHtml((c.personality || toneLabel(c.tone)).slice(0, 60));
        const active = c.id === currentCharId ? ' active' : '';
        return `<div class="char-item${active}" data-id="${escapeHtml(c.id)}">
            <div class="char-avatar">${av}</div>
            <div class="char-info">
                <div class="char-name-row">
                    <div class="char-name">${escapeHtml(c.name)}</div>
                    <span class="char-tone">${toneLabel(c.tone)}</span>
                </div>
                <div class="char-meta">${preview || creator}</div>
            </div>
        </div>`;
    }).join('');
    el.querySelectorAll('.char-item').forEach(item => {
        item.addEventListener('click', () => {
            const ch = list.find(x => x.id === item.dataset.id);
            if (ch) openCharChat(ch);

async function loadNetworkCharacters() {
    const el = document.getElementById('panelRede');
    el.innerHTML = '<div class="empty">Carregando da rede…</div>';
    try {
        if (!window.NostrTools) await new Promise(r => setTimeout(r, 500));
        if (!pool) pool = new NostrTools.SimplePool();
        const events = await pool.querySync(RELAYS, { kinds: [CHAR_KIND], limit: 80 });
        const byD = new Map();
        (events || []).forEach(ev => {
            const ch = parseCharEvent(ev);
            if (!ch) return;
            const key = ch.pubkey + ':' + (ch.d || ch.id);
            const prev = byD.get(key);
            if (!prev || (ch.created_at || 0) > (prev.created_at || 0)) byD.set(key, ch);
        });
        const list = [...byD.values()].sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
        for (const ch of list) {
            const p = await fetchProfile(ch.pubkey);
            ch.creatorName = p.name || '';
            ch.creatorPicture = p.picture || '';
        }
        networkChars = list;
        renderCharList('panelRede', networkChars);
        const session = getSession();
        const me = session?.pubkey?.toLowerCase();
        myChars = list.filter(c => c.pubkey && c.pubkey.toLowerCase() === me);
        renderCharList('panelMeus', myChars);
    } catch (e) {
        console.error(e);
        el.innerHTML = '<div class="empty">Erro ao buscar personagens.</div>';
    }
}

async function createCharacter() {
    const name = (document.getElementById('charName').value || '').trim();
    const personality = (document.getElementById('charPersonality').value || '').trim();
    const tone = document.querySelector('input[name="tone"]:checked')?.value || 'contidas';
    const file = document.getElementById('charImage').files?.[0];
    const status = document.getElementById('createStatus');
    const btn = document.getElementById('createBtn');
    if (!name) { status.textContent = 'Informe o nome.'; status.className = 'status error'; return; }
    if (!personality) { status.textContent = 'Descreva a personalidade.'; status.className = 'status error'; return; }
    const sk = getSk();
    const session = getSession();
    if (!sk || !session?.pubkey || !window.NostrTools) {
        status.textContent = 'Sessão inválida.'; status.className = 'status error'; return;
    }
    btn.disabled = true;
    status.textContent = 'Enviando imagem…'; status.className = 'status';
    try {
        let imageUrl = '';
        if (file) {
            const up = await uploadBlossom(file, sk);
            imageUrl = up.url;
        }
        status.textContent = 'Publicando personagem…';
        const dTag = 'char-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const content = JSON.stringify({
            lore: 1, type: 'character', name, personality, tone, image: imageUrl
        });
        const event = NostrTools.finalizeEvent({
            kind: CHAR_KIND,
            created_at: Math.floor(Date.now() / 1000),
            tags: [
                ['d', dTag],
                ['title', name],
                ...(imageUrl ? [['image', imageUrl]] : [])
            ],
            content
        }, sk);
        if (!pool) pool = new NostrTools.SimplePool();
        await Promise.any(pool.publish(RELAYS, event));
        try {
            const key = 'loresocial_chats_' + String(session.pubkey).toLowerCase();
            let chats = [];
            try { chats = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
            const pseudoPk = 'char:' + dTag;
            const exists = chats.some(c => c.pubkey === pseudoPk);
            if (!exists) {
                const id = chats.length ? Math.max(...chats.map(c => c.id || 0)) + 1 : 1;
                chats.unshift({
                    id, name: '@' + name, lastMsg: 'Personagem IA',
                    avatar: name.substring(0, 2).toUpperCase(), avatarUrl: imageUrl,
                    type: 'personagens', status: 'accepted', pinned: false,
                    pubkey: pseudoPk, isCharacter: true, addedVia: 'character',
                    characterMeta: { name, personality, tone, image: imageUrl, eventId: event.id },
                    stories: [], messages: []
                });
                localStorage.setItem(key, JSON.stringify(chats));
            }
        } catch {}
        status.textContent = 'Personagem publicado!'; status.className = 'status ok';
        document.getElementById('charName').value = '';
        document.getElementById('charPersonality').value = '';
        await loadNetworkCharacters();
        switchPanel('meus');
    } catch (e) {
        console.error(e);
        status.textContent = e.message || 'Erro ao publicar.'; status.className = 'status error';
    } finally {
        btn.disabled = false;
    }
}

function getNetworkProfile() {
    if (networkProfile) return networkProfile;
    const mem = Number(navigator.deviceMemory) || 4;
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const effectiveType = (conn && conn.effectiveType) || '4g';
    const saveData = !!(conn && conn.saveData);
    const downlink = (conn && conn.downlink) || 10;
    let concurrency = 8, chunkSize = 10 * 1024 * 1024, p2pConcurrency = 4, rangeConcurrency = 6;
    if (saveData || mem <= 2 || effectiveType === 'slow-2g' || effectiveType === '2g') {
        concurrency = 2; chunkSize = 2 * 1024 * 1024; p2pConcurrency = 1; rangeConcurrency = 2;
    } else if (mem <= 4 || effectiveType === '3g' || downlink < 1.5) {
        concurrency = 4; chunkSize = 4 * 1024 * 1024; p2pConcurrency = 2; rangeConcurrency = 3;
    } else if (downlink < 5) {
        concurrency = 6; chunkSize = 6 * 1024 * 1024; p2pConcurrency = 3; rangeConcurrency = 4;
    }
    networkProfile = { mem, effectiveType, saveData, downlink, concurrency, chunkSize, p2pConcurrency, rangeConcurrency };
    return networkProfile;
}

function modelFileUrl(path) {
    return MODEL_HF_BASE.replace(/\/?$/, '/') + String(path || '').replace(/^\//, '');
}
function normalizePath(urlOrPath) {
    const s = String(urlOrPath || '');
    const idx = s.indexOf('/resolve/main/');
    if (idx >= 0) return s.slice(idx + '/resolve/main/'.length).split('?')[0];
    try { return new URL(s, location.href).pathname.split('/').pop() || s; }
    catch { return s.split('/').pop() || s; }
}
function isModelArtifactUrl(url) {
    return !!(url && (url.includes('Qwen2.5-0.5B-Instruct') || url.includes(MODEL_ID)));
}

function patchFetchForModel() {
    if (fetchPatched) return;
    originalFetch = window.fetch.bind(window);
    window.fetch = async function (input, init) {
        try {
            const url = typeof input === 'string' ? input : (input && input.url) ? input.url : '';
            if (isModelArtifactUrl(url)) {
                const path = normalizePath(url);
                const key = modelFileUrl(path);
                const buf = modelBlobMap.get(key) || modelBlobMap.get(url);
                if (buf) {
                    return new Response(buf.slice(0), {
                        status: 200,
                        headers: {
                            'Content-Type': 'application/octet-stream',
                            'Content-Length': String(buf.byteLength)
                        }
                    });
                }
            }
        } catch {}
        return originalFetch(input, init);
    };
    fetchPatched = true;
}

async function putModelInAllCaches(url, buf) {
    if (!('caches' in window)) return;
    try {
        const names = await caches.keys();
        const targets = new Set([...names, 'webllm-cache', 'loresocial-webllm-model', 'tvmjs']);
        await Promise.all([...targets].map(async (name) => {

                    headers: {

                        'Content-Length': String(buf.byteLength)
                    }
                }));
            } catch {}
        }));
    } catch {}
}

function splitBuffer(buf, maxBytes) {
    const parts = [];
    const u8 = new Uint8Array(buf);
    for (let off = 0; off < u8.length; off += maxBytes) {
        parts.push(u8.slice(off, Math.min(off + maxBytes, u8.length)).buffer);
    }
    return parts;
}

async function registerLocalPartsFromFile(path, fullBuf, chunkSize) {
    const chunks = splitBuffer(fullBuf, chunkSize);
    return Promise.all(chunks.map(async (chunk, i) => {
        const hash = await sha256Hex(chunk);
        localPartIndex.set(hash, chunk);
        return { index: i, hash, size: chunk.byteLength };
    }));
}

async function listModelCacheEntries() {
    const out = [];
    const seen = new Set();
    for (const [url, buf] of modelBlobMap) {
        const path = normalizePath(url);
        if (seen.has(path)) continue;
        seen.add(path);
        out.push({ url, path, buf, size: buf.byteLength });
    }
    if (!('caches' in window)) return out;
    try {
        for (const name of await caches.keys()) {
            const cache = await caches.open(name);
            for (const req of await cache.keys()) {
                const url = req.url || '';
                if (!isModelArtifactUrl(url)) continue;
                const path = normalizePath(url);
                if (seen.has(path)) continue;
                const res = await cache.match(req);
                if (!res) continue;
                const buf = await res.arrayBuffer();
                seen.add(path);
                const fullUrl = modelFileUrl(path);
                out.push({ url: fullUrl, path, buf, size: buf.byteLength });
                modelBlobMap.set(fullUrl, buf);
            }
        }
    } catch (e) { console.warn(e); }
    return out;
}

async function mapPool(items, concurrency, worker) {
    const results = new Array(items.length);
    let i = 0;
    async function run() {
        while (i < items.length) {
            const idx = i++;
            results[idx] = await worker(items[idx], idx);
        }
    }
    await Promise.all(Array.from({ length: Math.min(concurrency, Math.max(1, items.length)) }, () => run()));
    return results;
}

async function uploadBlossomBuf(buf, contentType, sk, fileLabel) {
    const hash = await sha256Hex(buf);
    for (const base of BLOSSOM_SERVERS) {
        try {
            const head = await fetch(base.replace(/\/$/, '') + '/' + hash, { method: 'HEAD' });
            if (head.ok) return { url: base.replace(/\/$/, '') + '/' + hash, hash, size: buf.byteLength, existed: true };
        } catch {}
    }
    const now = Math.floor(Date.now() / 1000);
    const authEvent = NostrTools.finalizeEvent({
        kind: 24242,
        created_at: now,
        tags: [['t', 'upload'], ['x', hash], ['expiration', String(now + 600)]],
        content: 'Upload model part ' + (fileLabel || hash.slice(0, 12))
    }, sk);
    const authHeader = 'Nostr ' + btoa(JSON.stringify(authEvent));
    for (const base of BLOSSOM_SERVERS) {
        try {
            const res = await fetch(base.replace(/\/$/, '') + '/upload', {
                method: 'PUT',
                headers: { Authorization: authHeader, 'Content-Type': contentType || 'application/octet-stream' },
                body: buf
            });
            if (!res.ok) continue;
            const data = await res.json().catch(() => ({}));
            const url = data.url || (base.replace(/\/$/, '') + '/' + hash);
            if (url) return { url, hash, size: buf.byteLength, existed: false };
        } catch {}
    }
    throw new Error('Falha Blossom: ' + (fileLabel || hash.slice(0, 8)));
}

async function fetchSharedModelManifests() {
    if (!window.NostrTools) return [];
    try {
        if (!pool) pool = new NostrTools.SimplePool();
        const events = await pool.querySync(RELAYS, [
            { kinds: [MODEL_PACK_KIND], '#d': [MODEL_MANIFEST_D], limit: 40 },
            { kinds: [MODEL_PACK_KIND], '#model': [MODEL_ID], limit: 40 }
        ]);
        const packs = [];
        (events || []).forEach(ev => {
            try {
                const data = JSON.parse(ev.content || '{}');
                if (data.lore !== 1 || data.type !== 'model_pack') return;
                if (data.model_id && data.model_id !== MODEL_ID) return;
                if (!Array.isArray(data.files) || !data.files.length) return;
                packs.push({ ...data, _created: ev.created_at || 0, _pubkey: ev.pubkey });
            } catch {}
        });
        return packs;
    } catch (e) { console.warn(e); return []; }
}

function mergeSharedManifests(packs) {
    const byPath = new Map();
    packs.sort((a, b) => (b._created || 0) - (a._created || 0));
    for (const pack of packs) {
        for (const f of pack.files || []) {
            if (!f?.path) continue;
            let prev = byPath.get(f.path);
            if (!prev) {
                byPath.set(f.path, {
                    path: f.path, size: f.size, sha256: f.sha256,
                    parts: (f.parts || []).map(p => ({ ...p }))
                });
                continue;
            }
            if (!prev.sha256 && f.sha256) prev.sha256 = f.sha256;
            if (!prev.size && f.size) prev.size = f.size;
            const partMap = new Map();
            (prev.parts || []).forEach(p => partMap.set(p.index + ':' + (p.hash || ''), p));
            (f.parts || []).forEach(p => {
                const k = p.index + ':' + (p.hash || '');
                if (!partMap.has(k)) partMap.set(k, { ...p });
                else if (!partMap.get(k).url && p.url) partMap.get(k).url = p.url;
            });
            prev.parts = [...partMap.values()].sort((a, b) => a.index - b.index);
        }
    }
    return { lore: 1, type: 'model_pack', model_id: MODEL_ID, hf_base: MODEL_HF_BASE, files: [...byPath.values()] };
}

async function fetchPartBufferBlossom(part) {
    const urls = [];
    if (part.url) urls.push(part.url);
    for (const base of BLOSSOM_SERVERS) {
        if (part.hash) urls.push(base.replace(/\/$/, '') + '/' + part.hash);
    }
    for (const u of urls) {
        try {
            const res = await fetch(u);
            if (!res.ok) continue;
            const buf = await res.arrayBuffer();
            if (part.hash && (await sha256Hex(buf)) !== part.hash) continue;
            localPartIndex.set(part.hash, buf);
            return buf;
        } catch {}
    }
    return null;
}

async function publishPeerAnnounce(extra = {}) {
    const sk = getSk();
    const session = getSession();
    if (!sk || !session?.pubkey || !window.NostrTools) return;
    const hashes = [...localPartIndex.keys()].slice(0, 200);
    if (!hashes.length && !extra.offer && !extra.answer && !extra.ice) return;
    try {
        if (!pool) pool = new NostrTools.SimplePool();
        const content = JSON.stringify({
            lore: 1, type: 'model_peer', model_id: MODEL_ID, hashes, ...extra, ts: Date.now()
        });
        const tags = [
            ['model', MODEL_ID],
            ['expiration', String(Math.floor(Date.now() / 1000) + 180)]
        ];
        if (extra.to) tags.push(['p', extra.to]);
        const event = NostrTools.finalizeEvent({
            kind: MODEL_PEER_KIND,
            created_at: Math.floor(Date.now() / 1000),
            tags,
            content
        }, sk);
        pool.publish(RELAYS, event);
    } catch (e) { console.warn('announce', e); }
}

function setupDataChannel(channel, remotePk) {
    channel.binaryType = 'arraybuffer';
    channel.onmessage = async (ev) => {
        try {
            if (typeof ev.data === 'string') {
                const msg = JSON.parse(ev.data);
                if (msg.t === 'req' && msg.hash && localPartIndex.has(msg.hash)) {
                    const buf = localPartIndex.get(msg.hash);
                    channel.send(JSON.stringify({ t: 'part', hash: msg.hash, size: buf.byteLength }));
                    channel.send(buf);
                }
            }
        } catch (e) { console.warn('dc msg', e); }
    };
}

async function createPeerConnection(remotePk, asOfferer) {
    if (peerRtc.has(remotePk)) return peerRtc.get(remotePk);
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const entry = { pc, channel: null, ready: false };
    peerRtc.set(remotePk, entry);
    pc.onicecandidate = (e) => {
        if (e.candidate) {
            publishPeerAnnounce({
                to: remotePk,
                ice: e.candidate.toJSON(),
                role: asOfferer ? 'offer' : 'answer'
            });
        }
    };
    if (asOfferer) {
        const ch = pc.createDataChannel('model', { ordered: true });
        entry.channel = ch;
        setupDataChannel(ch, remotePk);
        ch.onopen = () => { entry.ready = true; };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await publishPeerAnnounce({ to: remotePk, offer, role: 'offer' });
    } else {
        pc.ondatachannel = (e) => {
            entry.channel = e.channel;
            setupDataChannel(e.channel, remotePk);
            e.channel.onopen = () => { entry.ready = true; };
        };
    }
    return entry;
}

async function handlePeerSignal(ev) {
    const session = getSession();
    if (!session?.pubkey || ev.pubkey === session.pubkey) return;
    let data;
    try { data = JSON.parse(ev.content || '{}'); } catch { return; }
    if (data.lore !== 1 || data.type !== 'model_peer' || data.model_id !== MODEL_ID) return;
    if (Array.isArray(data.hashes)) {
        if (!window._remotePartPeers) window._remotePartPeers = new Map();
        data.hashes.forEach(h => {
            if (!window._remotePartPeers.has(h)) window._remotePartPeers.set(h, new Set());
            window._remotePartPeers.get(h).add(ev.pubkey);
        });
    }
    if (data.to && data.to !== session.pubkey) return;
    try {
        if (data.offer && data.role === 'offer') {
            const entry = await createPeerConnection(ev.pubkey, false);
            await entry.pc.setRemoteDescription(data.offer);
            const answer = await entry.pc.createAnswer();
            await entry.pc.setLocalDescription(answer);
            await publishPeerAnnounce({ to: ev.pubkey, answer, role: 'answer' });
        } else if (data.answer && data.role === 'answer') {
            const entry = peerRtc.get(ev.pubkey) || await createPeerConnection(ev.pubkey, true);
            if (entry.pc.signalingState !== 'stable') {
                await entry.pc.setRemoteDescription(data.answer);
            }
        } else if (data.ice) {
            const entry = peerRtc.get(ev.pubkey);
            if (entry) {
                try { await entry.pc.addIceCandidate(data.ice); } catch {}
            }
        }
    } catch (e) { console.warn('signal', e); }
}

async function startPeerNetwork() {
    if (!window.NostrTools || !getSession()?.pubkey) return;
    try {
        if (!pool) pool = new NostrTools.SimplePool();
        if (peerSub?.close) try { peerSub.close(); } catch {}
        const since = Math.floor(Date.now() / 1000) - 60;
        peerSub = pool.subscribeMany(RELAYS, [
            { kinds: [MODEL_PEER_KIND], '#model': [MODEL_ID], since }
        ], { onevent: handlePeerSignal });
        await publishPeerAnnounce({});
        if (!window._peerAnnounceTimer) {
            window._peerAnnounceTimer = setInterval(() => publishPeerAnnounce({}), 45000);
        }
    } catch (e) { console.warn('startPeerNetwork', e); }
}

function requestPartFromPeers(hash, timeoutMs) {
    return new Promise(async (resolve) => {
        if (localPartIndex.has(hash)) {
            resolve(localPartIndex.get(hash));
            return;
        }
        const peers = window._remotePartPeers?.get(hash);
        if (!peers || !peers.size) {
            resolve(null);
            return;
        }
        const profile = getNetworkProfile();
        let settled = false;
        const timer = setTimeout(() => {
            if (!settled) { settled = true; resolve(null); }
        }, timeoutMs || (profile.effectiveType === '4g' ? 4000 : 7000));

        for (const pk of peers) {
            try {
                let entry = peerRtc.get(pk);
                if (!entry) entry = await createPeerConnection(pk, true);
                const waitOpen = Date.now() + 3000;
                while ((!entry.channel || entry.channel.readyState !== 'open') && Date.now() < waitOpen) {
                    await new Promise(r => setTimeout(r, 100));
                }
                if (!entry.channel || entry.channel.readyState !== 'open') continue;
                const onMsg = async (ev) => {
                    try {
                        if (typeof ev.data === 'string') {
                            const meta = JSON.parse(ev.data);
                            if (meta.t === 'part' && meta.hash === hash) {
                                entry._expectHash = hash;
                            }
                        } else if (ev.data instanceof ArrayBuffer && entry._expectHash === hash) {
                            const buf = ev.data;
                            if (!hash || (await sha256Hex(buf)) === hash) {
                                localPartIndex.set(hash, buf);
                                if (!settled) {
                                    settled = true;
                                    clearTimeout(timer);
                                    entry.channel.removeEventListener('message', onMsg);
                                    resolve(buf);
                                }
                            }
                        }
                    } catch {}
                };
                entry.channel.addEventListener('message', onMsg);
                entry.channel.send(JSON.stringify({ t: 'req', hash }));
            } catch {}
        }
    });
}

async function fetchPartFast(part) {
    if (part.hash && localPartIndex.has(part.hash)) return localPartIndex.get(part.hash);
    if (part.hash) {
        const p2p = await requestPartFromPeers(part.hash, getNetworkProfile().saveData ? 2500 : 4500);
        if (p2p) return p2p;
    }
    return fetchPartBufferBlossom(part);
}

async function hydrateFromSharedBlossom(merged, statusEl) {
    if (!merged?.files?.length) return { ok: 0, total: 0 };
    const profile = getNetworkProfile();
    const total = merged.files.length;
    let ok = 0;
    let doneFiles = 0;
    await mapPool(merged.files, profile.concurrency, async (f) => {
        const targetUrl = modelFileUrl(f.path);
        if (modelBlobMap.has(targetUrl)) {
            ok++;
            doneFiles++;
            return;
        }
        const parts = (f.parts || []).slice().sort((a, b) => a.index - b.index);
        if (!parts.length) { doneFiles++; return; }
        try {
            const buffers = await mapPool(parts, profile.p2pConcurrency, async (p) => {
                const buf = await fetchPartFast(p);
                if (!buf) throw new Error('parte ' + p.index);
                return buf;
            });
            const totalLen = buffers.reduce((n, b) => n + b.byteLength, 0);
            const mergedU8 = new Uint8Array(totalLen);
            let off = 0;
            for (const b of buffers) {
                mergedU8.set(new Uint8Array(b), off);
                off += b.byteLength;
            }
            if (f.sha256) {
                const got = await sha256Hex(mergedU8.buffer);
                if (got !== f.sha256) throw new Error('sha256 ' + f.path);
            }
            modelBlobMap.set(targetUrl, mergedU8.buffer);
            await putModelInAllCaches(targetUrl, mergedU8.buffer);
            await registerLocalPartsFromFile(f.path, mergedU8.buffer, profile.chunkSize);
            ok++;
        } catch (e) {
            console.warn('hydrate', f.path, e);
        }
        doneFiles++;
        if (statusEl) {
            statusEl.textContent = `Rede P2P/Blossom: ${doneFiles}/${total} · ${profile.effectiveType}`;
            setModelProgress(Math.round((doneFiles / total) * 100), true);
        }
    });
    if (statusEl) {
        statusEl.textContent = ok
            ? `${ok}/${total} arquivos da rede. Completando…`
            : 'Pool vazio; baixando com latência adaptativa…';
    }
    publishPeerAnnounce({});
    return { ok, total };
}

async function syncModelToSharedBlossom(statusEl) {
    if (modelSyncRunning) return;
    const sk = getSk();
    const session = getSession();
    if (!sk || !session?.pubkey || !window.NostrTools) return;
    modelSyncRunning = true;
    const profile = getNetworkProfile();
    try {
        if (statusEl) statusEl.textContent = 'Semeando partes na rede (Blossom + P2P)…';
        const entries = await listModelCacheEntries();
        if (!entries.length) return;
        const knownHashes = new Set();
        const existingPacks = await fetchSharedModelManifests();
        existingPacks.forEach(p => (p.files || []).forEach(f =>
            (f.parts || []).forEach(part => { if (part.hash) knownHashes.add(part.hash); })
        ));
        const files = [];
        let uploaded = 0;
        for (const ent of entries) {
            const fullHash = await sha256Hex(ent.buf);
            const chunks = splitBuffer(ent.buf, profile.chunkSize);
            const parts = [];
            for (let i = 0; i < chunks.length; i++) {
                const h = await sha256Hex(chunks[i]);
                localPartIndex.set(h, chunks[i]);
                if (knownHashes.has(h)) {
                    parts.push({
                        index: i, hash: h,
                        url: BLOSSOM_SERVERS[0].replace(/\/$/, '') + '/' + h,
                        size: chunks[i].byteLength
                    });
                    continue;
                }
                try {
                    const up = await uploadBlossomBuf(chunks[i], 'application/octet-stream', sk, ent.path + '.p' + i);
                    knownHashes.add(up.hash);
                    parts.push({ index: i, hash: up.hash, url: up.url, size: up.size });
                    if (!up.existed) uploaded++;
                } catch (e) { console.warn(e); }
            }
            if (parts.length) files.push({ path: ent.path, size: ent.size, sha256: fullHash, parts });
        }
        if (!files.length) {
            publishPeerAnnounce({});
            return;
        }
        if (!pool) pool = new NostrTools.SimplePool();
        const event = NostrTools.finalizeEvent({
            kind: MODEL_PACK_KIND,
            created_at: Math.floor(Date.now() / 1000),
            tags: [
                ['d', MODEL_MANIFEST_D],
                ['title', 'LoreSocial shared model ' + MODEL_ID],
                ['model', MODEL_ID],
                ['shared', '1']
            ],
            content: JSON.stringify({
                lore: 1, type: 'model_pack', model_id: MODEL_ID, hf_base: MODEL_HF_BASE,
                files, shared: true, p2p: true, created_at: Date.now()
            })
        }, sk);
        await Promise.any(pool.publish(RELAYS, event));
        publishPeerAnnounce({});
        if (statusEl) {
            statusEl.textContent = uploaded
                ? `Rede alimentada: ${uploaded} partes novas (Blossom+P2P).`
                : 'Semente P2P ativa; Blossom já tinha as partes.';
        }
    } catch (e) {
        console.warn(e);
        if (statusEl) statusEl.textContent = 'Modelo OK. Semeadura: ' + (e.message || 'parcial');
    } finally {
        modelSyncRunning = false;
    }
}

async function ensureEngine(statusEl) {
    if (engine) return engine;
    if (!window.webllm) {
        if (statusEl) statusEl.textContent = 'WebLLM não carregou. Usando modo local simples.';
        setModelProgress(0, false);
        return null;
    }
    if (modelLoading) {
        if (statusEl) statusEl.textContent = 'Carregando modelo…';
        while (modelLoading) await new Promise(r => setTimeout(r, 300));
        return engine;
    }
    modelLoading = true;
    patchFetchForModel();
    const profile = getNetworkProfile();
    try {
        if (statusEl) {
            statusEl.style.display = 'block';
            statusEl.textContent = `Qwen2.5-0.5B · carregando rápido (${profile.effectiveType})…`;
        }
        setModelProgress(2, true);
        startPeerNetwork();
        const packs = await fetchSharedModelManifests();
        const merged = mergeSharedManifests(packs);
        if (merged.files.length) {
            await hydrateFromSharedBlossom(merged, statusEl);
        }
        if (statusEl) {
            statusEl.textContent = modelBlobMap.size
                ? `Montando (${modelBlobMap.size} arquivos em cache/rede)…`
                : 'Baixando modelo leve (~278MB) em paralelo…';
        }
        setModelProgress(Math.max(10, Math.min(50, modelBlobMap.size * 4)), true);
        engine = await window.webllm.CreateMLCEngine(MODEL_ID, {
            initProgressCallback: (p) => {
                const progress = typeof p?.progress === 'number' ? p.progress : 0;
                const pct = Math.round(progress * 100);
                setModelProgress(pct || 12, true);
                if (statusEl) statusEl.textContent = pct >= 100 ? 'Finalizando no dispositivo…' : `${pct}% — ${p?.text || 'carregando'}`;
            }
        });
        setModelProgress(100, true);
        if (statusEl) statusEl.textContent = 'Modelo pronto · semeando rede…';
        setTimeout(() => setModelProgress(0, false), 400);
        setTimeout(() => {
            syncModelToSharedBlossom(statusEl).catch(() => {});
            publishPeerAnnounce({});
        }, 600);
        return engine;
    } catch (e) {
        console.warn(e);
        if (statusEl) statusEl.textContent = 'Falha no modelo. Usando respostas locais simples.';
        setModelProgress(0, false);
        engine = null;
        return null;
    } finally {
        modelLoading = false;
    }
}

function openCharChat(ch) {
    currentChar = ch;
    currentCharId = ch.id;
    chatHistory = [];
    document.getElementById('chatName').textContent = ch.name;
    document.getElementById('chatSub').textContent =
        toneLabel(ch.tone) + (ch.creatorName ? ' · @' + ch.creatorName : ' · personagem IA');
    const av = document.getElementById('chatAv');
    if (ch.image) av.innerHTML = `<img src="${escapeHtml(ch.image)}" alt="">`;
    else av.textContent = (ch.name || '?').substring(0, 2).toUpperCase();
    const msgs = document.getElementById('chatMsgs');
    msgs.classList.remove('welcome');
    msgs.innerHTML = `<div class="bubble sys">Conversando com ${escapeHtml(ch.name)}. A IA roda no seu aparelho.</div>`;
    document.getElementById('welcomePlaceholder')?.remove();
    document.getElementById('chatInputArea').style.display = 'flex';
    document.getElementById('modelStatus').style.display = 'block';
    if (window.innerWidth <= 767) appContainer.classList.add('mobile-show-chat');
    renderCharList('panelRede', networkChars);
    renderCharList('panelMeus', myChars);
    ensureEngine(document.getElementById('modelStatus'));
}

function closeCharChat() {
    currentChar = null;
    currentCharId = null;
    chatHistory = [];
    appContainer.classList.remove('mobile-show-chat');
    document.getElementById('chatName').textContent = 'Personagens IA';
    document.getElementById('chatSub').textContent = 'Selecione um personagem';
    document.getElementById('chatAv').innerHTML = '<i class="fa-solid fa-masks-theater"></i>';
    document.getElementById('chatInputArea').style.display = 'none';
    document.getElementById('modelStatus').style.display = 'none';
    setModelProgress(0, false);
    const msgs = document.getElementById('chatMsgs');
    msgs.classList.add('welcome');
    msgs.innerHTML = `<div class="welcome-placeholder" id="welcomePlaceholder">
        <i class="fa-solid fa-masks-theater"></i>
        <h2>Personagens LoreSocial</h2>
        <p>Escolha um personagem na lista ao lado para conversar. A IA roda quantizada no seu aparelho.</p>
    </div>`;
    renderCharList('panelRede', networkChars);
    renderCharList('panelMeus', myChars);
}

function appendBubble(role, text) {
    const msgs = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.className = 'bubble ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

async function sendCharMessage() {
    const input = document.getElementById('chatInput');
    const text = (input.value || '').trim();
    if (!text || !currentChar) return;
    input.value = '';
    appendBubble('user', text);
    chatHistory.push({ role: 'user', content: text });
    const statusEl = document.getElementById('modelStatus');
    const eng = await ensureEngine(statusEl);
    const lastBot = appendBubble('bot', '…');
    try {
        if (eng) {
            const messages = [
                { role: 'system', content: systemPromptFor(currentChar) },
                ...chatHistory.slice(-12)
            ];
            const reply = await eng.chat.completions.create({
                messages,
                temperature: currentChar.tone === 'euforicas' ? 0.95 : currentChar.tone === 'eroticas' ? 0.9 : 0.7,
                max_tokens: 400
            });
            const out = reply?.choices?.[0]?.message?.content?.trim() || '…';
            lastBot.textContent = out;
            chatHistory.push({ role: 'assistant', content: out });
        } else {
            const out = `[${currentChar.name}] ${text.length > 0 ? 'Entendi. ' : ''}${
                currentChar.tone === 'euforicas' ? 'Que animação! ' : currentChar.tone === 'eroticas' ? 'Hmm… ' : ''
            }Como personagem, reajo com base na minha personalidade: ${(currentChar.personality || '').slice(0, 80)}…`;
            lastBot.textContent = out;
            chatHistory.push({ role: 'assistant', content: out });
        }
    } catch (e) {
        lastBot.textContent = 'Erro ao gerar resposta. Tente de novo.';
        console.error(e);
    }
}

document.getElementById('chatInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendCharMessage();
});

async function boot() {
    for (let i = 0; i < 50 && !window.NostrTools; i++) await new Promise(r => setTimeout(r, 100));
    await loadNetworkCharacters();
    if (window.webllm) {
        const silent = { style: {}, textContent: '' };
        ensureEngine(silent).catch(() => {});
    }
}
boot();
</script>
