<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central da conta</title>
    <!-- Importando ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f5fa; /* Fundo levemente arroxeado para combinar */
            color: #1a1a1a;
        }

        /* Container Principal do Perfil */
        .fb-profile-container {
            max-width: 940px;
            margin: 0 auto;
            background-color: #ffffff; /* Branco principal */
            box-shadow: 0 1px 3px rgba(111, 66, 193, 0.08);
        }

        /* Seção da Capa */
        .fb-cover-wrapper {
            position: relative;
            max-width: 940px;
            height: 350px;
            margin: 0 auto;
            background-color: #e9e2f5;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow: hidden;
        }

        .fb-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Seção de Informações Básicas abaixo da Capa */
        .fb-header-section {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #e9e2f5;
            position: relative;
        }

        .fb-header-content {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            position: relative;
            margin-top: -30px;
        }

        .fb-profile-left {
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }

        /* Foto de Perfil */
        .fb-avatar-wrapper {
            position: relative;
            width: 168px;
            height: 168px;
            border-radius: 50%;
            border: 4px solid #ffffff; /* Branco */
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(111, 66, 193, 0.15);
        }

        .fb-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Nome e Amigos */
        .fb-profile-info {
            padding-bottom: 10px;
        }

        .fb-profile-name {
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Estilo da Lista Horizontal de Informações Pessoais */
        .fb-user-details-list {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            gap: 15px;
            margin-top: 8px;
            font-size: 14px;
            color: #4b4b4b;
        }

        .fb-user-details-list li {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fb-user-details-list i {
            color: #6f42c1;
        }

        /* Botões de Ação (Violeta) */
        .fb-profile-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
        }

        .fb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Botão Primário em Violeta (Home) */
        .fb-btn-primary {
            background-color: #6f42c1; /* Violeta */
            color: #ffffff;
        }

        .fb-btn-primary:hover {
            background-color: #5a32a3;
        }

        /* Botão Secundário em tons claros/violeta suave (Edição) */
        .fb-btn-secondary {
            background-color: #f3eef9;
            color: #5a32a3;
        }

        .fb-btn-secondary:hover {
            background-color: #e6dcfl;
        }

        /* --- TOP TAB BARS (ESTILO TIKTOK) --- */
        .tiktok-tab-container {
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #e9e2f5;
            background-color: #ffffff;
            position: relative;
        }

        .tiktok-tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }

        .tiktok-tab.active {
            color: #1a1a1a;
        }

        /* Indicador deslizante inferior característico do TikTok */
        .tiktok-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background-color: #6f42c1;
            border-radius: 2px;
        }

        .tiktok-tab:hover {
            color: #6f42c1;
        }

        /* --- SISTEMA DE ABAS (CONTEÚDOS) --- */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- SEÇÃO DO MAPA (ESTILO SNAP MAP) --- */
        .fb-map-section {
            padding: 20px;
            border-bottom: 1px solid #e9e2f5;
        }

        .fb-map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .fb-map-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-map-title i {
            color: #6f42c1;
        }

        .fb-map-container {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #e9e2f5;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(111, 66, 193, 0.1);
        }

        .fb-map-pin {
            position: absolute;
            background: #ffffff;
            padding: 4px;
            border-radius: 50%;
            border: 2px solid #6f42c1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .fb-map-pin img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .pin-1 { top: 30%; left: 25%; }
        .pin-2 { top: 60%; left: 70%; }
        .pin-3 { top: 20%; left: 75%; }

        .fb-map-placeholder-text {
            color: #6c757d;
            font-size: 14px;
            font-weight: 600;
        }

        /* --- SEÇÃO MEUS POSTS --- */
        .fb-generic-section {
            padding: 40px 20px;
            text-align: center;
            color: #6c757d;
            font-size: 16px;
            font-weight: 600;
        }

        /* --- SEÇÃO CONTA (OPÇÕES) --- */
        .fb-account-section {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .fb-account-option-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 18px;
            background-color: #f3eef9;
            color: #5a32a3;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #e9e2f5;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }

        .fb-account-option-btn i {
            font-size: 16px;
        }

        .fb-account-option-btn:hover {
            background-color: #e9e2f5;
            border-color: #6f42c1;
        }

        /* Opção específica de exclusão em tom de alerta suave */
        .fb-account-option-btn.danger {
            background-color: #fdf2f2;
            color: #d9534f;
            border-color: #f5c6cb;
        }

        .fb-account-option-btn.danger:hover {
            background-color: #f8d7da;
            border-color: #d9534f;
        }

        /* --- MENU FLUTUANTE DE EDIÇÃO (MODAL DESKTOP/PADRÃO) --- */
        .edit-modal-overlay {
            visibility: hidden;
            opacity: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .edit-modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .edit-modal-container {
            background-color: #ffffff;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .edit-modal-overlay.active .edit-modal-container {
            transform: translateY(0);
        }

        .edit-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e9e2f5;
        }

        .edit-modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-modal-title i {
            color: #6f42c1;
        }

        .edit-modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #6c757d;
            cursor: pointer;
        }

        .edit-modal-close:hover {
            color: #1a1a1a;
        }

        .edit-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .edit-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .edit-form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4b4b4b;
        }

        .edit-form-group input,
        .edit-form-group select {
            padding: 10px 14px;
            border: 1px solid #dcd1ed;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            color: #1a1a1a;
            background-color: #fdfcff;
        }

        .edit-form-group input:focus,
        .edit-form-group select:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 0 2px rgba(111, 66, 193, 0.15);
        }

        .edit-modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #e9e2f5;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background-color: #f7f5fa;
        }

        /* --- RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 768px) {
            .fb-cover-wrapper {
                height: 200px;
            }

            .fb-header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
                margin-top: -60px;
            }

            .fb-profile-left {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .fb-avatar-wrapper {
                width: 140px;
                height: 140px;
            }

            .fb-profile-name {
                font-size: 24px;
                justify-content: center;
            }

            .fb-user-details-list {
                justify-content: center;
                text-align: center;
            }

            .fb-profile-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 10px;
            }

            .fb-btn {
                flex: 1;
                min-width: 120px;
            }

            /* Adaptação do Modal para Mobile: Altura inferior, full-width e slide-up */
            .edit-modal-overlay {
                align-items: flex-end; /* Posiciona no fundo da tela */
            }

            .edit-modal-container {
                width: 100%;
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
                transform: translateY(100%); /* Esconde inicialmente abaixo da tela */
            }

            .edit-modal-overlay.active .edit-modal-container {
                transform: translateY(0); /* Desliza para cima até encaixar na base */
            }
        }
    </style>
</head>
<body>

    <div class="fb-profile-container">
        
        <!-- Capa do Perfil -->
        <div class="fb-cover-wrapper">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80" alt="Capa" class="fb-cover-img">
        </div>

        <!-- Cabeçalho -->
        <div class="fb-header-section">
            <div class="fb-header-content">
                
                <div class="fb-profile-left">
                    <div class="fb-avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Foto de Perfil" class="fb-avatar-img">
                    </div>
                    <div class="fb-profile-info">
                        <h1 class="fb-profile-name">
                            Nome Sobrenome 
                            <i class="fa-solid fa-circle-check" style="color: #6f42c1; font-size: 18px;" title="Verificado"></i>
                        </h1>
                        
                        <ul class="fb-user-details-list">
                            <li><i class="fa-solid fa-venus-mars"></i> Feminino</li>
                            <li><i class="fa-solid fa-ring"></i> Solteira(o)</li>
                            <li><i class="fa-solid fa-globe"></i> Brasileira(o)</li>
                            <li><i class="fa-solid fa-location-dot"></i> São Paulo, SP</li>
                            <li><i class="fa-solid fa-graduation-cap"></i> Universidade de São Paulo (USP)</li>
                        </ul>
                    </div>
                </div>

                <div class="fb-profile-actions">
                    <a href="../Social.html" class="fb-btn fb-btn-primary">
                        <i class="fa-solid fa-house"></i> Home
                    </a>
                    <!-- Botão Edição agora aciona o menu flutuante -->
                    <button class="fb-btn fb-btn-secondary" id="open-edit-modal">
                        <i class="fa-solid fa-pen"></i> Edição
                    </button>
                </div>

            </div>
        </div>

        <!-- Container Horizontal de Top Tab Bars (Estilo TikTok) -->
        <div class="tiktok-tab-container">
            <button class="tiktok-tab active" data-target="mapa-section">Mapa</button>
            <button class="tiktok-tab" data-target="posts-section">Meus posts</button>
            <button class="tiktok-tab" data-target="conta-section">Conta</button>
        </div>

        <!-- SEÇÃO 1: MAPA (Ativa por padrão) -->
        <div id="mapa-section" class="tab-content active">
            <div class="fb-map-section">
                <div class="fb-map-header">
                    <h3 class="fb-map-title">
                        <i class="fa-solid fa-map-location-dot"></i> Mapa de Amigos
                    </h3>
                </div>
                <div class="fb-map-container">
                    <span class="fb-map-placeholder-text">Visualização do Mapa Interativo</span>
                    
                    <div class="fb-map-pin pin-1" title="Usuário 1">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Amigo 1">
                    </div>
                    <div class="fb-map-pin pin-2" title="Usuário 2">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Amigo 2">
                    </div>
                    <div class="fb-map-pin pin-3" title="Usuário 3">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80" alt="Amigo 3">
                    </div>
                </div>
            </div>
        </div>

        <!-- SEÇÃO 2: MEUS POSTS -->
        <div id="posts-section" class="tab-content">
            <div class="fb-generic-section">
                <i class="fa-solid fa-images" style="font-size: 32px; color: #6f42c1; margin-bottom: 10px; display: block;"></i>
                Nenhum post publicado ainda.
            </div>
        </div>

        <!-- SEÇÃO 3: CONTA -->
        <div id="conta-section" class="tab-content">
            <div class="fb-account-section">
                <button class="fb-account-option-btn">
                    <span><i class="fa-solid fa-right-left" style="margin-right: 8px;"></i> Troca de conta</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="fb-account-option-btn danger">
                    <span><i class="fa-solid fa-user-slash" style="margin-right: 8px;"></i> Excluir conta</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Menu Flutuante (Modal) de Edição -->
    <div class="edit-modal-overlay" id="edit-modal">
        <div class="edit-modal-container">
            <div class="edit-modal-header">
                <h3 class="edit-modal-title">
                    <i class="fa-solid fa-pen-to-square"></i> Editar Perfil
                </h3>
                <button class="edit-modal-close" id="close-edit-modal">&times;</button>
            </div>
            <div class="edit-modal-body">
                <div class="edit-form-group">
                    <label>Nome Completo</label>
                    <input type="text" value="Nome Sobrenome">
                </div>
                <div class="edit-form-group">
                    <label>Gênero</label>
                    <select>
                        <option selected>Feminino</option>
                        <option>Masculino</option>
                        <option>Outro</option>
                    </select>
                </div>
                <div class="edit-form-group">
                    <label>Estado Civil</label>
                    <select>
                        <option selected>Solteira(o)</option>
                        <option>Casada(o)</option>
                        <option>Em um relacionamento</option>
                    </select>
                </div>
                <div class="edit-form-group">
                    <label>Nacionalidade / País</label>
                    <input type="text" value="Brasileira(o)">
                </div>
                <div class="edit-form-group">
                    <label>Localização (Cidade, UF)</label>
                    <input type="text" value="São Paulo, SP">
                </div>
                <div class="edit-form-group">
                    <label>Educação</label>
                    <input type="text" value="Universidade de São Paulo (USP)">
                </div>
            </div>
            <div class="edit-modal-footer">
                <button class="fb-btn fb-btn-secondary" id="cancel-edit-modal">Cancelar</button>
                <button class="fb-btn fb-btn-primary" id="save-edit-modal">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <!-- Script para Alternar as Abas e Controlar o Modal de Edição -->
    <script>
        // Lógica das Abas (Top Tab Bars)
        const tabs = document.querySelectorAll('.tiktok-tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));

                tab.classList.add('active');

                const targetId = tab.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Lógica do Modal Flutuante de Edição
        const editModal = document.getElementById('edit-modal');
        const openModalBtn = document.getElementById('open-edit-modal');
        const closeModalBtn = document.getElementById('close-edit-modal');
        const cancelModalBtn = document.getElementById('cancel-edit-modal');
        const saveModalBtn = document.getElementById('save-edit-modal');

        openModalBtn.addEventListener('click', () => {
            editModal.classList.add('active');
        });

        const closeModal = () => {
            editModal.classList.remove('active');
        };

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        saveModalBtn.addEventListener('click', () => {
            closeModal();
        });

        // Fecha o modal ao clicar fora da caixa do modal
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) {
                closeModal();
            }
        });
    </script>

</body>
</html>
