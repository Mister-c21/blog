<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Estilo Facebook (Branco e Violeta)</title>
    <!-- Importando ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f5fa; /* Fundo levemente arroxeado para combinar */
            color: #1a1a1a;
        }

        /* Container Principal do Perfil */
        .fb-profile-container {
            max-width: 940px;
            margin: 0 auto;
            background-color: #ffffff; /* Branco principal */
            box-shadow: 0 1px 3px rgba(111, 66, 193, 0.08);
        }

        /* Seção da Capa */
        .fb-cover-wrapper {
            position: relative;
            max-width: 940px;
            height: 350px;
            margin: 0 auto;
            background-color: #e9e2f5;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow: hidden;
        }

        .fb-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Seção de Informações Básicas abaixo da Capa */
        .fb-header-section {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #e9e2f5;
            position: relative;
        }

        .fb-header-content {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            position: relative;
            margin-top: -30px;
        }

        .fb-profile-left {
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }

        /* Foto de Perfil */
        .fb-avatar-wrapper {
            position: relative;
            width: 168px;
            height: 168px;
            border-radius: 50%;
            border: 4px solid #ffffff; /* Branco */
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(111, 66, 193, 0.15);
        }

        .fb-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Nome e Amigos */
        .fb-profile-info {
            padding-bottom: 10px;
        }

        .fb-profile-name {
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .fb-profile-friends {
            font-size: 15px;
            color: #6c757d;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Botões de Ação (Violeta) */
        .fb-profile-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
        }

        .fb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Botão Primário em Violeta */
        .fb-btn-primary {
            background-color: #6f42c1; /* Violeta */
            color: #ffffff;
        }

        .fb-btn-primary:hover {
            background-color: #5a32a3; /* Violeta escuro */
        }

        /* Botão Secundário em tons claros/violeta suave */
        .fb-btn-secondary {
            background-color: #f3eef9;
            color: #5a32a3;
        }

        .fb-btn-secondary:hover {
            background-color: #e6dcfl;
        }

        /* --- RESPONSIVIDADE PARA MOBILE --- */
        @media (max-width: 768px) {
            .fb-cover-wrapper {
                height: 200px;
            }

            .fb-header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
                margin-top: -60px;
            }

            .fb-profile-left {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .fb-avatar-wrapper {
                width: 140px;
                height: 140px;
            }

            .fb-profile-name {
                font-size: 24px;
                justify-content: center;
            }

            .fb-profile-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 10px;
            }

            .fb-btn {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="fb-profile-container">
        
        <!-- Capa do Perfil -->
        <div class="fb-cover-wrapper">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80" alt="Capa" class="fb-cover-img">
        </div>

        <!-- Cabeçalho -->
        <div class="fb-header-section">
            <div class="fb-header-content">
                
                <div class="fb-profile-left">
                    <div class="fb-avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Foto de Perfil" class="fb-avatar-img">
                    </div>
                    <div class="fb-profile-info">
                        <h1 class="fb-profile-name">
                            Nome Sobrenome 
                            <!-- Ícone de verificação em violeta -->
                            <i class="fa-solid fa-circle-check" style="color: #6f42c1; font-size: 18px;" title="Verificado"></i>
                        </h1>
                        <p class="fb-profile-friends">500 amigos</p>
                    </div>
                </div>

                <div class="fb-profile-actions">
                    <button class="fb-btn fb-btn-primary">
                        <i class="fa-solid fa-plus"></i> Adicionar aos amigos
                    </button>
                    <button class="fb-btn fb-btn-secondary">
                        <i class="fa-solid fa-comment-dots"></i> Mensagem
                    </button>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
