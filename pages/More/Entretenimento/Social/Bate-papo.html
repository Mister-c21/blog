<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoreWiki</title>

  <link rel="icon" type="image/png" href="./Src/FavicoLW.png">
  <link rel="apple-touch-icon" href="./Src/FavicoLW.png">

  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary-violet: #7c3aed;
      --primary-violet-hover: #6d28d9;
      --primary-light: #f5f3ff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --nav-size: 65px;
      --sidebar-width: 240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    /* --- NAVEGAÇÃO (Mobile First: Bottom Tabbar) --- */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--nav-size);
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      /* Transição fluida aplicada apenas para o comportamento mobile */
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      transform: translateY(0);
      opacity: 1;
    }

    /* Classe para esconder a barra SOMENTE no Mobile (desliza para baixo) */
    .navbar.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      display: none;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-violet);
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .nav-list {
      display: flex;
      width: 100%;
      justify-content: space-around;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item a:hover {
      color: var(--primary-violet);
      background-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .nav-item a.active {
      color: var(--primary-violet);
      background-color: var(--primary-light);
      font-weight: 600;
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.18);
    }

    .nav-item a i {
      width: 24px;
      height: 24px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item a.active i {
      transform: scale(1.15) rotate(-3deg);
    }

    /* --- CONTEÚDO PRINCIPAL --- */
    .main-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - var(--nav-size));
      display: flex;
      transition: height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Expande a altura no mobile quando a barra inferior some */
    .main-wrapper.expanded {
      height: 100vh;
    }

    .feed {
      width: 100%;
      height: 100%;
      max-width: none;
      padding: 0;
    }

    .feed-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: scale(1);
    }

    .feed-iframe.changing {
      opacity: 0;
      transform: scale(0.99);
    }

    /* --- LAYOUT DESKTOP (Sidebar Fixa e Imune a Ocultação) --- */
    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }

      .navbar {
        position: sticky;
        top: 0;
        left: 0;
        width: var(--sidebar-width);
        height: 100vh;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 30px;
        border-top: none;
        border-right: 1px solid var(--border-color);
        /* Anula qualquer efeito de sumir ou deslocamento lateral no desktop */
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        transition: none;
      }

      .logo {
        display: block;
      }

      .nav-list {
        flex-direction: column;
        gap: 8px;
        padding: 0 12px;
      }

      .nav-item a {
        flex-direction: row;
        font-size: 1rem;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 12px;
      }

      .main-wrapper {
        height: 100vh !important;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar" id="mainNav">
    <div class="logo">LoreWiki</div>
    <ul class="nav-list">
      <li class="nav-item nav-home">
        <a href="../Social.html">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" data-src="Chat/Index.html" class="active">
          <i data-lucide="message-square"></i>
          <span>Chat</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="main-wrapper" id="mainWrapper">
    <main class="feed">
      <iframe src="Chat/Index.html" class="feed-iframe" title="Conteúdo do Feed"></iframe>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const feedIframe = document.querySelector('.feed-iframe');
    const navLinks = document.querySelectorAll('.nav-list a[data-src]');
    const mainNav = document.getElementById('mainNav');
    const mainWrapper = document.getElementById('mainWrapper');

    // Executa a ocultação animada apenas se estiver em telas menores (Mobile)
    if (window.innerWidth < 768) {
      mainNav.classList.add('hidden');
      mainWrapper.classList.add('expanded');
    }

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        if (link.classList.contains('active')) return;

        document.querySelectorAll('.nav-list a').forEach(item => item.classList.remove('active'));
        link.classList.add('active');
        
        const newSrc = link.getAttribute('data-src');
        if (newSrc) {
          feedIframe.classList.add('changing');
          setTimeout(() => {
            feedIframe.src = newSrc;
            feedIframe.classList.remove('changing');
          }, 200);
        }
      });
    });

    // Comunicação opcional via iframe
    window.addEventListener('message', (event) => {
      if (window.innerWidth < 768) {
        if (event.data === 'hideNav') {
          mainNav.classList.add('hidden');
          mainWrapper.classList.add('expanded');
        } else if (event.data === 'showNav') {
          mainNav.classList.remove('hidden');
          mainWrapper.classList.remove('expanded');
        }
      }
    });
  </script>
</body>
</html>
