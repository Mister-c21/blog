<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Criar Story — LoreSocial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import * as NostrTools from 'https://esm.sh/nostr-tools@2.10.4';
        import { hexToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';
        window.NostrTools = NostrTools;
        window.nostrHexToBytes = hexToBytes;
    </script>
    <style>
        :root { --primary-bg:#fff; --secondary-color:#6c5ce7; --secondary-hover:#5b4be2; --light-violet:#f3f0ff; --gray-bg:#f8f9fa; --text-main:#2d3436; --text-muted:#636e72; --border-color:#dfe6e9; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        html, body { height:100%; height:100dvh; background:var(--light-violet); }
        body { display:flex; justify-content:center; }
        .page { width:100%; max-width:480px; min-height:100%; min-height:100dvh; background:var(--primary-bg); display:flex; flex-direction:column; }
        .header { flex-shrink:0; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-color); font-weight:600; }
        .header button { background:none; border:none; color:var(--secondary-color); font-size:16px; cursor:pointer; padding:6px; }
        .header .post-btn { background:var(--secondary-color); color:#fff; border-radius:16px; padding:8px 16px; font-weight:600; font-size:14px; }
        .header .post-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .body { flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
        .preview-box { width:100%; aspect-ratio:9/16; max-height:45vh; background:#111; border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.5); }
        .preview-box img, .preview-box video { width:100%; height:100%; object-fit:contain; }
        .pick-row { display:flex; gap:10px; }
        .pick-btn { flex:1; padding:12px; border:1px dashed var(--border-color); border-radius:12px; background:var(--gray-bg); cursor:pointer; text-align:center; font-size:13px; font-weight:600; }
        .pick-btn i { display:block; font-size:20px; color:var(--secondary-color); margin-bottom:6px; }
        textarea, select, input[type="number"] { width:100%; padding:12px 14px; border:1px solid var(--border-color); border-radius:12px; outline:none; font-size:14px; background:var(--gray-bg); }
        textarea { min-height:70px; resize:vertical; }
        label.field { font-size:13px; font-weight:600; color:var(--text-main); }
        .duration-row { display:flex; gap:8px; flex-wrap:wrap; }
        .dur-chip { padding:8px 12px; border-radius:20px; border:1px solid var(--border-color); background:var(--gray-bg); font-size:13px; font-weight:600; cursor:pointer; }
        .dur-chip.active { background:var(--light-violet); border-color:var(--secondary-color); color:var(--secondary-color); }
        .status { font-size:13px; color:var(--text-muted); text-align:center; }
        .status.error { color:#e74c3c; } .status.ok { color:#00b894; }
        input[type="file"] { display:none; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <button type="button" onclick="location.href='./Bate-papo.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <span>Novo story</span>
        <button type="button" class="post-btn" id="postBtn" disabled onclick="publishStory()">Publicar</button>
    </div>
    <div class="body">
        <div class="preview-box" id="previewBox"><span id="previewPlaceholder"><i class="fa-solid fa-image" style="font-size:32px;display:block;margin-bottom:8px;"></i>Escolha foto ou vídeo</span></div>
        <div class="pick-row">
            <label class="pick-btn"><i class="fa-solid fa-camera"></i> Foto<input type="file" id="fileImage" accept="image/*"></label>
            <label class="pick-btn"><i class="fa-solid fa-video"></i> Vídeo<input type="file" id="fileVideo" accept="video/*"></label>
        </div>
        <textarea id="caption" placeholder="Legenda (opcional)" maxlength="500"></textarea>
        <label class="field">Duração (máx. 24 horas)</label>
        <div class="duration-row" id="durationChips">
            <button type="button" class="dur-chip" data-h="1">1h</button>
            <button type="button" class="dur-chip" data-h="3">3h</button>
            <button type="button" class="dur-chip" data-h="6">6h</button>
            <button type="button" class="dur-chip" data-h="12">12h</button>
            <button type="button" class="dur-chip active" data-h="24">24h</button>
        </div>
        <label class="field">Ou horas personalizadas (1–24)</label>
        <input type="number" id="customHours" min="1" max="24" step="1" placeholder="Ex: 8" inputmode="numeric">
        <p class="status" id="statusText">A duração é registrada na rede (tag expiration). Você pode publicar vários stories e apagar antes do fim.</p>
    </div>
</div>
<script>
(function(){ try{ const s=JSON.parse(localStorage.getItem('nostr_session')||'null'); if(localStorage.getItem('isLoggedIn')!=='true'||!s?.privateKeyHex||!s?.pubkey) location.replace('../Social.html'); }catch{ location.replace('../Social.html'); }})();

const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.primal.net','wss://relay.nostr.band'];
const BLOSSOM = ['https://blossom.primal.net','https://cdn.nostrcheck.me','https://blossom.oxtr.dev'];
const STORY_KIND = 30078;
const MAX_HOURS = 24;

let selectedFile = null, selectedType = 'image', durationHours = 24, pool = null;

function getSession(){ try{ return JSON.parse(localStorage.getItem('nostr_session')||'null'); }catch{ return null; } }
function getSk(){
    const s=getSession(); if(!s?.privateKeyHex) return null;
    if(window.nostrHexToBytes) return window.nostrHexToBytes(s.privateKeyHex);
    const hex=s.privateKeyHex; const out=new Uint8Array(hex.length/2);
    for(let i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16); return out;
}
function setStatus(msg,type){ const el=document.getElementById('statusText'); el.textContent=msg; el.className='status'+(type==='error'?' error':type==='ok'?' ok':''); }
function updatePostBtn(){ document.getElementById('postBtn').disabled=!selectedFile; }

document.querySelectorAll('.dur-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('.dur-chip').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        durationHours = Math.min(MAX_HOURS, Math.max(1, Number(btn.dataset.h)||24));
        document.getElementById('customHours').value = '';
    });
});
document.getElementById('customHours').addEventListener('input', e=>{
    let v = parseInt(e.target.value, 10);
    if (isNaN(v)) return;
    v = Math.min(MAX_HOURS, Math.max(1, v));
    durationHours = v;
    document.querySelectorAll('.dur-chip').forEach(b=>{
        b.classList.toggle('active', Number(b.dataset.h)===v);
    });
});

function onFile(file, type){
    if(!file) return;
    selectedFile=file; selectedType=type;
    const box=document.getElementById('previewBox'); box.innerHTML='';
    const url=URL.createObjectURL(file);
    if(type==='video'){ const v=document.createElement('video'); v.src=url; v.controls=true; v.playsInline=true; box.appendChild(v); }
    else { const img=document.createElement('img'); img.src=url; box.appendChild(img); }
    updatePostBtn(); setStatus('Pronto. Duração: '+durationHours+'h na rede.');
}
document.getElementById('fileImage').addEventListener('change', e=>{ const f=e.target.files?.[0]; if(f) onFile(f,'image'); });
document.getElementById('fileVideo').addEventListener('change', e=>{ const f=e.target.files?.[0]; if(f) onFile(f,'video'); });

async function sha256Hex(buf){ const h=await crypto.subtle.digest('SHA-256',buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function uploadBlossom(file, sk){
    const buf=await file.arrayBuffer(); const hash=await sha256Hex(buf);
    const now=Math.floor(Date.now()/1000);
    const authEvent=NostrTools.finalizeEvent({ kind:24242, created_at:now, tags:[['t','upload'],['x',hash],['expiration',String(now+300)]], content:'Upload story' }, sk);
    const auth='Nostr '+btoa(JSON.stringify(authEvent));
    for(const base of BLOSSOM){
        try{
            const res=await fetch(base.replace(/\/$/,'')+'/upload',{ method:'PUT', headers:{ Authorization:auth, 'Content-Type':file.type||'application/octet-stream' }, body:buf });
            if(!res.ok) continue;
            const data=await res.json().catch(()=>({}));
            const url=data.url||(base.replace(/\/$/,'')+'/'+hash);
            if(url) return { url, hash };
        }catch{}
    }
    throw new Error('Falha no upload Blossom.');
}

async function publishStory(){
    if(!selectedFile) return;
    const custom = parseInt(document.getElementById('customHours').value, 10);
    if (!isNaN(custom)) durationHours = Math.min(MAX_HOURS, Math.max(1, custom));

    const sk=getSk(); const session=getSession();
    if(!sk||!session?.pubkey||!window.NostrTools){ setStatus('Sessão inválida.','error'); return; }
    const btn=document.getElementById('postBtn'); btn.disabled=true;
    setStatus('Enviando mídia...');
    try{
        const { url, hash } = await uploadBlossom(selectedFile, sk);
        setStatus('Publicando na rede ('+durationHours+'h)...');
        const caption=(document.getElementById('caption').value||'').trim();
        const created=Math.floor(Date.now()/1000);
        const ttlSec = Math.min(MAX_HOURS * 3600, Math.max(3600, durationHours * 3600));
        const expiresAtMs = Date.now() + ttlSec * 1000;
        const dTag='story-'+created+'-'+Math.random().toString(36).slice(2,8);
        const content=JSON.stringify({
            lore:1, type:'story', mediaType:selectedType, url, hash:hash||'',
            text:caption, createdAt:Date.now(), expiresAt:expiresAtMs, durationHours
        });
        const event=NostrTools.finalizeEvent({
            kind: STORY_KIND,
            created_at: created,
            tags: [
                ['d', dTag],
                ['expiration', String(created + ttlSec)],
                ['m', selectedType==='video'?'video':'image'],
                ['url', url]
            ],
            content
        }, sk);
        if(!pool) pool=new NostrTools.SimplePool();
        await Promise.any(pool.publish(RELAYS, event));

        const key='loresocial_own_stories_'+String(session.pubkey).toLowerCase();
        let own=[]; try{ own=JSON.parse(localStorage.getItem(key)||'[]'); }catch{}
        own.unshift({ url, type:selectedType, text:caption, time:Date.now(), expiresAt:expiresAtMs, eventId:event.id, dTag });
        own=own.filter(s=>{
            const exp=s.expiresAt||0; if(exp) return Date.now()<exp;
            return Date.now()-(s.time||0)<24*60*60*1000;
        }).slice(0,30);
        localStorage.setItem(key, JSON.stringify(own));

        setStatus('Story publicado! Expira em '+durationHours+'h.','ok');
        setTimeout(()=>{ location.href='./Chat.html'; }, 900);
    }catch(e){
        console.error(e); setStatus(e.message||'Erro ao publicar.','error'); btn.disabled=false;
    }
}
</script>
</body>
</html>
