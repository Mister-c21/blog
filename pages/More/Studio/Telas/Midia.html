<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes</title>
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Estilo do Header Centralizado com cor violeta */
        .tiktok-header-title {
            text-align: center;
            padding: 12px 16px 4px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #8A2BE2; /* Violeta */
        }

        /* Lista horizontal com rolagem e alinhamento ajustado para caber todas as opções */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 20px;
            justify-content: flex-start; /* Permite rolar suavemente caso ultrapasse a tela */
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #8a8a8a;
            flex-shrink: 0; /* Impede que os itens espremem uns aos outros */
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container dos iframes (ajustado considerando a altura extra do header) */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 95px);
            position: relative;
            overflow: hidden;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .tab-iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <header class="tiktok-header-title">Mídia</header>
        
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-imagem" data-index="0">Imagem</li>
            <li class="tiktok-tab-item" data-target="iframe-video" data-index="1">Vídeo</li>
            <li class="tiktok-tab-item" data-target="iframe-apresentacao" data-index="2">Apresentação</li>
            <li class="tiktok-tab-item" data-target="iframe-pdf" data-index="3">PDF</li>
            <li class="tiktok-tab-item" data-target="iframe-documento" data-index="4">Documento</li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-imagem" class="tab-iframe active" src="Tols/imagem.html"></iframe>
        <iframe id="iframe-video" class="tab-iframe" src="Tols/video.html"></iframe>
        <iframe id="iframe-apresentacao" class="tab-iframe" src="Tols/apresentacao.html"></iframe>
        <iframe id="iframe-pdf" class="tab-iframe" src="Tols/pdf.html"></iframe>
        <iframe id="iframe-documento" class="tab-iframe" src="Tols/documento.html"></iframe>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        
        let currentIndex = 0;

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                if (index === currentIndex) return;

                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);

                // Remove classes ativas
                tabs.forEach(t => t.classList.remove('active'));
                iframes.forEach(frame => frame.classList.remove('active'));

                // Ativa a nova aba e iframe
                tab.classList.add('active');
                targetIframe.classList.add('active');

                currentIndex = index;
            });
        });
    </script>

</body>
</html>
