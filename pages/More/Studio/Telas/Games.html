<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tab Bar com Iframes</title>
    <style>
        /* Reseta margens e define fontes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container principal da Top Tab Bar */
        .tiktok-tab-container {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #efefef;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Estilo do Header Centralizado com cor violeta */
        .tiktok-header-title {
            text-align: center;
            padding: 12px 16px 4px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #8A2BE2; /* Violeta */
        }

        /* Lista horizontal com rolagem */
        .tiktok-tab-list {
            display: flex;
            list-style: none;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
            gap: 24px;
            justify-content: flex-start; /* Alinhado à esquerda para permitir rolagem se necessário */
        }

        .tiktok-tab-list::-webkit-scrollbar {
            display: none;
        }

        /* Estilo individual de cada aba */
        .tiktok-tab-item {
            position: relative;
            padding: 14px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #8a8a8a;
            flex-shrink: 0; /* Impede que os itens espremem */
        }

        /* Estado da aba ativa */
        .tiktok-tab-item.active {
            color: #161823;
        }

        /* Indicador em violeta */
        .tiktok-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #8A2BE2; /* Violeta */
            border-radius: 2px 2px 0 0;
        }

        .tiktok-tab-item:hover {
            color: #161823;
        }

        /* Container dos iframes (ajustado considerando a altura extra do header) */
        .tab-content-container {
            width: 100%;
            height: calc(100vh - 95px);
            position: relative;
            overflow: hidden;
        }

        .tab-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .tab-iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="tiktok-tab-container">
        <header class="tiktok-header-title">Games</header>
        
        <ul class="tiktok-tab-list">
            <li class="tiktok-tab-item active" data-target="iframe-2d" data-index="0">2d</li>
            <li class="tiktok-tab-item" data-target="iframe-3d" data-index="1">3D</li>
            <li class="tiktok-tab-item" data-target="iframe-25d" data-index="2">2.5D</li>
            <li class="tiktok-tab-item" data-target="iframe-minecraft-mod" data-index="3">minecraft mod</li>
            <li class="tiktok-tab-item" data-target="iframe-minecraft-addon" data-index="4">mineclaft addon</li>
        </ul>
    </nav>

    <div class="tab-content-container">
        <iframe id="iframe-2d" class="tab-iframe active" src="Tols/2d.html"></iframe>
        <iframe id="iframe-3d" class="tab-iframe" src="Tols/3d.html"></iframe>
        <iframe id="iframe-25d" class="tab-iframe" src="Tols/25d.html"></iframe>
        <iframe id="iframe-minecraft-mod" class="tab-iframe" src="Tols/minecraft-mod.html"></iframe>
        <iframe id="iframe-minecraft-addon" class="tab-iframe" src="Tols/minecraft-addon.html"></iframe>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tiktok-tab-item');
        const iframes = document.querySelectorAll('.tab-iframe');
        
        let currentIndex = 0;

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                if (index === currentIndex) return;

                const targetId = tab.getAttribute('data-target');
                const targetIframe = document.getElementById(targetId);

                // Remove classes ativas
                tabs.forEach(t => t.classList.remove('active'));
                iframes.forEach(frame => frame.classList.remove('active'));

                // Ativa a nova aba e iframe
                tab.classList.add('active');
                targetIframe.classList.add('active');

                currentIndex = index;
            });
        });
    </script>

</body>
</html>
