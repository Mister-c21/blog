<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Violet</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-violet: #7c3aed;
      --primary-violet-hover: #6d28d9;
      --primary-light: #f3e8ff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #f1f5f9;
      --border-strong: #e2e8f0;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fef2f2;
      --nav-size: 64px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --chat-sent-bg: #7c3aed;
      --chat-sent-bg-image: none;
      --chat-sent-text: #ffffff;
      --chat-bg-image: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-size);
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 1000;
    }

    .logo {
      display: flex;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-violet);
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }

    .main-wrapper {
      flex: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      background-color: var(--card-bg);
      padding-top: var(--nav-size);
    }

    .chat-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .chat-sidebar {
      width: 100%;
      height: 100%;
      border-right: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      z-index: 2;
    }

    .chat-search {
      padding: 20px;
      border-bottom: 1px solid var(--border-strong);
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-search input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-color);
      outline: none;
      font-size: 0.9rem;
    }

    .clear-search-btn {
      position: absolute;
      right: 32px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-full);
    }

    /* ESTILOS DA TIKTOK TOP TAB BAR */
    .tiktok-tab-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px 8px 20px;
      border-bottom: 1px solid var(--border-strong);
      overflow-x: auto;
      white-space: nowrap;
      background: var(--card-bg);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tiktok-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tiktok-tab-item {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding-bottom: 8px;
      transition: color 0.2s ease, font-weight 0.2s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .tiktok-tab-item:hover {
      color: var(--text-dark);
    }

    .tiktok-tab-item.active {
      color: var(--text-dark);
      font-weight: 700;
    }

    .tiktok-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background-color: var(--primary-violet);
      border-radius: 99px;
    }

    /* ESTILOS DA TIKTOK TAB BAR DE IDIOMAS DA WIKIPÉDIA */
    .wiki-lang-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 0 8px 0;
      border-bottom: 1px solid var(--border-strong);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin-bottom: 10px;
    }

    .wiki-lang-tabs::-webkit-scrollbar {
      display: none;
    }

    .wiki-lang-tab-item {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding-bottom: 6px;
      transition: color 0.2s ease, font-weight 0.2s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .wiki-lang-tab-item:hover {
      color: var(--text-dark);
    }

    .wiki-lang-tab-item.active {
      color: var(--primary-violet);
      font-weight: 700;
    }

    .wiki-lang-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 2px;
      background-color: var(--primary-violet);
      border-radius: 99px;
    }

    .chat-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.2s;
      margin-bottom: 4px;
    }

    .chat-item:hover {
      background-color: var(--bg-color);
    }

    .chat-item.active {
      background-color: var(--primary-light);
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background-color: var(--primary-violet);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-info-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .chat-last-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT WINDOW COM CAMADA DE BACKGROUND BORRADA */
    .chat-window {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
      background-color: var(--bg-color);
      position: relative;
    }

    /* Camada para a imagem borrada */
    .chat-window::before {
      content: '';
      position: absolute;
      top: -30px;
      left: -30px;
      right: -30px;
      bottom: -30px;
      background-image: var(--chat-bg-image);
      background-size: cover;
      background-position: center;
      filter: blur(24px) brightness(0.88);
      z-index: 0;
      transition: background-image 0.3s ease-in-out;
    }

    .chat-header {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 20;
    }

    .chat-messages,
    .chat-input-area {
      position: relative;
      z-index: 1;
    }

    .chat-window.desktop-open {
      display: flex;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      position: relative;
    }

    /* NOME DA COMUNIDADE CLICÁVEL */
    .chat-name-clickable {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
      user-select: none;
    }

    .chat-name-clickable:hover {
      color: var(--primary-violet);
    }

    /* MENU FLUTUANTE (POPOVER) */
    .info-popover {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      width: 330px;
      max-width: calc(100vw - 32px);
      max-height: 420px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: popoverFadeIn 0.2s ease-out;
    }

    .info-popover.active {
      display: flex;
    }

    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .info-popover-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(248, 250, 252, 0.8);
    }

    .info-popover-header h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .info-popover-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: var(--radius-full);
      transition: background 0.2s;
    }

    .info-popover-close:hover {
      background: var(--border-color);
      color: var(--text-dark);
    }

    .info-popover-body {
      padding: 16px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .info-tag {
      background: var(--primary-light);
      color: var(--primary-violet);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .info-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-strong);
      font-size: 0.82rem;
    }

    .info-stat-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-stat-value {
      font-weight: 600;
      color: var(--text-dark);
      text-align: right;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-description {
      line-height: 1.45;
      color: var(--text-dark);
      font-size: 0.82rem;
    }

    .wiki-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary-violet);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .wiki-link:hover {
      text-decoration: underline;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dark);
      padding: 6px;
      border-radius: var(--radius-full);
      margin-left: -6px;
    }

    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      overflow-x: hidden; /* EVITA VAZAMENTO HORIZONTAL DE TELA */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 65%;
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .message.received {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      align-self: flex-start;
      border: 1px solid var(--border-strong);
      border-top-left-radius: 4px;
    }

    .message.sent {
      background-color: var(--chat-sent-bg);
      background-image: var(--chat-sent-bg-image);
      color: var(--chat-sent-text);
      align-self: flex-end;
      border-top-right-radius: 4px;
    }

    /* MÍDIAS NA MENSAGEM (AJUSTADAS PARA EVITAR OVERFLOW) */
    .message-media-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 280px;
      border-radius: 12px;
      display: block;
      margin-top: 6px;
      object-fit: cover;
    }

    .message-media-video {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      border: none;
      margin-top: 6px;
      display: block;
    }

    .chat-input-area {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-strong);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* MENU DO BOTAO PLUS DA BARRA DE ESCRITA */
    .plus-wrapper {
      position: relative;
    }

    .plus-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .plus-btn:hover {
      color: var(--primary-violet);
      background-color: var(--primary-light);
    }

    .plus-menu {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 190px;
      z-index: 100;
      animation: popoverFadeIn 0.2s ease-out;
    }

    .plus-menu.active {
      display: flex;
    }

    .plus-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-dark);
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
      width: 100%;
      text-align: left;
    }

    .plus-menu-item:hover {
      background: var(--primary-light);
      color: var(--primary-violet);
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      outline: none;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.9);
    }

    .send-btn {
      background-color: var(--primary-violet);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 767px) {
      .message {
        max-width: 85%;
      }
      .chat-window.mobile-active {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
      }
      .chat-sidebar.mobile-hidden {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .chat-sidebar {
        width: 380px;
      }
      .back-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <i data-lucide="message-circle" style="width: 22px; height: 22px;"></i>
      <span>Chat</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <div class="chat-container">
      <div class="chat-sidebar" id="chatSidebar">
        <div class="chat-search">
          <input type="text" id="searchInput" placeholder="Pesquisar comunidades...">
          <button class="clear-search-btn" id="clearSearchBtn" aria-label="Limpar pesquisa">
            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <div class="tiktok-tab-bar" id="tiktokTabBar">
          <div class="tiktok-tab-item active" data-url="#">comunidades</div>
          <div class="tiktok-tab-item" data-url="curts.html">curts</div>
          <div class="tiktok-tab-item" data-url="bate-papo-aleatorio.html">bate-papo aleatório</div>
        </div>

        <ul class="chat-list" id="chatList">
        </ul>
      </div>

      <div class="chat-window" id="chatWindow">
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="back-btn" id="backBtn">
              <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
            </button>
            <div class="chat-avatar" id="activeAvatar" style="width: 38px; height: 38px;">
              <img id="activeAvatarImg" src="" alt="Avatar">
            </div>
            
            <div class="chat-name chat-name-clickable" id="activeNameContainer" title="Clique para ver detalhes da comunidade">
              <span id="activeName">Selecione uma Comunidade</span>
              <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
            </div>

            <div class="info-popover" id="infoPopover">
              <div class="info-popover-header">
                <h4 id="popoverTitle">Informações do Tema</h4>
                <button class="info-popover-close" id="closePopoverBtn" aria-label="Fechar informações">
                  <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                </button>
              </div>
              <div class="info-popover-body" id="popoverContent">
                Selecione uma comunidade para carregar as informações.
              </div>
            </div>

          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="message received">Bem-vindo à comunidade! Conversem sobre seus animes favoritos.</div>
          <div class="message sent">Qual o seu episódio ou temporada preferida?</div>
        </div>
        <div class="chat-input-area">
          <div class="plus-wrapper">
            <button class="plus-btn" id="plusBtn" aria-label="Anexar arquivo ou mídia">
              <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
            </button>

            <div class="plus-menu" id="plusMenu">
              <button class="plus-menu-item" id="btnAddImage">
                <i data-lucide="image" style="width: 18px; height: 18px;"></i>
                <span>Imagem via URL</span>
              </button>
              <button class="plus-menu-item" id="btnAddVideo">
                <i data-lucide="video" style="width: 18px; height: 18px;"></i>
                <span>Vídeo do YouTube</span>
              </button>
            </div>
          </div>

          <input type="text" id="messageInput" placeholder="Digite sua mensagem na comunidade...">
          <button class="send-btn" id="sendBtn">
            <i data-lucide="send" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Lógica para as abas da TikTok Tab Bar com redirecionamento
    const tiktokTabs = document.querySelectorAll('.tiktok-tab-bar .tiktok-tab-item');
    tiktokTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetUrl = tab.getAttribute('data-url');
        if (targetUrl && targetUrl !== '#') {
          window.location.href = targetUrl;
        } else {
          tiktokTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        }
      });
    });

    const chatSidebar = document.getElementById('chatSidebar');
    const chatWindow = document.getElementById('chatWindow');
    const backBtn = document.getElementById('backBtn');
    const activeNameContainer = document.getElementById('activeNameContainer');
    const activeName = document.getElementById('activeName');
    const activeAvatarImg = document.getElementById('activeAvatarImg');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const chatList = document.getElementById('chatList');

    // Elementos do Menu Flutuante (Popover)
    const infoPopover = document.getElementById('infoPopover');
    const closePopoverBtn = document.getElementById('closePopoverBtn');
    const popoverTitle = document.getElementById('popoverTitle');
    const popoverContent = document.getElementById('popoverContent');

    // Elementos do Menu Seletor Plus
    const plusBtn = document.getElementById('plusBtn');
    const plusMenu = document.getElementById('plusMenu');
    const btnAddImage = document.getElementById('btnAddImage');
    const btnAddVideo = document.getElementById('btnAddVideo');

    let currentAnimeData = null;

    // LÓGICA DO MENU PLUS E ADIÇÃO DE MÍDIAS
    plusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      plusMenu.classList.toggle('active');
    });

    // Fecha o menu plus ao clicar fora dele
    document.addEventListener('click', (e) => {
      if (plusMenu.classList.contains('active') && !plusMenu.contains(e.target) && !plusBtn.contains(e.target)) {
        plusMenu.classList.remove('active');
      }
    });

    // Função para extrair o ID do vídeo do YouTube de variados formatos de URL
    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Opção 1: Imagem via URL
    btnAddImage.addEventListener('click', () => {
      plusMenu.classList.remove('active');
      const imageUrl = prompt('Digite ou cole a URL da imagem da Web:');
      if (imageUrl && imageUrl.trim()) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message sent';
        messageDiv.innerHTML = `
          <span>Imagem enviada:</span>
          <img src="${imageUrl.trim()}" class="message-media-img" alt="Imagem enviada" onerror="this.onerror=null; this.src=''; this.alt='Erro ao carregar a imagem. Verifique a URL.';">
        `;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });

    // Opção 2: Vídeo do YouTube via URL
    btnAddVideo.addEventListener('click', () => {
      plusMenu.classList.remove('active');
      const videoUrl = prompt('Digite ou cole o link do vídeo do YouTube:');
      if (videoUrl && videoUrl.trim()) {
        const videoId = getYouTubeId(videoUrl.trim());
        if (videoId) {
          const messageDiv = document.createElement('div');
          messageDiv.className = 'message sent';
          messageDiv.innerHTML = `
            <span>Vídeo anexado:</span>
            <iframe class="message-media-video" src="https://www.youtube.com/embed/${videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          `;
          chatMessages.appendChild(messageDiv);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        } else {
          alert('URL do YouTube inválida. Verifique o link e tente novamente.');
        }
      }
    });

    // Controla a abertura do menu flutuante ao clicar no nome da Comunidade
    activeNameContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentAnimeData) return;

      const isVisible = infoPopover.classList.contains('active');
      if (isVisible) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        infoPopover.classList.remove('active');
      } else {
        renderAnimeInfo(currentAnimeData);
        infoPopover.classList.add('active');
      }
    });

    closePopoverBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      infoPopover.classList.remove('active');
    });

    // Fecha o popover ao clicar fora dele
    document.addEventListener('click', (e) => {
      if (!infoPopover.contains(e.target) && !activeNameContainer.contains(e.target)) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        infoPopover.classList.remove('active');
      }
    });

    // Função parametrizada para buscar resumo na Wikipédia API em qualquer idioma especifico
    async function fetchWikipediaSummary(animeTitle, lang = 'pt') {
      try {
        const response = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(animeTitle)}`);
        if (response.ok) {
          const data = await response.json();
          if (data.extract) {
            return {
              extract: data.extract,
              url: data.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(animeTitle)}`
            };
          }
        }
      } catch (err) {
        console.log(`Erro na Wikipédia ${lang.toUpperCase()}:`, err);
      }
      return null;
    }

    // Renderiza os dados no Menu Flutuante
    async function renderAnimeInfo(anime) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      popoverTitle.textContent = anime.title;
      
      const genres = anime.genres ? anime.genres.map(g => g.name).join(', ') : 'N/A';
      const studios = anime.studios ? anime.studios.map(s => s.name).join(', ') : 'N/A';
      
      popoverContent.innerHTML = `
        <div class="info-tag-list">
          <span class="info-tag">★ ${anime.score || 'N/A'}</span>
          <span class="info-tag">${anime.type || 'TV'}</span>
          <span class="info-tag">${anime.episodes ? anime.episodes + ' eps' : 'Em exibição'}</span>
        </div>

        <div>
          <div class="info-stat-row">
            <span class="info-stat-label">Status:</span>
            <span class="info-stat-value">${anime.status || 'N/A'}</span>
          </div>
          <div class="info-stat-row">
            <span class="info-stat-label">Estúdio:</span>
            <span class="info-stat-value">${studios}</span>
          </div>
          <div class="info-stat-row">
            <span class="info-stat-label">Gêneros:</span>
            <span class="info-stat-value">${genres}</span>
          </div>
        </div>

        <div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <strong style="font-size: 0.8rem; color: var(--text-muted);">RESUMO & WIKIPÉDIA</strong>
            <button id="audioDescBtn" title="Ouvir audiodescrição da descrição" style="background: none; border: none; cursor: pointer; color: var(--primary-violet); display: flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600;">
              <i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> Audiodescrição
            </button>
          </div>
          
          <div class="wiki-lang-tabs" id="wikiLangTabs">
            <div class="wiki-lang-tab-item active" data-lang="pt">Português</div>
            <div class="wiki-lang-tab-item" data-lang="en">English</div>
            <div class="wiki-lang-tab-item" data-lang="es">Español</div>
            <div class="wiki-lang-tab-item" data-lang="ja">日本語</div>
            <div class="wiki-lang-tab-item" data-lang="fr">Français</div>
          </div>

          <p class="info-description" id="wikiSynopsis">Buscando resumo na Wikipédia...</p>
        </div>
      `;

      lucide.createIcons();

      const wikiSynopsisElem = document.getElementById('wikiSynopsis');
      const langTabs = popoverContent.querySelectorAll('.wiki-lang-tab-item');
      const audioDescBtn = document.getElementById('audioDescBtn');
      let currentLangCode = 'pt';

      // Lógica do botão de audiodescrição
      if (audioDescBtn && 'speechSynthesis' in window) {
        audioDescBtn.addEventListener('click', () => {
          if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            audioDescBtn.innerHTML = '<i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> Audiodescrição';
            lucide.createIcons();
            return;
          }

          // Obtém o texto limpo da sinopse
          const textToRead = wikiSynopsisElem.innerText;
          if (!textToRead || textToRead.includes('Carregando') || textToRead.includes('Buscando')) return;

          const utterance = new SpeechSynthesisUtterance(textToRead);
          utterance.lang = currentLangCode;

          utterance.onend = () => {
            audioDescBtn.innerHTML = '<i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> Audiodescrição';
            lucide.createIcons();
          };

          utterance.onerror = () => {
            audioDescBtn.innerHTML = '<i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> Audiodescrição';
            lucide.createIcons();
          };

          window.speechSynthesis.speak(utterance);
          audioDescBtn.innerHTML = '<i data-lucide="square" style="width: 14px; height: 14px;"></i> Parar';
          lucide.createIcons();
        });
      }

      // Atualiza a sinopse buscando EXCLUSIVAMENTE na Wikipédia
      async function updateSynopsisByLang(langCode) {
        if (!wikiSynopsisElem) return;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (audioDescBtn) {
          audioDescBtn.innerHTML = '<i data-lucide="volume-2" style="width: 14px; height: 14px;"></i> Audiodescrição';
        }

        currentLangCode = langCode;
        wikiSynopsisElem.innerHTML = 'Carregando resumo da Wikipédia...';
        
        const wikiData = await fetchWikipediaSummary(anime.title, langCode);
        
        if (wikiData) {
          wikiSynopsisElem.innerHTML = `
            ${wikiData.extract}
            <br>
            <a href="${wikiData.url}" target="_blank" rel="noopener noreferrer" class="wiki-link">
              Ver mais na Wikipédia <i data-lucide="external-link" style="width: 12px; height: 12px;"></i>
            </a>
          `;
        } else {
          wikiSynopsisElem.innerHTML = 'Nenhum resumo encontrado na Wikipédia para este idioma.';
        }
        lucide.createIcons();
      }

      // Adiciona evento às abas de idiomas no estilo TikTok
      langTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          langTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const selectedLang = tab.getAttribute('data-lang');
          updateSynopsisByLang(selectedLang);
        });
      });

      // Busca inicial padrão em Português
      updateSynopsisByLang('pt');
    }

    // Consumo da API de Anime (Jikan / MyAnimeList)
    async function loadAnimeCommunities() {
      chatList.innerHTML = '<li style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">Carregando comunidades...</li>';
      try {
        const response = await fetch('https://api.jikan.moe/v4/top/anime?limit=12');
        const result = await response.json();
        const animes = result.data;

        chatList.innerHTML = '';

        animes.forEach((anime, index) => {
          const li = document.createElement('li');
          li.className = 'chat-item';
          li.setAttribute('data-name', anime.title);
          
          const animeCoverUrl = anime.images.jpg.large_image_url || anime.images.jpg.image_url;
          li.setAttribute('data-img', animeCoverUrl);

          const genreList = anime.genres.map(g => g.name).slice(0, 2).join(', ');

          li.innerHTML = `
            <div class="chat-avatar">
              <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
            </div>
            <div class="chat-info">
              <div class="chat-info-top">
                <span class="chat-name">${anime.title}</span>
                <span class="chat-time">★ ${anime.score || 'N/A'}</span>
              </div>
              <p class="chat-last-msg">Comunidade • ${genreList || 'Anime'}</p>
            </div>
          `;

          li.addEventListener('click', () => {
            document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            li.classList.add('active');

            currentAnimeData = anime;
            activeName.textContent = anime.title;
            activeAvatarImg.src = anime.images.jpg.image_url;

            // Fecha o popover e interrompe fala ao mudar de comunidade
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            infoPopover.classList.remove('active');

            // Define a capa do anime como imagem de fundo borrada do chat
            chatWindow.style.setProperty('--chat-bg-image', `url("${animeCoverUrl}")`);

            if (window.innerWidth < 768) {
              chatSidebar.classList.add('mobile-hidden');
              chatWindow.classList.add('mobile-active');
              window.parent.postMessage({ action: 'openChatWindow' }, '*');
            } else {
              chatWindow.classList.add('desktop-open');
            }
          });

          chatList.appendChild(li);

          // Define a primeira comunidade como ativa por padrão
          if (index === 0) {
            li.classList.add('active');
            currentAnimeData = anime;
            activeName.textContent = anime.title;
            activeAvatarImg.src = anime.images.jpg.image_url;
            chatWindow.style.setProperty('--chat-bg-image', `url("${animeCoverUrl}")`);
            
            if (window.innerWidth >= 768) {
              chatWindow.classList.add('desktop-open');
            }
          }
        });

      } catch (error) {
        chatList.innerHTML = '<li style="padding: 20px; text-align: center; color: var(--danger-color); font-size: 0.9rem;">Erro ao carregar comunidades de anime.</li>';
      }
    }

    loadAnimeCommunities();

    backBtn.addEventListener('click', () => {
      chatSidebar.classList.remove('mobile-hidden');
      chatWindow.classList.remove('mobile-active');
      chatWindow.classList.remove('desktop-open');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      infoPopover.classList.remove('active');
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));

      if (window.innerWidth < 768) {
        window.parent.postMessage({ action: 'closeChatWindow' }, '*');
      }
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message sent';
      messageDiv.textContent = text;
      chatMessages.appendChild(messageDiv);
      messageInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      clearSearchBtn.style.display = term.length > 0 ? 'flex' : 'none';
      document.querySelectorAll('.chat-item').forEach(item => {
        const name = item.querySelector('.chat-name').textContent.toLowerCase();
        item.style.display = name.includes(term) ? 'flex' : 'none';
      });
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      document.querySelectorAll('.chat-item').forEach(item => item.style.display = 'flex');
      searchInput.focus();
    });
  </script>
</body>
</html>
