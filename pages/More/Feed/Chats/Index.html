<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Violet</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-violet: #7c3aed;
      --primary-violet-hover: #6d28d9;
      --primary-light: #f3e8ff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #f1f5f9;
      --border-strong: #e2e8f0;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fef2f2;
      --nav-size: 64px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --chat-sent-bg: #7c3aed;
      --chat-sent-bg-image: none;
      --chat-sent-text: #ffffff;
      --chat-bg-image: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-size);
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      z-index: 1000;
    }

    .logo {
      display: flex;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-violet);
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }

    .main-wrapper {
      flex: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      background-color: var(--card-bg);
      padding-top: var(--nav-size);
    }

    .chat-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .chat-sidebar {
      width: 100%;
      height: 100%;
      border-right: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      z-index: 2;
    }

    .chat-search {
      padding: 20px;
      border-bottom: 1px solid var(--border-strong);
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-search input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-color);
      outline: none;
      font-size: 0.9rem;
    }

    .clear-search-btn {
      position: absolute;
      right: 32px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-full);
    }

    /* ESTILOS DA TIKTOK TOP TAB BAR */
    .tiktok-tab-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px 8px 20px;
      border-bottom: 1px solid var(--border-strong);
      overflow-x: auto;
      white-space: nowrap;
      background: var(--card-bg);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tiktok-tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tiktok-tab-item {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding-bottom: 8px;
      transition: color 0.2s ease, font-weight 0.2s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .tiktok-tab-item:hover {
      color: var(--text-dark);
    }

    .tiktok-tab-item.active {
      color: var(--text-dark);
      font-weight: 700;
    }

    .tiktok-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background-color: var(--primary-violet);
      border-radius: 99px;
    }

    .chat-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.2s;
      margin-bottom: 4px;
    }

    .chat-item:hover {
      background-color: var(--bg-color);
    }

    .chat-item.active {
      background-color: var(--primary-light);
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background-color: var(--primary-violet);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-info-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .chat-last-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT WINDOW COM CAMADA DE BACKGROUND BORRADA */
    .chat-window {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
      background-color: var(--bg-color);
      position: relative;
      overflow: hidden;
    }

    /* Camada para a imagem borrada */
    .chat-window::before {
      content: '';
      position: absolute;
      top: -30px;
      left: -30px;
      right: -30px;
      bottom: -30px;
      background-image: var(--chat-bg-image);
      background-size: cover;
      background-position: center;
      filter: blur(24px) brightness(0.88);
      z-index: 0;
      transition: background-image 0.3s ease-in-out;
    }

    .chat-header,
    .chat-messages,
    .chat-input-area {
      position: relative;
      z-index: 1;
    }

    .chat-window.desktop-open {
      display: flex;
    }

    .chat-header {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dark);
      padding: 6px;
      border-radius: var(--radius-full);
      margin-left: -6px;
    }

    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 65%;
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.received {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      align-self: flex-start;
      border: 1px solid var(--border-strong);
      border-top-left-radius: 4px;
    }

    .message.sent {
      background-color: var(--chat-sent-bg);
      background-image: var(--chat-sent-bg-image);
      color: var(--chat-sent-text);
      align-self: flex-end;
      border-top-right-radius: 4px;
    }

    .chat-input-area {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-strong);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      outline: none;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.9);
    }

    .send-btn {
      background-color: var(--primary-violet);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 767px) {
      .chat-window.mobile-active {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
      }
      .chat-sidebar.mobile-hidden {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .chat-sidebar {
        width: 380px;
      }
      .back-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <i data-lucide="message-circle" style="width: 22px; height: 22px;"></i>
      <span>Chat</span>
    </div>
  </nav>

  <div class="main-wrapper">
    <div class="chat-container">
      <div class="chat-sidebar" id="chatSidebar">
        <div class="chat-search">
          <input type="text" id="searchInput" placeholder="Pesquisar comunidades...">
          <button class="clear-search-btn" id="clearSearchBtn" aria-label="Limpar pesquisa">
            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <div class="tiktok-tab-bar" id="tiktokTabBar">
          <div class="tiktok-tab-item active" data-url="#">comunidades</div>
          <div class="tiktok-tab-item" data-url="curts.html">curts</div>
          <div class="tiktok-tab-item" data-url="marketplace.html">marketiplace</div>
        </div>

        <ul class="chat-list" id="chatList">
          </ul>
      </div>

      <div class="chat-window" id="chatWindow">
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="back-btn" id="backBtn">
              <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
            </button>
            <div class="chat-avatar" id="activeAvatar" style="width: 38px; height: 38px;">
              <img id="activeAvatarImg" src="" alt="Avatar">
            </div>
            <span class="chat-name" id="activeName">Selecione uma Comunidade</span>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="message received">Bem-vindo à comunidade! Conversem sobre seus animes favoritos.</div>
          <div class="message sent">Qual o seu episódio ou temporada preferida?</div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="messageInput" placeholder="Digite sua mensagem na comunidade...">
          <button class="send-btn" id="sendBtn">
            <i data-lucide="send" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Lógica para as abas da TikTok Tab Bar com redirecionamento
    const tiktokTabs = document.querySelectorAll('.tiktok-tab-item');
    tiktokTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetUrl = tab.getAttribute('data-url');
        if (targetUrl && targetUrl !== '#') {
          window.location.href = targetUrl;
        } else {
          tiktokTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        }
      });
    });

    const chatSidebar = document.getElementById('chatSidebar');
    const chatWindow = document.getElementById('chatWindow');
    const backBtn = document.getElementById('backBtn');
    const activeName = document.getElementById('activeName');
    const activeAvatarImg = document.getElementById('activeAvatarImg');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const chatList = document.getElementById('chatList');

    // Consumo da API de Anime (Jikan / MyAnimeList)
    async function loadAnimeCommunities() {
      chatList.innerHTML = '<li style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">Carregando comunidades...</li>';
      try {
        const response = await fetch('https://api.jikan.moe/v4/top/anime?limit=12');
        const result = await response.json();
        const animes = result.data;

        chatList.innerHTML = '';

        animes.forEach((anime, index) => {
          const li = document.createElement('li');
          li.className = 'chat-item';
          li.setAttribute('data-name', anime.title);
          
          const animeCoverUrl = anime.images.jpg.large_image_url || anime.images.jpg.image_url;
          li.setAttribute('data-img', animeCoverUrl);

          const genreList = anime.genres.map(g => g.name).slice(0, 2).join(', ');

          li.innerHTML = `
            <div class="chat-avatar">
              <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
            </div>
            <div class="chat-info">
              <div class="chat-info-top">
                <span class="chat-name">${anime.title}</span>
                <span class="chat-time">★ ${anime.score || 'N/A'}</span>
              </div>
              <p class="chat-last-msg">Comunidade • ${genreList || 'Anime'}</p>
            </div>
          `;

          li.addEventListener('click', () => {
            document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            li.classList.add('active');

            activeName.textContent = anime.title;
            activeAvatarImg.src = anime.images.jpg.image_url;

            // Define a capa do anime como imagem de fundo borrada do chat
            chatWindow.style.setProperty('--chat-bg-image', `url("${animeCoverUrl}")`);

            if (window.innerWidth < 768) {
              chatSidebar.classList.add('mobile-hidden');
              chatWindow.classList.add('mobile-active');
              window.parent.postMessage({ action: 'openChatWindow' }, '*');
            } else {
              chatWindow.classList.add('desktop-open');
            }
          });

          chatList.appendChild(li);

          // Define a primeira comunidade como ativa por padrão
          if (index === 0) {
            li.classList.add('active');
            activeName.textContent = anime.title;
            activeAvatarImg.src = anime.images.jpg.image_url;
            chatWindow.style.setProperty('--chat-bg-image', `url("${animeCoverUrl}")`);
            
            if (window.innerWidth >= 768) {
              chatWindow.classList.add('desktop-open');
            }
          }
        });

      } catch (error) {
        chatList.innerHTML = '<li style="padding: 20px; text-align: center; color: var(--danger-color); font-size: 0.9rem;">Erro ao carregar comunidades de anime.</li>';
      }
    }

    loadAnimeCommunities();

    backBtn.addEventListener('click', () => {
      chatSidebar.classList.remove('mobile-hidden');
      chatWindow.classList.remove('mobile-active');
      chatWindow.classList.remove('desktop-open');
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));

      if (window.innerWidth < 768) {
        window.parent.postMessage({ action: 'closeChatWindow' }, '*');
      }
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message sent';
      messageDiv.textContent = text;
      chatMessages.appendChild(messageDiv);
      messageInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      clearSearchBtn.style.display = term.length > 0 ? 'flex' : 'none';
      document.querySelectorAll('.chat-item').forEach(item => {
        const name = item.querySelector('.chat-name').textContent.toLowerCase();
        item.style.display = name.includes(term) ? 'flex' : 'none';
      });
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      document.querySelectorAll('.chat-item').forEach(item => item.style.display = 'flex');
      searchInput.focus();
    });
  </script>
</body>
</html>
