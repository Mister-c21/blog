<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bate-Papo Aleatório & Anônimo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      color: #1e1b2e;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    /* Container Principal */
    .chat-menu {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
    }

    /* ESTILOS DO HEADER */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #f0ebf8;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e1b2e;
    }

    .nav-button {
      background-color: #f3e8ff;
      color: #7c3aed;
      border: 1px solid #ede9fe;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-button:hover {
      background-color: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      transform: translateY(-1px);
    }

    .menu-title {
      font-size: 0.85rem;
      color: #6b6680;
      margin-bottom: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Lista expandida */
    .chat-options {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* Itens minimalistas com paleta clara */
    .option-item {
      background-color: #ffffff;
      border: 1px solid #ede9fe;
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      flex: 1;
      position: relative;
    }

    .option-item:hover {
      border-color: #7c3aed;
      background-color: #faf5ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.1);
    }

    .option-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background-color: #f3e8ff;
      border: 1px solid #ede9fe;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      transition: all 0.3s ease;
    }

    .option-item:hover .icon-box {
      background-color: #7c3aed;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      transform: scale(1.05);
    }

    .text-group .option-title {
      font-size: 1rem;
      font-weight: 700;
      color: #2d2b38;
      letter-spacing: -0.01em;
    }

    .text-group .option-subtitle {
      font-size: 0.82rem;
      color: #6b6680;
      margin-top: 3px;
      font-weight: 500;
    }

    .arrow {
      color: #8b5cf6;
      font-size: 1.4rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .option-item:hover .arrow {
      color: #7c3aed;
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="chat-menu">
    
    <header class="chat-header">
      <h1 class="header-title">Bate-Papo Aleatório & Anônimo</h1>
      <a href="outra-pagina.html" class="nav-button">
        <span>&larr;</span> Voltar
      </a>
    </header>

    <h2 class="menu-title">Escolha como deseja falar:</h2>

    <ul class="chat-options">
      
      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">💬</div>
          <div class="text-group">
            <div class="option-title">Chat de Texto</div>
            <div class="option-subtitle">Mensagens instantâneas</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">🎙️</div>
          <div class="text-group">
            <div class="option-title">Chamada de Áudio</div>
            <div class="option-subtitle">Conversa por voz</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">📹</div>
          <div class="text-group">
            <div class="option-title">Chamada de Vídeo</div>
            <div class="option-subtitle">Transmissão com câmera</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

    </ul>
  </div>

</body>
</html>
