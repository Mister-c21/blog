<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opções de Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background-color: #ffffff;
      display: flex;
      padding: 0;
    }

    /* Container Principal */
    .chat-menu {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      padding: 24px;
      border-radius: 0;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    /* ESTILOS DO HEADER ADICIONADO */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0ebf8;
    }

    .header-title {
      font-size: 1.3rem;
      color: #1e1b2e;
      font-weight: 700;
    }

    .nav-button {
      background-color: #f3e8ff;  /* Fundo violeta suave */
      color: #7c3aed;            /* Texto violeta */
      border: 1px solid #ede9fe;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-button:hover {
      background-color: #7c3aed;  /* Fundo violeta escuro no hover */
      color: #ffffff;            /* Texto branco no hover */
      border-color: #7c3aed;
    }

    .menu-title {
      font-size: 1.1rem;
      color: #6b6680;
      margin-bottom: 16px;
      font-weight: 600;
    }

    /* Lista expandida */
    .chat-options {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Itens mantendo o design original */
    .option-item {
      background-color: #ffffff;
      border: 1px solid #ede9fe;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s ease;
      flex: 1;
    }

    .option-item:hover {
      border-color: #7c3aed;
      background-color: #faf5ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.12);
    }

    .option-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background-color: #f3e8ff;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
    }

    .text-group .option-title {
      font-size: 1rem;
      font-weight: 600;
      color: #2d2b38;
    }

    .text-group .option-subtitle {
      font-size: 0.85rem;
      color: #6b6680;
      margin-top: 4px;
    }

    .arrow {
      color: #8b5cf6;
      font-size: 1.4rem;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .option-item:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="chat-menu">
    
    <header class="chat-header">
      <h1 class="header-title">Central de Atendimento</h1>
      <a href="outra-pagina.html" class="nav-button">
        <span>&larr;</span> Voltar
      </a>
    </header>

    <h2 class="menu-title">Escolha como deseja falar:</h2>

    <ul class="chat-options">
      
      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">💬</div>
          <div class="text-group">
            <div class="option-title">Chat de Texto</div>
            <div class="option-subtitle">Mensagens instantâneas</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">🎙️</div>
          <div class="text-group">
            <div class="option-title">Chamada de Áudio</div>
            <div class="option-subtitle">Conversa por voz</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

      <li class="option-item">
        <div class="option-info">
          <div class="icon-box">📹</div>
          <div class="text-group">
            <div class="option-title">Chamada de Vídeo</div>
            <div class="option-subtitle">Transmissão com câmera</div>
          </div>
        </div>
        <span class="arrow">&rsaquo;</span>
      </li>

    </ul>
  </div>

</body>
</html>
