<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoreSpace-Social</title>
    <!-- Favicon adicionado aqui: -->
  <link rel="icon" type="image/png" href="./Src/FavicoLS.png">
  <link rel="apple-touch-icon" href="./Src/FavicoLS.png">

  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary-violet: #7c3aed;
      --primary-violet-hover: #6d28d9;
      --primary-light: #f5f3ff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --nav-size: 65px;
      --sidebar-width: 240px; /* Será sobrescrito na media query para desktop */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
    }

    /* --- NAVEGAÇÃO (Mobile First: Bottom Tabbar) --- */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--nav-size);
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      transform: translateY(0);
      opacity: 1;
    }

    .navbar.hidden-tabbar {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      display: none;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-violet);
      padding: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .nav-list {
      display: flex;
      width: 100%;
      justify-content: space-around;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item a:hover {
      color: var(--primary-violet);
      background-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .nav-item a.active {
      color: var(--primary-violet);
      background-color: var(--primary-light);
      font-weight: 600;
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.18);
    }

    .nav-item a i {
      width: 24px;
      height: 24px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item a.active i {
      transform: scale(1.15) rotate(-3deg);
    }

    /* --- CONTEÚDO PRINCIPAL --- */
    .main-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - var(--nav-size));
      display: flex;
      transition: height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.chat-active-mobile .main-wrapper {
      height: 100vh;
    }

    .feed {
      width: 100%;
      height: 100%;
      max-width: none;
      padding: 0;
    }

    .feed-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: scale(1);
    }

    .feed-iframe.changing {
      opacity: 0;
      transform: scale(0.99);
    }

    /* --- LAYOUT DESKTOP (Sidebar Compacta) --- */
    @media (min-width: 768px) {
      :root {
        --sidebar-width: 76px; /* Largura estreita apenas para os ícones */
      }

      body {
        flex-direction: row;
      }

      body.chat-active-mobile .main-wrapper {
        height: 100vh;
      }

      .navbar {
        position: sticky;
        top: 0;
        left: 0;
        width: var(--sidebar-width);
        height: 100vh;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding-top: 25px;
        border-top: none;
        border-right: 1px solid var(--border-color);
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      .navbar.hidden-tabbar {
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      .logo {
        display: block;
        font-size: 0.9rem;
      }

      .nav-list {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 8px;
      }

      .nav-item {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .nav-item a {
        flex-direction: column; /* Mantém ícone em cima e texto embaixo (ou escondido) */
        align-items: center;
        justify-content: center;
        font-size: 0.65rem; /* Letra miúda embaixo do ícone */
        gap: 4px;
        width: 56px;
        height: 56px;
        padding: 0;
        border-radius: 12px;
      }

      .nav-item.nav-home a:hover,
      .nav-item.nav-home a:focus-visible {
        box-shadow: none;
        background-color: var(--primary-light);
        color: var(--primary-violet);
        transform: translateY(-2px);
      }

      .nav-item a.active {
        transform: scale(1.06) translateY(-2px);
      }

      .main-wrapper {
        height: 100vh;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar" id="mainNavbar">
    <div class="logo">social</div>
    <ul class="nav-list">
      <li class="nav-item nav-home">
        <a href="../../../index.html">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" data-src="Chats/Index.html" id="chatNavLink" class="active">
          <i data-lucide="message-square"></i>
          <span>Chats</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="Store/Index.html">
          <i data-lucide="shopping-bag"></i>
          <span>Store</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="main-wrapper">
    <main class="feed">
      <iframe src="Chats/Index.html" class="feed-iframe" title="Conteúdo do Feed"></iframe>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const feedIframe = document.querySelector('.feed-iframe');
    const navLinks = document.querySelectorAll('.nav-list .nav-item:not(.nav-home) a:not([href^="Store"])');
    const mainNavbar = document.getElementById('mainNavbar');
    const chatNavLink = document.getElementById('chatNavLink');

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        if (link.classList.contains('active')) return;

        document.querySelectorAll('.nav-list a').forEach(item => item.classList.remove('active'));
        link.classList.add('active');

        if (link !== chatNavLink) {
          document.body.classList.remove('chat-active-mobile');
          mainNavbar.classList.remove('hidden-tabbar');
        }
        
        const newSrc = link.getAttribute('data-src');
        if (newSrc) {
          feedIframe.classList.add('changing');
          setTimeout(() => {
            feedIframe.src = newSrc;
            feedIframe.classList.remove('changing');
          }, 200);
        }
      });
    });

    window.addEventListener('message', (event) => {
      if (window.innerWidth >= 768) return;

      if (event.data && typeof event.data === 'object') {
        if (event.data.action === 'openChatWindow') {
          document.body.classList.add('chat-active-mobile');
          mainNavbar.classList.add('hidden-tabbar');
        } else if (event.data.action === 'closeChatWindow') {
          document.body.classList.remove('chat-active-mobile');
          mainNavbar.classList.remove('hidden-tabbar');
        }
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        document.body.classList.remove('chat-active-mobile');
        mainNavbar.classList.remove('hidden-tabbar');
      }
    });
  </script>
</body>
</html>
