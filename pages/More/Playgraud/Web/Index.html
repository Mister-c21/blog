    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #13091c; 
            --bg-sidebar: #1c102b;
            --bg-card: #25163a;
            --text-color: #ffffff;
            --text-secondary: #b3a1ca;
            --accent-color: #8a2be2; 
            --gradient-accent: linear-gradient(135deg, #a855f7, #6366f1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: padding-bottom 0.5s ease;
        }

        body.modal-open {
            overflow: hidden !important;
            height: 100vh !important;
        }

        /* Menu Lateral (Desktop) */
        aside {
            width: 240px;
            min-width: 240px;
            background-color: var(--bg-sidebar);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--bg-card);
            color: var(--text-color);
        }

        .desktop-nav-tabs {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }

        .desktop-nav-tabs .menu-item {
            font-size: 16px;
            font-weight: 600;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 100%;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 12px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 36px;
            width: 100%;
        }

        .logo-header {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .logo-header a {
            text-decoration: none;
            color: inherit;
            background: inherit;
            -webkit-background-clip: inherit;
            -webkit-text-fill-color: inherit;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .search-bar {
            width: 100%;
            max-width: 320px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 36px 8px 14px;
            font-size: 14px;
            background-color: var(--bg-sidebar);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            color: white;
            outline: none;
            transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-bar input:hover {
            border-color: rgba(168, 85, 247, 0.5);
            background-color: rgba(28, 16, 43, 0.8);
        }

        .search-bar input:focus {
            border-color: var(--accent-color);
            background-color: var(--bg-sidebar);
            box-shadow: 0 0 14px rgba(138, 43, 226, 0.6);
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: none; 
            user-select: none;
            line-height: 1;
        }

        .clear-btn:hover {
            color: var(--text-color);
        }

        .hamburger-menu {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 6px;
            padding: 4px;
            position: absolute;
            left: 0;
            z-index: 110;
        }

        .hamburger-menu span {
            display: block;
            width: 26px;
            height: 3px;
            background-color: var(--text-color);
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .hamburger-menu.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .hamburger-menu.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-menu.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .mobile-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background-color: var(--bg-sidebar);
            z-index: 100;
            padding: 80px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            transition: left 0.3s ease-in-out;
            overflow-y: auto;
        }

        .mobile-drawer.open {
            left: 0;
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 99;
            display: none;
        }

        .drawer-overlay.open {
            display: block;
        }

        .games-section {
            width: 100%;
        }

        .games-section h2 {
            font-size: 22px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .game-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1.5px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), 
                        0 0 14px rgba(168, 85, 247, 0.25);
        }

        .game-thumb {
            width: 100%;
            height: 135px;
            background-color: #3b245d;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #2a1942, #3b245d);
            transition: opacity 0.2s;
        }

        .game-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card:hover .game-thumb {
            opacity: 0.9;
        }

        .game-info {
            padding: 12px;
        }

        .game-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-category {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* --- Menu Flutuante de Seleção de Modo --- */
        .game-options-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-options-overlay.active {
            display: flex;
            opacity: 1;
        }

        .game-options-modal {
            background-color: var(--bg-sidebar);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-options-overlay.active .game-options-modal {
            transform: scale(1);
        }

        .game-options-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        .game-option-btn {
            background-color: var(--bg-card);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .game-option-btn:hover {
            border-color: rgba(168, 85, 247, 0.5);
            background-color: rgba(138, 43, 226, 0.15);
        }

        /* Opção de Página Web Destacada */
        .game-option-btn.highlighted {
            background: var(--gradient-accent);
            border-color: transparent;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .game-option-btn.highlighted:hover {
            filter: brightness(1.1);
        }

        /* Modal do Iframe */
        #iframeModal {
            position: fixed; 
            inset: 0; 
            z-index: 9999; 
            background-color: black;
            display: none; 
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
            border-radius: 0;
        }

        #iframeModal.active { 
            display: flex; 
            transform: translateY(0); 
        }

        #modal-drag-handle { 
            height: 30px; 
            width: 100%;      
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: grab; 
            touch-action: none; 
            flex-shrink: 0; 
            background-color: #121212;
            border-bottom: 1px solid #222;
            position: relative;
        }

        .drag-pill { 
            width: 48px; 
            height: 6px; 
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 9999px; 
        }

        .close-modal-btn {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            outline: none;
            display: none; 
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .close-modal-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .modal-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        @media (max-width: 768px) {
            aside {
                display: none; 
            }
            .hamburger-menu {
                display: flex; 
            }
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            main {
                padding: 16px;
                gap: 20px; 
            }
            .search-bar {
                max-width: 250px; 
            }
            .search-bar input {
                padding: 8px 32px 8px 14px; 
                font-size: 13px; 
                border-radius: 16px; 
            }
            .clear-btn {
                right: 11px;
                font-size: 16px;
            }
        }

        @media (min-width: 768px) {
            .close-modal-btn {
                display: flex; 
            }
        }
    </style>
</head>

                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6g39gUoqZfvA_OaJQTUoUsmqcaGn2-tBpcILxLjKy6g&s=10",
                "iframeUrl": "https://ZombsRoyale.io"
            },
            {
                "title": "Krunker.io",
                "category": "ação",
                "categoryText": "Ação • FPS",
                "thumbUrl": "https://cdn.blipzi.com/kr/un/krunker-io-d.jpg?width=450&height=450&aspect_ratio=1:1",
                "iframeUrl": "https://Krunker.io"
            },
            {
                "title": "Territorial.io",
                "category": "aventura",
                "categoryText": "Aventura",
                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6JzaVzn6TmsadC7pB-QltXG3GMEmw2lnk6N2EsWYwdlTHZPpyUF-mZ-5z&s=10",
                "iframeUrl": "https://Territorial.io"
            },
            {
                "title": "Surviv.io",
                "category": "aventura",
                "categoryText": "Aventura",
                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0soogFKycjALZbMFRkJg1U9LmnvMgW_Bn98UmxevQRQ&s",
                "iframeUrl": "https://Surviv.io"
            },
            {
                "title": "Paper.io",
                "category": "Simulação",
                "categoryText": "Simulação",
                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIRxp711sckdJDbg_QXp9-O49I9AVtYqwEc6dAD_hkLHURLwNTc2WUTHM&s=10",
                "iframeUrl": "https://Paper.io"
            },
            {
                "title": "Zombs.io",
                "category": "Simulação",
                "categoryText": "Simulação",
                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1-djvXg_Uof9OScPQRXEz3GSYo2LMhzoVe1tGZdKqAg&s=10",
                "iframeUrl": "https://Zombs.io"
            },
            {
                "title": "Florr.io",
                "category": "Simulação",
                "categoryText": "Simulação",
                "thumbUrl": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn7F9o0SMuq1nUwZf4j99NcqP8SQe1ED0LoThjlwVCCi0WgLBIPxf_PMZ2&s=10",
                "iframeUrl": "https://Florr.io"
            }
        ];
        
        let selectedGameUrl = '';

        function renderGames() {
            const gamesGrid = document.getElementById('gamesGrid');
            gamesGrid.innerHTML = '';

            gamesData.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-category', game.category.toLowerCase());
                card.setAttribute('data-url', game.iframeUrl);
                card.setAttribute('data-title', game.title);

                card.innerHTML = `
                    <div class="game-thumb">
                        <img src="${game.thumbUrl}" alt="${game.title}">
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-category">${game.categoryText}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    const targetUrl = card.getAttribute('data-url');
                    const gameTitle = card.getAttribute('data-title');
                    if(targetUrl) {
                        openGameOptions(targetUrl, gameTitle);
                    }
                });

                gamesGrid.appendChild(card);
            });

            window.gameCards = document.querySelectorAll('.game-card');
        }

        renderGames();

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const sectionTitle = document.getElementById('sectionTitle');
        
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        const iframeModal = document.getElementById('iframeModal');
        const modalIframe = document.getElementById('modalIframe');
        const handle = document.getElementById('modal-drag-handle');
        
        const gameOptionsOverlay = document.getElementById('gameOptionsOverlay');
        const gameOptionsTitle = document.getElementById('gameOptionsTitle');
        const btnWebPage = document.getElementById('btnWebPage');
        const btnLocal = document.getElementById('btnLocal');

        let touchStartY = 0;
        let isDragging = false;
        let currentCategoryFilter = 'para voce';

        function toggleMenu() {
            hamburgerBtn.classList.toggle('open');
            mobileDrawer.classList.toggle('open');
            drawerOverlay.classList.toggle('open');
        }

        hamburgerBtn.addEventListener('click', toggleMenu);
        drawerOverlay.addEventListener('click', toggleMenu);

        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            const cards = window.gameCards || [];

            cards.forEach(card => {
                const title = card.querySelector('.game-title').textContent.toLowerCase();
                const categoryText = card.querySelector('.game-category').textContent.toLowerCase();
                const cardAttrCategory = card.getAttribute('data-category') || '';

                const matchesSearch = title.includes(query) || categoryText.includes(query);
                const matchesCategory = (currentCategoryFilter === 'para voce') || (cardAttrCategory === currentCategoryFilter);

                if (matchesSearch && matchesCategory) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        searchInput.addEventListener('input', () => {
            clearBtn.style.display = searchInput.value.trim().length > 0 ? 'block' : 'none';
            applyFilters();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.focus();
            applyFilters();
        });

        const allMenuItems = document.querySelectorAll('.menu-item');
        allMenuItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const filterValue = item.getAttribute('data-filter');
                
                if (filterValue) {
                    e.preventDefault();
                    currentCategoryFilter = filterValue;

                    allMenuItems.forEach(el => {
                        if(el.getAttribute('data-filter') === filterValue) {
                            el.classList.add('active');
                        } else {
                            el.classList.remove('active');
                        }
                    });

                    if (filterValue === 'para voce') {
                        sectionTitle.textContent = "Jogos em Destaque";
                    } else {
                        sectionTitle.textContent = `Jogos de ${item.textContent.trim()}`;
                    }

                    applyFilters();
                }

                if(mobileDrawer.classList.contains('open')) {
                    toggleMenu();
                }
            });
        });

        function openGameOptions(url, title) {
            selectedGameUrl = url;
            gameOptionsTitle.textContent = title;
            gameOptionsOverlay.classList.add('active');
            document.body.classList.add('modal-open');
        }

        function closeGameOptions() {
            gameOptionsOverlay.classList.remove('active');
            document.body.classList.remove('modal-open');
        }

        btnWebPage.addEventListener('click', () => {
            closeGameOptions();
            window.open(selectedGameUrl, '_blank');
        });

        btnLocal.addEventListener('click', () => {
            closeGameOptions();
            window.open(selectedGameUrl, '_blank');
        });

        gameOptionsOverlay.addEventListener('click', (e) => {
            if (e.target === gameOptionsOverlay) {
                closeGameOptions();
            }
        });

        window.openIframeModal = function(url) {
            modalIframe.src = url;
            iframeModal.style.display = 'flex';
            setTimeout(() => {
                iframeModal.classList.add('active');
            }, 10);
            document.body.classList.add('modal-open');
        }

        window.closeIframeModal = function() {
            iframeModal.style.transform = 'translateY(100%)';
            setTimeout(() => { 
                iframeModal.classList.remove('active'); 
                iframeModal.style.transform = ''; 
                iframeModal.style.display = 'none';
                document.body.classList.remove('modal-open'); 
                modalIframe.src = 'about:blank'; 
            }, 400);
        }

        handle.addEventListener('touchstart', (e) => { 
            touchStartY = e.touches[0].clientY; 
            isDragging = true; 
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => { 
            if (!isDragging) return; 
            const diff = e.touches[0].clientY - touchStartY; 
            if (diff > 0) {
                iframeModal.style.transform = `translateY(${diff}px)`; 
            }
        }, { passive: true });

        handle.addEventListener('touchend', (e) => { 
            isDragging = false; 
            const diff = e.changedTouches[0].clientY - touchStartY; 
            if (diff > 100) {
                closeIframeModal();
            } else {
                iframeModal.style.transform = 'translateY(0)'; 
            }
        }, { passive: true });
    </script>
</body>
</html>
